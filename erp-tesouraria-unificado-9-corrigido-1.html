function calcularAlertasFinanceiros(){
  const alertas = [];
  const hojeStr = hoje();
  const emDias = (d,n)=>{ const dt=new Date(hojeStr); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); };
  const daqui7 = emDias(hojeStr,7);

  // Contas a Pagar vencidas / a vencer
  const pagarAberto = DB.contasPagar.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const pagarVencidas = pagarAberto.filter(c=>c.vencimento < hojeStr);
  const pagarAVencer = pagarAberto.filter(c=>c.vencimento >= hojeStr && c.vencimento <= daqui7);
  if(pagarVencidas.length) alertas.push({nivel:'alto', tab:'pagar', texto:`${pagarVencidas.length} conta(s) a pagar em atraso, totalizando ${fmt(pagarVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});
  if(pagarAVencer.length) alertas.push({nivel:'medio', tab:'pagar', texto:`${pagarAVencer.length} conta(s) a pagar vencem nos próximos 7 dias, totalizando ${fmt(pagarAVencer.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // Contas a Receber vencidas
  const receberAberto = DB.contasReceber.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const receberVencidas = receberAberto.filter(c=>c.vencimento < hojeStr);
  if(receberVencidas.length) alertas.push({nivel:'alto', tab:'receber', texto:`${receberVencidas.length} conta(s) a receber em atraso, totalizando ${fmt(receberVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // Pagamentos a Prestadores de Serviços vencidos / a vencer
  const prestAberto = (DB.prestadoresServicos||[]).filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const prestVencidas = prestAberto.filter(c=>c.vencimento < hojeStr);
  const prestAVencer = prestAberto.filter(c=>c.vencimento >= hojeStr && c.vencimento <= daqui7);
  if(prestVencidas.length) alertas.push({nivel:'alto', tab:'prestadores', texto:`${prestVencidas.length} pagamento(s) a prestador(es) de serviços em atraso, totalizando ${fmt(prestVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});
  if(prestAVencer.length) alertas.push({nivel:'medio', tab:'prestadores', texto:`${prestAVencer.length} pagamento(s) a prestador(es) de serviços vencem nos próximos 7 dias, totalizando ${fmt(prestAVencer.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // Despesas de "Serviços de Terceiros" lançadas fora do módulo Prestadores de Serviços
  // (via Lançamentos/FaturaBot) — não passam pelo cálculo de Retenção na Fonte (AGT).
  const servicosForaPrestadores = DB.lancamentos.filter(l=>
    l.tipo==='Despesa' && l.categoria==='Serviços de Terceiros' &&
    !(DB.prestadoresServicos||[]).some(p=> p.entidade===l.entidade && Math.abs(Number(p.valor||0)-Number(l.valor||0))<0.5)
  );
  if(servicosForaPrestadores.length) alertas.push({nivel:'baixo', tab:'prestadores', texto:`${servicosForaPrestadores.length} despesa(s) de "Serviços de Terceiros" lançada(s) fora de 🛠️ Prestadores de Serviços — não tiveram Retenção na Fonte (AGT) calculada. Considere lançá-las (ou as futuras) em Prestadores de Serviços para aplicar IVA/Retenção corretamente.`});

  // Saldo negativo por conta
  CONTAS.forEach(c=>{
    const mov = DB.lancamentos.filter(l=>l.conta===c.codigo).reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0);
    if(mov < 0) alertas.push({nivel:'alto', tab:'lancamento', texto:`Saldo negativo em ${c.nome}: ${fmt(mov)} Kz.`});
  });

  // Duplicados de fatura
  const grupos = {};
  DB.lancamentos.forEach(l=>{
    if(!l.nFatura) return;
    const chave = `${(l.entidade||'').toLowerCase()}|${l.nFatura}|${Number(l.valor)}`;
    grupos[chave]=grupos[chave]||[]; grupos[chave].push(l);
  });
  const nDups = Object.values(grupos).filter(g=>g.length>1).length;
  if(nDups) alertas.push({nivel:'medio', tab:'duplicados', texto:`${nDups} possível(is) lançamento(s) duplicado(s) por identificar (mesma entidade + nº fatura + valor).`});

  // Orçamento ultrapassado
  [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].forEach(cat=>{
    const orc = Number(DB.orcamento[cat]||0);
    if(!orc) return;
    const realizado = explodirLancamentos(DB.lancamentos).filter(l=>l.categoria===cat && l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    if(realizado > orc) alertas.push({nivel:'medio', tab:'orcamento', texto:`Categoria "${cat}" já ultrapassou o orçamento anual (realizado ${fmt(realizado)} Kz vs orçamento ${fmt(orc)} Kz).`});
  });

  // Entregas/Suprimentos de Caixa por justificar há mais de 15 dias
  const suprimentosPendentes = (DB.suprimentos||[]).filter(s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);
    return (Number(s.valor||0)-j-d) > 0.5;
  });
  const suprimentosAtrasados = suprimentosPendentes.filter(s=>s.data <= emDias(hojeStr,-15));
  if(suprimentosAtrasados.length) alertas.push({nivel:'alto', tab:'suprimentos', texto:`${suprimentosAtrasados.length} entrega(s) de caixa (Logística/RH/Prestadores) há mais de 15 dias por justificar ou devolver.`});
  else if(suprimentosPendentes.length) alertas.push({nivel:'baixo', tab:'suprimentos', texto:`${suprimentosPendentes.length} entrega(s) de caixa ainda por justificar/devolver, totalizando ${fmt(suprimentosPendentes.reduce((s,x)=>{const j=(x.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);const d=(x.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);return s+(Number(x.valor||0)-j-d);},0))} Kz.`});

  // Divergências entre o SAF-T (lançamentos) e o Fecho de Caixa declarado pelos postos
  const divergReconciliacao = calcularReconciliacao().filter(l=>l.status==='divergente');
  if(divergReconciliacao.length) alertas.push({nivel:'alto', tab:'reconciliacao', texto:`${divergReconciliacao.length} dia(s)/posto(s)/turno(s) com divergência entre o total lançado (SAF-T) e o Fecho de Caixa declarado.`});

  // Lançamentos de extrato bancário importado que não batem com nenhuma conta do Plano de Contas
  const semCorrelacaoExtrato = lancamentosExtratoSemCorrelacao();
  if(semCorrelacaoExtrato.length) alertas.push({nivel:'medio', tab:'bancos', texto:`${semCorrelacaoExtrato.length} lançamento(s) com dados de extrato bancário que não correspondem a nenhuma conta do Plano de Contas.`});

  // Prazos fiscais (AGT) a vencer nos próximos 7 dias — mesma lógica do Motor Fiscal
  try{
    const hojeD = new Date(hojeStr);
    const addMeses = (data,n)=>{ const d=new Date(data); d.setMonth(d.getMonth()+n); return d; };
    const anoAtual = hojeD.getFullYear();
    const prazoIvaEsteMes = ultimoDiaUtilDoMes(anoAtual, hojeD.getMonth());
    const mesAnteriorD = addMeses(new Date(anoAtual, hojeD.getMonth(), 1), -1);
    let prazoIvaProximo = prazoIvaEsteMes, mesDeclarado = MESES[mesAnteriorD.getMonth()];
    if(hojeD > prazoIvaEsteMes){
      const mesSeguinte = addMeses(new Date(anoAtual, hojeD.getMonth(), 1), 1);
      prazoIvaProximo = ultimoDiaUtilDoMes(mesSeguinte.getFullYear(), mesSeguinte.getMonth());
      mesDeclarado = MESES[hojeD.getMonth()];
    }
    const diasIva = Math.ceil((prazoIvaProximo - hojeD)/86400000);
    if(diasIva>=0 && diasIva<=7) alertas.push({nivel:'alto', tab:'motorFiscal', texto:`Declaração Periódica de IVA (${mesDeclarado}) vence em ${diasIva} dia(s) — ${fmtData(prazoIvaProximo)}.`});
  }catch(e){ /* não bloqueia os restantes alertas se o cálculo de prazos falhar */ }

  // Stock abaixo do mínimo definido (Existências — Stocks, SKU)
  const produtosAbaixoMinimo = (DB.produtos||[]).filter(p=>{
    if(!(Number(p.stockMinimo||0)>0)) return false;
    const meses = stockMensal(p);
    const ultimo = meses[meses.length-1];
    return ultimo && ultimo.final < Number(p.stockMinimo);
  });
  if(produtosAbaixoMinimo.length) alertas.push({nivel:'medio', tab:'stocks', texto:`${produtosAbaixoMinimo.length} produto(s) abaixo do stock mínimo definido: ${produtosAbaixoMinimo.map(p=>p.nome).join(', ')}.`});

  // Faturas do FaturaBot pendentes de revisão/aprovação há mais de 5 dias
  const faturabotAtrasadas = (DB.faturabot||[]).filter(f=>f.status==='Pendente' && f.criado && f.criado.slice(0,10) <= emDias(hojeStr,-5));
  if(faturabotAtrasadas.length) alertas.push({nivel:'medio', tab:'faturabot', texto:`${faturabotAtrasadas.length} fatura(s) no FaturaBot pendente(s) de revisão há mais de 5 dias.`});

  const ordem = {alto:0, medio:1, baixo:2};
  return alertas.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}
function viewAlertas(){
  const alertas = calcularAlertasFinanceiros();
  const corNivel = {alto:'var(--vermelho)', medio:'var(--amarelo)', baixo:'var(--verde)'};
  const rotuloNivel = {alto:'⚠️ Urgente', medio:'🔶 Atenção', baixo:'ℹ️ Informativo'};
  const linhas = alertas.map(a=>`
    <div class="card" style="border-left:4px solid ${corNivel[a.nivel]};min-width:100%;cursor:pointer;" data-tab="${a.tab}">
      <div class="lbl">${rotuloNivel[a.nivel]}</div>
      <div style="margin-top:4px;font-size:13.5px;">${a.texto}</div>
    </div>`).join('') || `<p class="note">✅ Sem alertas financeiros no momento — tudo dentro do esperado.</p>`;
  return `
  <h2>🔔 Alertas Financeiros</h2>
  <p class="note">Verificação automática de contas vencidas, saldos negativos, duplicados e desvios de orçamento. Clique num alerta para ir direto ao módulo relacionado.</p>
  <div class="cards" style="flex-direction:column;">${linhas}</div>`;
}

function gerarNumeroFatura(unidade, dataStr){
  const anoRef = (dataStr||hoje()).slice(0,4);
  const chave = `${unidade||'GERAL'}:${anoRef}`;
  const atual = DB.faturaSeries[chave] || 0;
  const prefixo = ((unidade||'GER').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4)) || 'GER';
  DB.faturaSeries[chave] = atual+1;
  return `${prefixo}/${anoRef}/${String(atual+1).padStart(5,'0')}`;
}

/* Campos do lançamento comparados para gerar o histórico de alterações (rótulos amigáveis). */
const CAMPOS_LANC_LABEL = {data:'Data', tipo:'Tipo', unidade:'Unidade de Negócio', turno:'Turno', formaPagamento:'Forma de Pagamento',
  categoria:'Categoria', conta:'Conta', entidade:'Entidade', nif:'NIF', nFatura:'Nº Fatura', valor:'Valor', moeda:'Moeda',
  quantidade:'Quantidade', produtoId:'Produto', iva:'IVA', taxaIVA:'Taxa IVA', descricao:'Descrição'};

function diffLancamento(antigo, novo){
  const alteracoes = [];
  Object.keys(CAMPOS_LANC_LABEL).forEach(campo=>{
    const de = antigo[campo] ?? '';
    const para = novo[campo] ?? '';
    if(String(de) !== String(para)) alteracoes.push({campo:CAMPOS_LANC_LABEL[campo], de: de===''?'—':de, para: para===''?'—':para});
  });
  return alteracoes;
}
function categoriaReceitaAutomatica(unidade){
  if(unidade==="ZOOM'S LODGE") return 'Receitas Operacionais';
  if(unidade && unidade.startsWith('BAKERY LINE')) return CATEGORIA_RECEITA_BAKERY;
  if(unidade==='SUPRIMENTOS') return 'Suprimentos';
  return 'Receitas Operacionais';
}

      <button type="button" class="sec" id="btnAdicionarDivisao">+ Adicionar forma de pagamento</button>

    <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};">
      Total: <b>${fmt(total)} Kz</b> &nbsp;|&nbsp; Soma das divisões: <b>${fmt(soma)} Kz</b> &nbsp;|&nbsp;
      Diferença: <b>${fmt(diferenca)} Kz</b> ${bate?'✅':'⚠️ tem de ser 0 para gravar'}
    </div>

    <div class="actions" style="margin-top:10px;">
      <button type="button" id="btnLancarDivisao" ${(!bate||total<=0)?'disabled':''}>+ Lançar Fecho de Caixa</button>
    </div>
  </div>`;
}

function viewTransferenciaEntreContas(){
  const dataAtual = transfData || hoje();
  const origemNome = (CONTAS.find(c=>c.codigo===transfContaOrigem)||{}).nome || '';
  const destinoNome = (CONTAS.find(c=>c.codigo===transfContaDestino)||{}).nome || '';
  const mesmaConta = transfContaOrigem && transfContaOrigem===transfContaDestino;
  const valorValido = Number(transfValor) > 0;
  return `
  <div class="card" style="margin-bottom:18px;border:2px solid var(--castanho);">
    <h3 style="margin:0 0 4px;font-family:Cambria,Georgia,serif;">🔁 Transferência entre Contas</h3>
    <p class="note" style="margin-top:4px;">Para mover dinheiro entre contas da própria empresa (ex.: do BAI para o BFA, ou de/para a Caixa Tesouraria) — não é Receita nem Despesa real do negócio, é só um movimento interno. O sistema cria os DOIS lançamentos automaticamente (saída na Conta de Origem + entrada na Conta de Destino), categoria "Transferência entre Contas", já ligados à conta real de cada lado — entram certos na Conciliação Bancária de ambas. Fica de fora do Fluxo de Caixa como entrada/saída real, e do Resultado do Exercício.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
      <div><label>Data</label><input type="date" id="transfDataInput" value="${dataAtual}"></div>
      <div><label>Conta de Origem (de onde sai)</label><select id="transfContaOrigemSel"><option value="">—</option>${CONTAS.map(c=>`<option value="${c.codigo}" ${transfContaOrigem===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Conta de Destino (para onde vai)</label><select id="transfContaDestinoSel"><option value="">—</option>${CONTAS.map(c=>`<option value="${c.codigo}" ${transfContaDestino===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Valor</label><input type="number" step="0.01" id="transfValorInput" value="${transfValor}" placeholder="0.00"></div>
    </div>
    <div style="grid-column:1/-1;margin-top:8px;"><label>Descrição (opcional)</label><input id="transfDescricaoInput" value="${xmlEsc(transfDescricao)}" placeholder="ex.: Reforço de caixa, cobertura de despesas..."></div>
    ${mesmaConta ? `<p class="note" style="border-color:var(--vermelho);margin-top:8px;">⚠️ A Conta de Origem e a Conta de Destino têm de ser diferentes.</p>` : ''}
    ${(transfContaOrigem && transfContaDestino && !mesmaConta) ? `<p class="note" style="margin-top:8px;">Vai criar: <b>Despesa</b> de ${fmt(Number(transfValor)||0)} Kz em <b>${origemNome}</b> + <b>Receita</b> de ${fmt(Number(transfValor)||0)} Kz em <b>${destinoNome}</b>.</p>` : ''}
    <div class="actions" style="margin-top:10px;">
      <button type="button" id="btnLancarTransferencia" ${(!transfContaOrigem||!transfContaDestino||mesmaConta||!valorValido)?'disabled':''}>+ Lançar Transferência</button>
    </div>
  </div>`;
}

function viewLancamento(modoCaixa){
  const filtrados = DB.lancamentos.filter(l=>{
    if(filtrosLanc.dataDe && l.data < filtrosLanc.dataDe) return false;
    if(filtrosLanc.dataAte && l.data > filtrosLanc.dataAte) return false;
    if(filtrosLanc.mes && mesKey(l.data) !== filtrosLanc.mes) return false;
    if(filtrosLanc.tipo && l.tipo !== filtrosLanc.tipo) return false;
    if(filtrosLanc.categoria && l.categoria !== filtrosLanc.categoria) return false;
    if(filtrosLanc.origem && l.origem !== filtrosLanc.origem) return false;
    if(filtrosLanc.conta && l.conta !== filtrosLanc.conta) return false;
    if(filtrosLanc.formaPagamento && l.formaPagamento !== filtrosLanc.formaPagamento) return false;
    if(filtrosLanc.turno && (l.turno||'') !== filtrosLanc.turno) return false;
    return true;
  });
  const totFiltro = filtrados.reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const rows = filtrados.slice().reverse().map(l=>{
    const hist = l.historico||[];
    const linhaHist = lancHistoricoAberto.has(l.id) ? `
    <tr class="hist-row"><td colspan="17" style="background:#f7f7f2;">
      ${hist.length? `<b>Histórico de alterações (${hist.length})</b><table style="margin-top:6px;"><thead><tr><th>Quando</th><th>Por</th><th>Campo</th><th>De</th><th>Para</th></tr></thead><tbody>
        ${hist.slice().reverse().map(h=>h.alteracoes.map((a,i)=>`<tr>${i===0?`<td rowspan="${h.alteracoes.length}">${new Date(h.quando).toLocaleString('pt-PT')}</td><td rowspan="${h.alteracoes.length}">${h.por||'—'}</td>`:''}<td>${a.campo}</td><td>${a.de}</td><td>${a.para}</td></tr>`).join('')).join('')}
      </tbody></table>` : `<span class="note">Sem alterações registadas desde a criação deste lançamento.</span>`}
    </td></tr>` : '';
    return `
    <tr>
      <td>${l.data}</td>
      <td>${l.turno||'—'}</td>
      <td><span class="badge ${l.tipo==='Receita'?'pago':'atraso'}">${l.tipo}</span></td>
      <td>${l.origem||'—'}</td>
      <td>${l.categoria}</td>
      <td>${l.conta}</td>
      <td>${l.formaPagamento||'—'}${l.fechoTpaSeq>1?` <span class="note">(${l.fechoTpaSeq}º fecho TPA do dia)</span>`:''}</td>
      <td>${l.entidade||''}</td>
      <td>${l.nif||''}</td>
      <td>${l.nFatura||''}</td>
      <td class="right">${fmt(l.valor)}</td>
      <td>${l.moeda}</td>
      <td class="right">${l.quantidade? fmt(l.quantidade) : '—'}</td>
      <td>${l.produtoId ? (DB.produtos.find(p=>p.id===l.produtoId)||{}).nome || '' : ''}</td>
      <td>${l.iva==='Sim'? (l.taxaIVA*100).toFixed(0)+'%':'—'}</td>
      <td>${l.descricao||''}</td>
      <td><button data-edit-lanc="${l.id}">Editar</button> <button class="sec" data-hist-lanc="${l.id}">Histórico${hist.length?` (${hist.length})`:''}</button> ${l.tipo==='Receita' && l.nFatura ? `<button class="print" data-print-fatura="${l.id}">Fatura</button>` : ''} <button class="danger" data-del-lanc="${l.id}">Apagar</button></td>
    </tr>${linhaHist}`;

  const lancEditando = editandoLancId ? DB.lancamentos.find(l=>l.id===editandoLancId) : null;

      <div class="lbl">✅ Último lançamento gravado com sucesso</div>
      <div style="margin-top:6px;font-size:14px;">
        <b>${ultimoLancCaixa.tipo}</b> — ${ultimoLancCaixa.categoria} — <b>${fmt(ultimoLancCaixa.valor)} ${ultimoLancCaixa.moeda}</b>

  return `

  ${!lancEditando ? `

  ${(!lancEditando) ? `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">

    ${modoCaixa ? `<button type="button" class="tab-conta ${lancSubView==='contagem'?'active':''}" data-lancsub="contagem">🔒 Contagem Física do Dia</button>` : ''}
    ${!modoCaixa ? `<button type="button" class="tab-conta ${lancSubView==='transferencia'?'active':''}" data-lancsub="transferencia">🔁 Transferência entre Contas</button>` : ''}

  ${(!lancEditando && lancSubView==='dividido') ? viewFechoCaixaDividido() : ''}
  ${(!lancEditando && lancSubView==='transferencia' && !modoCaixa) ? viewTransferenciaEntreContas() : ''}

  ${lancEditando ? `

      <div><label>Tipo</label><select name="tipo" id="lancTipo"><option ${lancEditando?.tipo==='Receita'?'selected':''}>Receita</option><option ${lancEditando?.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div><label>Unidade de Negócio (Origem — qual loja/hotel)</label><select name="unidade" id="lancUnidade"><option value="">—</option>${UNIDADES_NEGOCIO.map(u=>`<option ${lancEditando?.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div><label>Turno (opcional)</label><select name="turno" id="lancTurno"><option value="" ${!lancEditando?.turno?'selected':''}>Dia inteiro / turno único</option>${TURNOS.map(t=>`<option ${lancEditando?.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento" id="lancFormaPagamento">${FORMAS_PAGAMENTO.map(f=>`<option ${lancEditando?.formaPagamento===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div id="lancTipoVendaRow" style="display:none;"><label>Tipo de Venda (Zoom's Lodge)</label><select id="lancTipoVenda"><option value="">—</option>${Object.keys(TIPOS_VENDA_ZOOMS_LODGE).map(t=>`<option ${lancEditando?.categoria===TIPOS_VENDA_ZOOMS_LODGE[t]?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Categoria <span id="lancSugestaoTag" style="font-weight:normal;font-size:12px;color:var(--muted);"></span></label><select name="categoria" id="lancCategoria">${optsCategorias(lancEditando?.categoria, (lancEditando?.tipo||'Receita')==='Despesa'?'despesa':'receita')}</select></div>
      <div><label>Conta Bancária/Caixa</label><select name="conta" id="lancConta">${CONTAS.map(c=>`<option value="${c.codigo}" ${lancEditando?.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>

    </details>

  ${(modoCaixa && !lancEditando) ? `
  <p class="note">Este acesso só permite lançar o fecho de caixa — não é possível ver os lançamentos de outros postos de venda. O quadro verde acima confirma que o último lançamento foi gravado.</p>
  ${lancSubView==='contagem' ? `

      <div><label>Conta</label><select name="conta"><option value="">Todas</option>${CONTAS.map(c=>`<option value="${c.codigo}" ${filtrosLanc.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento"><option value="">Todas</option>${FORMAS_PAGAMENTO.map(f=>`<option ${filtrosLanc.formaPagamento===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label>Turno</label><select name="turno"><option value="">Todos</option>${TURNOS.map(t=>`<option ${filtrosLanc.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltro">Limpar filtros</button> <button type="button" class="sec" id="btnExportarLanc">⬇️ Exportar (Excel)</button> <button type="button" class="print" id="btnImprimirLanc">Imprimir / PDF</button></div>
  </form>
  <p class="note">${filtrados.length} de ${DB.lancamentos.length} lançamentos · Saldo do filtro: <b>${fmt(totFiltro)} Kz</b></p>
  <div class="tablewrap">

function executarPesquisa(){
  const termo=(document.getElementById('pqTexto').value||'').toLowerCase();
  const de=document.getElementById('pqDe').value, ate=document.getElementById('pqAte').value;
  const origem=document.getElementById('pqOrigem').value;

  const resLanc = DB.lancamentos.filter(l=>{
    if(de && l.data<de) return false;
    if(ate && l.data>ate) return false;
    if(origem && l.origem!==origem) return false;
    if(termo){
      const alvo = `${l.entidade||''} ${l.descricao||''} ${l.nFatura||''} ${l.categoria}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  }).map(l=>({origemTipo:'Lançamento', data:l.data, tipo:l.tipo, categoria:l.categoria, entidade:l.entidade||'', nFatura:l.nFatura||'', valor:l.valor, moeda:l.moeda, descricao:l.descricao||''}));

  const resDeContas = (key,label)=> !origem ? DB[key].filter(c=>{
    const dataRef = c.vencimento || c.data || '';
    if(de && dataRef<de) return false;
    if(ate && dataRef>ate) return false;
    if(termo){
      const alvo = `${c.entidade||''} ${c.descricao||''}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  }).map(c=>({origemTipo:label, data:c.vencimento||c.data||'', tipo:label, categoria:'—', entidade:c.entidade||'', nFatura:'', valor:c.valor, moeda:'KZ', descricao:c.descricao||''})) : [];

  const res = [...resLanc, ...resDeContas('contasPagar','Conta a Pagar'), ...resDeContas('contasReceber','Conta a Receber'), ...resDeContas('prestadoresServicos','Pagamento a Prestador de Serviço')]
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  ultimaPesquisaGeral = res;

  const html = res.length ? `<table><thead><tr><th>Origem</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor</th><th>Descrição</th></tr></thead><tbody>
    ${res.map(l=>`<tr><td>${l.origemTipo}</td><td>${l.data}</td><td>${l.tipo}</td><td>${l.categoria}</td><td>${l.entidade}</td><td>${l.nFatura}</td><td class="right">${fmt(l.valor)}</td><td>${l.descricao}</td></tr>`).join('')}
    </tbody></table>` : `<table><tbody><tr><td class="note">Nenhum resultado encontrado.</td></tr></tbody></table>`;
  document.getElementById('resPesquisa').innerHTML = html;
}

/* ---------- Controlo de Duplicados ---------- */
function calcularDuplicados(){
  const grupos = {};
  DB.lancamentos.forEach(l=>{
    if(!l.nFatura) return;
    const chave = `${(l.entidade||'').toLowerCase()}|${l.nFatura}|${Number(l.valor)}`;
    grupos[chave]=grupos[chave]||[]; grupos[chave].push(l);
  });
  return Object.values(grupos).filter(g=>g.length>1).flat();
}

/* ---------- Fecho de Períodos ---------- */
/* Resultado do Exercício de um ano — agora contabilidade completa, não só o cash das
   Receitas/Despesas: inclui também os lançamentos automáticos não-monetários (gastos
   que não passam pela Tesouraria mas reduzem o lucro na mesma) — Amortização do
   Imobilizado, Provisão de Férias/13º Salário, Provisão de Cobrança Duvidosa e o efeito
   líquido das Diferenças Cambiais do ano. Exclui Suprimentos (Passivo/dívida a sócios,
   não é lucro) e os pagamentos que apenas liquidam provisões já reconhecidas (senão
   contavam a despesa duas vezes: uma na provisão, outra no pagamento). */
const CATEGORIAS_EXCLUIDAS_RESULTADO = ['Suprimentos','Imposto Industrial (Pagamento)','Férias/13º Salário (Pagamento)','Transferência entre Contas','Adiantamentos e Suprimentos de Caixa a Justificar'];
function resultadoAntesImpostoDoAno(ano){
  const doAno = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)) && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria)));
  const r = doAno.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const d = doAno.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  const amortizacao = amortizacaoDoAno(ano);
  const provisaoFerias = provisaoFeriasDecimoTerceiroDoAno(ano);
  const provisaoCobranca = Number(ano)===new Date().getFullYear() ? provisaoCobrancaDuvidosaAtual() : 0;
  const diferencaCambial = diferencaCambialDoAno(ano); // já vem com sinal: ganho soma, perda subtrai
  return r - d - amortizacao - provisaoFerias - provisaoCobranca + diferencaCambial;
}
/* Resultado Líquido do Exercício = Resultado Antes de Impostos − Provisão de Imposto
   Industrial do ano. É este número (já depois de todos os ajustamentos e do imposto)
   que deve aparecer no Balanço, no Encerramento Anual, e em qualquer "Resultado do
   Exercício" formal do sistema. */
function resultadoLiquidoDoAno(ano){
  return resultadoAntesImpostoDoAno(ano) - impostoIndustrialDoAno(ano);
}
function resultadoDoAno(ano){ return resultadoLiquidoDoAno(ano); }

/* ---------- Contas a Pagar/Receber e Prestadores de Serviços (genérico) ---------- */
const CONTA_CFG = {
  contasPagar:        {cor:'var(--castanho)', icone:'📤', acaoData:'Compra',              wording:'Fornecedor',           ccPlural:'Fornecedores',           direcao:'pagar',   titulo:'Contas a Pagar',              slug:'contas-a-pagar',           categoriaDefault:'Compra de Mercadorias para Revenda'},
  contasReceber:       {cor:'var(--verde)',    icone:'📥', acaoData:'Venda',               wording:'Cliente',              ccPlural:'Clientes',                direcao:'receber', titulo:'Contas a Receber',            slug:'contas-a-receber',         categoriaDefault:'Outras Receitas Operacionais'},
  prestadoresServicos: {cor:'var(--azul-nav)', icone:'🛠️', acaoData:'Prestação de Serviço', wording:'Prestador de Serviço', ccPlural:'Prestadores de Serviços', direcao:'pagar',   titulo:'Pagamentos a Prestadores de Serviços', slug:'prestadores-de-servicos', categoriaDefault:'Serviços de Terceiros'},
};
/* Aplica a Retenção na Fonte sobre Serviços de Terceiros (Fonte: AGT) a um registo de
   Prestador de Serviços. A taxa e a base vêm de REGRAS_FISCAIS_AGT.retencaoServicos (única
   tabela de taxas fiscais do sistema — ver nota no topo do ficheiro). O valor retido é
   registado de imediato como um "pagamento" sem Forma de Pagamento/Conta bancária real
   (não é uma saída de Caixa/Banco, não gera Lançamento de Tesouraria) — serve apenas para
   que o saldo em aberto do registo passe a refletir o Valor Líquido a Pagar ao prestador.
   O imposto retido é entregue à AGT separadamente (ver 🧾 IVA e Retenções / 📑 Mapas Fiscais). */
function aplicarRetencaoAGT(novo, dadosForm, valorBase){
  novo.iva = dadosForm.iva || 'Não';
  novo.taxaIVA = Number(dadosForm.taxaIVA||0);
  novo.retencaoAplicavel = (dadosForm.retencaoAplicavel||'Sim') === 'Sim';
  novo.taxaRetencao = REGRAS_FISCAIS_AGT.retencaoServicos.taxa;
  novo.valorRetencao = novo.retencaoAplicavel ? Math.round(Number(valorBase||0)*novo.taxaRetencao*100)/100 : 0;
  novo.valorLiquido = Math.round((Number(valorBase||0) - novo.valorRetencao)*100)/100;
  if(novo.valorRetencao>0){
    novo.pagamentos.push({
      id: uid(), data: novo.data||hoje(), valor: novo.valorRetencao,
      observacao: `Retenção na Fonte sobre Serviços de Terceiros — ${(novo.taxaRetencao*100).toFixed(1)}% (Fonte: AGT)`,
      formaPagamento: 'Retenção na Fonte (AGT)', conta: ''
    });
    novo.valorPago = novo.valorRetencao;
  }
}
function viewContas(key,titulo,labelEntidade){
  const cfg = CONTA_CFG[key] || {cor:'var(--verde)',icone:'📄',acaoData:'Movimento',wording:labelEntidade,ccPlural:labelEntidade,direcao:'pagar'};

  const listaFiltrada = DB[key].filter(c=>{
    const dataRef = c.vencimento || c.data || '';
    if(filtro.de && dataRef < filtro.de) return false;
    if(filtro.ate && dataRef > filtro.ate) return false;
    if(filtro.estado){
      const valorPago = Number(c.valorPago||0);
      const saldo = Number(c.valor||0) - valorPago;
      const quitado = saldo <= 0.5;
      const parcial = !quitado && valorPago > 0.5;

      const estadoAtual = quitado?'Pago':(atraso?'Em atraso':(parcial?'Parcial':'Pendente'));

    return true;
  });

    const valorPago = Number(c.valorPago||0);
    const saldo = Number(c.valor||0) - valorPago;
    const quitado = saldo <= 0.5;

      : '';
    return `<tr>
      <td>${c.entidade}</td><td>${c.descricao||''}${parcelaInfo}</td><td>${c.data||c.vencimento}</td><td>${c.vencimento}</td>

          <select data-contapag="${key}:${c.id}" title="Conta (Caixa/Banco)" style="padding:5px;">${CONTAS.map(cc=>`<option value="${cc.codigo}" ${cc.codigo==='CASH'?'selected':''}>${cc.nome}</option>`).join('')}</select>
          <select data-catpag="${key}:${c.id}" title="Categoria" style="padding:5px;">${optsCategorias(cfg.categoriaDefault, cfg.direcao==='pagar'?'despesa':'receita')}</select>

          <button class="sec" data-pay="${key}:${c.id}">Registar Pagamento</button>

        <p class="note" style="margin-top:3px;">A Forma de Pagamento e a Conta escolhidas aqui determinam em que Caixa/Banco este pagamento vai aparecer na Tesouraria.</p>`:''}
      <button class="print" data-print-conta="${key}:${c.id}">Imprimir</button>
      <button class="danger" data-delc="${key}:${c.id}">Apagar</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="${key==='prestadoresServicos'?12:9}" class="note">Nada registado ainda.</td></tr>`;

  return `

      ${key==='prestadoresServicos' ? `

      <div><label>Sujeito a Retenção na Fonte (AGT)?</label><select name="retencaoAplicavel"><option value="Sim">Sim</option><option value="Não">Não</option></select></div>` : ''}
    </div>
    ${key==='prestadoresServicos' ? `<p class="note">🏛️ <b>Retenção na Fonte sobre Serviços de Terceiros (Fonte: AGT):</b> taxa de ${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% sobre o Valor Total, calculada e registada automaticamente ao gravar (${REGRAS_FISCAIS_AGT.retencaoServicos.nota}). O sistema desconta este valor de imediato como retido — não é dinheiro que sai da Caixa/Banco, fica como imposto a entregar à AGT (ver 🧾 IVA e Retenções / 📑 Mapas Fiscais). O <b>Valor Líquido a Pagar</b> ao prestador (Valor Total − Retenção) é o que aparece como saldo em aberto para "Registar Pagamento" — a Forma de Pagamento e a Conta escolhidas nesse passo é que ficam espelhadas na Tesouraria/conta bancária real. Marque "Não" se este prestador não estiver sujeito a retenção (ex.: enquadramento diferente — confirme com o contabilista).</p>` : ''}
    <p class="note">Se o Nº de Parcelas for maior que 1, o valor total é dividido igualmente entre as parcelas (ajuste de arredondamento na última) e é criado um registo por parcela, cada um com o seu vencimento e pagamento próprios${key==='prestadoresServicos'?' (a retenção é recalculada por parcela)':''}.</p>
    <div class="actions"><button type="submit">+ Adicionar</button></div>
  </form>
  <form class="inline" id="formFiltroContas" data-key="${key}">
    <div class="grid">
      <div><label>Vencimento De</label><input type="date" name="de" value="${filtro.de}"></div>
      <div><label>Vencimento Até</label><input type="date" name="ate" value="${filtro.ate}"></div>
      <div><label>Estado</label><select name="estado"><option value="">Todos</option><option ${filtro.estado==='Pendente'?'selected':''}>Pendente</option><option ${filtro.estado==='Parcial'?'selected':''}>Parcial</option><option ${filtro.estado==='Em atraso'?'selected':''}>Em atraso</option><option ${filtro.estado==='Pago'?'selected':''}>Pago</option></select></div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltroContas" data-key="${key}">Limpar filtros</button> <button type="button" class="sec" id="btnExportarContas" data-key="${key}">⬇️ Exportar (Excel)</button> <button type="button" class="print" id="btnImprimirContas" data-key="${key}">Imprimir / PDF</button></div>
  </form>
  <p class="note">${listaFiltrada.length} de ${DB[key].length} registo(s)</p>
  <div class="tablewrap">
    <table><thead><tr><th>${labelEntidade}</th><th>Descrição</th><th>Data</th><th>Vencimento</th><th class="right">Valor</th>${key==='prestadoresServicos'?`<th>IVA</th><th class="right">Retenção AGT (${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}%)</th><th class="right">Líquido a Pagar</th>`:''}<th class="right">Pago</th><th class="right">Saldo</th><th>Estado</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>
  ${key==='prestadoresServicos' ? '<p class="note">"Pago" inclui a Retenção na Fonte já registada automaticamente (não é saída de Caixa/Banco) mais qualquer pagamento em numerário/banco já efetuado. "Saldo" é o que ainda falta pagar ao prestador em dinheiro — é esse o valor que aparece pré-preenchido em "Registar Pagamento".</p>' : ''}
  <p class="note" style="margin-top:14px;">Para ver o histórico completo por ${labelEntidade.toLowerCase()} (movimentos a crédito + pagamentos, com saldo a transitar), vai a <b>🧾 Conta Corrente de ${cfg.ccPlural}</b> no menu.</p>`;
}

/* ---------- Conta Corrente (Clientes, Fornecedores ou Prestadores de Serviços) ---------- */
let contaCorrenteAtivo = {};
function viewContaCorrente(key){
  const cfg = CONTA_CFG[key] || {wording:'Entidade', ccPlural:'Entidades', direcao:'pagar'};
  const isFornecedor = cfg.direcao === 'pagar';
  const titulo = `Conta Corrente de ${cfg.ccPlural}`;
  const labelEntidade = cfg.wording;
  const tipoDebito = isFornecedor ? 'Débito (Compra/Serviço a Crédito)' : 'Débito (Venda a Crédito)';
  const tipoCredito = isFornecedor ? 'Crédito (Pagamento Efetuado)' : 'Crédito (Pagamento Recebido)';

  const entidades = [...new Set(DB[key].map(c=>c.entidade).filter(Boolean))].sort();
  let ativo = contaCorrenteAtivo[key] || '';
  if(!ativo && entidades.length) ativo = entidades[0];

  const saldoDaEntidade = (nome)=> DB[key].filter(c=>c.entidade===nome)
    .reduce((s,c)=> s + (Number(c.valor||0) - Number(c.valorPago||0)), 0);

  const resumo = entidades.map(nome=>({nome, saldo: saldoDaEntidade(nome)}))
    .sort((a,b)=> b.saldo - a.saldo);

  let linhasLedger = '', totalEmAberto = 0;
  if(ativo){
    const entradas = DB[key].filter(c=>c.entidade===ativo);
    const movimentos = [];
    entradas.forEach(c=>{
      movimentos.push({data:c.data||c.vencimento, tipo:tipoDebito, descricao:c.descricao||'—', valor:Number(c.valor||0)});
      (c.pagamentos||[]).forEach(p=>{
        const viaConta = p.formaPagamento ? ` (${p.formaPagamento}${p.conta?' — '+((CONTAS.find(cc=>cc.codigo===p.conta)||{}).nome||p.conta):''})` : '';
        movimentos.push({data:p.data, tipo:tipoCredito, descricao:(p.observacao||'Pagamento')+viaConta, valor:-Number(p.valor||0)});
      });
    });
    movimentos.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    let saldoCorrente = 0;
    linhasLedger = movimentos.map(m=>{
      saldoCorrente += m.valor;
      return `<tr><td>${m.data}</td><td>${m.tipo}</td><td>${m.descricao}</td>
        <td class="right">${m.valor>=0?fmt(m.valor):'—'}</td>
        <td class="right">${m.valor<0?fmt(-m.valor):'—'}</td>
        <td class="right"><b>${fmt(saldoCorrente)}</b></td></tr>`;
    }).join('') || `<tr><td colspan="6" class="note">Sem movimentos para ${labelEntidade.toLowerCase()} selecionado(a).</td></tr>`;
    totalEmAberto = saldoCorrente;
  }

  return `
  <h2>🧾 ${titulo}</h2>
  <p class="note">Histórico completo de cada ${labelEntidade.toLowerCase()}: todos os movimentos a crédito (débito) e todos os pagamentos ${isFornecedor?'efetuados':'recebidos'} (crédito), com saldo a transitar — tal como um extrato bancário. Os pagamentos registam-se no módulo de origem.</p>

  <div class="tablewrap" style="margin-bottom:18px;">
    <table><thead><tr><th>${labelEntidade}</th><th class="right">Saldo em Aberto</th><th></th></tr></thead>
    <tbody>${resumo.map(r=>`<tr${r.nome===ativo?' style="background:var(--bg);"':''}>
      <td>${r.nome}</td><td class="right">${fmt(r.saldo)}</td>
      <td><button class="sec" data-cc="${key}:${r.nome.replace(/"/g,'&quot;')}">Ver Extrato</button></td>
    </tr>`).join('') || `<tr><td colspan="3" class="note">Ainda sem registos em ${titulo}.</td></tr>`}</tbody></table>
  </div>

  ${ativo ? `
  <h2 class="sub" style="font-size:15px;">Extrato — ${ativo}</h2>
  <div class="actions" style="margin-bottom:10px;"><button type="button" class="print" id="btnImprimirContaCorrente" data-cc-print="${key}">Imprimir Extrato</button></div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="right">Débito</th><th class="right">Crédito</th><th class="right">Saldo</th></tr></thead>
    <tbody>${linhasLedger}</tbody></table>
  </div>
  <div class="card" style="margin-top:14px;background:${totalEmAberto>0.5?'#fdeceb':'var(--verde-claro)'};border-color:${totalEmAberto>0.5?'var(--vermelho)':'var(--verde)'};">
    Saldo em Aberto de <b>${ativo}</b>: <b>${fmt(totalEmAberto)} Kz</b> ${totalEmAberto<=0.5?`✅ ${isFornecedor?'Sem dívida a esta entidade':'Sem dívida'}`:`⚠️ ${isFornecedor?'Ainda devemos a esta entidade':'Cliente ainda deve'}`}
  </div>` : ''}`;
}

/* ---------- Conciliação Bancária ---------- */
const MESES_CONCILIACAO = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function viewBancos(){
  const contasBanco = CONTAS.filter(c=>c.codigo!=='CASH');
  if(!contasBanco.find(c=>c.codigo===bancoTabAtivo)) bancoTabAtivo = contasBanco[0].codigo;
  const conta = contasBanco.find(c=>c.codigo===bancoTabAtivo);
  const ano = bancoAnoAtivo;

  const cfg = (DB.bancosConfig && DB.bancosConfig[conta.codigo]) || {};
  const saldoAbertura = Number(cfg.saldoAbertura||0);
  const ajustes = Number(cfg.ajustes||0);

  function manual(mesIdx, campo){
    const key = `${conta.codigo}:${ano}:${mesIdx}`;
    const r = (DB.saldosBancarios && DB.saldosBancarios[key]) || {};
    return Number(r[campo]||0);
  }

  /* Propositadamente NÃO se usa valorEmKZ aqui: cada conta bancária tem a sua própria
     moeda (BAI-EUR-001 é EUR, BAI-USD-002 é USD) e o extrato do banco vem nessa mesma
     moeda nativa — por isso os saldos ficam na moeda da própria conta, para bater certo
     com o extrato real. Isto é diferente do Balanço/DRE, que somam TODAS as contas
     juntas num único total em Kz. */
  const saldoInicial=[], movimento=[], saldoContabNosso=[], saldoDispNosso=[], saldoDispExtrato=[], diferenca=[];
  for(let m=0;m<12;m++){
    saldoInicial[m] = m===0 ? saldoAbertura : saldoContabNosso[m-1];
    const chaveMes = `${ano}-${String(m+1).padStart(2,'0')}`;
    movimento[m] = DB.lancamentos.filter(l=>l.conta===conta.codigo && mesKey(l.data)===chaveMes)
      .reduce((s,l)=> s + (l.tipo==='Receita'? Number(l.valor||0) : -Number(l.valor||0)), 0);
    saldoContabNosso[m] = saldoInicial[m] + movimento[m];
    saldoDispNosso[m] = saldoContabNosso[m] - ajustes;
    saldoDispExtrato[m] = manual(m,'saldoDisponivel');
    diferenca[m] = saldoDispExtrato[m] - saldoDispNosso[m];
  }

  const tabs = contasBanco.map(c=>`<button type="button" class="tab-conta ${c.codigo===conta.codigo?'active':''}" data-banco-tab="${c.codigo}">${c.codigo}<br><small>${c.banco||''} · ${c.moeda||''}</small></button>`).join('');

  const linhaCalc = (label,arr,forte)=> `<tr${forte?' style="font-weight:bold;"':''}><td>${label}</td>${arr.map(v=>`<td class="right">${fmt(v)}</td>`).join('')}</tr>`;

  const linhaEstado = `<tr><td>Estado</td>${diferenca.map(v=> `<td class="right">${Math.round(v*100)===0? '<span class="badge pago">✓</span>' : '<span class="badge atraso">⚠</span>'}</td>`).join('')}</tr>`;

  const linhaManual = (label,campo)=> `<tr><td>${label}</td>${MESES_CONCILIACAO.map((m,i)=>`<td><input type="number" step="0.01" data-banco-manual="${conta.codigo}:${ano}:${i}:${campo}" value="${manual(i,campo)||''}" style="width:100px;"></td>`).join('')}</tr>`;

  const anosLanc = Array.from(new Set(DB.lancamentos.map(l=> Number(mesKey(l.data).slice(0,4))))).filter(a=>a);
  const anos = Array.from(new Set([...anosLanc, new Date().getFullYear()])).sort();

  const nContaExtrato = extraiNumeroContaBancaria(conta.numConta);
  const bancoExtrato = extraiCodigoBanco(conta.codigo) || extraiCodigoBanco(conta.banco);
  const semCorrelacao = lancamentosExtratoSemCorrelacao().filter(l=>l.conta===conta.codigo);

  return `
  <h2>🏦 Conciliação Bancária</h2>
  <p class="note">Dados das contas reais da empresa. Preencha o Saldo de Abertura e os Ajustes uma vez; preencha o Saldo Disponível do extrato todo mês para conferir com o sistema. Mais abaixo, importe o extrato real (CSV/Excel ou foto/PDF) para conferir transação a transação.</p>

  <div class="actions" style="margin-bottom:14px;">
    <button type="button" class="print" onclick="imprimirFichaConciliacaoAtual()">Imprimir ficha de conciliação</button>
  </div>



  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${tabs}</div>

  <div class="card" style="margin-bottom:18px;">
    <h3 style="margin:0 0 10px;font-family:Cambria,Georgia,serif;">CONTA ${conta.codigo} — ${conta.banco||''} (${conta.moeda||''})</h3>
    <table style="width:100%;font-size:12.5px;border:none;">
      <tr>
        <td class="lbl2">Banco:</td><td>${conta.banco||'—'}</td>
        <td class="lbl2">Nome da Conta:</td><td colspan="3">${conta.nomeConta||'—'}</td>
        <td class="lbl2">Moeda:</td><td>${conta.moeda||'—'}</td>
        <td class="lbl2">Natureza:</td><td>${conta.natureza||'—'}</td>
      </tr>
      <tr>
        <td class="lbl2">Nº de Conta:</td><td>${conta.numConta||'—'}</td>
        <td class="lbl2">IBAN:</td><td colspan="3">${conta.iban||'—'}</td>
        <td class="lbl2">SWIFT/BIC:</td><td colspan="2">${conta.swift||'—'}</td>
      </tr>
    </table>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;">
      <div>
        <label>Ano</label>
        <select id="bancoAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div>
        <label>Saldo de abertura em 01/Jan/${ano} (transitado de ${ano-1})</label>
        <input type="number" step="0.01" data-banco-config="${conta.codigo}:saldoAbertura" value="${saldoAbertura}">
      </div>
      <div>
        <label>Ajustes conhecidos (cheques por compensar, tarifas não lançadas, etc.)</label>
        <input type="number" step="0.01" data-banco-config="${conta.codigo}:ajustes" value="${ajustes}">
      </div>
    </div>
  </div>

  <div class="tablewrap" style="margin-bottom:22px;">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaCalc('Saldo Inicial do Mês (calculado)', saldoInicial)}
        ${linhaCalc('(+/-) Movimento do Mês (calculado do LANÇAMENTO)', movimento)}
        ${linhaCalc('SALDO CONTABILÍSTICO (nosso, calculado)', saldoContabNosso, true)}
        ${linhaCalc('SALDO DISPONÍVEL (nosso, calculado)', saldoDispNosso, true)}
        ${linhaCalc('Saldo Disponível (extrato bancário) — igual ao lançamento manual abaixo', saldoDispExtrato)}
        ${linhaCalc('DIFERENÇA (Extrato − Saldo Disponível)', diferenca, true)}
        ${linhaEstado}
      </tbody>
    </table>
  </div>

  <h2 class="sub">LANÇAMENTO MANUAL — VALORES DO EXTRATO BANCÁRIO (preencher todo mês)</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaManual('Saldo Transitado (extrato bancário)','saldoTransitado')}
        ${linhaManual('Saldo Contabilístico (extrato bancário)','saldoContabilistico')}
        ${linhaManual('Saldo Disponível (extrato bancário)','saldoDisponivel')}
      </tbody>
    </table>
  </div>

  <p class="note" style="background:var(--verde-claro);border-color:var(--verde);margin-top:22px;">
    ℹ️ Esta conta está configurada como: <strong>${conta.nome}</strong>
    <br><code>${bancoExtrato||'—'}–${nContaExtrato||'—'}</code> (Banco: ${bancoExtrato?bancoExtrato.toUpperCase():'—'}, Conta: ${nContaExtrato||'—'})
    <br>Os lançamentos criados a partir desta conta (botão "+ Lançar" abaixo) gravam este mesmo par Banco/Nº de Conta, para rastreabilidade.
  </p>
  ${semCorrelacao.length ? `
  <p class="note" style="border-color:var(--amarelo);background:#FFFAED;">
    ⚠️ <b>${semCorrelacao.length} lançamento(s) desta conta</b> tem/têm dados de extrato (Banco/Nº de Conta) que não correspondem a nenhuma conta do Plano de Contas — provavelmente um lançamento antigo editado à mão. Reveja:
    <ul style="margin:8px 0;">
      ${semCorrelacao.map(l=>`<li><code>${l.nContaExtrato}@${l.bancoExtrato}</code> — ${l.data} ${l.descricao||''} (${fmt(l.valor)} Kz)</li>`).join('')}
    </ul>
  </p>` : ''}
  ${viewConciliacaoExtratoImportado(conta.codigo)}`;
}

/* ---------- Conciliação de Extrato Bancário Importado (transação a transação) ---------- */
function viewConciliacaoExtratoImportado(contaCodigo){
  const {linhas, nConfere, nSoExtrato, nSoSistema, total} = calcularConciliacaoExtrato(contaCodigo);
  const badge = (status)=> status==='confere' ? '<span class="badge pago">✓ Confere</span>'
    : status==='so_extrato' ? '<span class="badge atraso">⚠ Só no extrato</span>'
    : '<span class="badge pendente">⚠ Só no sistema</span>';
  const linhasHtml = linhas.map(l=>{
    const sugestaoHtml = l.status==='so_extrato'
      ? `${l.categoriaSugerida?`<div style="font-size:12px;">💡 ${l.categoriaSugerida}${l.entidadeSugerida?` — ${l.entidadeSugerida}`:''}</div>`:'<div class="note" style="font-size:12px;">Sem sugestão</div>'}
         <button type="button" data-lancar-extrato="${contaCodigo}:${l.id}" style="font-size:12px;padding:2px 8px;">+ Lançar</button>`
      : '';
    return `<tr><td>${l.data||'—'}</td><td>${l.descricao||'—'}</td><td class="right">${fmt(l.valor)}</td><td>${badge(l.status)}</td><td>${sugestaoHtml}</td></tr>`;
  }).join('') || `<tr><td colspan="5" class="note">Ainda não importaste o extrato desta conta.</td></tr>`;

  /* Resumo do mês corrente: tudo o que está "só no extrato" (pagamentos que já saíram do
     banco mas ainda não foram lançados no sistema) agrupado pela categoria sugerida — dá
     o cálculo, no fim do mês, de quanto falta lançar em cada categoria de despesa/receita
     usando a MESMA lógica de categorização automática que já existe nas Despesas. */
  const mesAtual = hoje().slice(0,7);
  const soExtratoMes = linhas.filter(l=>l.status==='so_extrato' && (l.data||'').startsWith(mesAtual));
  const porCategoria = {};
  soExtratoMes.forEach(l=>{
    const cat = l.categoriaSugerida || 'Sem categoria sugerida';
    porCategoria[cat] = porCategoria[cat]||{qtd:0,total:0};
    porCategoria[cat].qtd++; porCategoria[cat].total += Number(l.valor)||0;
  });
  const resumoMesHtml = Object.entries(porCategoria).map(([cat,v])=>
    `<tr><td>${cat}</td><td class="right">${v.qtd}</td><td class="right">${fmt(v.total)}</td></tr>`).join('');

  return `
  <h2 class="sub" style="font-size:15px;margin-top:24px;">🔎 Conciliação Automática — Extrato Real vs Lançamentos (transação a transação)</h2>
  <p class="note">Mesma lógica da Reconciliação SAF-T vs Fecho de Caixa, mas aqui compara-se o <b>extrato bancário real</b> desta conta com os lançamentos pagos/recebidos por Banco/TPA/Transferência — incluindo pagamentos a fornecedores por banco. Importa o extrato em CSV/Excel (mais fiável) ou tira uma foto/PDF para leitura automática por IA. Linhas "Só no extrato" recebem uma categoria sugerida (mesma lógica de categorização automática das Despesas) — clique "+ Lançar" para criar o lançamento já com essa categoria, ajustando depois se for preciso.</p>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px;">
    <div><label>Importar CSV ou Excel (.csv, .xls, .xlsx)</label><input type="file" id="extratoArquivoCSV" accept=".csv,.xls,.xlsx" data-conta="${contaCodigo}"></div>
    <div><label>Importar Foto ou PDF do Extrato (leitura por IA)</label><input type="file" id="extratoArquivoOCR" accept="image/*,application/pdf" data-conta="${contaCodigo}"></div>
  </div>
  <div id="extratoImportTag" class="note" style="margin-bottom:10px;"></div>
  ${total>0?`<div class="actions" style="margin-bottom:10px;"><button type="button" class="danger" id="btnLimparExtratoImportado" data-conta="${contaCodigo}">Limpar extrato importado desta conta</button></div>`:''}

  ${total>0?`
  <div class="cards" style="margin-bottom:10px;">
    <div class="card"><div class="lbl">Confere</div><div class="val pos">${nConfere}</div></div>
    <div class="card"><div class="lbl">Só no Extrato (falta lançar)</div><div class="val neg">${nSoExtrato}</div></div>
    <div class="card"><div class="lbl">Só no Sistema (não aparece no banco)</div><div class="val neg">${nSoSistema}</div></div>
  </div>`:''}
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="right">Valor</th><th>Estado</th><th>Sugestão</th></tr></thead>
  <tbody>${linhasHtml}</tbody></table></div>

  ${resumoMesHtml?`
  <h2 class="sub" style="font-size:15px;margin-top:20px;">📆 Resumo do Mês — Pagamentos ao Banco por Categoria (só extrato, ${mesAtual})</h2>
  <p class="note">Tudo o que saiu/entrou nesta conta este mês e ainda não tem lançamento correspondente, agrupado pela categoria sugerida — use como checklist para fechar o mês sem deixar nada por lançar.</p>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="right">Qtd.</th><th class="right">Total</th></tr></thead>
  <tbody>${resumoMesHtml}</tbody></table></div>`:''}`;
}

/* ---------- Tabela de Câmbio ---------- */

}

  const bate = Math.abs(totalDebito-totalCredito) < 0.5;

  const livroMes = gerarLivroDiario().filter(l=>mesKey(l.data)===diarioMesAtivo);
  const opcoesMes = [...new Set(gerarLivroDiario().map(l=>mesKey(l.data)).concat([hoje().slice(0,7)]))].sort().reverse();
  const linhasDiario = livroMes.map(l=>`
    <tr><td>${l.data}</td><td>${l.descricao}</td>
      <td>${l.debito.cod} — ${l.debito.nome}</td>
      <td>${l.credito.cod} — ${l.credito.nome}</td>
      <td class="right">${fmt(l.valor)}</td>
      <td><span class="note" style="margin:0;">${l.origem}</span></td></tr>`).join('') || `<tr><td colspan="6" class="note">Sem movimentos em ${diarioMesAtivo}.</td></tr>`;

  return `
  <h2>📚 Plano de Contas / Balancete — Partidas Dobradas</h2>
  <p class="note">Cada lançamento (e cada Conta a Pagar/Receber em aberto) gera automaticamente um par Débito/Crédito no Livro Diário — é contabilidade de dupla entrada real, não apenas soma de receitas e despesas. O Balancete abaixo agrega esse livro por conta. Confirme os códigos finais (SNC-AO) com o seu contabilista antes de submissões oficiais.</p>
  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};margin-bottom:14px;">
    Total Débito: <b>${fmt(totalDebito)} Kz</b> &nbsp;|&nbsp; Total Crédito: <b>${fmt(totalCredito)} Kz</b> &nbsp;|&nbsp;
    ${bate?'✅ Partidas dobradas batem (Débito = Crédito)':'⚠️ Diferença encontrada — reveja os lançamentos'}
  </div>
  <div class="tablewrap"><table><thead><tr><th>Código</th><th>Conta</th><th class="right">Total Débito</th><th class="right">Total Crédito</th><th class="right">Saldo</th></tr></thead>
  <tbody>${linhasBalancete}</tbody></table></div>

  <div class="grid" style="grid-template-columns:220px;margin-bottom:10px;">
    <div><label>Mês</label><select id="diarioMesSel">${opcoesMes.map(m=>`<option value="${m}" ${m===diarioMesAtivo?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Débito</th><th>Crédito</th><th class="right">Valor</th><th>Origem</th></tr></thead>

/* ---------- Motor Fiscal AGT ---------- */
let ultimoMotorFiscal = null;
/* ---------- Reporting Fiscal (Integração Automática) ----------
   Ferramenta de reporting fiscal para cumprir as obrigações legais/fiscais da AGT: em vez
   de recalcular ou reintroduzir números, este módulo só LÊ os valores já apurados noutros
   módulos (🧾 IVA e Retenções, 👥 Folha de Salários, 📈 DRE, 📑 Mapas Fiscais) e junta-os
   num único checklist por período, com prazo (do 🏛️ Motor Fiscal AGT) e um estado que o
   utilizador pode marcar (Pendente/Submetido/Pago) — essa marcação fica guardada em
   DB.obrigacoesFiscais, por período e por obrigação. Não faz nenhuma submissão eletrónica
   à AGT (o ERP não tem essa integração) — é um painel de controlo interno do que falta
   entregar, com os valores já prontos para copiar para o Portal do Contribuinte. */
function chaveObrigacao(periodo, nome){ return `${periodo}::${nome}`; }
function estadoObrigacao(periodo, nome){
  DB.obrigacoesFiscais = DB.obrigacoesFiscais || {};
  return DB.obrigacoesFiscais[chaveObrigacao(periodo,nome)] || {estado:'Pendente', observacao:''};
}
function viewReportingFiscal(){
  const hojeD = new Date();
  const ano = hojeD.getFullYear();
  const mesIdx = hojeD.getMonth();
  const periodoMes = `${ano}-${String(mesIdx+1).padStart(2,'0')}`;
  const nomeMes = MESES[mesIdx];

  /* IVA do mês corrente — mesma lógica de viewIVA/dadosMensais. */
  const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===periodoMes);
  const ivaLiquidadoMes = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelMes = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaApuradoMes = ivaLiquidadoMes - ivaDedutivelMes;

  /* Retenção na Fonte s/ Serviços de Terceiros do mês — mesma lógica de Mapas Fiscais. */
  const retServicosMes = explodirLancamentos(doMes.filter(l=>l.tipo==='Despesa'))
    .filter(l=>l.categoria==='Serviços de Terceiros')
    .reduce((s,l)=>s+valorEmKZ(l),0) * REGRAS_FISCAIS_AGT.retencaoServicos.taxa;

  /* IRT sobre a Folha de Salários atual (mensal) — mesma lógica de Folha de Salários. */
  const irtMes = DB.salarios.reduce((s,f)=>{
    const bruto = Number(f.base||0)+Number(f.subsidios||0);
    const inssTrab = bruto*0.03;
    return s + calcIRT(bruto-inssTrab);
  },0);
  const inssEntidadeMes = DB.salarios.reduce((s,f)=>{const bruto=Number(f.base||0)+Number(f.subsidios||0); return s+bruto*0.08;},0);

  /* Imposto Industrial — provisão do exercício corrente (já calculada na DRE). */
  const impostoIndustrialAno = impostoIndustrialDoAno(ano);

  /* Imposto Predial sobre Rendas ("RENT") — só se aplica a quem tem receitas de arrendamento
     de imóveis. Zoom's Lodge/Bakery Line não têm essa categoria de receita nos Lançamentos,
     por isso fica configurável manualmente (para o dia em que passe a aplicar-se), em vez de
     inventar um valor. Guardado em DB.obrigacoesFiscaisConfig. */
  DB.obrigacoesFiscaisConfig = DB.obrigacoesFiscaisConfig || {};
  const rentAplicavel = !!DB.obrigacoesFiscaisConfig.rentAplicavel;
  const rentBaseAnual = Number(DB.obrigacoesFiscaisConfig.rentBaseAnual||0);

  const obrigacoes = [
    {chave:'IVA', periodo:periodoMes, nome:`Declaração Periódica de IVA — ${nomeMes}/${ano}`, base:`IVA Liquidado (${fmt(ivaLiquidadoMes)}) − IVA Dedutível (${fmt(ivaDedutivelMes)})`, valor:ivaApuradoMes, origem:'🧾 IVA e Retenções', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'RETSERV', periodo:periodoMes, nome:`Retenção na Fonte s/ Serviços de Terceiros — ${nomeMes}/${ano}`, base:`${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% sobre despesas "Serviços de Terceiros" do mês`, valor:retServicosMes, origem:'📑 Mapas Fiscais', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'IRT', periodo:periodoMes, nome:`IRT — Retenção sobre Salários — ${nomeMes}/${ano}`, base:`Soma do IRT calculado por trabalhador na Folha de Salários atual`, valor:irtMes, origem:'👥 Folha de Salários', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'INSS', periodo:periodoMes, nome:`INSS (Trabalhador 3% + Entidade 8%) — ${nomeMes}/${ano}`, base:`Calculado sobre a Folha de Salários atual`, valor:(DB.salarios.reduce((s,f)=>{const bruto=Number(f.base||0)+Number(f.subsidios||0);return s+bruto*0.03;},0)+inssEntidadeMes), origem:'👥 Folha de Salários', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'II', periodo:String(ano), nome:`Imposto Industrial — Provisão do Exercício ${ano}`, base:`Resultado Antes de Imposto × ${taxaImpostoIndustrial()}% (ver 📈 DRE)`, valor:impostoIndustrialAno, origem:'📈 Demonstração de Resultados', prazo:ultimoDiaUtilDoMes(ano+1,4)},
  ];
  if(rentAplicavel){
    obrigacoes.push({chave:'RENT', periodo:String(ano), nome:`Imposto Predial sobre Rendas ("RENT") — ${ano}`, base:`Base anual configurada manualmente abaixo (${fmt(rentBaseAnual)} Kz)`, valor:rentBaseAnual, origem:'Configuração manual (sem módulo de arrendamento no ERP)', prazo:ultimoDiaUtilDoMes(ano+1,0)});
  }

  const linhas = obrigacoes.map(o=>{
    const est = estadoObrigacao(o.periodo, o.chave);
    const diasRestantes = Math.ceil((o.prazo - hojeD)/86400000);
    return `<tr>
      <td>${o.nome}<div class="note" style="margin-top:2px;">${o.base} · fonte: ${o.origem}</div></td>
      <td class="right">${fmt(o.valor)}</td>
      <td class="right ${diasRestantes<=7?'neg':''}">${fmtData(o.prazo)}${diasRestantes>=0?` (${diasRestantes}d)`:''}</td>
      <td><select data-obr-estado="${o.periodo}::${o.chave}">
        <option ${est.estado==='Pendente'?'selected':''}>Pendente</option>
        <option ${est.estado==='Submetido'?'selected':''}>Submetido</option>
        <option ${est.estado==='Pago'?'selected':''}>Pago</option>
      </select></td>
      <td><input data-obr-obs="${o.periodo}::${o.chave}" value="${est.observacao||''}" placeholder="Nº de referência, notas..."></td>
    </tr>`;
  }).join('');

  const pendentes = obrigacoes.filter(o=>estadoObrigacao(o.periodo,o.chave).estado==='Pendente').length;

  return `
  <h2 style="background:var(--castanho);">📅 Reporting Fiscal (Integração Automática)</h2>
  <p class="note">Este painel não recalcula nada por si — só reúne, num único checklist, os valores já apurados automaticamente nos módulos 🧾 IVA e Retenções, 👥 Folha de Salários, 📈 DRE e 📑 Mapas Fiscais, com o prazo de cada obrigação e um estado que pode marcar à medida que vai submetendo à AGT. Não submete nada eletronicamente — é um painel de controlo interno; a submissão continua a ser feita no <a href="https://portaldocontribuinte.minfin.gov.ao" target="_blank" rel="noopener">Portal do Contribuinte</a>. (Ferramentas como o NovoADN, historicamente focadas no Modelo 22/IES de Portugal, têm vindo a alargar-se a Angola — mas este ERP não está ligado a nenhuma API externa: os dados abaixo vêm sempre dos seus próprios Lançamentos/Salários.)</p>
  <div class="cards">
    <div class="card"><div class="lbl">Obrigações Pendentes</div><div class="val ${pendentes?'neg':'pos'}">${pendentes}</div></div>
    <div class="card"><div class="lbl">IVA Apurado (${nomeMes})</div><div class="val">${fmt(ivaApuradoMes)} Kz</div></div>
    <div class="card"><div class="lbl">Imposto Industrial — Provisão ${ano}</div><div class="val">${fmt(impostoIndustrialAno)} Kz</div></div>
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Obrigação</th><th class="right">Valor Apurado</th><th class="right">Prazo</th><th>Estado</th><th>Observações / Nº Referência</th></tr></thead>
    <tbody>${linhas}</tbody></table>
  </div>
  <h2 class="sub" style="font-size:15px;margin-top:18px;">Imposto Predial sobre Rendas ("RENT")</h2>
  <p class="note">${rentAplicavel ? 'Ativo — a linha "RENT" acima usa a base anual configurada abaixo (o ERP ainda não tem um módulo de receitas de arrendamento próprio; se vier a ter, ligamos automaticamente).' : 'Só se aplica a quem recebe rendas de arrendamento de imóveis. Não há esse tipo de receita nos Lançamentos atuais — por isso está desativado. Ative e indique a base anual se/quando isso mudar.'}</p>
  <form class="inline" id="formRentConfig">
    <div class="grid">
      <div><label>Aplica-se à minha empresa?</label><select name="rentAplicavel"><option value="nao" ${!rentAplicavel?'selected':''}>Não</option><option value="sim" ${rentAplicavel?'selected':''}>Sim</option></select></div>
      <div><label>Base Anual de Rendas Recebidas</label><input type="number" step="0.01" name="rentBaseAnual" value="${rentBaseAnual||''}"></div>
    </div>
    <div class="actions"><button type="submit" class="sec">Guardar</button></div>
  </form>`;
}

function viewMotorFiscal(){
  const hojeD = new Date();
  const ano = hojeD.getFullYear();
  const addMeses = (data,n)=>{ const d=new Date(data); d.setMonth(d.getMonth()+n); return d; };
  /* Próximo prazo de IVA: a declaração do mês anterior ao corrente vence no último dia útil do mês corrente.
     Se já passou esse dia, o próximo prazo relevante é o do mês seguinte (para o mês corrente).
     Usa setMonth (via addMeses) para a virada de ano (dez→jan) ser tratada automaticamente pelo JS. */
  const prazoIvaEsteMes = ultimoDiaUtilDoMes(ano, hojeD.getMonth());
  const mesAnterior = addMeses(new Date(ano, hojeD.getMonth(), 1), -1);
  let prazoIvaProximo = prazoIvaEsteMes, mesDeclarado = MESES[mesAnterior.getMonth()];
  if(hojeD > prazoIvaEsteMes){
    const mesSeguinte = addMeses(new Date(ano, hojeD.getMonth(), 1), 1);
    prazoIvaProximo = ultimoDiaUtilDoMes(mesSeguinte.getFullYear(), mesSeguinte.getMonth());
    mesDeclarado = MESES[hojeD.getMonth()];
  }
  let prazoModelo1Geral = ultimoDiaUtilDoMes(ano, 4); // Maio
  let prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano, 3); // Abril
  let exercicioGeral = ano-1, exercicioSimplificado = ano-1;
  if(hojeD > prazoModelo1Geral){ prazoModelo1Geral = ultimoDiaUtilDoMes(ano+1, 4); exercicioGeral = ano; }
  if(hojeD > prazoModelo1Simplificado){ prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano+1, 3); exercicioSimplificado = ano; }
  const iiG = REGRAS_FISCAIS_AGT.impostoIndustrial;
  const iva = REGRAS_FISCAIS_AGT.iva;
  const ret = REGRAS_FISCAIS_AGT.retencaoServicos;

  const prazos = [
    {nome:`Declaração Periódica de IVA (${mesDeclarado})`, data:prazoIvaProximo, freq:"Mensal"},
    {nome:`Imposto Industrial — Modelo 1 (Regime Geral, exercício ${exercicioGeral})`, data:prazoModelo1Geral, freq:"Anual"},
    {nome:`Imposto Industrial — Declaração Simplificada (exercício ${exercicioSimplificado})`, data:prazoModelo1Simplificado, freq:"Anual"},
  ].sort((a,b)=>a.data-b.data);
  ultimoMotorFiscal = prazos.map(p=>{
    const dias = Math.ceil((p.data - hojeD)/86400000);
    return [p.nome, p.freq, fmtData(p.data), dias>=0?String(dias):'—'];
  });

  return `
  <h2 style="background:var(--castanho);">🏛️ Motor Fiscal AGT</h2>
  <p class="note">⚠️ Referência interna de apoio — taxas e prazos podem mudar por despacho da AGT (já houve prorrogações pontuais). Confirme sempre no <a href="https://portaldocontribuinte.minfin.gov.ao" target="_blank" rel="noopener">Portal do Contribuinte</a> ou com o contabilista antes de submeter ou pagar.</p>

  <h2 class="sub" style="font-size:15px;">Próximos Prazos</h2>
  <div class="tablewrap"><table><thead><tr><th>Obrigação</th><th>Periodicidade</th><th class="right">Prazo</th><th class="right">Dias restantes</th></tr></thead><tbody>
    ${prazos.map(p=>{
      const dias = Math.ceil((p.data - hojeD)/86400000);
      return `<tr><td>${p.nome}</td><td>${p.freq}</td><td class="right">${fmtData(p.data)}</td><td class="right ${dias<=7?'neg':''}">${dias>=0?dias+' dia(s)':'—'}</td></tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="actions" style="margin-top:8px;">
    <button type="button" class="sec" id="btnExportarMotorFiscal">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirMotorFiscal">Imprimir / PDF</button>
  </div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">IVA</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral</td><td class="right">${(iva.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Taxas reduzidas</td><td class="right">${iva.taxasReduzidas.map(t=>(t*100).toFixed(0)+'%').join(' / ')}</td></tr>
    <tr><td>Prazo da declaração</td><td>${iva.prazoDeclaracao}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Retenção na Fonte</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa (${ret.base})</td><td class="right">${(ret.taxa*100).toFixed(1)}%</td></tr>
    <tr><td colspan="2" class="note">${ret.nota}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Imposto Industrial</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral (Regime Geral)</td><td class="right">${(iiG.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Atividades agrícolas/aquícolas/pecuárias</td><td class="right">${(iiG.taxaAgropecuaria*100).toFixed(0)}%</td></tr>
    <tr><td>Banca, seguros, telecomunicações, petrolíferas</td><td class="right">${(iiG.taxaSectorEspecial*100).toFixed(0)}%</td></tr>
    <tr><td>Prazo Modelo 1 (Regime Geral)</td><td>${iiG.prazoModelo1RegimeGeral}</td></tr>
    <tr><td>Prazo Declaração Simplificada</td><td>${iiG.prazoModelo1RegimeSimplificado}</td></tr>
    <tr><td>Limiar do Regime Simplificado</td><td>${iiG.limiarRegimeSimplificado}</td></tr>
  </tbody></table></div>`;
}

/* ---------- Mapas Fiscais (Retenções na Fonte + Fornecedores/Clientes por NIF) ---------- */
let ultimoMapasFiscais = null;
function viewMapasFiscais(){
  const anos = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))].filter(Boolean).sort((a,b)=>b-a);
  const ano = anos[0] || new Date().getFullYear();
  const doAno = DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)));

  /* Mapa de Retenções na Fonte: despesas de "Serviços de Terceiros" com retenção estimada. */
  const retencoes = explodirLancamentos(doAno.filter(l=>l.tipo==='Despesa'))
    .filter(l=>l.categoria==='Serviços de Terceiros')
    .map(l=>({data:l.data, entidade:l.entidade||'—', nif:l.nif||'—', base:l.valor, retencao:l.valor*REGRAS_FISCAIS_AGT.retencaoServicos.taxa}))
    .sort((a,b)=>a.data.localeCompare(b.data));
  const totalBase = retencoes.reduce((s,r)=>s+r.base,0);
  const totalRetido = retencoes.reduce((s,r)=>s+r.retencao,0);

  /* Mapa de Fornecedores e Clientes: total anual por NIF/entidade — despesas (fornecedores) e receitas (clientes). */
  const porEntidade = {};
  doAno.filter(l=>l.entidade && l.entidade.trim()).forEach(l=>{
    const chave = `${(l.nif||'—')}|${l.entidade}`;
    if(!porEntidade[chave]) porEntidade[chave] = {entidade:l.entidade, nif:l.nif||'—', compras:0, vendas:0};
    if(l.tipo==='Despesa') porEntidade[chave].compras += valorEmKZ(l);
    else porEntidade[chave].vendas += valorEmKZ(l);
  });
  const listaEntidades = Object.values(porEntidade).sort((a,b)=>(b.compras+b.vendas)-(a.compras+a.vendas));
  const semNIF = listaEntidades.filter(e=>e.nif==='—').length;

  ultimoMapasFiscais = {
    ano,
    retencoes: {cabecalhos:['Data','Entidade','NIF','Base','Retenção'], linhas: retencoes.map(r=>[r.data,r.entidade,r.nif,r.base,r.retencao])},
    entidades: {cabecalhos:['Entidade','NIF','Total Compras','Total Vendas'], linhas: listaEntidades.map(e=>[e.entidade,e.nif,e.compras,e.vendas])},
  };

  return `

/* ---------- Controlo NIF ----------
   Junta o NIF de todas as fontes (Lançamentos + faturas do FaturaBot, pendentes e
   já aprovadas) por entidade, valida o formato, e assinala inconsistências:
   NIFs com formato inválido/a confirmar, entidades sem NIF, e o mesmo NIF usado
   por nomes de entidade diferentes (possível erro de digitação a corrigir). */
function viewControloNIF(){
  const porEntidade = {};
  const registar = (entidade, nif)=>{
    if(!entidade || !entidade.trim()) return;
    const chaveEnt = entidade.trim();
    if(!porEntidade[chaveEnt]) porEntidade[chaveEnt] = {entidade:chaveEnt, nifs:new Set(), ocorrencias:0};
    porEntidade[chaveEnt].nifs.add((nif||'').trim());
    porEntidade[chaveEnt].ocorrencias++;
  };
  DB.lancamentos.forEach(l=>registar(l.entidade, l.nif));
  DB.faturabot.forEach(f=>registar(f.fornecedor, f.nif));

  const linhas = Object.values(porEntidade).map(e=>{
    const nifsValidos = [...e.nifs].filter(n=>n);
    const v = nifsValidos.length ? validarNIF(nifsValidos[0]) : {valido:false, tipo:'', mensagem:'NIF em falta'};
    return {...e, nifPrincipal: nifsValidos[0]||'', multiplosNIF: nifsValidos.length>1, validacao:v};
  }).sort((a,b)=> (a.validacao.valido===true?1:0) - (b.validacao.valido===true?1:0) || a.entidade.localeCompare(b.entidade));

  /* Mesmo NIF usado por entidades com nomes diferentes — indício de nome digitado de formas diferentes. */
  const nifParaEntidades = {};
  Object.values(porEntidade).forEach(e=>{
    [...e.nifs].filter(n=>n).forEach(n=>{
      if(!nifParaEntidades[n]) nifParaEntidades[n] = new Set();
      nifParaEntidades[n].add(e.entidade);
    });
  });
  const nifsPartilhados = Object.entries(nifParaEntidades).filter(([n,ents])=>ents.size>1);

  const semNif = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem==='NIF em falta').length;
  const invalidos = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem!=='NIF em falta').length;
  const aConfirmar = linhas.filter(l=>l.validacao.valido===null).length;
  const validos = linhas.filter(l=>l.validacao.valido===true).length;

  return `
  <h2 style="background:var(--castanho);">🪪 Controlo NIF</h2>
  <p class="note">Verificação de formato (10 dígitos para empresas; 9 dígitos + 2 letras + 3 dígitos para particulares com nº de BI) — não confirma se o NIF existe de facto na AGT, só a estrutura. Consolidado a partir de Lançamentos e faturas do FaturaBot.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Válidos</div><div class="val pos">${validos}</div></div>
    <div class="card"><div class="lbl">A Confirmar</div><div class="val">${aConfirmar}</div></div>
    <div class="card"><div class="lbl">Formato Inválido</div><div class="val neg">${invalidos}</div></div>
    <div class="card"><div class="lbl">Sem NIF</div><div class="val neg">${semNif}</div></div>
  </div>
  ${nifsPartilhados.length? `
  <h2 class="sub" style="font-size:15px;">⚠️ Mesmo NIF em nomes diferentes (possível erro de digitação)</h2>
  <div class="tablewrap"><table><thead><tr><th>NIF</th><th>Nomes usados</th></tr></thead><tbody>
    ${nifsPartilhados.map(([n,ents])=>`<tr><td>${n}</td><td>${[...ents].join(' / ')}</td></tr>`).join('')}
  </tbody></table></div>`:''}
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Por Entidade</h2>
  <div class="tablewrap"><table><thead><tr><th>Entidade</th><th>NIF</th><th>Situação</th><th class="right">Nº Lançamentos/Faturas</th></tr></thead><tbody>
    ${linhas.length? linhas.map(l=>`<tr>
      <td>${l.entidade}</td>
      <td>${l.nifPrincipal||'—'}${l.multiplosNIF?' <span class="note">(vários NIFs diferentes!)</span>':''}</td>
      <td>${l.validacao.valido===true?'✅':(l.validacao.valido===null?'⚠️':'❌')} ${l.validacao.mensagem}${l.validacao.tipo?` (${l.validacao.tipo})`:''}</td>
      <td class="right">${l.ocorrencias}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="note">Sem entidades registadas ainda.</td></tr>`}
  </tbody></table></div>`;
}

/* calcularIVAControlado(): separa o IVA Dedutível "bruto" do "aceite" — compras sem NIF do
   fornecedor OU sem nº de fatura (nFatura) ficam de fora do dedutível aceite, porque a AGT não
   aceita dedução de IVA sem documento fiscal válido. Note: usa l.nFatura (o campo que o
   formulário de Lançamento realmente preenche) e não um campo "documentoFiscal" separado que
   nunca chegava a ser gravado. */
function calcularIVAControlado(){
  const vendas = DB.lancamentos.filter(l=>l.tipo==='Receita' && l.iva==='Sim');
  const compras = DB.lancamentos.filter(l=>l.tipo==='Despesa' && l.iva==='Sim');
  const ivaLiquidado = vendas.reduce((s,l)=>s + valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelBruto = compras.reduce((s,l)=>s + valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const comprasPendentes = compras.filter(l=>!l.nif || !l.nFatura).reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelAceite = Math.max(0, ivaDedutivelBruto-comprasPendentes);
  return {ivaLiquidado, ivaDedutivelBruto, ivaDedutivelAceite, ivaPagar:ivaLiquidado-ivaDedutivelAceite, comprasPendentes};
}

function validarIVACompra(l){
  const alertas=[];
  if(!l.nif) alertas.push('Sem NIF fornecedor');
  if(!l.nFatura) alertas.push('Sem referência da fatura');
  if(l.iva!=='Sim') alertas.push('IVA não marcado');
  return alertas;
}

  <div class="cards">
    <div class="card"><div class="lbl">IVA Liquidado</div><div class="val">${fmt(c.ivaLiquidado)}</div></div>
    <div class="card"><div class="lbl">IVA Dedutível Aceite</div><div class="val">${fmt(c.ivaDedutivelAceite)}</div></div>
    <div class="card"><div class="lbl">IVA a Pagar / Crédito</div><div class="val">${fmt(c.ivaPagar)}</div></div>
  </div>
  <h2 class="sub">Apuramento Mensal (${ano})</h2>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">IVA Liquidado</th><th class="right">IVA Dedutível</th><th class="right">IVA Apurado</th><th class="right">Acumulado</th><th class="right">Retenção Estimada (${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}%)</th></tr></thead>
  <tbody>${linhas}</tbody></table></div>
  <div class="actions" style="margin-top:10px;">
    <button type="button" class="sec" id="btnExportarIVA">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirIVA">Imprimir / PDF</button>
  </div>
  <h2 class="sub">Validação de Compras com IVA</h2>
  <div class="tablewrap"><table><thead><tr><th>Documento</th><th>Pendências</th></tr></thead><tbody>${erros || '<tr><td colspan="2">Nenhuma pendência encontrada</td></tr>'}</tbody></table></div>`;
}
function exportarIVAAtual(){
  const c = calcularIVAControlado();
  const ano = new Date().getFullYear();
  let acumulado=0;
  const dadosMensais = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key);
    const liquidado = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const dedutivel = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const apurado = liquidado-dedutivel;
    acumulado += apurado;
    return {mes:m, liquidado, dedutivel, apurado, acumulado};
  });
  return {c, ano, dadosMensais};
}
