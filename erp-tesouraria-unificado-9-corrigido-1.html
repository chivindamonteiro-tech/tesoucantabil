  /* Itens do formulário de NOVA fatura ficam numa lista em memória (fbItensFormulario),
     re-renderizada dentro do container sempre que muda — assim suportamos várias
     categorias de despesa na mesma fatura antes mesmo de ela existir em DB.faturabot. */
  const renderItensFormulario = ()=>{
    if(!fbItensContainer) return;
    fbItensContainer.innerHTML = fbItensFormulario.map((it,idx)=>`
      <div class="grid" style="grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end;margin-bottom:6px;">
        <div><label>Descrição do item</label><input data-fbf-campo="${idx}:descricao" value="${(it.descricao||'').replace(/"/g,'&quot;')}" placeholder="Ex.: cimento, combustível..."></div>
        <div><label>Valor</label><input type="number" step="0.01" data-fbf-campo="${idx}:valor" value="${it.valor||''}"></div>
        <div><label>Categoria</label><select data-fbf-campo="${idx}:categoria">${optsCategorias(it.categoria,'despesa')}</select></div>
        <div>${fbItensFormulario.length>1 ? `<button type="button" data-fbf-remover="${idx}">Remover</button>` : ''}</div>
      </div>`).join('');
    fbItensContainer.querySelectorAll('[data-fbf-campo]').forEach(el=>{
      const [idx,campo] = el.dataset.fbfCampo.split(':');
      el.onchange = ()=>{ fbItensFormulario[idx][campo] = el.value; if(campo==='valor') atualizarTotalFormulario(); };
    });
    fbItensContainer.querySelectorAll('[data-fbf-remover]').forEach(b=>b.onclick=()=>{
      fbItensFormulario.splice(Number(b.dataset.fbfRemover),1); renderItensFormulario(); atualizarTotalFormulario();
    });
    atualizarTotalFormulario();
  };
  const atualizarTotalFormulario = ()=>{
    const total = fbItensFormulario.reduce((s,i)=>s+(Number(i.valor)||0),0);
    const span = document.getElementById('fbTotalItens');
    if(span) span.textContent = fmt(total);
  };
  if(fbItensContainer){
    if(fbItensFormulario.length===0) fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  }
  const fbAddItemBtn = document.getElementById('fbAddItem');
  if(fbAddItemBtn) fbAddItemBtn.onclick = ()=>{
    fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  };

  if(fbForn) fbForn.oninput=()=>{
    const sug = faturabotSugestao(fbForn.value, '');
    const tag = document.getElementById('fbSugestaoTag');
    if(sug && fbItensFormulario[0]){
      fbItensFormulario[0].categoria = sug.categoria;
      if(sug.conta && ffb && ffb.elements.conta) ffb.elements.conta.value = sug.conta;
      renderItensFormulario();
      tag.textContent = `— 1º item sugerido (${sug.origemSugestao})`;
    } else if(tag) tag.textContent = '';
  };
  const fbNifEl = document.getElementById('fbNif');
  if(fbNifEl) fbNifEl.oninput=()=>{
    const tag = document.getElementById('fbNifTag');
    if(!tag) return;
    const v = validarNIF(fbNifEl.value);
    if(!fbNifEl.value.trim()){ tag.textContent=''; return; }
    tag.textContent = (v.valido===true?'✅ ':v.valido===null?'⚠️ ':'❌ ') + v.mensagem + (v.tipo?` (${v.tipo})`:'');
    tag.style.color = v.valido===true?'green':(v.valido===null?'#b8860b':'#b00');
  };

  const fbArquivo=document.getElementById('fbArquivo');
  if(fbArquivo) fbArquivo.onchange=async()=>{
    const arquivo = fbArquivo.files[0];
    if(!arquivo || !ffb) return;
    const tag = document.getElementById('fbOcrTag');
    const leitor = new FileReader();
    leitor.onload = async()=>{
      const dataUrl = leitor.result;
      const base64 = dataUrl.split(',')[1];
      if(tag) tag.textContent = '🔍 A ler o documento com IA...';
      try{
        if(!supa) throw new Error('sem Supabase');
        const { data, error } = await supa.functions.invoke('faturabot-ocr', { body:{ imageBase64: base64, mediaType: arquivo.type || 'image/jpeg' } });
        if(error) throw error;
        if(data && data.ok && data.campos){
          const c = data.campos;
          const set=(campo,val)=>{ if(val!==undefined && val!==null && val!=='' && ffb.elements[campo]) ffb.elements[campo].value = val; };
          set('fornecedor', c.fornecedor); set('nif', c.nif); set('nFatura', c.nFatura);
          set('data', c.data); set('vencimento', c.vencimento);
          set('moeda', c.moeda); set('iva', c.iva); set('taxaIVA', c.taxaIVA);
          /* A IA pode devolver "itens" (várias despesas na mesma fatura) ou só um valor/descrição total.
             A conta/forma de pagamento é sempre uma só, ao nível da fatura. */
          const sugConta = faturabotSugestao(c.fornecedor, '');
          if(sugConta && sugConta.conta && ffb.elements.conta) ffb.elements.conta.value = sugConta.conta;
          if(Array.isArray(c.itens) && c.itens.length){
            fbItensFormulario.length = 0;
            c.itens.forEach(it=>{
              const sug = faturabotSugestao(c.fornecedor, it.descricao) || {};
              fbItensFormulario.push({descricao:it.descricao||'', valor:it.valor||'', categoria:it.categoriaSugerida||sug.categoria||CATEGORIAS[0]});
            });
          } else if(c.valor){
            fbItensFormulario.length = 0;
            fbItensFormulario.push({descricao:c.descricao||'', valor:c.valor, categoria:CATEGORIAS[0]});
          }
          renderItensFormulario();
          if(fbForn) fbForn.oninput();
          if(tag) tag.textContent = '✅ Documento lido pela IA — confira os campos e itens antes de enviar.';
          toast('Documento lido automaticamente. Confira os campos.');
        } else {
          if(tag) tag.textContent = '⚠️ Não consegui ler automaticamente — preencha os campos manualmente.';
        }
      }catch(e){
        console.warn('OCR indisponível', e);
        if(tag) tag.textContent = '⚠️ Leitura automática indisponível (serviço OCR não ligado) — preencha os campos manualmente.';
      }
    };
    leitor.readAsDataURL(arquivo);
  };

  /* Importação em Lote (CSV/Excel) — cria uma fatura "Pendente" por linha válida,
     mesma lógica de leitura de colunas do Extrato Bancário. Não substitui a aprovação:
     cada linha ainda passa por "✅ Aprovar" antes de gerar o Lançamento. */
  const fbArquivoCSV = document.getElementById('fbArquivoCSV');
  if(fbArquivoCSV) fbArquivoCSV.onchange = async ()=>{
    const arquivo = fbArquivoCSV.files[0];
    if(!arquivo) return;
    const tag = document.getElementById('fbImportTag');
    if(tag) tag.textContent = '📄 A ler o ficheiro...';
    try{
      let faturas = [];
      if(/\.(xlsx|xls)$/i.test(arquivo.name)){
        const buffer = await arquivo.arrayBuffer();
        if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada');
        faturas = parseXLSXFaturaBot(buffer);
      } else {
        const texto = await arquivo.text();
        faturas = parseCSVFaturaBot(texto);
      }
      if(!faturas.length){
        if(tag) tag.textContent = '⚠️ Não consegui identificar linhas de Fornecedor/Data/Valor no ficheiro — confirme o formato e o cabeçalho das colunas.';
        return;
      }
      let importadas = 0, ignoradasDuplicadas = 0;
      faturas.forEach(row=>{
        const dup = DB.faturabot.some(x=>x.fornecedor===row.fornecedor && x.nFatura===row.nFatura && Number(x.valor)===Number(row.valor) && row.nFatura);
        if(dup){ ignoradasDuplicadas++; return; }
        const sug = faturabotSugestao(row.fornecedor, row.descricao) || {};
        const formaPagamento = FORMAS_PAGAMENTO.find(f=>f.toLowerCase()===row.formaPagamento.toLowerCase()) || 'Cash';
        const conta = 'CASH'; // conta por defeito na importação em lote — revista e corrigida manualmente abaixo
        const novo = {
          id: uid(), fornecedor: row.fornecedor, nif: row.nif, nFatura: row.nFatura,
          data: row.data, vencimento:'', moeda: row.moeda||'KZ',
          conta, formaPagamento,
          iva:'Não', taxaIVA:0, unidade: row.unidade||'',
          itens:[{descricao: row.descricao||row.fornecedor, valor: row.valor, categoria: row.categoria||sug.categoria||CATEGORIAS[0]}],
          valor: row.valor,
          origem: origemAutomatica(row.unidade||'', formaPagamento),
          criado: new Date().toISOString(), status:'Pendente',
        };
        DB.faturabot.push(novo);
        importadas++;
      });
      logar('FaturaBot: importação em lote (CSV/Excel)', `${importadas} fatura(s) importada(s)${ignoradasDuplicadas?`, ${ignoradasDuplicadas} ignorada(s) por duplicado`:''}`);
      await saveDB();
      if(tag) tag.textContent = `✅ ${importadas} fatura(s) importada(s) como Pendente${ignoradasDuplicadas?` — ${ignoradasDuplicadas} ignorada(s) por parecer duplicado (mesmo Fornecedor + Nº Fatura + Valor)`:''}. Reveja e aprove abaixo.`;
      toast(`${importadas} fatura(s) importada(s) para o FaturaBot.`);
      render();
    }catch(e){
      console.warn('Erro a importar faturas em lote', e);
      if(tag) tag.textContent = '⚠️ Não consegui ler este ficheiro — confirme se é um CSV ou Excel válido.';
    }
  };

  if(ffb) ffb.onsubmit=async e=>{
    e.preventDefault();
    const arquivo = document.getElementById('fbArquivo').files[0];
    const novo = Object.fromEntries(new FormData(ffb).entries());
    novo.taxaIVA = Number(novo.taxaIVA||0);
    novo.origem = origemAutomatica(novo.unidade, novo.formaPagamento);
    /* A Conta é a que estiver selecionada no formulário (fbConta) — trava sozinha em
       CAIXA TESOURARIA apenas quando a Forma de Pagamento é "Cash" (ver travarContaCash);
       para TPA/Banco/Transferência/M.Express, o utilizador escolhe a conta bancária real
       de onde a despesa está a sair (ou fica pré-preenchida pelo padrão configurado). */
    novo.itens = fbItensFormulario.map(it=>({descricao:it.descricao||'', valor:Number(it.valor)||0, categoria:it.categoria}));
    novo.valor = novo.itens.reduce((s,i)=>s+i.valor,0);
    if(!novo.valor){ toast('Preencha o valor de pelo menos um item da fatura.'); return; }
    novo.id=uid(); novo.criado=new Date().toISOString(); novo.status='Pendente';
    const gravar=async()=>{
      DB.faturabot.push(novo);
      logar('FaturaBot: fatura recebida', `${novo.fornecedor} — ${fmt(novo.valor)} ${novo.moeda} (${novo.itens.length} item(ns))`);
      await saveDB(); toast('Fatura enviada para o FaturaBot — aguardando aprovação.'); ffb.reset();
      fbItensFormulario.length = 0; render();
    };
    if(arquivo){
      const leitor = new FileReader();
      leitor.onload = async()=>{ novo.anexoNome = arquivo.name; novo.anexoBase64 = leitor.result; await gravar(); };
      leitor.readAsDataURL(arquivo);
    } else await gravar();
  };
  document.querySelectorAll('[data-fb-campo]').forEach(el=>el.onchange=async()=>{
    const [id,campo]=el.dataset.fbCampo.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(f){ f[campo]=el.value; await saveDB(); }
  });
  document.querySelectorAll('[data-fb-toggle-itens]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.fbToggleItens;
    if(fbItensAbertos.has(id)) fbItensAbertos.delete(id); else fbItensAbertos.add(id);
    render();
  });
  document.querySelectorAll('[data-fb-item-campo]').forEach(el=>{
    const handler = async()=>{
      const [id,idx,campo] = el.dataset.fbItemCampo.split(':');
      const f = DB.faturabot.find(x=>x.id===id);
      if(!f) return;
      const itens = faturabotGetItens(f);
      itens[idx][campo] = campo==='valor' ? Number(el.value)||0 : el.value;
      f.itens = itens; f.valor = faturabotTotalItens(f);
      await saveDB(); render();

     unidades (Zoom's Lodge e Bakery Line). Regra única, igual para Receita e Despesa:
     - A Conta fica travada em CAIXA TESOURARIA (CASH) apenas quando a Forma de Pagamento
       é "Cash".
     - Para as restantes formas (Banco, TPA, Multicaixa Express, Transferência Bancária) —
       em Receita OU Despesa — a Conta é livre: usa-se a conta bancária real de onde o
       dinheiro sai/entra no momento do lançamento (sugerida pelo padrão configurado, mas
       sempre editável). Ex.: uma despesa paga por transferência sai diretamente da conta
       bancária escolhida, não passa pela Caixa Tesouraria.
     Aplica-se ao Lançamento normal/Fecho de Caixa e ao FaturaBot (que é sempre despesa). */
  function travarContaCash(formaSelId, contaSelId, tipoSelId){
    const formaSel = document.getElementById(formaSelId);
    const contaSel = document.getElementById(contaSelId);
    if(!formaSel || !contaSel) return;
    const aplicar = ()=>{
      /* A CAIXA TESOURARIA (CASH) só recebe lançamentos cuja Forma de Pagamento é "Cash" —
         tanto Receita como Despesa. Todas as outras formas (TPA, Banco, Multicaixa Express,
         Transferência Bancária) usam a conta bancária REAL de onde o dinheiro sai ou para
         onde entra, escolhida (ou sugerida pelo padrão configurado) no momento do lançamento
         — inclui despesas: uma despesa paga por transferência sai diretamente da conta
         bancária certa, não passa pela Caixa Tesouraria. */
      const travar = formaSel.value==='Cash';
      if(travar){
        contaSel.value='CASH';
        contaSel.style.pointerEvents='none'; contaSel.style.opacity='0.65';
        contaSel.title = "Cash usa sempre a CAIXA TESOURARIA (caixa único) — não é editável.";
      } else {
        contaSel.style.pointerEvents=''; contaSel.style.opacity=''; contaSel.title='';
      }
    };
    formaSel.addEventListener('change', aplicar);
    contaSel.addEventListener('change', aplicar); // reforça caso a trava seja contornada (ex.: teclado)
    if(tipoSelId){ const tipoSel = document.getElementById(tipoSelId); if(tipoSel) tipoSel.addEventListener('change', aplicar); }
    aplicar();
  }

    const contaEl = document.querySelector(`[data-contapag="${key}:${id}"]`);
    const catEl = document.querySelector(`[data-catpag="${key}:${id}"]`);
    let valorPagamento = inputEl && inputEl.value ? Number(inputEl.value) : saldoAtual;
    if(!valorPagamento || valorPagamento<=0){ toast('Indique um valor de pagamento válido.'); return; }
    if(valorPagamento > saldoAtual + 0.5){
      if(!confirm(`O valor indicado (${fmt(valorPagamento)}) é superior ao saldo em aberto (${fmt(saldoAtual)}). Deseja registar apenas o saldo em aberto?`)) return;
      valorPagamento = saldoAtual;
    }
    const formaPagamento = (formaEl && formaEl.value) || 'Cash';
    const contaCodigo = formaPagamento==='Cash' ? 'CASH' : ((contaEl && contaEl.value) || 'CASH');
    const categoria = (catEl && catEl.value) || cfg.categoriaDefault || '';
    const dataPag = hoje();
    if(anoEncerrado(dataPag)){ toast(`O ano ${dataPag.slice(0,4)} está ENCERRADO — não é possível lançar nesse período. Reabra o ano em "Encerramento Anual" se for mesmo necessário.`); return; }
    if(periodoFechado(dataPag) && !confirm('Este período (mês) está marcado como FECHADO em "Fecho de Períodos". Confirma mesmo assim o lançamento?')) return;
    const contaNome = (CONTAS.find(cc=>cc.codigo===contaCodigo)||{}).nome || contaCodigo;
    const observacao = (obsEl&&obsEl.value)||'';
    c.pagamentos = c.pagamentos || [];
    const pagamentoId = uid();
    c.pagamentos.push({id:pagamentoId, data:dataPag, valor:valorPagamento, observacao, formaPagamento, conta:contaCodigo});
    c.valorPago = Number(c.valorPago||0) + valorPagamento;
    const novoSaldo = Number(c.valor||0) - c.valorPago;
    const quitado = novoSaldo <= 0.5;
    c.status = quitado ? 'Pago' : 'Parcial';
    DB[key] = DB[key].map(x=>x.id===id?c:x);
    /* Espelha o pagamento como Lançamento de Tesouraria (Despesa se for a pagar,
       Receita se for a receber), na Forma de Pagamento e Conta escolhidas acima —
       é isto que faz o pagamento aparecer no saldo certo da Caixa/Banco. */
    const lancPagamento = {
      id: uid(), historico:[], contaCorrenteId:id, contaCorrenteChave:key, pagamentoId,
      data: dataPag, tipo: cfg.direcao==='receber' ? 'Receita' : 'Despesa', unidade:'',
      categoria, formaPagamento, conta: contaCodigo,
      entidade: c.entidade||'', nif:c.nif||'', nFatura:c.nFatura||'',
      valor: valorPagamento, moeda:'KZ', iva:'Não', taxaIVA:0,

      origem: cfg.titulo||'',
    };
    DB.lancamentos.push(lancPagamento);
    logar(quitado?'Pagamento registado (quitação total)':'Pagamento parcial registado',
      `${cfg.wording||'Entidade'} ${c.entidade} — ${fmt(valorPagamento)} via ${formaPagamento} (${contaNome}) — saldo remanescente: ${fmt(Math.max(0,novoSaldo))}`);
    await saveDB(); toast(quitado?`Pagamento registado em ${contaNome} — conta quitada.`:`Pagamento parcial registado em ${contaNome}.`); render();

    try{
      let linhas = [], numContaDetectado = '';
      if(/\.(xlsx|xls)$/i.test(arquivo.name)){
        const buffer = await arquivo.arrayBuffer();
        if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada');
        ({linhas, numContaDetectado} = parseXLSXExtrato(buffer));
      } else {
        const texto = await arquivo.text();
        ({linhas, numContaDetectado} = parseCSVExtrato(texto));
      }
      if(!linhas.length){
        if(tag) tag.textContent = '⚠️ Não consegui identificar linhas de Data/Descrição/Valor no ficheiro — confirme o formato.';
        return;
      }
      /* Confirma que o número de conta mencionado no próprio ficheiro corresponde à
         conta selecionada — cada conta do Plano de Contas está ligada a um número de
         conta bancário real (ex.: BFA-001 termina em "...001"). Se o ficheiro for de
         outra conta, a conciliação nunca vai bater por muito que o valor seja igual. */
      const contaSelecionada = CONTAS.find(c=>c.codigo===contaCodigo);
      const contaDetectada = detectarContaPorNumero(numContaDetectado);
      if(contaDetectada && contaDetectada.codigo!==contaCodigo){

        if(!prosseguir){ if(tag) tag.textContent = '⚠️ Importação cancelada — confirme se está na aba da conta certa.'; return; }
      }
      DB.extratoImportado = DB.extratoImportado || {};
      DB.extratoImportado[contaCodigo] = (DB.extratoImportado[contaCodigo]||[]).concat(linhas);
      logar('Extrato importado (CSV/Excel)', `Conta ${contaCodigo} — ${linhas.length} linha(s)`);
      await saveDB();
      if(tag) tag.textContent = `✅ ${linhas.length} linha(s) importada(s) e conciliadas automaticamente.`;
      toast(`${linhas.length} linha(s) do extrato importadas.`);

      console.warn('Erro a importar extrato', e);

    /* Alerta de reconciliação: verifica se, para o mês/ano do SAF-T a exportar, há

    const chaveMesSaft = `${saftAnoAtivo}-${String(saftMesAtivo).padStart(2,'0')}`;

    DB.existencias[inp.dataset.existencia]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-existencia-qtd]').forEach(inp=>inp.onchange=async()=>{
    DB.existenciasQtd[inp.dataset.existenciaQtd]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-orc]').forEach(inp=>inp.onchange=async()=>{
    DB.orcamento[inp.dataset.orc]=inp.value; await saveDB(); render();
  });
  const fi=document.getElementById('formImob');
  if(fi) fi.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fi).entries());
    novo.id=uid(); DB.imobilizado.push(novo); await saveDB(); toast('Bem adicionado.'); render();
  };
  document.querySelectorAll('[data-delimob]').forEach(b=>b.onclick=async()=>{
    DB.imobilizado=DB.imobilizado.filter(a=>a.id!==b.dataset.delimob); await saveDB(); render();
  });

  document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async()=>{
    const email=sel.dataset.role;
    const novoPapel=sel.value;
    await supa.from('team_roles').upsert({email, role: novoPapel});
    if(email===meuEmail) meuPapel = novoPapel;
    toast('Papel atualizado.'); await carregarMembros(); render();
  });
  document.querySelectorAll('[data-posto]').forEach(sel=>sel.onchange=async()=>{
    const email=sel.dataset.posto;
    const novoPosto=sel.value||null;
    const { error } = await supa.from('team_roles').upsert({email, posto: novoPosto});
    if(error){ toast('Não foi possível guardar — falta correr o SQL "alter table team_roles add column if not exists posto text;" no Supabase.'); return; }
    if(email===meuEmail) meuPosto = novoPosto;
    toast('Posto de venda atualizado.'); await carregarMembros(); render();
  });

  const zpFraseEl = document.getElementById('zpFrase');
  const btnZonaPerigoApagar = document.getElementById('btnZonaPerigoApagar');
  const normalizarZp = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
  const ZP_FRASE_ALVO = normalizarZp('APAGAR TODOS OS LANÇAMENTOS');
  if(zpFraseEl && btnZonaPerigoApagar){
    zpFraseEl.oninput = ()=>{ btnZonaPerigoApagar.disabled = normalizarZp(zpFraseEl.value) !== ZP_FRASE_ALVO; };
  }
  if(btnZonaPerigoApagar) btnZonaPerigoApagar.onclick = async ()=>{
    if(!DB.lancamentos.length){ toast('Já não há lançamentos para apagar.'); return; }
    if(!confirm(`Isto vai apagar TODOS os ${DB.lancamentos.length} lançamentos (todos os postos, todos os meses), para todos os utilizadores. Um backup em Excel vai ser descarregado antes de apagar. Esta ação não pode ser desfeita. Tem a certeza?`)) return;
    const linhas = DB.lancamentos.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(l=>[
      l.data||'', l.tipo||'', l.unidade||'', l.turno||'', l.formaPagamento||'', l.categoria||'', l.conta||'',
      l.entidade||'', l.nif||'', l.nFatura||'', Number(l.valor)||0, l.moeda||'', l.quantidade??'', l.produtoId||'',
      l.iva||'', l.taxaIVA??'', l.descricao||'', l.origem||''
    ]);
    exportarExcel(`backup-lancamentos-antes-de-apagar-${hoje()}`, 'Lançamentos', [
      'Data','Tipo','Unidade','Turno','Forma de Pagamento','Categoria','Conta','Entidade','NIF','Nº Fatura',
      'Valor','Moeda','Quantidade','Produto (SKU)','IVA','Taxa IVA','Descrição','Origem'
    ], linhas);
    const totalApagado = DB.lancamentos.length;
    DB.lancamentos = [];
    logar('Zona de Perigo — Lançamentos apagados', `${totalApagado} lançamento(s) apagados por ${meuEmail}, backup Excel descarregado antes.`);
    await saveDB();
    zpFraseEl.value=''; btnZonaPerigoApagar.disabled=true;
    toast(`${totalApagado} lançamento(s) apagados. Backup descarregado.`);
    render();
  };

  const fs=document.getElementById('formSal');
  if(fs) fs.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fs).entries());
    novo.id=uid(); DB.salarios.push(novo); await saveDB(); toast('Trabalhador adicionado.'); render();
  };
  document.querySelectorAll('[data-delsal]').forEach(b=>b.onclick=async()=>{
    DB.salarios=DB.salarios.filter(s=>s.id!==b.dataset.delsal); await saveDB(); render();
  });
  const btnExportarSalarios=document.getElementById('btnExportarSalarios');
  if(btnExportarSalarios) btnExportarSalarios.onclick=()=>{
    if(!DB.salarios.length){ toast('Sem trabalhadores para exportar.'); return; }
    exportarExcel('folha-salarios','Salários',
      ['Nome','Função','Base','Subsídios','Bruto','INSS (3%)','IRT','Outros Desc.','Líquido','INSS Emp.(8%)','Custo Total'],
      DB.salarios.map(s=>{
        const bruto=Number(s.base||0)+Number(s.subsidios||0);
        const inssTrab=bruto*0.03, irt=calcIRT(bruto-inssTrab);
        const liquido=bruto-inssTrab-irt-Number(s.outrosDesc||0);
        const inssEmp=bruto*0.08;
        return [s.nome,s.funcao||'',Number(s.base||0),Number(s.subsidios||0),bruto,inssTrab,irt,Number(s.outrosDesc||0),liquido,inssEmp,bruto+inssEmp];
      }));
  };
  const btnImprimirSalarios=document.getElementById('btnImprimirSalarios');
  if(btnImprimirSalarios) btnImprimirSalarios.onclick=()=>{
    if(!DB.salarios.length){ toast('Sem trabalhadores para imprimir.'); return; }
    imprimirRelatorioGenerico('Folha de Salários','INSS: 3% trabalhador + 8% empresa. IRT: tabela oficial (Lei n.º 14/25, OGE 2026).',
      ['Nome','Função','Bruto','INSS (3%)','IRT','Líquido','Custo Total'],
      DB.salarios.map(s=>{
        const bruto=Number(s.base||0)+Number(s.subsidios||0);
        const inssTrab=bruto*0.03, irt=calcIRT(bruto-inssTrab);
        const liquido=bruto-inssTrab-irt-Number(s.outrosDesc||0);
        return [s.nome,s.funcao||'',fmt(bruto),fmt(inssTrab),fmt(irt),fmt(liquido),fmt(bruto+bruto*0.08)];
      }),
      `${DB.salarios.length} trabalhador(es)`);
  };
}

/* iniciar() já chamado acima */
</script>
</body>
</html>
