/* ---------- Balanço Patrimonial (simplificado) ---------- */
let ultimoBalanco = null;
function viewBalanco(){
  const {contas} = calcularBalancetePartidasDobradas();
  const saldoConta = (cod)=> contas[cod] ? contas[cod].debito - contas[cod].credito : 0;

  /* Ativo: soma o saldo devedor de todas as contas de Caixa/Bancos (códigos definidos em
     CONTAS, já incluindo o efeito das reavaliações de Diferenças Cambiais) + saldo da conta
     Clientes líquido da Provisão de Cobrança Duvidosa — tudo extraído do Balancete de
     partidas dobradas, não de um filtro solto. */
  const caixaBancos = CONTAS.reduce((s,c)=> s + saldoConta(c.codigo), 0);
  const provisaoCobrancaDuvidosa = provisaoCobrancaDuvidosaAtual();
  const contasReceber = Math.max(0, saldoConta(CONTA_CLIENTES.cod) - provisaoCobrancaDuvidosa);
  const imobilizadoLiquido = DB.imobilizado.reduce((s,a)=> s + Math.max(0, Number(a.valor||0) - amortizacaoAcumuladaDoBem(a)), 0);
  const ativoTotal = caixaBancos+contasReceber+imobilizadoLiquido;

  /* Passivo: saldo credor da conta Fornecedores + qualquer outra conta do Plano de Contas
     explicitamente marcada como "Passivo" (Suprimentos de Sócios, Imposto Industrial a
     Pagar, Provisão de Férias/13º a Pagar). */
  const contasPagar = Math.max(0, -saldoConta(CONTA_FORNECEDORES.cod));
  const suprimentos = Math.max(0, -saldoConta("25"));
  const impostoAPagar = Math.max(0, -saldoConta(CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod));
  const feriasAPagar = Math.max(0, -saldoConta(CONTA_FERIAS_13_A_PAGAR.cod));
  const codigosPassivoOutros = [...new Set(Object.values(CATEGORIA_CONTA).filter(c=>c.tipo==='Passivo').map(c=>c.cod))]
    .filter(cod=>!["25",CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod,CONTA_FERIAS_13_A_PAGAR.cod].includes(cod));
  const passivoOutros = codigosPassivoOutros.reduce((s,cod)=> s + Math.max(0, -saldoConta(cod)), 0);
  const passivoExtra = suprimentos + impostoAPagar + feriasAPagar + passivoOutros;
  const passivoTotal = contasPagar + passivoExtra;

  /* Capital Próprio: calculado de forma INDEPENDENTE (não é "o que sobra" para o Balanço
     bater à força) — Capital Social (declarado pela empresa) + Resultados Transitados
     (resultado líquido acumulado de anos fiscais anteriores) + Resultado do Exercício
     (receitas - despesas - custos do ano corrente, já líquido de amortizações, provisões,
     diferenças cambiais e Imposto Industrial). */
  const anoCorrente = new Date().getFullYear();
  const capitalSocial = Number((DB.empresaConfig||{}).capitalSocial || 0);
  const anosComMovimento = [...new Set(DB.lancamentos.map(l=>mesKey(l.data).slice(0,4)))].map(Number);
  const resultadosTransitados = anosComMovimento.filter(a=>a<anoCorrente).reduce((s,a)=>s+resultadoLiquidoDoAno(a),0);
  const resultadoExercicio = resultadoLiquidoDoAno(anoCorrente);
  const capitalProprio = capitalSocial + resultadosTransitados + resultadoExercicio;

  const diferenca = ativoTotal - (passivoTotal + capitalProprio);
  const bate = Math.abs(diferenca) < 0.5;

  ultimoBalanco = {
    anoCorrente,
    linhas: [
      ['Caixa e Bancos', fmt(caixaBancos), ''],
      ['Clientes (Contas a Receber)', fmt(contasReceber), ''],
      ['Ativo Fixo Líquido (Imobilizado)', fmt(imobilizadoLiquido), ''],
      ['TOTAL DO ATIVO', fmt(ativoTotal), ''],
      ['Fornecedores (Contas a Pagar)', '', fmt(contasPagar)],
      ['Suprimentos de Sócios', '', fmt(suprimentos)],
      ['Estado — Imposto Industrial a Pagar', '', fmt(impostoAPagar)],
      ['Provisão de Férias e 13º Salário a Pagar', '', fmt(feriasAPagar)],
      ['Outros Passivos', '', fmt(passivoOutros)],
      ['Capital Social', '', fmt(capitalSocial)],
      ['Resultados Transitados (anos anteriores)', '', fmt(resultadosTransitados)],
      [`Resultado do Exercício (${anoCorrente})`, '', fmt(resultadoExercicio)],
      ['TOTAL PASSIVO + CAPITAL PRÓPRIO', '', fmt(passivoTotal+capitalProprio)],
    ],
  };

  return `
  <h2>🏛️ Balanço Patrimonial</h2>
  <p class="note">O Capital Próprio já não é calculado "à força" para o balanço bater — é a soma de Capital Social + Resultados Transitados (anos anteriores) + Resultado do Exercício (ano corrente), tal como numa contabilidade real. O Resultado do Exercício já inclui Amortizações, Provisão de Férias/13º, Provisão de Cobrança Duvidosa, Diferenças Cambiais e a Provisão de Imposto Industrial (ver 📈 DRE para o detalhe). O Resultado exclui entradas de Suprimentos (empréstimos de sócios) — isso é Passivo, não lucro. Se o Ativo não coincidir com Passivo + Capital Próprio, o sistema avisa em vez de esconder a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:14px;">
    <div><label>Capital Social</label><input type="number" step="0.01" id="balancoCapitalSocial" value="${capitalSocial||''}" placeholder="0.00"></div>
  </div>

    Ativo: <b>${fmt(ativoTotal)} Kz</b> &nbsp;|&nbsp; Passivo + Capital Próprio: <b>${fmt(passivoTotal+capitalProprio)} Kz</b> &nbsp;|&nbsp;

/* ---------- Demonstração de Fluxos de Caixa (DFC) — Método Direto ---------- */
let fluxoCaixaAnoAtivo = new Date().getFullYear();
let ultimoFluxoCaixa = null;
function viewFluxoCaixa(){
  const ano = fluxoCaixaAnoAtivo;
  const chaveAno = String(ano);
  const todosCash = DB.lancamentos.filter(l=> CONTAS.some(c=>c.codigo===l.conta));

  /* Saldo inicial de caixa = tudo o que já se moveu nas contas de Caixa/Bancos ANTES do
     1º dia do ano selecionado (independentemente da atividade). */
  const saldoInicial = todosCash.filter(l=>mesKey(l.data) < `${chaveAno}-01`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doAno = todosCash.filter(l=> mesKey(l.data).startsWith(chaveAno));

  /* Classifica cada movimento de caixa do ano na atividade certa. "Transferência entre
     Contas" é excluída das 3 atividades — é dinheiro que sai de uma conta da empresa e
     entra noutra conta da própria empresa, não é fluxo real de/para fora da empresa (o
     efeito líquido no Saldo de Caixa total é sempre ~0, por isso só distorceria os
     totais se fosse incluída). */
  const isInvestimento = l => l.categoria==='Investimentos / Imobilizado';
  const isFinanciamento = l => l.categoria==='Suprimentos';
  const isTransferencia = l => l.categoria==='Transferência entre Contas';
  const isOperacional = l => !isInvestimento(l) && !isFinanciamento(l) && !isTransferencia(l);

  const somaTipo = (lista, tipo)=> lista.filter(l=>l.tipo===tipo).reduce((s,l)=>s+valorEmKZ(l),0);

  const opRecebimentos = somaTipo(doAno.filter(isOperacional), 'Receita');
  const opPagamentos = somaTipo(doAno.filter(isOperacional), 'Despesa');
  const fluxoOperacional = opRecebimentos - opPagamentos;

  const invEntradas = somaTipo(doAno.filter(isInvestimento), 'Receita');
  const invSaidas = somaTipo(doAno.filter(isInvestimento), 'Despesa');
  const fluxoInvestimento = invEntradas - invSaidas;

  const finEntradas = somaTipo(doAno.filter(isFinanciamento), 'Receita');
  const finSaidas = somaTipo(doAno.filter(isFinanciamento), 'Despesa');
  const fluxoFinanciamento = finEntradas - finSaidas;

  const transferenciasEntradas = somaTipo(doAno.filter(isTransferencia), 'Receita');
  const transferenciasSaidas = somaTipo(doAno.filter(isTransferencia), 'Despesa');

  const variacaoLiquida = fluxoOperacional + fluxoInvestimento + fluxoFinanciamento;
  const saldoFinal = saldoInicial + variacaoLiquida;

  /* Confirmação: o Saldo Final calculado aqui tem de bater com o saldo real de Caixa e
     Bancos a 31/Dez desse ano (soma de todos os movimentos até ao fim do ano, por
     qualquer atividade — incluindo transferências, que aqui se anulam). */
  const saldoRealAoFimDoAno = todosCash.filter(l=>mesKey(l.data) <= `${chaveAno}-12`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const bate = Math.abs(saldoFinal - saldoRealAoFimDoAno) < 0.5;

  const anosDisponiveis = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))].concat([new Date().getFullYear()]);
  const anosUnicos = [...new Set(anosDisponiveis)].sort((a,b)=>b-a);

  ultimoFluxoCaixa = {
    ano,
    linhas: [
      ['Recebimentos de Clientes / Vendas', fmt(opRecebimentos)],
      ['Pagamentos a Fornecedores e Despesas Operacionais', `(${fmt(opPagamentos)})`],
      ['Fluxo de Caixa das Atividades Operacionais', fmt(fluxoOperacional)],
      ['Entradas de Investimento', fmt(invEntradas)],
      ['Saídas de Investimento', `(${fmt(invSaidas)})`],
      ['Fluxo de Caixa das Atividades de Investimento', fmt(fluxoInvestimento)],
      ['Suprimentos de Sócios Recebidos', fmt(finEntradas)],
      ['Reembolsos de Suprimentos aos Sócios', `(${fmt(finSaidas)})`],
      ['Fluxo de Caixa das Atividades de Financiamento', fmt(fluxoFinanciamento)],
      ['Variação Líquida de Caixa no Ano', fmt(variacaoLiquida)],
      ['Saldo de Caixa no Início do Ano', fmt(saldoInicial)],
      ['Saldo de Caixa no Fim do Ano', fmt(saldoFinal)],
    ],
  };

  return `
  <h2>🌊 Demonstração de Fluxos de Caixa (Método Direto)</h2>
  <p class="note">Mostra de onde veio e para onde foi o dinheiro da Caixa Tesouraria e das contas bancárias durante o ano — separado em Atividades Operacionais (o negócio em si), de Investimento (compra/venda de equipamento e imobilizado) e de Financiamento (empréstimos/suprimentos de sócios). Transferências entre contas da própria empresa não entram (não representam entrada/saída real de dinheiro da empresa).</p>
  <div class="grid" style="grid-template-columns:160px;margin-bottom:14px;">
    <div><label>Ano</label><select id="fluxoCaixaAnoSel">${anosUnicos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>

  <div class="tablewrap" style="margin-bottom:14px;">
    <table><tbody>
      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades Operacionais</b></td></tr>
      <tr><td>Recebimentos de Clientes / Vendas</td><td class="right">${fmt(opRecebimentos)}</td></tr>
      <tr><td>Pagamentos a Fornecedores e Despesas Operacionais</td><td class="right">(${fmt(opPagamentos)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades Operacionais</b></td><td class="right"><b>${fmt(fluxoOperacional)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Investimento</b></td></tr>
      <tr><td>Entradas (venda de imobilizado)</td><td class="right">${fmt(invEntradas)}</td></tr>
      <tr><td>Saídas (compra de imobilizado/equipamento)</td><td class="right">(${fmt(invSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Investimento</b></td><td class="right"><b>${fmt(fluxoInvestimento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Financiamento</b></td></tr>
      <tr><td>Suprimentos de Sócios Recebidos</td><td class="right">${fmt(finEntradas)}</td></tr>
      <tr><td>Reembolsos de Suprimentos aos Sócios</td><td class="right">(${fmt(finSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Financiamento</b></td><td class="right"><b>${fmt(fluxoFinanciamento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Resumo</b></td></tr>
      <tr><td><b>Variação Líquida de Caixa no Ano</b></td><td class="right"><b>${fmt(variacaoLiquida)}</b></td></tr>
      <tr><td>Saldo de Caixa no Início do Ano</td><td class="right">${fmt(saldoInicial)}</td></tr>
      <tr><td><b>Saldo de Caixa no Fim do Ano</b></td><td class="right"><b>${fmt(saldoFinal)}</b></td></tr>
    </tbody></table>
  </div>

  ${(transferenciasEntradas||transferenciasSaidas) ? `<p class="note">Transferências internas entre contas da empresa neste ano (não incluídas acima): ${fmt(transferenciasEntradas)} Kz recebidas / ${fmt(transferenciasSaidas)} Kz enviadas — efeito líquido no saldo total: ${fmt(transferenciasEntradas-transferenciasSaidas)} Kz.</p>`:''}

  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};">
    ${bate?'✅ O Saldo de Caixa no Fim do Ano bate com o saldo real de Caixa e Bancos.':'⚠️ O Saldo de Caixa calculado não bate com o saldo real — reveja lançamentos deste ano.'}
  </div>
  <div class="actions" style="margin-top:14px;">
    <button type="button" class="sec" id="btnExportarFluxoCaixa">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirFluxoCaixa">Imprimir / PDF</button>
  </div>`;
}

/* ---------- Existências e CMV ---------- */
let ultimoExistencias = null;
function viewExistencias(){
  const ano = new Date().getFullYear();
  let inicial = 0, inicialQtd = 0;
  const linhasExport = [];
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data)===key)).filter(l=>l.categoria==='Compra de Mercadorias para Revenda');
    const compras = doMes.reduce((s,l)=>s+valorEmKZ(l),0);
    const comprasQtd = doMes.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const final = Number(DB.existencias[key]||0);
    const finalQtd = Number(DB.existenciasQtd[key]||0);
    const cmv = inicial+compras-final;
    const consumoQtd = inicialQtd+comprasQtd-finalQtd;
    linhasExport.push([m, inicial, compras, final, cmv, inicialQtd, comprasQtd, finalQtd, consumoQtd]);
    const linha = `<tr><td>${m}</td>
      <td class="right">${fmt(inicial)}</td><td class="right">${fmt(compras)}</td>
      <td><input type="number" step="0.01" data-existencia="${key}" value="${DB.existencias[key]||''}" placeholder="Valor" style="width:110px;"></td>
      <td class="right"><b>${fmt(cmv)}</b></td>
      <td class="right">${fmt(inicialQtd)}</td><td class="right">${fmt(comprasQtd)}</td>
      <td><input type="number" step="0.01" data-existencia-qtd="${key}" value="${DB.existenciasQtd[key]||''}" placeholder="Contagem" style="width:100px;"></td>
      <td class="right"><b>${fmt(consumoQtd)}</b></td></tr>`;
    inicial = final; inicialQtd = finalQtd;
    return linha;
  }).join('');
  ultimoExistencias = {ano, linhas: linhasExport};
  return `
  <h2>📦 Existências e CMV</h2>
  <p class="note">Método de inventário periódico: CMV = Existências Iniciais + Compras do Mês − Existências Finais. As colunas de Quantidade vêm automaticamente do campo "Quantidade" dos Lançamentos (categoria "Compra de Mercadorias para Revenda") — preencha só a contagem física do fim do mês (valor e/ou quantidade); o mês seguinte transita sozinho.</p>
  <div class="tablewrap"><table><thead><tr>
    <th>Mês</th><th class="right">Exist. Iniciais (Kz)</th><th class="right">Compras (Kz)</th><th>Exist. Finais (Kz)</th><th class="right">CMV (Kz)</th>
    <th class="right">Exist. Iniciais (Qtd.)</th><th class="right">Compras (Qtd.)</th><th>Exist. Finais (Qtd.)</th><th class="right">Consumo (Qtd.)</th>
  </tr></thead>
  <tbody>${linhas}</tbody></table></div>
  <div class="actions" style="margin-top:14px;">
    <button type="button" class="sec" id="btnExportarExistencias">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirExistencias">Imprimir / PDF</button>
  </div>`;
}

  <div class="cards">
    <div class="card"><div class="lbl">Total Receitas em Cash (Ano)</div><div class="val pos">${fmt(totRec)} Kz</div></div>
    <div class="card"><div class="lbl">Total Despesas em Cash (Ano)</div><div class="val neg">${fmt(totDesp)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo Cash Acumulado</div><div class="val ${totRec-totDesp>=0?'pos':'neg'}">${fmt(totRec-totDesp)} Kz</div></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo do Mês</th></tr></thead><tbody>${linhas}</tbody></table></div>
  ${viewControloCashDiario()}`;
}

/* ---------- Controlo de Cash Diário (Caixa Tesouraria) ---------- */
function viewControloCashDiario(){
  const doCashTodos = DB.lancamentos.filter(l=>l.conta==='CASH').slice().sort((a,b)=> a.data.localeCompare(b.data));
  const mesRef = cashDiarioMes || hoje().slice(0,7);

  /* Saldo inicial = tudo o que entrou/saiu na Caixa Tesouraria ANTES do 1º dia do mês selecionado. */
  const saldoInicialMes = doCashTodos
    .filter(l=> mesKey(l.data) < mesRef)
    .reduce((s,l)=> s + (l.tipo==='Receita' ? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doMes = doCashTodos.filter(l=> mesKey(l.data)===mesRef);
  const dias = [...new Set(doMes.map(l=>l.data))].sort();

  let saldoCorrente = saldoInicialMes;
  const linhasDias = dias.map(dia=>{
    const doDia = doMes.filter(l=>l.data===dia);
    const entradas = doDia.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const saidas = doDia.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const saldoAbertura = saldoCorrente;
    saldoCorrente = saldoAbertura + entradas - saidas;
    const declaracoesDia = (DB.fechosCaixa||[]).filter(f=>f.data===dia);
    const totalContadoDia = declaracoesDia.reduce((s,f)=> s + (f.moeda==='KZ' ? Number(f.valorContado||0) : (Number(f.valorContado||0) * (taxaCambio(f.moeda,f.data)||1))), 0);
    const diferenca = declaracoesDia.length ? totalContadoDia - saldoCorrente : null;
    return {dia, saldoAbertura, entradas, saidas, saldoFecho:saldoCorrente, totalContadoDia, temDeclaracao:declaracoesDia.length>0, diferenca, nLanc:doDia.length};
  });

  const totalEntradasMes = linhasDias.reduce((s,l)=>s+l.entradas,0);
  const totalSaidasMes = linhasDias.reduce((s,l)=>s+l.saidas,0);
  const saldoFinalMes = linhasDias.length ? linhasDias[linhasDias.length-1].saldoFecho : saldoInicialMes;

  const opcoesMes = [...new Set(doCashTodos.map(l=>mesKey(l.data)).concat([hoje().slice(0,7)]))].sort().reverse();

  return `
  <h2 class="sub" style="font-size:15px;margin-top:22px;">📅 Controlo de Cash Diário — Caixa Tesouraria</h2>
  <p class="note">Saldo dia-a-dia da Caixa Tesouraria (conta CASH): saldo de abertura, entradas, saídas e saldo de fecho, com o saldo acumulado a transitar de um dia para o outro. Quando existe uma contagem física declarada no "Fecho de Caixa" para esse dia, mostra também a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:10px;">
    <div><label>Mês</label><select id="cashDiarioMesSel">${opcoesMes.map(m=>`<option value="${m}" ${m===mesRef?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">Saldo Inicial do Mês</div><div class="val">${fmt(saldoInicialMes)} Kz</div></div>
    <div class="card"><div class="lbl">Entradas do Mês</div><div class="val pos">${fmt(totalEntradasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saídas do Mês</div><div class="val neg">${fmt(totalSaidasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo Final do Mês</div><div class="val ${saldoFinalMes>=0?'pos':'neg'}">${fmt(saldoFinalMes)} Kz</div></div>
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th class="right">Saldo Abertura</th><th class="right">Entradas</th><th class="right">Saídas</th><th class="right">Saldo Fecho</th><th class="right">Contado (físico)</th><th class="right">Diferença</th></tr></thead>
    <tbody>${linhasDias.length ? linhasDias.map(l=>`
      <tr>
        <td>${l.dia}</td>
        <td class="right">${fmt(l.saldoAbertura)}</td>
        <td class="right">${fmt(l.entradas)}</td>
        <td class="right">${fmt(l.saidas)}</td>
        <td class="right"><b>${fmt(l.saldoFecho)}</b></td>
        <td class="right">${l.temDeclaracao ? fmt(l.totalContadoDia) : '—'}</td>
        <td class="right" style="${l.diferenca!==null && Math.abs(l.diferenca)>=0.5 ? 'color:var(--vermelho);font-weight:bold;' : ''}">${l.diferenca!==null ? fmt(l.diferenca) : '—'}</td>
      </tr>`).join('') : `<tr><td colspan="7" class="note">Sem movimentos na Caixa Tesouraria em ${mesRef}.</td></tr>`}
    </tbody></table>
  </div>`;
}

/* ---------- Controlo de Caixas (por Forma de Pagamento e por Unidade de Negócio) ---------- */
let ultimoControloCaixas = null;
function viewControloCaixas(){
  const porForma = FORMAS_PAGAMENTO.map(fp=>{
    const doForma = DB.lancamentos.filter(l=>l.formaPagamento===fp);
    const r = doForma.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doForma.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return {nome:fp, receitas:r, despesas:d, saldo:r-d, qtd:doForma.length};
  });
  const semForma = DB.lancamentos.filter(l=>!l.formaPagamento);
  const porUnidade = UNIDADES_NEGOCIO.map(u=>{
    const doUnidade = DB.lancamentos.filter(l=> (l.origem||'').startsWith(u));
    const r = doUnidade.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doUnidade.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return {nome:u, receitas:r, despesas:d, saldo:r-d};
  });
  ultimoControloCaixas = {
    cabecalhos: ['Agrupamento','Nome','Receitas','Despesas','Saldo'],
    linhas: [
      ...porForma.map(f=>['Forma de Pagamento', f.nome, f.receitas, f.despesas, f.saldo]),
      ...porUnidade.map(u=>['Unidade de Negócio', u.nome, u.receitas, u.despesas, u.saldo]),
    ],
  };
  return `
  <h2 style="background:var(--castanho);">💳 Controlo de Caixas</h2>
  <p class="note">Resumo automático por Forma de Pagamento (Cash, Banco, TPA, Multicaixa Express, Transferência) e por Unidade de Negócio — a Origem de cada lançamento é calculada a partir destes dois campos.</p>

    ${porForma.map(f=>`<tr><td>${f.nome}</td><td class="right">${f.qtd}</td><td class="right">${fmt(f.receitas)}</td><td class="right">${fmt(f.despesas)}</td><td class="right"><b>${fmt(f.saldo)}</b></td></tr>`).join('')}
    ${semForma.length? `<tr><td>— Sem forma de pagamento definida —</td><td class="right">${semForma.length}</td><td colspan="3" class="note">Lançamentos antigos, criados antes desta funcionalidade.</td></tr>`:''}
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Por Unidade de Negócio</h2>
  <div class="tablewrap"><table><thead><tr><th>Unidade</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo</th></tr></thead><tbody>
    ${porUnidade.map(u=>`<tr><td>${u.nome}</td><td class="right">${fmt(u.receitas)}</td><td class="right">${fmt(u.despesas)}</td><td class="right"><b>${fmt(u.saldo)}</b></td></tr>`).join('')}
  </tbody></table></div>
  <div class="actions" style="margin-top:12px;">
    <button type="button" class="sec" id="btnExportarControloCaixas">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirControloCaixas">Imprimir / PDF</button>

  ${viewControloCashDiario()}`;

   Recursos Humanos) ou é entregue a um Prestador de Serviços, para pagamentos/compras
   diversas. Ao registar a entrega, o sistema já lança a saída em Cash na categoria
   "Adiantamentos e Suprimentos de Caixa a Justificar" (categoria neutra, fora do Resultado
   do Exercício — tal como Transferência entre Contas — porque ainda não é despesa real,
   é dinheiro à guarda de alguém). A justificação (prestação de contas, com comprovativos)
   é registada depois, por categoria real, e NÃO gera novos lançamentos de caixa (o dinheiro
   já saiu na entrega) — serve de documento de suporte/controlo interno. Se restar dinheiro
   por gastar, regista-se a Devolução (entra de volta na Caixa). */

  ficheiro: 'adiantamentos-caixa',
  cabecalhos: ['Data','Destinatário','Detalhe','Responsável','Unidade','Finalidade','Valor Entregue','Justificado','Devolvido','Saldo Pendente'],
  linha: s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,x)=>t+Number(x.valor||0),0);
    return [s.data,s.destinatario,s.destinatarioDetalhe||'',s.responsavel||'',s.unidade||'',s.finalidade||'',Number(s.valor||0),j,d,Number(s.valor||0)-j-d];
  },
  cabecalhosImpressao: ['Data','Destinatário','Responsável','Finalidade','Valor Entregue','Saldo Pendente'],
  linhaImpressao: s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);
    return [s.data,s.destinatario,s.responsavel||'',s.finalidade||'',fmt(s.valor),fmt(Number(s.valor||0)-j-d)];
  },
});

/* ---------- Controlo de Suprimentos de Sócios ----------
   Dinheiro que os SÓCIOS emprestam/investem na empresa (aporte) e que a empresa lhes
   deve devolver (Passivo — conta 25 "Suprimentos de Sócios") — DIFERENTE dos
   "Adiantamentos de Caixa" acima, que é dinheiro da empresa entregue a um departamento/
   prestador para gastar. Cada aporte gera um lançamento (Receita, categoria "Suprimentos")
   e cada reembolso ao sócio gera um lançamento (Despesa, categoria "Suprimentos") — os
   mesmos que já alimentam o Balanço (conta 25) e a Demonstração de Fluxos de Caixa
   (Atividades de Financiamento), agora com o detalhe de A QUEM se deve e a taxa de juro
   acordada. Os juros, quando pagos/capitalizados, são registados à parte como Gasto
   Financeiro (categoria "Financeiras") — fiscalmente aceites apenas até ao limite da
   taxa de referência do BNA usada pela AGT (ver REGRAS_FISCAIS_AGT.suprimentosSocios). */
let socioAberto = new Set();
function diasEntreDatas(d1,d2){ return Math.max(0, Math.round((new Date(d2) - new Date(d1)) / 86400000)); }
function saldoAporteSocio(a){
  const reemb = (a.reembolsos||[]).reduce((s,r)=>s+Number(r.valor||0),0);
  return Number(a.valor||0) - reemb;
}
function jurosPagosAporte(a){ return (a.jurosRegistados||[]).reduce((s,j)=>s+Number(j.valor||0),0); }
/* Estimativa simples de juro corrido desde o último juro registado (ou desde o aporte,
   se ainda não houve nenhum), sobre o saldo em dívida atual — proporção linear de dias/365.
   É só uma sugestão de apoio, não substitui o cálculo do contabilista para efeitos fiscais. */
function jurosEstimadosAporte(a, ateData){
  const saldo = saldoAporteSocio(a);
  if(saldo<=0) return 0;
  const desde = (a.jurosRegistados&&a.jurosRegistados.length) ? a.jurosRegistados[a.jurosRegistados.length-1].data : a.data;
  const dias = diasEntreDatas(desde, ateData||hoje());
  const taxa = Number(a.taxaJuroAnual||0)/100;
  return saldo * taxa * dias/365;
}
registrarFiltroModulo('suprimentosSocios', {
  getLista: ()=> DB.suprimentosSocios,
  campoData: 'data',
  titulo: 'Controlo de Suprimentos de Sócios', subtitulo: 'Aportes de capital/empréstimos dos sócios à empresa, com taxa de juro e reembolsos.',
  ficheiro: 'suprimentos-socios',
  cabecalhos: ['Data','Sócio','Valor Aportado','Moeda','Taxa Juro Anual (%)','Reembolsado','Juros Pagos','Saldo em Dívida'],
  linha: a=>[a.data,a.socio,Number(a.valor||0),a.moeda||'KZ',Number(a.taxaJuroAnual||0),(a.reembolsos||[]).reduce((s,r)=>s+Number(r.valor||0),0),jurosPagosAporte(a),saldoAporteSocio(a)],
  cabecalhosImpressao: ['Data','Sócio','Valor Aportado','Taxa Juro Anual (%)','Saldo em Dívida'],

/* ---------- Centro Financeiro — Bakery Line (consolidado das 3 lojas) ---------- */
function viewBakeryLine(){
  const LOJAS_BAKERY = UNIDADES_NEGOCIO.filter(u=>u.startsWith("BAKERY LINE"));
  const doBakery = DB.lancamentos.filter(l=> LOJAS_BAKERY.some(loja=>(l.origem||'').startsWith(loja)));
  const totRec = doBakery.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const totDesp = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='DESPESAS').reduce((s,l)=>s+valorEmKZ(l),0);
  const totCustos = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='CUSTOS').reduce((s,l)=>s+valorEmKZ(l),0);
  const totOutros = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='OUTRAS').reduce((s,l)=>s+valorEmKZ(l),0);
  const saldo = totRec - totDesp - totCustos - totOutros;

  const porLoja = LOJAS_BAKERY.map(loja=>{
    const doLoja = DB.lancamentos.filter(l=>(l.origem||'').startsWith(loja));
    const r = doLoja.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doLoja.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const cash = doLoja.filter(l=>(l.origem||'').endsWith('CASH')).reduce((s,l)=> s + (l.tipo==='Receita'?valorEmKZ(l):-valorEmKZ(l)), 0);
    const banco = doLoja.filter(l=>(l.origem||'').endsWith('BANCO')).reduce((s,l)=> s + (l.tipo==='Receita'?valorEmKZ(l):-valorEmKZ(l)), 0);
    return {nome:loja, receitas:r, despesas:d, saldo:r-d, cash, banco};
  });

  const doBakeryExplodido = explodirLancamentos(doBakery);
  const porCategoria = [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].map(cat=>({
    nome:cat, val: doBakeryExplodido.filter(l=>l.tipo==='Despesa'&&l.categoria===cat).reduce((s,l)=>s+valorEmKZ(l),0)
  })).filter(r=>r.val!==0);

  const ano=new Date().getFullYear();
  const doAno = doBakery.filter(l=>mesKey(l.data).startsWith(String(ano)));
  const linhasMes = MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = doAno.filter(l=>mesKey(l.data)===key);
    const r = doMes.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doMes.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return `<tr><td>${m}</td><td class="right">${fmt(r)}</td><td class="right">${fmt(d)}</td><td class="right"><b>${fmt(r-d)}</b></td></tr>`;
  }).join('');

  return `
  <h2 style="background:var(--castanho);">🥖 Centro Financeiro — Bakery Line</h2>
  <p class="note">Consolidado automático das 3 lojas (Main Store, CFM Store, New Store), a partir da Unidade de Negócio de cada lançamento.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Receitas (Bakery Line)</div><div class="val pos">${fmt(totRec)} Kz</div></div>
    <div class="card"><div class="lbl">Despesas</div><div class="val neg">${fmt(totDesp)} Kz</div></div>
    <div class="card"><div class="lbl">Custos (não despesas)</div><div class="val neg">${fmt(totCustos)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo</div><div class="val ${saldo>=0?'pos':'neg'}">${fmt(saldo)} Kz</div></div>
  </div>
  <h2 class="sub" style="font-size:15px;">Por Loja</h2>
  <div class="tablewrap"><table><thead><tr><th>Loja</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo</th><th class="right">Saldo Cash</th><th class="right">Saldo Banco</th></tr></thead><tbody>
    ${porLoja.map(l=>`<tr><td>${l.nome}</td><td class="right">${fmt(l.receitas)}</td><td class="right">${fmt(l.despesas)}</td><td class="right"><b>${fmt(l.saldo)}</b></td><td class="right">${fmt(l.cash)}</td><td class="right">${fmt(l.banco)}</td></tr>`).join('')}
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Despesas e Custos por Categoria</h2>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="right">Valor</th></tr></thead><tbody>
    ${porCategoria.length? porCategoria.map(c=>`<tr><td>${c.nome}</td><td class="right">${fmt(c.val)}</td></tr>`).join('') : `<tr><td colspan="2" class="note">Sem despesas/custos lançados ainda para a Bakery Line.</td></tr>`}
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Evolução Mensal (${ano})</h2>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo do Mês</th></tr></thead><tbody>${linhasMes}</tbody></table></div>`;
}

/* ---------- Existências — Stocks (SKU) ---------- */
function entradasDoProduto(produtoId, key){
  return DB.lancamentos.filter(l=>l.produtoId===produtoId && l.quantidade && mesKey(l.data)===key);
}
function stockMensal(p){
  const ano = new Date().getFullYear();
  let inicial=0, custoMedio=0;
  return MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const entradas = entradasDoProduto(p.id,key);
    let qtdComEntradas = inicial, valorAcum = inicial*custoMedio;
    entradas.forEach(l=>{
      const q=Number(l.quantidade)||0; if(q<=0) return;
      const custoU = valorEmKZ(l)/q;
      valorAcum += q*custoU; qtdComEntradas += q;
    });
    custoMedio = qtdComEntradas>0 ? valorAcum/qtdComEntradas : custoMedio;
    const entradasQtd = entradas.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const finalKey = `${p.id}:${key}`;
    const temContagem = DB.existenciasStockFinal[finalKey]!==undefined && DB.existenciasStockFinal[finalKey]!=='';
    const final = temContagem ? Number(DB.existenciasStockFinal[finalKey]) : qtdComEntradas;
    const consumo = qtdComEntradas-final;
    const valorFinal = final*custoMedio;
    const linha = {mes:m,key,inicial,entradasQtd,final,consumo,custoMedio,valorFinal,finalKey,temContagem};
    inicial = final;
    return linha;
  });
}

  const rowsProd = DB.produtos.slice().reverse().map(p=>`

  const blocosProduto = DB.produtos.map(p=>{
    const meses = stockMensal(p);
    const ultimo = meses[meses.length-1];
    const abaixoMinimo = Number(p.stockMinimo||0)>0 && ultimo.final<Number(p.stockMinimo);
    const linhas = meses.map(l=>`
      <tr><td>${l.mes}</td><td class="right">${fmt(l.inicial)}</td><td class="right">${fmt(l.entradasQtd)}</td>
      <td><input type="number" step="0.01" data-stockfinal="${l.finalKey}" value="${DB.existenciasStockFinal[l.finalKey]||''}" placeholder="Contagem" style="width:100px;"></td>
      <td class="right">${fmt(l.consumo)}</td><td class="right">${fmt(l.custoMedio)}</td><td class="right"><b>${fmt(l.valorFinal)}</b></td></tr>`).join('');

let membrosCache = [];
async function carregarMembros(){
  try{
    /* Tenta com "posto"; se a coluna ainda não existir (SQL de migração por
       correr), volta a tentar só com "email, role" para o ecrã continuar a
       funcionar (a coluna Posto de Venda fica só sem dados nesse caso). */
    let { data, error } = await supa.from('team_roles').select('email, role, posto').order('email');
    if(error){
      const fallback = await supa.from('team_roles').select('email, role').order('email');
      data = fallback.data; error = fallback.error;
    }
    if(!error) membrosCache = data || [];
  }catch(e){ console.warn(e); }
}

  const rows = DB.salarios.slice().reverse().map(s=>{
    const bruto = Number(s.base||0)+Number(s.subsidios||0);
    const inssTrab = bruto*0.03;
    const baseIRT = bruto - inssTrab;
    const irt = calcIRT(baseIRT);
    const liquido = bruto - inssTrab - irt - Number(s.outrosDesc||0);
    const inssEmp = bruto*0.08;
    const custoTotal = bruto + inssEmp;
    return `<tr>
      <td>${s.nome}</td><td>${s.funcao||''}</td>
      <td class="right">${fmt(s.base)}</td><td class="right">${fmt(s.subsidios||0)}</td>
      <td class="right">${fmt(bruto)}</td><td class="right">${fmt(inssTrab)}</td>
      <td class="right">${fmt(irt)}</td><td class="right">${fmt(s.outrosDesc||0)}</td>
      <td class="right"><b>${fmt(liquido)}</b></td>
      <td class="right">${fmt(inssEmp)}</td><td class="right">${fmt(custoTotal)}</td>
      <td><button class="print" data-print-sal="${s.id}">Imprimir</button> <button class="danger" data-delsal="${s.id}">Apagar</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="12" class="note">Sem trabalhadores lançados.</td></tr>`;

  const totLiquido = DB.salarios.reduce((sum,s)=>{
    const bruto=Number(s.base||0)+Number(s.subsidios||0);
    const inssTrab=bruto*0.03, irt=calcIRT(bruto-inssTrab);
    return sum + (bruto-inssTrab-irt-Number(s.outrosDesc||0));

  const totINSS = DB.salarios.reduce((sum,s)=>{const b=Number(s.base||0)+Number(s.subsidios||0);return sum+b*0.11;},0);

  const totCusto = DB.salarios.reduce((sum,s)=>{const b=Number(s.base||0)+Number(s.subsidios||0);return sum+b*1.08;},0);

  return `

    <tbody>${rows}</tbody></table>

  <div class="cards" style="margin-top:16px;">

/* ---------- Exportação SAF-T (AO) — tipo Facturação ---------- */
let ultimoSaft = null;
let ultimoSaftCompras = null;
function xmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n2(v){ return (Number(v)||0).toFixed(2); }

function gerarXmlSaftFacturacao(ano, mes){
  const cfg = DB.empresaConfig || {};
  const mesNum = String(mes).padStart(2,'0');
  const inicio = `${ano}-${mesNum}-01`;
  const fimData = new Date(ano, Number(mes), 0);
  const fim = `${ano}-${mesNum}-${String(fimData.getDate()).padStart(2,'0')}`;

  const linhasReceita = DB.lancamentos.filter(l=> l.tipo==='Receita' && l.nFatura && mesKey(l.data)===`${ano}-${mesNum}`);
  /* Agrupa por Nº de Fatura: uma fatura paga com 2-3 formas de pagamento gera várias
     linhas de lançamento (uma por conta/forma de pagamento) partilhando o mesmo nFatura —
     para o SAF-T interessa o total da fatura, não cada movimento de tesouraria em separado. */
  const gruposFatura = new Map();
  linhasReceita.forEach(l=>{
    if(!gruposFatura.has(l.nFatura)) gruposFatura.set(l.nFatura, {...l, valor:0});
    gruposFatura.get(l.nFatura).valor += Number(l.valor||0);
  });
  const faturas = Array.from(gruposFatura.values())
    .sort((a,b)=> a.data.localeCompare(b.data) || String(a.nFatura).localeCompare(String(b.nFatura)));

  /* Clientes únicos (por NIF, ou "Consumidor Final" quando não há NIF) */
  const clientesMap = new Map();
  faturas.forEach(l=>{
    const chave = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    if(!clientesMap.has(chave)){
      clientesMap.set(chave, { id: chave, nome: l.entidade || 'Consumidor Final', nif: (l.nif&&l.nif.trim())||'999999999' });
    }
  });

  const customersXml = Array.from(clientesMap.values()).map(c=>`
    <Customer>
      <CustomerID>${xmlEsc(c.id)}</CustomerID>
      <AccountID>Desconhecido</AccountID>
      <CustomerTaxID>${xmlEsc(c.nif)}</CustomerTaxID>
      <CompanyName>${xmlEsc(c.nome)}</CompanyName>
      <BillingAddress>
        <AddressDetail>Desconhecido</AddressDetail>
        <City>Luanda</City>
        <Country>AO</Country>
      </BillingAddress>
      <SelfBillingIndicator>0</SelfBillingIndicator>
    </Customer>`).join('');

  const taxCodeFromTaxa = (taxa)=> taxa>=0.14 ? 'NOR' : (taxa>0 ? 'RED' : 'ISE');
  const taxasUsadas = new Set(faturas.map(l=> l.iva==='Sim' ? Number(l.taxaIVA||0) : 0));
  if(taxasUsadas.size===0) taxasUsadas.add(0.14);
  const taxTableXml = Array.from(taxasUsadas).map(taxa=>`
    <TaxTableEntry>
      <TaxType>IVA</TaxType>
      <TaxCountryRegion>AO</TaxCountryRegion>
      <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
      <Description>${taxa===0?'IVA Isento':'IVA '+(taxa*100).toFixed(0)+'%'}</Description>
      <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
    </TaxTableEntry>`).join('');

  let totalDebit = 0, totalCredit = 0;
  const invoicesXml = faturas.map((l,idx)=>{
    const chaveCliente = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    const taxa = l.iva==='Sim' ? Number(l.taxaIVA||0) : 0;
    const bruto = Number(l.valor||0);
    const subtotal = taxa>0 ? bruto/(1+taxa) : bruto;
    const valorIVA = bruto - subtotal;
    totalCredit += bruto;
    const periodo = Number(mes);
    return `
    <Invoice>
      <InvoiceNo>${xmlEsc(l.nFatura)}</InvoiceNo>
      <DocumentStatus>
        <InvoiceStatus>N</InvoiceStatus>
        <InvoiceStatusDate>${xmlEsc(l.data)}T00:00:00</InvoiceStatusDate>
        <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
        <SourceBilling>M</SourceBilling>
      </DocumentStatus>
      <Period>${periodo}</Period>
      <InvoiceDate>${xmlEsc(l.data)}</InvoiceDate>
      <InvoiceType>FT</InvoiceType>
      <SpecialRegimes>
        <SelfBillingIndicator>0</SelfBillingIndicator>
        <CashVATSchemeIndicator>0</CashVATSchemeIndicator>
        <ThirdPartiesBillingIndicator>0</ThirdPartiesBillingIndicator>
      </SpecialRegimes>
      <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
      <SystemEntryDate>${xmlEsc(l.data)}T00:00:00</SystemEntryDate>
      <CustomerID>${xmlEsc(chaveCliente)}</CustomerID>
      <Line>
        <LineNumber>1</LineNumber>
        <ProductDescription>${xmlEsc(l.descricao||l.categoria||'Venda')}</ProductDescription>
        <Quantity>${xmlEsc(l.quantidade||1)}</Quantity>
        <UnitOfMeasure>UN</UnitOfMeasure>
        <UnitPrice>${n2(subtotal / (Number(l.quantidade)||1))}</UnitPrice>
        <TaxPointDate>${xmlEsc(l.data)}</TaxPointDate>
        <Description>${xmlEsc(l.descricao||l.categoria||'Venda')}</Description>
        <CreditAmount>${n2(subtotal)}</CreditAmount>
        <Tax>
          <TaxType>IVA</TaxType>
          <TaxCountryRegion>AO</TaxCountryRegion>
          <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
          <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
        </Tax>
      </Line>
      <DocumentTotals>
        <TaxPayable>${n2(valorIVA)}</TaxPayable>
        <NetTotal>${n2(subtotal)}</NetTotal>
        <GrossTotal>${n2(bruto)}</GrossTotal>
      </DocumentTotals>
    </Invoice>`;
  }).join('');

  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<AuditFile xmlns="urn:OECD:StandardAuditFile-Tax:AO_1.01_01" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:OECD:StandardAuditFile-Tax:AO_1.01_01 https://raw.githubusercontent.com/assoft-portugal/SAF-T-AO/master/XSD/SAFTAO1.01_01.xsd">
<Header>
<AuditFileVersion>1.01_01</AuditFileVersion>
<CompanyID>${xmlEsc(cfg.nif||'')} ${xmlEsc(cfg.nome||'')}</CompanyID>
<TaxRegistrationNumber>${xmlEsc(cfg.nif||'')}</TaxRegistrationNumber>
<TaxAccountingBasis>F</TaxAccountingBasis>
<CompanyName>${xmlEsc(cfg.nome||"ZOOM'S LODGE HOTELARIA E RESTAURAÇÃO")}</CompanyName>
<CompanyAddress>
<AddressDetail>${xmlEsc(cfg.morada||'Desconhecido')}</AddressDetail>
<City>${xmlEsc(cfg.cidade||'Luanda')}</City>
<Country>AO</Country>
</CompanyAddress>
<FiscalYear>${ano}</FiscalYear>
<StartDate>${inicio}</StartDate>
<EndDate>${fim}</EndDate>
<CurrencyCode>AOA</CurrencyCode>
<DateCreated>${hoje()}</DateCreated>
<TaxEntity>Global</TaxEntity>
<ProductID>ERP Tesouraria Zoom's Lodge</ProductID>
<ProductVersion>1.0</ProductVersion>
</Header>
<MasterFiles>${customersXml}
<TaxTable>${taxTableXml}
</TaxTable>
</MasterFiles>
<SourceDocuments>
<SalesInvoices>
<NumberOfEntries>${faturas.length}</NumberOfEntries>
<TotalDebit>${n2(totalDebit)}</TotalDebit>
<TotalCredit>${n2(totalCredit)}</TotalCredit>${invoicesXml}
</SalesInvoices>
</SourceDocuments>
</AuditFile>`;
  return xml;
}

  const taxasUsadas = new Set(faturas.map(l=> l.iva==='Sim' ? Number(l.taxaIVA||0) : 0));

    <TaxTableEntry>
      <TaxType>IVA</TaxType>

      <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>

    const subtotal = taxa>0 ? bruto/(1+taxa) : bruto;
    const valorIVA = bruto - subtotal;
    totalDebit += bruto;
    const periodo = Number(mes);
    return `
    <Invoice>

function baixarFicheiro(nomeFicheiro, conteudo, tipo){
  const blob = new Blob([conteudo], {type: tipo||'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeFicheiro;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Contabilidade Analítica (Centros de Custo) ----------
   Repartição do resultado por Unidade de Negócio. Cada lançamento com Unidade preenchida
   entra como direto dessa unidade. Despesas cujas categorias estejam marcadas abaixo como
   "Custo Indireto" (ex.: Administrativas, Financeiras) são somadas num único total e rateadas
   entre as unidades operacionais segundo o % configurado — a soma dos % deve fechar em 100%.
   Lançamentos sem Unidade (e que não sejam custo indireto) caem em "Não Alocado". Não altera
   nenhum lançamento nem o Balanço/DRE oficiais — é só uma reorganização analítica do mesmo
   histórico, por isso o TOTAL desta tabela deve bater com o Resultado (histórico) da DRE. */
const UNIDADES_RATEIO = UNIDADES_NEGOCIO.filter(u=>u!=='SUPRIMENTOS');
function configAnalitica(){
  DB.analitica = DB.analitica || {categoriasIndiretas:[], rateio:{}};
  DB.analitica.categoriasIndiretas = DB.analitica.categoriasIndiretas || [];
  DB.analitica.rateio = DB.analitica.rateio || {};
  return DB.analitica;
}
function calcularContabAnalitica(de, ate){
  const cfg = configAnalitica();
  const categoriasIndiretas = new Set(cfg.categoriasIndiretas);
  let lista = explodirLancamentos(DB.lancamentos).filter(l=>!CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);

  const porUnidade = {};
  UNIDADES_RATEIO.forEach(u=> porUnidade[u] = {receitas:0, despesasDiretas:0, despesasIndiretas:0, resultado:0});
  let naoAlocadoReceitas = 0, naoAlocadoDespesas = 0, poolIndireto = 0;

  lista.forEach(l=>{
    const valor = valorEmKZ(l);
    const unidade = (l.unidade||'').trim();
    if(l.tipo==='Receita'){
      if(porUnidade[unidade]) porUnidade[unidade].receitas += valor;
      else naoAlocadoReceitas += valor;
    } else if(l.tipo==='Despesa'){
      if(categoriasIndiretas.has(l.categoria)){
        poolIndireto += valor;
      } else if(porUnidade[unidade]){
        porUnidade[unidade].despesasDiretas += valor;
      } else {
        naoAlocadoDespesas += valor;
      }
    }
  });

  const somaRateio = UNIDADES_RATEIO.reduce((s,u)=>s+Number(cfg.rateio[u]||0),0);
  UNIDADES_RATEIO.forEach(u=>{
    const pct = Number(cfg.rateio[u]||0);
    porUnidade[u].despesasIndiretas = poolIndireto * (pct/100);
    porUnidade[u].resultado = porUnidade[u].receitas - porUnidade[u].despesasDiretas - porUnidade[u].despesasIndiretas;
  });

  return {porUnidade, naoAlocadoReceitas, naoAlocadoDespesas, poolIndireto, somaRateio, cfg};
}
let filtroAnalitica = {de:'', ate:''};
let ultimoAnalitica = null;

      <tr style="background:var(--verde-claro);"><td><b>TOTAL</b></td><td class="right"><b>${fmt(totalReceitas)}</b></td><td class="right"><b>${fmt(totalDespesasDiretas)}</b></td><td class="right"><b>${fmt(poolIndireto)}</b></td><td class="right"><b>${fmt(totalResultado)}</b></td></tr>

/* ======================================================================
   ---------- Centros de Custo (Contabilidade Analítica Avançada) ----------
   Camada analítica adicional à Contabilidade Analítica por Unidade de Negócio
   (acima). Aqui cada lançamento pode ser repartido por um ou mais Centros de
   Custo (com percentuais que devem somar 100%), com 12 Centros de Custo
   pré-configurados (6 para Zoom's Lodge, 6 para Bakery Line), sugestão
   automática com base na Unidade + Categoria do lançamento, análise por
   período, comparação mês a mês por Centro de Custo, e identificação de
   lançamentos ainda por alocar (migração). Tal como a Contabilidade Analítica
   por Unidade, NÃO altera nenhum lançamento oficial, Tesouraria, DRE ou
   Balanço — é apenas uma reclassificação analítica do mesmo histórico
   (usa-se o campo adicional, opcional, l.alocacaoCC = [{cc, pct}, ...]).
   ====================================================================== */
const CENTROS_CUSTO_PADRAO = [
  {codigo:'ZL-HOSP',  nome:'Hospedagem',                    unidade:"ZOOM'S LODGE"},
  {codigo:'ZL-REST',  nome:'Restauração',                   unidade:"ZOOM'S LODGE"},
  {codigo:'ZL-BAR',   nome:'Bar',                            unidade:"ZOOM'S LODGE"},
  {codigo:'ZL-MANU',  nome:'Manutenção & Infraestrutura',    unidade:"ZOOM'S LODGE"},
  {codigo:'ZL-ADMIN', nome:'Administração Central',          unidade:"ZOOM'S LODGE"},
  {codigo:'ZL-COM',   nome:'Marketing & Comercial',          unidade:"ZOOM'S LODGE"},
  {codigo:'BL-LOJA1', nome:'Loja Central',                   unidade:'BAKERY LINE-MAIN STORE'},
  {codigo:'BL-LOJA2', nome:'Filial 1',                       unidade:'BAKERY LINE-CFM STORE'},
  {codigo:'BL-LOJA3', nome:'Filial 2',                       unidade:'BAKERY LINE-NEW STORE'},
  {codigo:'BL-PROD',  nome:'Produção (Fábrica)',             unidade:'BAKERY LINE'},
  {codigo:'BL-DIST',  nome:'Distribuição & Logística',       unidade:'BAKERY LINE'},
  {codigo:'BL-ADMIN', nome:'Administração',                  unidade:'BAKERY LINE'},
];
/* 1. Garante DB.centrosCusto inicializado (com os 12 pré-configurados na primeira vez). */
function configCC(){
  if(!Array.isArray(DB.centrosCusto)) DB.centrosCusto = [];
  if(!DB.centrosCusto.length) DB.centrosCusto = CENTROS_CUSTO_PADRAO.map(c=>({...c, ativo:true}));
  return DB.centrosCusto;
}
/* 2. */ function ccPorCodigo(codigo){ return configCC().find(c=>c.codigo===codigo); }
/* 3. */ function ccAtivos(){ return configCC().filter(c=>c.ativo!==false); }
/* 4. Unidade-base (ZL/BL) a partir da Unidade de Negócio do lançamento. */
function unidadeBaseCC(l){
  const u = (l.unidade||'').toUpperCase();
  if(u.startsWith("ZOOM")) return 'ZL';
  if(u.startsWith('BAKERY')) return 'BL';
  return null;
}
/* 5. Loja Bakery Line específica (quando aplicável) a partir da Unidade do lançamento. */
function lojaBakeryCC(l){
  const u = (l.unidade||'').toUpperCase();
  if(u.includes('MAIN STORE')) return 'BL-LOJA1';
  if(u.includes('CFM STORE'))  return 'BL-LOJA2';
  if(u.includes('NEW STORE'))  return 'BL-LOJA3';
  return null;
}
/* 6. Sugestão automática de Centro de Custo com base na Unidade + Categoria do lançamento. */
function sugerirCC(l){
  const base = unidadeBaseCC(l);
  if(!base) return null;
  const cat = l.categoria||'';
  if(base==='ZL'){
    if(/manutenção|funcionamento|serviços de terceiros/i.test(cat)) return 'ZL-MANU';
    if(/comerciais/i.test(cat)) return 'ZL-COM';
    if(/matéria-prima|mercadorias/i.test(cat)) return 'ZL-REST';
    if(/pessoal|administrativ/i.test(cat)) return 'ZL-ADMIN';
    if(l.tipo==='Receita') return /bar/i.test(cat) ? 'ZL-BAR' : (/restaura|alimenta/i.test(cat) ? 'ZL-REST' : 'ZL-HOSP');
    return 'ZL-ADMIN';
  }
  const loja = lojaBakeryCC(l);
  if(/matéria-prima/i.test(cat)) return 'BL-PROD';
  if(/distribui|transporte|logística/i.test(cat)) return 'BL-DIST';
  if(/pessoal|administrativ/i.test(cat)) return loja || 'BL-ADMIN';
  if(l.tipo==='Receita') return loja || 'BL-LOJA1';
  return loja || 'BL-ADMIN';
}
/* 7. Base de lançamentos (explodidos, sem categorias excluídas do Resultado) para um período. */
function lancamentosBaseCC(de, ate){
  let lista = explodirLancamentos(DB.lancamentos).filter(l=>!CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);
  return lista;
}
/* 8. Resumo (Receitas/Despesas/Resultado) por Centro de Custo, num período. */
function resumoPorCC(de, ate){
  const ccs = ccAtivos();
  const porCC = {};
  ccs.forEach(c=> porCC[c.codigo] = {receitas:0, despesas:0, resultado:0});
  let naoAlocadoReceitas=0, naoAlocadoDespesas=0;
  lancamentosBaseCC(de,ate).forEach(l=>{
    const valor = valorEmKZ(l);
    const aloc = (Array.isArray(l.alocacaoCC) && l.alocacaoCC.length) ? l.alocacaoCC : null;
    if(!aloc){
      if(l.tipo==='Receita') naoAlocadoReceitas += valor;
      else if(l.tipo==='Despesa') naoAlocadoDespesas += valor;
      return;
    }
    aloc.forEach(a=>{
      if(!porCC[a.cc]) return; // Centro de Custo inativo/removido — ignora na análise
      const parte = valor * (Number(a.pct)||0)/100;
      if(l.tipo==='Receita') porCC[a.cc].receitas += parte;
      else if(l.tipo==='Despesa') porCC[a.cc].despesas += parte;
    });
  });
  ccs.forEach(c=> porCC[c.codigo].resultado = porCC[c.codigo].receitas - porCC[c.codigo].despesas);
  return {porCC, naoAlocadoReceitas, naoAlocadoDespesas, ccs};
}
/* 9. Série mensal (Receitas/Despesas/Resultado + Variação vs mês anterior) para 1 Centro de Custo. */
function resumoMensalCC(codigoCC, de, ate){
  const meses = {};
  lancamentosBaseCC(de, ate).forEach(l=>{
    const aloc = Array.isArray(l.alocacaoCC) ? l.alocacaoCC.find(a=>a.cc===codigoCC) : null;
    if(!aloc) return;
    const mk = mesKey(l.data);
    meses[mk] = meses[mk] || {receitas:0, despesas:0};
    const parte = valorEmKZ(l) * (Number(aloc.pct)||0)/100;
    if(l.tipo==='Receita') meses[mk].receitas += parte;
    else if(l.tipo==='Despesa') meses[mk].despesas += parte;
  });
  const chaves = Object.keys(meses).sort();
  return chaves.map((mk,i)=>{
    const atual = meses[mk];
    const resultado = atual.receitas - atual.despesas;
    const anterior = i>0 ? meses[chaves[i-1]] : null;
    const resultadoAnterior = anterior ? (anterior.receitas-anterior.despesas) : null;
    const variacaoAbs = anterior!==null ? (resultado-resultadoAnterior) : null;
    const variacaoPct = (anterior!==null && resultadoAnterior) ? (variacaoAbs/Math.abs(resultadoAnterior))*100 : null;
    return {mes:mk, receitas:atual.receitas, despesas:atual.despesas, resultado, variacaoAbs, variacaoPct};
  });
}
/* 10. Lançamentos por Alocar (migração) — Receitas/Despesas sem l.alocacaoCC, num período. */
function lancamentosSemAlocacaoCC(de, ate){
  let lista = DB.lancamentos.filter(l=>
    (l.tipo==='Receita'||l.tipo==='Despesa') &&
    !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) &&
    !(Array.isArray(l.alocacaoCC) && l.alocacaoCC.length));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);
  return lista.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
/* 11. Aplica alocação rápida (100% a um único Centro de Custo). */
async function aplicarAlocacaoCCRapida(id, codigoCC){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return;
  l.alocacaoCC = [{cc:codigoCC, pct:100}];
  logar('Alocação a Centro de Custo', `Lançamento de ${fmt(l.valor)} (${l.categoria||''}) alocado a ${codigoCC}.`);
  await saveDB(); toast('Alocado a '+codigoCC+'.'); render();
}
/* 12. Remove a alocação de um lançamento (volta a "Não Alocado"). */
async function removerAlocacaoCC(id){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return;
  delete l.alocacaoCC;
  logar('Alocação a Centro de Custo removida', `Lançamento de ${fmt(l.valor)} voltou a "Não Alocado".`);
  await saveDB(); toast('Alocação removida.'); render();
}
/* 13. Aplica a sugestão automática, em massa, a todos os lançamentos por alocar num período. */
async function aplicarTodasSugestoesCC(de, ate){
  const lista = lancamentosSemAlocacaoCC(de, ate);
  let n=0;
  lista.forEach(l=>{ const sug=sugerirCC(l); if(sug){ l.alocacaoCC=[{cc:sug, pct:100}]; n++; } });
  if(!n){ toast('Nenhuma sugestão disponível para os lançamentos pendentes (verifique a Unidade de Negócio dos lançamentos).'); return; }
  logar('Alocação automática em massa', `${n} lançamento(s) alocado(s) por sugestão automática de Centro de Custo.`);
  await saveDB(); toast(`${n} lançamento(s) alocado(s) automaticamente.`); render();
}
/* 14. Aplica uma divisão por vários Centros de Custo (percentuais devem somar 100%). */
async function aplicarAlocacaoCCMultipla(id, alocacoes){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return false;
  const soma = alocacoes.reduce((s,a)=>s+Number(a.pct||0),0);
  if(Math.abs(soma-100)>0.5){ toast(`A soma das percentagens deve ser 100% (atual: ${soma.toFixed(1)}%).`); return false; }
  l.alocacaoCC = alocacoes.filter(a=>Number(a.pct||0)>0);
  logar('Alocação a Centro de Custo (dividida)', `Lançamento de ${fmt(l.valor)} dividido por ${l.alocacaoCC.length} centro(s) de custo.`);
  await saveDB(); toast('Alocação guardada.');
  ccDividindoId = null; render();
  return true;
}

function formDividirCC(l){
  const ccs = ccAtivos();

  (l.alocacaoCC||[]).forEach(a=> atuais[a.cc]=a.pct);
  const inputs = ccs.map(c=>`<div><label>${c.codigo}</label><input type="number" step="0.01" min="0" max="100" data-cc-pct="${c.codigo}" value="${atuais[c.codigo]||0}"></div>`).join('');
  return `

    <p class="note">Repartir este lançamento (${fmt(l.valor)} ${l.moeda||'KZ'}) por vários Centros de Custo — a soma das percentagens deve ser 100%.</p>

}

function viewCCAlocacao(){
  const pendentes = lancamentosSemAlocacaoCC(filtroCC.de, filtroCC.ate);
  const ccs = ccAtivos();
  const linhasPendentes = pendentes.map(l=>{
    const sug = sugerirCC(l);
    const sugCC = sug ? ccPorCodigo(sug) : null;
    const dividindo = ccDividindoId===l.id;
    return `
    <tr>
      <td>${l.data||''}</td>
      <td>${l.descricao||l.entidade||''}<br><span class="note" style="display:inline;padding:1px 5px;">${l.categoria||''}</span></td>
      <td class="right">${l.tipo==='Despesa'?'-':''}${fmt(l.valor)} ${l.moeda||'KZ'}</td>
      <td>${l.unidade||'—'}</td>
      <td>${sug ? `<span class="note" style="display:inline;padding:2px 6px;">${sug} — ${sugCC?sugCC.nome:''}</span>` : '<span class="note" style="display:inline;padding:2px 6px;">sem sugestão</span>'}</td>
      <td style="white-space:nowrap;">
        ${sug ? `<button type="button" class="sec" data-cc-aplicar-sug="${l.id}">✅ Usar sugestão</button>` : ''}
        <select data-cc-select="${l.id}" style="width:auto;display:inline-block;">
          <option value="">Escolher CC…</option>
          ${ccs.map(c=>`<option value="${c.codigo}">${c.codigo} — ${c.nome}</option>`).join('')}
        </select>
        <button type="button" class="sec" data-cc-aplicar-select="${l.id}">Aplicar</button>
        <button type="button" class="sec" data-cc-dividir-toggle="${l.id}">${dividindo?'✖️ Fechar':'🔀 Dividir'}</button>
      </td>
    </tr>
    ${dividindo ? `<tr><td colspan="6">${formDividirCC(l)}</td></tr>` : ''}`;
  }).join('');

  const alocados = DB.lancamentos.filter(l=>
    Array.isArray(l.alocacaoCC) && l.alocacaoCC.length &&
    (l.tipo==='Receita'||l.tipo==='Despesa') &&
    (!filtroCC.de || l.data>=filtroCC.de) && (!filtroCC.ate || l.data<=filtroCC.ate)
  ).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const linhasAlocados = alocados.map(l=>{
    const dividindo = ccDividindoId===l.id;
    const alocTxt = l.alocacaoCC.map(a=>`${a.cc} (${a.pct}%)`).join(', ');
    return `
    <tr>
      <td>${l.data||''}</td>
      <td>${l.descricao||l.entidade||''}<br><span class="note" style="display:inline;padding:1px 5px;">${l.categoria||''}</span></td>
      <td class="right">${l.tipo==='Despesa'?'-':''}${fmt(l.valor)} ${l.moeda||'KZ'}</td>
      <td>${alocTxt}</td>
      <td style="white-space:nowrap;">
        <button type="button" class="sec" data-cc-dividir-toggle="${l.id}">${dividindo?'✖️ Fechar':'✏️ Editar'}</button>
        <button type="button" class="sec" data-cc-remover-aloc="${l.id}">🗑️ Remover</button>
      </td>
    </tr>
    ${dividindo ? `<tr><td colspan="5">${formDividirCC(l)}</td></tr>` : ''}`;
  }).join('');

  return `
  <form class="inline" id="formFiltroCC">
    <div class="grid">
      <div><label>De</label><input type="date" name="de" value="${filtroCC.de}"></div>
      <div><label>Até</label><input type="date" name="ate" value="${filtroCC.ate}"></div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltroCC">Limpar</button> <button type="button" class="sec" id="btnAplicarTodasSugCC">✅ Aplicar todas as sugestões</button></div>
  </form>

  <h2 class="sub" style="font-size:15px;">🔗 Lançamentos por Alocar <span class="note" style="display:inline;padding:2px 6px;">${pendentes.length}</span></h2>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="right">Valor</th><th>Unidade</th><th>Sugestão</th><th></th></tr></thead>
  <tbody>${linhasPendentes || '<tr><td colspan="6">Sem lançamentos por alocar neste período. 🎉</td></tr>'}</tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:20px;">✅ Já Alocados</h2>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="right">Valor</th><th>Alocação</th><th></th></tr></thead>
  <tbody>${linhasAlocados || '<tr><td colspan="5">Nenhum lançamento alocado neste período.</td></tr>'}</tbody></table></div>`;
}

function viewCCAnalise(){
  const {porCC, naoAlocadoReceitas, naoAlocadoDespesas, ccs} = resumoPorCC(filtroCC.de, filtroCC.ate);
  const totalReceitas = ccs.reduce((s,c)=>s+porCC[c.codigo].receitas,0) + naoAlocadoReceitas;
  const totalDespesas = ccs.reduce((s,c)=>s+porCC[c.codigo].despesas,0) + naoAlocadoDespesas;
  const totalResultado = totalReceitas - totalDespesas;

  const linhas = ccs.map(c=>{
    const d = porCC[c.codigo];
    return `<tr><td><b>${c.codigo}</b> — ${c.nome}</td><td>${c.unidade||'—'}</td><td class="right">${fmt(d.receitas)}</td><td class="right">${fmt(d.despesas)}</td><td class="right"><b>${fmt(d.resultado)}</b></td></tr>`;
  }).join('');

  ultimoCCRelatorio = {
    cabecalhos: ['Centro de Custo','Unidade','Receitas','Despesas','Resultado'],
    linhas: [
      ...ccs.map(c=>[`${c.codigo} — ${c.nome}`, c.unidade||'—', porCC[c.codigo].receitas, porCC[c.codigo].despesas, porCC[c.codigo].resultado]),
      ['Não Alocado','—', naoAlocadoReceitas, naoAlocadoDespesas, naoAlocadoReceitas-naoAlocadoDespesas],
      ['TOTAL','—', totalReceitas, totalDespesas, totalResultado],
    ],
    periodo: `${filtroCC.de||'início'} a ${filtroCC.ate||'hoje'}`,
  };

  return `
  <form class="inline" id="formFiltroCCAnalise">
    <div class="grid">
      <div><label>De</label><input type="date" name="de" value="${filtroCC.de}"></div>
      <div><label>Até</label><input type="date" name="ate" value="${filtroCC.ate}"></div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltroCCAnalise">Limpar filtros</button> <button type="button" class="sec" id="btnExportarCC">⬇️ Exportar (Excel)</button> <button type="button" class="print" id="btnImprimirCC">Imprimir / PDF</button></div>
  </form>
  <div class="tablewrap">
    <table><thead><tr><th>Centro de Custo</th><th>Unidade</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Resultado</th></tr></thead>
    <tbody>
      ${linhas}
      <tr style="background:var(--bg);"><td>Não Alocado</td><td>—</td><td class="right">${fmt(naoAlocadoReceitas)}</td><td class="right">${fmt(naoAlocadoDespesas)}</td><td class="right"><b>${fmt(naoAlocadoReceitas-naoAlocadoDespesas)}</b></td></tr>
      <tr style="background:var(--verde-claro);"><td><b>TOTAL</b></td><td>—</td><td class="right"><b>${fmt(totalReceitas)}</b></td><td class="right"><b>${fmt(totalDespesas)}</b></td><td class="right"><b>${fmt(totalResultado)}</b></td></tr>
    </tbody></table>
  </div>
  <p class="note">Valores com base na alocação por Centro de Custo de cada lançamento (percentual definido em "🔗 Alocação de Lançamentos"). Lançamentos ainda sem alocação aparecem em "Não Alocado".</p>`;
}

function bindCentrosCustoEvents(){
  document.querySelectorAll('[data-ccsub]').forEach(b=>b.onclick=()=>{ ccSubView = b.dataset.ccsub; ccDividindoId=null; render(); });

  const formNovoCC = document.getElementById('formNovoCC');
  if(formNovoCC) formNovoCC.onsubmit = async e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(formNovoCC).entries());
    const codigo = (f.codigo||'').trim().toUpperCase();
    if(!codigo || !f.nome){ toast('Preencha código e nome.'); return; }
    const ccs = configCC();
    if(ccs.some(c=>c.codigo===codigo)){ toast('Já existe um Centro de Custo com este código.'); return; }
    ccs.push({codigo, nome:f.nome.trim(), unidade:f.unidade||'', ativo:true});
    logar('Centro de Custo criado', `${codigo} — ${f.nome}`);
    await saveDB(); toast('Centro de Custo criado.'); render();
  };

  const btnGuardarCCGestao = document.getElementById('btnGuardarCCGestao');
  if(btnGuardarCCGestao) btnGuardarCCGestao.onclick = async ()=>{
    const ccs = configCC();
    document.querySelectorAll('[data-cc-nome]').forEach(inp=>{
      const c = ccs.find(x=>x.codigo===inp.dataset.ccNome); if(c && inp.value.trim()) c.nome = inp.value.trim();
    });
    document.querySelectorAll('[data-cc-ativo]').forEach(chk=>{
      const c = ccs.find(x=>x.codigo===chk.dataset.ccAtivo); if(c) c.ativo = chk.checked;
    });
    logar('Centros de Custo atualizados', `${ccs.filter(c=>c.ativo!==false).length} ativo(s) de ${ccs.length}.`);
    await saveDB(); toast('Alterações guardadas.'); render();
  };

  document.querySelectorAll('[data-cc-remover]').forEach(b=>b.onclick=async ()=>{
    const codigo = b.dataset.ccRemover;
    if(!confirm(`Remover o Centro de Custo ${codigo}? Lançamentos já alocados a ele passam a "Não Alocado" nas análises.`)) return;
    DB.centrosCusto = configCC().filter(c=>c.codigo!==codigo);
    logar('Centro de Custo removido', codigo);
    await saveDB(); toast('Centro de Custo removido.'); render();
  });

  const formFiltroCC = document.getElementById('formFiltroCC');
  if(formFiltroCC) formFiltroCC.onsubmit = e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(formFiltroCC).entries()); filtroCC={de:f.de||'', ate:f.ate||''}; render(); };
  const btnLimparFiltroCC = document.getElementById('btnLimparFiltroCC');
  if(btnLimparFiltroCC) btnLimparFiltroCC.onclick = ()=>{ filtroCC={de:'',ate:''}; render(); };
  const btnAplicarTodasSugCC = document.getElementById('btnAplicarTodasSugCC');
  if(btnAplicarTodasSugCC) btnAplicarTodasSugCC.onclick = ()=> aplicarTodasSugestoesCC(filtroCC.de, filtroCC.ate);

  const formFiltroCCAnalise = document.getElementById('formFiltroCCAnalise');
  if(formFiltroCCAnalise) formFiltroCCAnalise.onsubmit = e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(formFiltroCCAnalise).entries()); filtroCC={de:f.de||'', ate:f.ate||''}; render(); };
  const btnLimparFiltroCCAnalise = document.getElementById('btnLimparFiltroCCAnalise');
  if(btnLimparFiltroCCAnalise) btnLimparFiltroCCAnalise.onclick = ()=>{ filtroCC={de:'',ate:''}; render(); };
  const btnExportarCC = document.getElementById('btnExportarCC');
  if(btnExportarCC) btnExportarCC.onclick = ()=>{ if(!ultimoCCRelatorio) return; exportarExcel('centros-de-custo','Centros de Custo', ultimoCCRelatorio.cabecalhos, ultimoCCRelatorio.linhas); };
  const btnImprimirCC = document.getElementById('btnImprimirCC');
  if(btnImprimirCC) btnImprimirCC.onclick = ()=>{ if(!ultimoCCRelatorio) return; imprimirRelatorioGenerico('Centros de Custo — Resultado Analítico', `Período: ${ultimoCCRelatorio.periodo}.`, ultimoCCRelatorio.cabecalhos, ultimoCCRelatorio.linhas.map(l=>[l[0],l[1],fmt(l[2]),fmt(l[3]),fmt(l[4])])); };

  const formCCComparacao = document.getElementById('formCCComparacao');
  if(formCCComparacao) formCCComparacao.onsubmit = e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(formCCComparacao).entries()); ccComparacaoSel=f.cc||''; filtroCC={de:f.de||'', ate:f.ate||''}; render(); };

  document.querySelectorAll('[data-cc-aplicar-sug]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ccAplicarSug; const l=DB.lancamentos.find(x=>x.id===id); if(!l) return;
    const sug=sugerirCC(l); if(!sug){ toast('Sem sugestão para este lançamento.'); return; }
    aplicarAlocacaoCCRapida(id, sug);
  });
  document.querySelectorAll('[data-cc-aplicar-select]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ccAplicarSelect;
    const sel=document.querySelector(`[data-cc-select="${id}"]`);
    if(!sel || !sel.value){ toast('Escolha um Centro de Custo.'); return; }
    aplicarAlocacaoCCRapida(id, sel.value);
  });
  document.querySelectorAll('[data-cc-dividir-toggle]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ccDividirToggle; ccDividindoId = (ccDividindoId===id) ? null : id; render();
  });
  document.querySelectorAll('[data-cc-guardar-divisao]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.ccGuardarDivisao;
    const alocacoes=[];
    document.querySelectorAll('[data-cc-pct]').forEach(inp=>{
      const pct=Number(inp.value||0); if(pct>0) alocacoes.push({cc:inp.dataset.ccPct, pct});
    });
    if(!alocacoes.length){ toast('Defina pelo menos uma percentagem.'); return; }
    await aplicarAlocacaoCCMultipla(id, alocacoes);
  });
  document.querySelectorAll('[data-cc-remover-aloc]').forEach(b=>b.onclick=()=> removerAlocacaoCC(b.dataset.ccRemoverAloc));
}

/* ---------- Eventos ---------- */
function bindEvents(){
  /* Barra genérica de Filtro por Período/Posto + Exportar/Imprimir (todos os módulos registados em MODULOS_FILTRO) */
  bindBarraFiltroModulo();

  /* Contabilidade Analítica — configuração de rateio, filtro de período, exportar/imprimir */
  const formAnaliticaConfig = document.getElementById('formAnaliticaConfig');
  if(formAnaliticaConfig) formAnaliticaConfig.onsubmit = async e=>{
    e.preventDefault();
    const novoRateio = {};
    document.querySelectorAll('[data-analitica-rateio]').forEach(inp=>{
      novoRateio[inp.dataset.analiticaRateio] = Number(inp.value||0);
    });
    const novasCategorias = [];
    document.querySelectorAll('[data-analitica-cat]').forEach(chk=>{
      if(chk.checked) novasCategorias.push(chk.dataset.analiticaCat);
    });
    DB.analitica = {rateio:novoRateio, categoriasIndiretas:novasCategorias};
    logar('Configuração de Rateio Analítico atualizada', `${novasCategorias.length} categoria(s) indireta(s) — soma do rateio: ${UNIDADES_RATEIO.reduce((s,u)=>s+Number(novoRateio[u]||0),0).toFixed(2)}%`);
    await saveDB(); toast('Configuração guardada.'); render();
  };
  const formFiltroAnalitica = document.getElementById('formFiltroAnalitica');
  if(formFiltroAnalitica) formFiltroAnalitica.onsubmit = e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(formFiltroAnalitica).entries());
    filtroAnalitica = {de:f.de||'', ate:f.ate||''};
    render();
  };
  const btnLimparFiltroAnalitica = document.getElementById('btnLimparFiltroAnalitica');
  if(btnLimparFiltroAnalitica) btnLimparFiltroAnalitica.onclick = ()=>{ filtroAnalitica={de:'',ate:''}; render(); };
  const btnExportarAnalitica = document.getElementById('btnExportarAnalitica');
  if(btnExportarAnalitica) btnExportarAnalitica.onclick = ()=>{
    if(!ultimoAnalitica) return;
    exportarExcel('contabilidade-analitica','Analítica', ultimoAnalitica.cabecalhos, ultimoAnalitica.linhas);
  };
  const btnImprimirAnalitica = document.getElementById('btnImprimirAnalitica');
  if(btnImprimirAnalitica) btnImprimirAnalitica.onclick = ()=>{
    if(!ultimoAnalitica) return;
    imprimirRelatorioGenerico('Contabilidade Analítica — Resultado por Centro de Custo', `Período: ${ultimoAnalitica.periodo}.`,
      ultimoAnalitica.cabecalhos, ultimoAnalitica.linhas.map(l=>[l[0],fmt(l[1]),fmt(l[2]),fmt(l[3]),fmt(l[4])]));
  };

  /* Centros de Custo — módulo de contabilidade analítica avançada (alocação detalhada) */
  bindCentrosCustoEvents();

  /* Balanço Patrimonial — Exportar/Imprimir do snapshot atual (ultimoBalanco, calculado em viewBalanco) */
  const btnExportarBalanco = document.getElementById('btnExportarBalanco');
  if(btnExportarBalanco) btnExportarBalanco.onclick=()=>{
    if(!ultimoBalanco) return;
    exportarExcel('balanco-patrimonial','Balanço',['Rubrica','Ativo','Passivo + Capital Próprio'],ultimoBalanco.linhas);
  };
  const btnImprimirBalanco = document.getElementById('btnImprimirBalanco');
  if(btnImprimirBalanco) btnImprimirBalanco.onclick=()=>{
    if(!ultimoBalanco) return;
    imprimirRelatorioGenerico('Balanço Patrimonial', `Posição em ${ultimoBalanco.anoCorrente}.`, ['Rubrica','Ativo','Passivo + Capital Próprio'], ultimoBalanco.linhas);
  };

  /* IVA e Retenções — Exportar/Imprimir do apuramento mensal do ano corrente */
  const btnExportarIVA = document.getElementById('btnExportarIVA');
  if(btnExportarIVA) btnExportarIVA.onclick=()=>{
    const {ano, dadosMensais} = exportarIVAAtual();
    exportarExcel('iva-retencoes-'+ano,'IVA',['Mês','IVA Liquidado','IVA Dedutível','IVA Apurado','Acumulado'],
      dadosMensais.map(d=>[d.mes,d.liquidado,d.dedutivel,d.apurado,d.acumulado]));
  };
  const btnImprimirIVA = document.getElementById('btnImprimirIVA');

  /* FaturaBot */
