}

/* ---------- Conta Corrente (Clientes ou Fornecedores) ---------- */
let clienteContaCorrenteAtivo = '';
let fornecedorContaCorrenteAtivo = '';
function viewContaCorrente(key){
  const isFornecedor = key==='contasPagar';
  const titulo = isFornecedor ? 'Conta Corrente de Fornecedores' : 'Conta Corrente de Clientes';
  const labelEntidade = isFornecedor ? 'Fornecedor' : 'Cliente';
  const tipoDebito = isFornecedor ? 'Débito (Compra a Crédito)' : 'Débito (Venda a Crédito)';
  const tipoCredito = isFornecedor ? 'Crédito (Pagamento Efetuado)' : 'Crédito (Pagamento Recebido)';

  const entidades = [...new Set(DB[key].map(c=>c.entidade).filter(Boolean))].sort();
  let ativo = isFornecedor ? fornecedorContaCorrenteAtivo : clienteContaCorrenteAtivo;
  if(!ativo && entidades.length) ativo = entidades[0];

  const saldoDaEntidade = (nome)=> DB[key].filter(c=>c.entidade===nome)
    .reduce((s,c)=> s + (Number(c.valor||0) - Number(c.valorPago||0)), 0);

  const resumo = entidades.map(nome=>({nome, saldo: saldoDaEntidade(nome)}))
    .sort((a,b)=> b.saldo - a.saldo);

  let linhasLedger = '', totalEmAberto = 0;
  if(ativo){
    const entradas = DB[key].filter(c=>c.entidade===ativo);
    const movimentos = [];
    entradas.forEach(c=>{
      movimentos.push({data:c.data||c.vencimento, tipo:tipoDebito, descricao:c.descricao||'—', valor:Number(c.valor||0)});
      (c.pagamentos||[]).forEach(p=>{
        movimentos.push({data:p.data, tipo:tipoCredito, descricao:p.observacao||'Pagamento', valor:-Number(p.valor||0)});
      });
    });
    movimentos.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    let saldoCorrente = 0;
    linhasLedger = movimentos.map(m=>{
      saldoCorrente += m.valor;
      return `<tr><td>${m.data}</td><td>${m.tipo}</td><td>${m.descricao}</td>
        <td class="right">${m.valor>=0?fmt(m.valor):'—'}</td>
        <td class="right">${m.valor<0?fmt(-m.valor):'—'}</td>
        <td class="right"><b>${fmt(saldoCorrente)}</b></td></tr>`;
    }).join('') || `<tr><td colspan="6" class="note">Sem movimentos para ${isFornecedor?'este fornecedor':'este cliente'}.</td></tr>`;
    totalEmAberto = saldoCorrente;
  }

  return `
  <h2>🧾 ${titulo}</h2>
  <p class="note">Histórico completo de cada ${labelEntidade.toLowerCase()}: todas as ${isFornecedor?'compras a crédito':'vendas a crédito'} (débito) e todos os pagamentos ${isFornecedor?'efetuados':'recebidos'} (crédito), com saldo a transitar — tal como um extrato bancário. Os pagamentos registam-se em "${isFornecedor?'Contas a Pagar':'Contas a Receber'}".</p>

  <div class="tablewrap" style="margin-bottom:18px;">
    <table><thead><tr><th>${labelEntidade}</th><th class="right">Saldo em Aberto</th><th></th></tr></thead>
    <tbody>${resumo.map(r=>`<tr${r.nome===ativo?' style="background:var(--bg);"':''}>
      <td>${r.nome}</td><td class="right">${fmt(r.saldo)}</td>
      <td><button class="sec" data-cc="${key}:${r.nome.replace(/"/g,'&quot;')}">Ver Extrato</button></td>
    </tr>`).join('') || `<tr><td colspan="3" class="note">Ainda sem ${isFornecedor?'fornecedores':'clientes'} em ${isFornecedor?'Contas a Pagar':'Contas a Receber'}.</td></tr>`}</tbody></table>
  </div>

  ${ativo ? `
  <h2 class="sub" style="font-size:15px;">Extrato — ${ativo}</h2>
  <div class="actions" style="margin-bottom:10px;"><button type="button" class="print" id="btnImprimirContaCorrente" data-cc-print="${key}">Imprimir Extrato</button></div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="right">Débito</th><th class="right">Crédito</th><th class="right">Saldo</th></tr></thead>
    <tbody>${linhasLedger}</tbody></table>
  </div>
  <div class="card" style="margin-top:14px;background:${totalEmAberto>0.5?'#fdeceb':'var(--verde-claro)'};border-color:${totalEmAberto>0.5?'var(--vermelho)':'var(--verde)'};">
    Saldo em Aberto de <b>${ativo}</b>: <b>${fmt(totalEmAberto)} Kz</b> ${totalEmAberto<=0.5?`✅ ${isFornecedor?'Sem dívida a este fornecedor':'Sem dívida'}`:`⚠️ ${isFornecedor?'Ainda devemos a este fornecedor':'Cliente ainda deve'}`}
  </div>` : ''}`;
}

/* ---------- Conciliação Bancária ---------- */
const MESES_CONCILIACAO = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function viewBancos(){
  const contasBanco = CONTAS.filter(c=>c.codigo!=='CASH');
  if(!contasBanco.find(c=>c.codigo===bancoTabAtivo)) bancoTabAtivo = contasBanco[0].codigo;
  const conta = contasBanco.find(c=>c.codigo===bancoTabAtivo);
  const ano = bancoAnoAtivo;

  const cfg = (DB.bancosConfig && DB.bancosConfig[conta.codigo]) || {};
  const saldoAbertura = Number(cfg.saldoAbertura||0);
  const ajustes = Number(cfg.ajustes||0);

  function manual(mesIdx, campo){
    const key = `${conta.codigo}:${ano}:${mesIdx}`;
    const r = (DB.saldosBancarios && DB.saldosBancarios[key]) || {};
    return Number(r[campo]||0);
  }

  /* Propositadamente NÃO se usa valorEmKZ aqui: cada conta bancária tem a sua própria
     moeda (BAI-EUR-001 é EUR, BAI-USD-002 é USD) e o extrato do banco vem nessa mesma
     moeda nativa — por isso os saldos ficam na moeda da própria conta, para bater certo
     com o extrato real. Isto é diferente do Balanço/DRE, que somam TODAS as contas
     juntas num único total em Kz. */
  const saldoInicial=[], movimento=[], saldoContabNosso=[], saldoDispNosso=[], saldoDispExtrato=[], diferenca=[];
  for(let m=0;m<12;m++){
    saldoInicial[m] = m===0 ? saldoAbertura : saldoContabNosso[m-1];
    const chaveMes = `${ano}-${String(m+1).padStart(2,'0')}`;
    movimento[m] = DB.lancamentos.filter(l=>l.conta===conta.codigo && mesKey(l.data)===chaveMes)
      .reduce((s,l)=> s + (l.tipo==='Receita'? Number(l.valor||0) : -Number(l.valor||0)), 0);
    saldoContabNosso[m] = saldoInicial[m] + movimento[m];
    saldoDispNosso[m] = saldoContabNosso[m] - ajustes;
    saldoDispExtrato[m] = manual(m,'saldoDisponivel');
    diferenca[m] = saldoDispExtrato[m] - saldoDispNosso[m];
  }

  const tabs = contasBanco.map(c=>`<button type="button" class="tab-conta ${c.codigo===conta.codigo?'active':''}" data-banco-tab="${c.codigo}">${c.codigo}<br><small>${c.banco||''} · ${c.moeda||''}</small></button>`).join('');

  const linhaCalc = (label,arr,forte)=> `<tr${forte?' style="font-weight:bold;"':''}><td>${label}</td>${arr.map(v=>`<td class="right">${fmt(v)}</td>`).join('')}</tr>`;

  const linhaEstado = `<tr><td>Estado</td>${diferenca.map(v=> `<td class="right">${Math.round(v*100)===0? '<span class="badge pago">✓</span>' : '<span class="badge atraso">⚠</span>'}</td>`).join('')}</tr>`;

  const linhaManual = (label,campo)=> `<tr><td>${label}</td>${MESES_CONCILIACAO.map((m,i)=>`<td><input type="number" step="0.01" data-banco-manual="${conta.codigo}:${ano}:${i}:${campo}" value="${manual(i,campo)||''}" style="width:100px;"></td>`).join('')}</tr>`;

  const anosLanc = Array.from(new Set(DB.lancamentos.map(l=> Number(mesKey(l.data).slice(0,4))))).filter(a=>a);
  const anos = Array.from(new Set([...anosLanc, new Date().getFullYear()])).sort();

  return `
  <h2>🏦 Conciliação Bancária</h2>
  <p class="note">Dados das contas reais da empresa. Preencha o Saldo de Abertura e os Ajustes uma vez; preencha o Saldo Disponível do extrato todo mês para conferir com o sistema.</p>

  <div class="actions" style="margin-bottom:14px;">
    <button type="button" class="print" onclick="imprimirFichaConciliacaoAtual()">Imprimir ficha de conciliação</button>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${tabs}</div>

  <div class="card" style="margin-bottom:18px;">
    <h3 style="margin:0 0 10px;font-family:Cambria,Georgia,serif;">CONTA ${conta.codigo} — ${conta.banco||''} (${conta.moeda||''})</h3>
    <table style="width:100%;font-size:12.5px;border:none;">
      <tr>
        <td class="lbl2">Banco:</td><td>${conta.banco||'—'}</td>
        <td class="lbl2">Nome da Conta:</td><td colspan="3">${conta.nomeConta||'—'}</td>
        <td class="lbl2">Moeda:</td><td>${conta.moeda||'—'}</td>
        <td class="lbl2">Natureza:</td><td>${conta.natureza||'—'}</td>
      </tr>
      <tr>
        <td class="lbl2">Nº de Conta:</td><td>${conta.numConta||'—'}</td>
        <td class="lbl2">IBAN:</td><td colspan="3">${conta.iban||'—'}</td>
        <td class="lbl2">SWIFT/BIC:</td><td colspan="2">${conta.swift||'—'}</td>
      </tr>
    </table>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;">
      <div>
        <label>Ano</label>
        <select id="bancoAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div>
        <label>Saldo de abertura em 01/Jan/${ano} (transitado de ${ano-1})</label>
        <input type="number" step="0.01" data-banco-config="${conta.codigo}:saldoAbertura" value="${saldoAbertura}">
      </div>
      <div>
        <label>Ajustes conhecidos (cheques por compensar, tarifas não lançadas, etc.)</label>
        <input type="number" step="0.01" data-banco-config="${conta.codigo}:ajustes" value="${ajustes}">
      </div>
    </div>
  </div>

  <div class="tablewrap" style="margin-bottom:22px;">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaCalc('Saldo Inicial do Mês (calculado)', saldoInicial)}
        ${linhaCalc('(+/-) Movimento do Mês (calculado do LANÇAMENTO)', movimento)}
        ${linhaCalc('SALDO CONTABILÍSTICO (nosso, calculado)', saldoContabNosso, true)}
        ${linhaCalc('SALDO DISPONÍVEL (nosso, calculado)', saldoDispNosso, true)}
        ${linhaCalc('Saldo Disponível (extrato bancário) — igual ao lançamento manual abaixo', saldoDispExtrato)}
        ${linhaCalc('DIFERENÇA (Extrato − Saldo Disponível)', diferenca, true)}
        ${linhaEstado}
      </tbody>
    </table>
  </div>

  <h2 class="sub">LANÇAMENTO MANUAL — VALORES DO EXTRATO BANCÁRIO (preencher todo mês)</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaManual('Saldo Transitado (extrato bancário)','saldoTransitado')}
        ${linhaManual('Saldo Contabilístico (extrato bancário)','saldoContabilistico')}
        ${linhaManual('Saldo Disponível (extrato bancário)','saldoDisponivel')}
      </tbody>
    </table>
  </div>
  ${viewConciliacaoExtratoImportado(conta.codigo)}`;
}

/* ---------- Conciliação de Extrato Bancário Importado (transação a transação) ---------- */
function viewConciliacaoExtratoImportado(contaCodigo){
  const {linhas, nConfere, nSoExtrato, nSoSistema, total} = calcularConciliacaoExtrato(contaCodigo);
  const badge = (status)=> status==='confere' ? '<span class="badge pago">✓ Confere</span>'
    : status==='so_extrato' ? '<span class="badge atraso">⚠ Só no extrato</span>'
    : '<span class="badge pendente">⚠ Só no sistema</span>';
  const linhasHtml = linhas.map(l=>{
    const sugestaoHtml = l.status==='so_extrato'
      ? `${l.categoriaSugerida?`<div style="font-size:12px;">💡 ${l.categoriaSugerida}${l.entidadeSugerida?` — ${l.entidadeSugerida}`:''}</div>`:'<div class="note" style="font-size:12px;">Sem sugestão</div>'}
         <button type="button" data-lancar-extrato="${contaCodigo}:${l.id}" style="font-size:12px;padding:2px 8px;">+ Lançar</button>`
      : '';
    return `<tr><td>${l.data||'—'}</td><td>${l.descricao||'—'}</td><td class="right">${fmt(l.valor)}</td><td>${badge(l.status)}</td><td>${sugestaoHtml}</td></tr>`;
  }).join('') || `<tr><td colspan="5" class="note">Ainda não importaste o extrato desta conta.</td></tr>`;

  /* Resumo do mês corrente: tudo o que está "só no extrato" (pagamentos que já saíram do
     banco mas ainda não foram lançados no sistema) agrupado pela categoria sugerida — dá
     o cálculo, no fim do mês, de quanto falta lançar em cada categoria de despesa/receita
     usando a MESMA lógica de categorização automática que já existe nas Despesas. */
  const mesAtual = hoje().slice(0,7);
  const soExtratoMes = linhas.filter(l=>l.status==='so_extrato' && (l.data||'').startsWith(mesAtual));
  const porCategoria = {};
  soExtratoMes.forEach(l=>{
    const cat = l.categoriaSugerida || 'Sem categoria sugerida';
    porCategoria[cat] = porCategoria[cat]||{qtd:0,total:0};
    porCategoria[cat].qtd++; porCategoria[cat].total += Number(l.valor)||0;
  });
  const resumoMesHtml = Object.entries(porCategoria).map(([cat,v])=>
    `<tr><td>${cat}</td><td class="right">${v.qtd}</td><td class="right">${fmt(v.total)}</td></tr>`).join('');

  return `
  <h2 class="sub" style="font-size:15px;margin-top:24px;">🔎 Conciliação Automática — Extrato Real vs Lançamentos (transação a transação)</h2>
  <p class="note">Mesma lógica da Reconciliação SAF-T vs Fecho de Caixa, mas aqui compara-se o <b>extrato bancário real</b> desta conta com os lançamentos pagos/recebidos por Banco/TPA/Transferência — incluindo pagamentos a fornecedores por banco. Importa o extrato em CSV/Excel (mais fiável) ou tira uma foto/PDF para leitura automática por IA. Linhas "Só no extrato" recebem uma categoria sugerida (mesma lógica de categorização automática das Despesas) — clique "+ Lançar" para criar o lançamento já com essa categoria, ajustando depois se for preciso.</p>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px;">

/* ---------- IVA e Retenções ---------- */
function viewMotorFiscal(){
  const hojeD = new Date();
  const ano = hojeD.getFullYear();
  const addMeses = (data,n)=>{ const d=new Date(data); d.setMonth(d.getMonth()+n); return d; };
  /* Próximo prazo de IVA: a declaração do mês anterior ao corrente vence no último dia útil do mês corrente.
     Se já passou esse dia, o próximo prazo relevante é o do mês seguinte (para o mês corrente).
     Usa setMonth (via addMeses) para a virada de ano (dez→jan) ser tratada automaticamente pelo JS. */
  const prazoIvaEsteMes = ultimoDiaUtilDoMes(ano, hojeD.getMonth());
  const mesAnterior = addMeses(new Date(ano, hojeD.getMonth(), 1), -1);
  let prazoIvaProximo = prazoIvaEsteMes, mesDeclarado = MESES[mesAnterior.getMonth()];
  if(hojeD > prazoIvaEsteMes){
    const mesSeguinte = addMeses(new Date(ano, hojeD.getMonth(), 1), 1);
    prazoIvaProximo = ultimoDiaUtilDoMes(mesSeguinte.getFullYear(), mesSeguinte.getMonth());
    mesDeclarado = MESES[hojeD.getMonth()];
  }
  let prazoModelo1Geral = ultimoDiaUtilDoMes(ano, 4); // Maio
  let prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano, 3); // Abril
  let exercicioGeral = ano-1, exercicioSimplificado = ano-1;
  if(hojeD > prazoModelo1Geral){ prazoModelo1Geral = ultimoDiaUtilDoMes(ano+1, 4); exercicioGeral = ano; }
  if(hojeD > prazoModelo1Simplificado){ prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano+1, 3); exercicioSimplificado = ano; }
  const iiG = REGRAS_FISCAIS_AGT.impostoIndustrial;
  const iva = REGRAS_FISCAIS_AGT.iva;
  const ret = REGRAS_FISCAIS_AGT.retencaoServicos;

  const prazos = [
    {nome:`Declaração Periódica de IVA (${mesDeclarado})`, data:prazoIvaProximo, freq:"Mensal"},
    {nome:`Imposto Industrial — Modelo 1 (Regime Geral, exercício ${exercicioGeral})`, data:prazoModelo1Geral, freq:"Anual"},
    {nome:`Imposto Industrial — Declaração Simplificada (exercício ${exercicioSimplificado})`, data:prazoModelo1Simplificado, freq:"Anual"},
  ].sort((a,b)=>a.data-b.data);

  return `
  <h2 style="background:var(--castanho);">🏛️ Motor Fiscal AGT</h2>
  <p class="note">⚠️ Referência interna de apoio — taxas e prazos podem mudar por despacho da AGT (já houve prorrogações pontuais). Confirme sempre no <a href="https://portaldocontribuinte.minfin.gov.ao" target="_blank" rel="noopener">Portal do Contribuinte</a> ou com o contabilista antes de submeter ou pagar.</p>

  <h2 class="sub" style="font-size:15px;">Próximos Prazos</h2>
  <div class="tablewrap"><table><thead><tr><th>Obrigação</th><th>Periodicidade</th><th class="right">Prazo</th><th class="right">Dias restantes</th></tr></thead><tbody>
    ${prazos.map(p=>{
      const dias = Math.ceil((p.data - hojeD)/86400000);
      return `<tr><td>${p.nome}</td><td>${p.freq}</td><td class="right">${fmtData(p.data)}</td><td class="right ${dias<=7?'neg':''}">${dias>=0?dias+' dia(s)':'—'}</td></tr>`;
    }).join('')}
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">IVA</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral</td><td class="right">${(iva.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Taxas reduzidas</td><td class="right">${iva.taxasReduzidas.map(t=>(t*100).toFixed(0)+'%').join(' / ')}</td></tr>
    <tr><td>Prazo da declaração</td><td>${iva.prazoDeclaracao}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Retenção na Fonte</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa (${ret.base})</td><td class="right">${(ret.taxa*100).toFixed(1)}%</td></tr>
    <tr><td colspan="2" class="note">${ret.nota}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Imposto Industrial</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral (Regime Geral)</td><td class="right">${(iiG.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Atividades agrícolas/aquícolas/pecuárias</td><td class="right">${(iiG.taxaAgropecuaria*100).toFixed(0)}%</td></tr>
    <tr><td>Banca, seguros, telecomunicações, petrolíferas</td><td class="right">${(iiG.taxaSectorEspecial*100).toFixed(0)}%</td></tr>
    <tr><td>Prazo Modelo 1 (Regime Geral)</td><td>${iiG.prazoModelo1RegimeGeral}</td></tr>
    <tr><td>Prazo Declaração Simplificada</td><td>${iiG.prazoModelo1RegimeSimplificado}</td></tr>
    <tr><td>Limiar do Regime Simplificado</td><td>${iiG.limiarRegimeSimplificado}</td></tr>
  </tbody></table></div>`;
}

  const ano = anos[0] || new Date().getFullYear();
  const doAno = DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)));

  /* Mapa de Retenções na Fonte: despesas de "Serviços de Terceiros" com retenção estimada. */
  const retencoes = explodirLancamentos(doAno.filter(l=>l.tipo==='Despesa'))
    .filter(l=>l.categoria==='Serviços de Terceiros')
    .map(l=>({data:l.data, entidade:l.entidade||'—', nif:l.nif||'—', base:l.valor, retencao:l.valor*REGRAS_FISCAIS_AGT.retencaoServicos.taxa}))
    .sort((a,b)=>a.data.localeCompare(b.data));
  const totalBase = retencoes.reduce((s,r)=>s+r.base,0);
  const totalRetido = retencoes.reduce((s,r)=>s+r.retencao,0);

  /* Mapa de Fornecedores e Clientes: total anual por NIF/entidade — despesas (fornecedores) e receitas (clientes). */
  const porEntidade = {};
  doAno.filter(l=>l.entidade && l.entidade.trim()).forEach(l=>{

    if(l.tipo==='Despesa') porEntidade[chave].compras += valorEmKZ(l);
    else porEntidade[chave].vendas += valorEmKZ(l);
  });
  const listaEntidades = Object.values(porEntidade).sort((a,b)=>(b.compras+b.vendas)-(a.compras+a.vendas));
  const semNIF = listaEntidades.filter(e=>e.nif==='—').length;

  return `

    <div class="card"><div class="lbl">Base Sujeita a Retenção</div><div class="val">${fmt(totalBase)} Kz</div></div>

  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Entidade</th><th>NIF</th><th class="right">Base</th><th class="right">Retenção</th></tr></thead><tbody>

/* ---------- Controlo NIF ----------
   Junta o NIF de todas as fontes (Lançamentos + faturas do FaturaBot, pendentes e
   já aprovadas) por entidade, valida o formato, e assinala inconsistências:
   NIFs com formato inválido/a confirmar, entidades sem NIF, e o mesmo NIF usado
   por nomes de entidade diferentes (possível erro de digitação a corrigir). */
function viewControloNIF(){
  const porEntidade = {};
  const registar = (entidade, nif)=>{
    if(!entidade || !entidade.trim()) return;
    const chaveEnt = entidade.trim();
    if(!porEntidade[chaveEnt]) porEntidade[chaveEnt] = {entidade:chaveEnt, nifs:new Set(), ocorrencias:0};
    porEntidade[chaveEnt].nifs.add((nif||'').trim());
    porEntidade[chaveEnt].ocorrencias++;
  };
  DB.lancamentos.forEach(l=>registar(l.entidade, l.nif));
  DB.faturabot.forEach(f=>registar(f.fornecedor, f.nif));

  const linhas = Object.values(porEntidade).map(e=>{
    const nifsValidos = [...e.nifs].filter(n=>n);
    const v = nifsValidos.length ? validarNIF(nifsValidos[0]) : {valido:false, tipo:'', mensagem:'NIF em falta'};
    return {...e, nifPrincipal: nifsValidos[0]||'', multiplosNIF: nifsValidos.length>1, validacao:v};
  }).sort((a,b)=> (a.validacao.valido===true?1:0) - (b.validacao.valido===true?1:0) || a.entidade.localeCompare(b.entidade));

  /* Mesmo NIF usado por entidades com nomes diferentes — indício de nome digitado de formas diferentes. */
  const nifParaEntidades = {};
  Object.values(porEntidade).forEach(e=>{
    [...e.nifs].filter(n=>n).forEach(n=>{
      if(!nifParaEntidades[n]) nifParaEntidades[n] = new Set();
      nifParaEntidades[n].add(e.entidade);
    });
  });
  const nifsPartilhados = Object.entries(nifParaEntidades).filter(([n,ents])=>ents.size>1);

  const semNif = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem==='NIF em falta').length;
  const invalidos = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem!=='NIF em falta').length;
  const aConfirmar = linhas.filter(l=>l.validacao.valido===null).length;
  const validos = linhas.filter(l=>l.validacao.valido===true).length;

  return `
  <h2 style="background:var(--castanho);">🪪 Controlo NIF</h2>
  <p class="note">Verificação de formato (10 dígitos para empresas; 9 dígitos + 2 letras + 3 dígitos para particulares com nº de BI) — não confirma se o NIF existe de facto na AGT, só a estrutura. Consolidado a partir de Lançamentos e faturas do FaturaBot.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Válidos</div><div class="val pos">${validos}</div></div>
    <div class="card"><div class="lbl">A Confirmar</div><div class="val">${aConfirmar}</div></div>
    <div class="card"><div class="lbl">Formato Inválido</div><div class="val neg">${invalidos}</div></div>
    <div class="card"><div class="lbl">Sem NIF</div><div class="val neg">${semNif}</div></div>
  </div>
  ${nifsPartilhados.length? `
  <h2 class="sub" style="font-size:15px;">⚠️ Mesmo NIF em nomes diferentes (possível erro de digitação)</h2>
  <div class="tablewrap"><table><thead><tr><th>NIF</th><th>Nomes usados</th></tr></thead><tbody>
    ${nifsPartilhados.map(([n,ents])=>`<tr><td>${n}</td><td>${[...ents].join(' / ')}</td></tr>`).join('')}
  </tbody></table></div>`:''}
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Por Entidade</h2>
  <div class="tablewrap"><table><thead><tr><th>Entidade</th><th>NIF</th><th>Situação</th><th class="right">Nº Lançamentos/Faturas</th></tr></thead><tbody>
    ${linhas.length? linhas.map(l=>`<tr>
      <td>${l.entidade}</td>
      <td>${l.nifPrincipal||'—'}${l.multiplosNIF?' <span class="note">(vários NIFs diferentes!)</span>':''}</td>
      <td>${l.validacao.valido===true?'✅':(l.validacao.valido===null?'⚠️':'❌')} ${l.validacao.mensagem}${l.validacao.tipo?` (${l.validacao.tipo})`:''}</td>
      <td class="right">${l.ocorrencias}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="note">Sem entidades registadas ainda.</td></tr>`}
  </tbody></table></div>`;
}

function viewIVA(){
  const ano = new Date().getFullYear();
  let acumulado=0;
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key);
    const liquidado = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const dedutivel = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const apurado = liquidado-dedutivel;
    acumulado += apurado;
    const retServicos = explodirLancamentos(doMes).filter(l=>l.tipo==='Despesa'&&l.categoria==='Serviços de Terceiros').reduce((s,l)=>s+valorEmKZ(l),0)*REGRAS_FISCAIS_AGT.retencaoServicos.taxa;
    return `<tr><td>${m}</td><td class="right">${fmt(liquidado)}</td><td class="right">${fmt(dedutivel)}</td><td class="right">${fmt(apurado)}</td><td class="right">${fmt(acumulado)}</td><td class="right">${fmt(retServicos)}</td></tr>`;
  }).join('');
  return `
  <h2>🧾 IVA e Retenções</h2>
  <p class="note">Estimativa a partir dos lançamentos com IVA marcado (Sim + taxa). Retenção estimada: ${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% sobre despesas de "Serviços de Terceiros". Taxas e prazos consultáveis em 🏛️ Motor Fiscal AGT. Confirme sempre com o contabilista/AGT antes de submeter.</p>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">IVA Liquidado</th><th class="right">IVA Dedutível</th><th class="right">IVA Apurado</th><th class="right">Acumulado</th><th class="right">Retenção Estimada (6,5%)</th></tr></thead>
  <tbody>${linhas}</tbody></table></div>`;
}

/* ---------- Balanço Patrimonial (simplificado) ---------- */
function viewBalanco(){
  const {contas} = calcularBalancetePartidasDobradas();
  const saldoConta = (cod)=> contas[cod] ? contas[cod].debito - contas[cod].credito : 0;

  /* Ativo: soma o saldo devedor de todas as contas de Caixa/Bancos (códigos definidos em
     CONTAS, já incluindo o efeito das reavaliações de Diferenças Cambiais) + saldo da conta
     Clientes líquido da Provisão de Cobrança Duvidosa — tudo extraído do Balancete de
     partidas dobradas, não de um filtro solto. */
  const caixaBancos = CONTAS.reduce((s,c)=> s + saldoConta(c.codigo), 0);
  const provisaoCobrancaDuvidosa = provisaoCobrancaDuvidosaAtual();
  const contasReceber = Math.max(0, saldoConta(CONTA_CLIENTES.cod) - provisaoCobrancaDuvidosa);
  const imobilizadoLiquido = DB.imobilizado.reduce((s,a)=> s + Math.max(0, Number(a.valor||0) - amortizacaoAcumuladaDoBem(a)), 0);
  const ativoTotal = caixaBancos+contasReceber+imobilizadoLiquido;

  /* Passivo: saldo credor da conta Fornecedores + qualquer outra conta do Plano de Contas
     explicitamente marcada como "Passivo" (Suprimentos de Sócios, Imposto Industrial a
     Pagar, Provisão de Férias/13º a Pagar). */
  const contasPagar = Math.max(0, -saldoConta(CONTA_FORNECEDORES.cod));
  const suprimentos = Math.max(0, -saldoConta("25"));
  const impostoAPagar = Math.max(0, -saldoConta(CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod));
  const feriasAPagar = Math.max(0, -saldoConta(CONTA_FERIAS_13_A_PAGAR.cod));
  const codigosPassivoOutros = [...new Set(Object.values(CATEGORIA_CONTA).filter(c=>c.tipo==='Passivo').map(c=>c.cod))]
    .filter(cod=>!["25",CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod,CONTA_FERIAS_13_A_PAGAR.cod].includes(cod));
  const passivoOutros = codigosPassivoOutros.reduce((s,cod)=> s + Math.max(0, -saldoConta(cod)), 0);
  const passivoExtra = suprimentos + impostoAPagar + feriasAPagar + passivoOutros;
  const passivoTotal = contasPagar + passivoExtra;

  /* Capital Próprio: calculado de forma INDEPENDENTE (não é "o que sobra" para o Balanço
     bater à força) — Capital Social (declarado pela empresa) + Resultados Transitados
     (resultado líquido acumulado de anos fiscais anteriores) + Resultado do Exercício
     (receitas - despesas - custos do ano corrente, já líquido de amortizações, provisões,
     diferenças cambiais e Imposto Industrial). */
  const anoCorrente = new Date().getFullYear();
  const capitalSocial = Number((DB.empresaConfig||{}).capitalSocial || 0);
  const anosComMovimento = [...new Set(DB.lancamentos.map(l=>mesKey(l.data).slice(0,4)))].map(Number);
  const resultadosTransitados = anosComMovimento.filter(a=>a<anoCorrente).reduce((s,a)=>s+resultadoLiquidoDoAno(a),0);
  const resultadoExercicio = resultadoLiquidoDoAno(anoCorrente);
  const capitalProprio = capitalSocial + resultadosTransitados + resultadoExercicio;

  const diferenca = ativoTotal - (passivoTotal + capitalProprio);
  const bate = Math.abs(diferenca) < 0.5;

  return `
  <h2>🏛️ Balanço Patrimonial</h2>
  <p class="note">O Capital Próprio já não é calculado "à força" para o balanço bater — é a soma de Capital Social + Resultados Transitados (anos anteriores) + Resultado do Exercício (ano corrente), tal como numa contabilidade real. O Resultado do Exercício já inclui Amortizações, Provisão de Férias/13º, Provisão de Cobrança Duvidosa, Diferenças Cambiais e a Provisão de Imposto Industrial (ver 📈 DRE para o detalhe). O Resultado exclui entradas de Suprimentos (empréstimos de sócios) — isso é Passivo, não lucro. Se o Ativo não coincidir com Passivo + Capital Próprio, o sistema avisa em vez de esconder a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:14px;">
    <div><label>Capital Social</label><input type="number" step="0.01" id="balancoCapitalSocial" value="${capitalSocial||''}" placeholder="0.00"></div>
  </div>
  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};margin-bottom:14px;">
    Ativo: <b>${fmt(ativoTotal)} Kz</b> &nbsp;|&nbsp; Passivo + Capital Próprio: <b>${fmt(passivoTotal+capitalProprio)} Kz</b> &nbsp;|&nbsp;
    ${bate?'✅ O Balanço bate':`⚠️ Diferença de ${fmt(diferenca)} Kz — reveja lançamentos/contas em aberto`}
  </div>
  <div class="split">
    <div><h2 class="sub" style="font-size:16px;">ATIVO</h2>
      <table><tbody>
      <tr><td>Caixa e Bancos</td><td class="right">${fmt(caixaBancos)}</td></tr>
      <tr><td>Clientes (Contas a Receber)${provisaoCobrancaDuvidosa>0.5?` <span class="note">(líquido de ${fmt(provisaoCobrancaDuvidosa)} de provisão)</span>`:''}</td><td class="right">${fmt(contasReceber)}</td></tr>
      <tr><td>Ativo Fixo Líquido (Imobilizado)</td><td class="right">${fmt(imobilizadoLiquido)}</td></tr>
      <tr><td><b>Total do Ativo</b></td><td class="right"><b>${fmt(ativoTotal)}</b></td></tr>
      </tbody></table>
    </div>
    <div><h2 class="sub" style="font-size:16px;">PASSIVO + CAPITAL PRÓPRIO</h2>
      <table><tbody>
      <tr><td>Fornecedores (Contas a Pagar)</td><td class="right">${fmt(contasPagar)}</td></tr>
      ${suprimentos>0?`<tr><td>Suprimentos de Sócios</td><td class="right">${fmt(suprimentos)}</td></tr>`:''}
      ${impostoAPagar>0?`<tr><td>Estado — Imposto Industrial a Pagar</td><td class="right">${fmt(impostoAPagar)}</td></tr>`:''}
      ${feriasAPagar>0?`<tr><td>Provisão de Férias e 13º Salário a Pagar</td><td class="right">${fmt(feriasAPagar)}</td></tr>`:''}
      ${passivoOutros>0?`<tr><td>Outros Passivos</td><td class="right">${fmt(passivoOutros)}</td></tr>`:''}
      <tr><td>Capital Social</td><td class="right">${fmt(capitalSocial)}</td></tr>
      <tr><td>Resultados Transitados (anos anteriores)</td><td class="right">${fmt(resultadosTransitados)}</td></tr>
      <tr><td>Resultado do Exercício (${anoCorrente})</td><td class="right">${fmt(resultadoExercicio)}</td></tr>
      <tr><td><b>Total</b></td><td class="right"><b>${fmt(passivoTotal+capitalProprio)}</b></td></tr>
      </tbody></table>
    </div>
  </div>`;
}

/* ---------- Demonstração de Fluxos de Caixa (DFC) — Método Direto ---------- */
let fluxoCaixaAnoAtivo = new Date().getFullYear();
function viewFluxoCaixa(){
  const ano = fluxoCaixaAnoAtivo;
  const chaveAno = String(ano);
  const todosCash = DB.lancamentos.filter(l=> CONTAS.some(c=>c.codigo===l.conta));

  /* Saldo inicial de caixa = tudo o que já se moveu nas contas de Caixa/Bancos ANTES do
     1º dia do ano selecionado (independentemente da atividade). */
  const saldoInicial = todosCash.filter(l=>mesKey(l.data) < `${chaveAno}-01`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doAno = todosCash.filter(l=> mesKey(l.data).startsWith(chaveAno));

  /* Classifica cada movimento de caixa do ano na atividade certa. "Transferência entre
     Contas" é excluída das 3 atividades — é dinheiro que sai de uma conta da empresa e
     entra noutra conta da própria empresa, não é fluxo real de/para fora da empresa (o
     efeito líquido no Saldo de Caixa total é sempre ~0, por isso só distorceria os
     totais se fosse incluída). */
  const isInvestimento = l => l.categoria==='Investimentos / Imobilizado';
  const isFinanciamento = l => l.categoria==='Suprimentos';
  const isTransferencia = l => l.categoria==='Transferência entre Contas';
  const isOperacional = l => !isInvestimento(l) && !isFinanciamento(l) && !isTransferencia(l);

  const somaTipo = (lista, tipo)=> lista.filter(l=>l.tipo===tipo).reduce((s,l)=>s+valorEmKZ(l),0);

  const opRecebimentos = somaTipo(doAno.filter(isOperacional), 'Receita');
  const opPagamentos = somaTipo(doAno.filter(isOperacional), 'Despesa');
  const fluxoOperacional = opRecebimentos - opPagamentos;

  const invEntradas = somaTipo(doAno.filter(isInvestimento), 'Receita');
  const invSaidas = somaTipo(doAno.filter(isInvestimento), 'Despesa');
  const fluxoInvestimento = invEntradas - invSaidas;

  const finEntradas = somaTipo(doAno.filter(isFinanciamento), 'Receita');
  const finSaidas = somaTipo(doAno.filter(isFinanciamento), 'Despesa');
  const fluxoFinanciamento = finEntradas - finSaidas;

  const transferenciasEntradas = somaTipo(doAno.filter(isTransferencia), 'Receita');
  const transferenciasSaidas = somaTipo(doAno.filter(isTransferencia), 'Despesa');

  const variacaoLiquida = fluxoOperacional + fluxoInvestimento + fluxoFinanciamento;
  const saldoFinal = saldoInicial + variacaoLiquida;

  /* Confirmação: o Saldo Final calculado aqui tem de bater com o saldo real de Caixa e
     Bancos a 31/Dez desse ano (soma de todos os movimentos até ao fim do ano, por
     qualquer atividade — incluindo transferências, que aqui se anulam). */
  const saldoRealAoFimDoAno = todosCash.filter(l=>mesKey(l.data) <= `${chaveAno}-12`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const bate = Math.abs(saldoFinal - saldoRealAoFimDoAno) < 0.5;

  const anosDisponiveis = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))].concat([new Date().getFullYear()]);
  const anosUnicos = [...new Set(anosDisponiveis)].sort((a,b)=>b-a);

  return `
  <h2>🌊 Demonstração de Fluxos de Caixa (Método Direto)</h2>
  <p class="note">Mostra de onde veio e para onde foi o dinheiro da Caixa Tesouraria e das contas bancárias durante o ano — separado em Atividades Operacionais (o negócio em si), de Investimento (compra/venda de equipamento e imobilizado) e de Financiamento (empréstimos/suprimentos de sócios). Transferências entre contas da própria empresa não entram (não representam entrada/saída real de dinheiro da empresa).</p>
  <div class="grid" style="grid-template-columns:160px;margin-bottom:14px;">
    <div><label>Ano</label><select id="fluxoCaixaAnoSel">${anosUnicos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>

  <div class="tablewrap" style="margin-bottom:14px;">
    <table><tbody>
      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades Operacionais</b></td></tr>
      <tr><td>Recebimentos de Clientes / Vendas</td><td class="right">${fmt(opRecebimentos)}</td></tr>
      <tr><td>Pagamentos a Fornecedores e Despesas Operacionais</td><td class="right">(${fmt(opPagamentos)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades Operacionais</b></td><td class="right"><b>${fmt(fluxoOperacional)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Investimento</b></td></tr>
      <tr><td>Entradas (venda de imobilizado)</td><td class="right">${fmt(invEntradas)}</td></tr>
      <tr><td>Saídas (compra de imobilizado/equipamento)</td><td class="right">(${fmt(invSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Investimento</b></td><td class="right"><b>${fmt(fluxoInvestimento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Financiamento</b></td></tr>
      <tr><td>Suprimentos de Sócios Recebidos</td><td class="right">${fmt(finEntradas)}</td></tr>
      <tr><td>Reembolsos de Suprimentos aos Sócios</td><td class="right">(${fmt(finSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Financiamento</b></td><td class="right"><b>${fmt(fluxoFinanciamento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Resumo</b></td></tr>
      <tr><td><b>Variação Líquida de Caixa no Ano</b></td><td class="right"><b>${fmt(variacaoLiquida)}</b></td></tr>
      <tr><td>Saldo de Caixa no Início do Ano</td><td class="right">${fmt(saldoInicial)}</td></tr>
      <tr><td><b>Saldo de Caixa no Fim do Ano</b></td><td class="right"><b>${fmt(saldoFinal)}</b></td></tr>
    </tbody></table>
  </div>

  ${(transferenciasEntradas||transferenciasSaidas) ? `<p class="note">Transferências internas entre contas da empresa neste ano (não incluídas acima): ${fmt(transferenciasEntradas)} Kz recebidas / ${fmt(transferenciasSaidas)} Kz enviadas — efeito líquido no saldo total: ${fmt(transferenciasEntradas-transferenciasSaidas)} Kz.</p>`:''}

  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};">
    ${bate?'✅ O Saldo de Caixa no Fim do Ano bate com o saldo real de Caixa e Bancos.':'⚠️ O Saldo de Caixa calculado não bate com o saldo real — reveja lançamentos deste ano.'}
  </div>`;
}

/* ---------- Existências e CMV ---------- */
function viewExistencias(){
  const ano = new Date().getFullYear();
  let inicial = 0, inicialQtd = 0;
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data)===key)).filter(l=>l.categoria==='Compra de Mercadorias para Revenda');
    const compras = doMes.reduce((s,l)=>s+valorEmKZ(l),0);
    const comprasQtd = doMes.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const final = Number(DB.existencias[key]||0);
    const finalQtd = Number(DB.existenciasQtd[key]||0);
    const cmv = inicial+compras-final;
    const consumoQtd = inicialQtd+comprasQtd-finalQtd;
    const linha = `<tr><td>${m}</td>
      <td class="right">${fmt(inicial)}</td><td class="right">${fmt(compras)}</td>
      <td><input type="number" step="0.01" data-existencia="${key}" value="${DB.existencias[key]||''}" placeholder="Valor" style="width:110px;"></td>
      <td class="right"><b>${fmt(cmv)}</b></td>
      <td class="right">${fmt(inicialQtd)}</td><td class="right">${fmt(comprasQtd)}</td>
      <td><input type="number" step="0.01" data-existencia-qtd="${key}" value="${DB.existenciasQtd[key]||''}" placeholder="Contagem" style="width:100px;"></td>
      <td class="right"><b>${fmt(consumoQtd)}</b></td></tr>`;
    inicial = final; inicialQtd = finalQtd;
    return linha;
  }).join('');
  return `
  <h2>📦 Existências e CMV</h2>
  <p class="note">Método de inventário periódico: CMV = Existências Iniciais + Compras do Mês − Existências Finais. As colunas de Quantidade vêm automaticamente do campo "Quantidade" dos Lançamentos (categoria "Compra de Mercadorias para Revenda") — preencha só a contagem física do fim do mês (valor e/ou quantidade); o mês seguinte transita sozinho.</p>
  <div class="tablewrap"><table><thead><tr>
    <th>Mês</th><th class="right">Exist. Iniciais (Kz)</th><th class="right">Compras (Kz)</th><th>Exist. Finais (Kz)</th><th class="right">CMV (Kz)</th>
    <th class="right">Exist. Iniciais (Qtd.)</th><th class="right">Compras (Qtd.)</th><th>Exist. Finais (Qtd.)</th><th class="right">Consumo (Qtd.)</th>
  </tr></thead>
  <tbody>${linhas}</tbody></table></div>`;
}

/* ---------- Orçamento vs Realizado ---------- */
function viewOrcamento(){
  const rows = [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].map(cat=>{
    const realizado = explodirLancamentos(DB.lancamentos).filter(l=>l.categoria===cat && l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const orc = Number(DB.orcamento[cat]||0);
    const desvio = realizado-orc;
    const pct = orc>0 ? (realizado/orc*100).toFixed(0)+'%' : '—';
    return `<tr><td>${cat}</td>
      <td><input type="number" step="0.01" data-orc="${cat}" value="${DB.orcamento[cat]||''}" style="width:130px;"></td>
      <td class="right">${fmt(realizado)}</td>
      <td class="right ${desvio>0?'':''}">${fmt(desvio)}</td><td class="right">${pct}</td></tr>`;
  }).join('');
  return `
  <h2>🎯 Orçamento vs Realizado</h2>
  <p class="note">Preencha o Orçamento Anual de cada categoria de despesa. Realizado, Desvio e % vêm automaticamente dos Lançamentos. Desvio positivo = gastou mais do que o orçamento.</p>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th>Orçamento Anual</th><th class="right">Realizado</th><th class="right">Desvio</th><th class="right">% Realizado</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}

function atualizarResumo(){
  const ano=document.getElementById('resAno').value, mes=document.getElementById('resMes').value;
  const key=`${ano}-${mes}`;
  const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key);
  const doMesExplodido = explodirLancamentos(doMes);
  const receitasOrigem = ORIGENS.map(o=>({nome:o,val:doMes.filter(l=>l.tipo==='Receita'&&l.origem===o).reduce((s,l)=>s+valorEmKZ(l),0)}));
  const totalReceitas = receitasOrigem.reduce((s,r)=>s+r.val,0);
  const receitasOperacionais = CATEGORIAS_RECEITAS.map(c=>({nome:c,val:doMes.filter(l=>l.tipo==='Receita'&&l.categoria===c).reduce((s,l)=>s+valorEmKZ(l),0)}));
  const totalReceitasOperacionais = receitasOperacionais.reduce((s,r)=>s+r.val,0);
  const receitasSemCategoria = totalReceitas - totalReceitasOperacionais - doMes.filter(l=>l.tipo==='Receita'&&l.categoria==='Suprimentos').reduce((s,l)=>s+valorEmKZ(l),0);
  const somaCat = c=>doMesExplodido.filter(l=>l.tipo==='Despesa'&&l.categoria===c).reduce((s,l)=>s+valorEmKZ(l),0);
  const despesasCat = CATEGORIAS_DESPESAS.map(c=>({nome:c,val:somaCat(c)}));
  const custosCat = CATEGORIAS_CUSTOS.map(c=>({nome:c,val:somaCat(c)}));
  const totalDespesas = despesasCat.reduce((s,r)=>s+r.val,0);
  const totalCustos = custosCat.reduce((s,r)=>s+r.val,0);
  document.getElementById('resumoConteudo').innerHTML = `
    <div><h2 class="sub" style="font-size:16px;">RECEITAS (por Origem — caixa/loja)</h2><table><tbody>
      ${receitasOrigem.map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.val)}</td></tr>`).join('')}
      <tr><td><b>TOTAL</b></td><td class="right"><b>${fmt(totalReceitas)}</b></td></tr>
    </tbody></table></div>
    <div><h2 class="sub" style="font-size:16px;">RECEITAS OPERACIONAIS (VENDAS)</h2><table><tbody>
      ${receitasOperacionais.filter(r=>r.val!==0).map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.val)}</td></tr>`).join('') || `<tr><td colspan="2" class="note">Sem receitas classificadas por categoria neste mês.</td></tr>`}
      <tr><td><b>TOTAL RECEITAS OPERACIONAIS</b></td><td class="right"><b>${fmt(totalReceitasOperacionais)}</b></td></tr>
      ${receitasSemCategoria>0?`<tr><td>Sem categoria de venda indicada</td><td class="right">${fmt(receitasSemCategoria)}</td></tr>`:''}
    </tbody></table></div>
    <div><h2 class="sub" style="font-size:16px;">DESPESAS (por Categoria)</h2><table><tbody>
      ${despesasCat.map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.val)}</td></tr>`).join('')}
      <tr><td><b>TOTAL DESPESAS</b></td><td class="right"><b>${fmt(totalDespesas)}</b></td></tr>
    </tbody></table></div>
    <div><h2 class="sub" style="font-size:16px;">CUSTOS (não despesas)</h2><table><tbody>
      ${custosCat.map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.val)}</td></tr>`).join('')}
      <tr><td><b>TOTAL CUSTOS</b></td><td class="right"><b>${fmt(totalCustos)}</b></td></tr>
    </tbody></table></div>`;
}

/* ---------- Controlo de Cash Diário (Caixa Tesouraria) ---------- */
function viewControloCashDiario(){
  const doCashTodos = DB.lancamentos.filter(l=>l.conta==='CASH').slice().sort((a,b)=> a.data.localeCompare(b.data));
  const mesRef = cashDiarioMes || hoje().slice(0,7);

  /* Saldo inicial = tudo o que entrou/saiu na Caixa Tesouraria ANTES do 1º dia do mês selecionado. */
  const saldoInicialMes = doCashTodos
    .filter(l=> mesKey(l.data) < mesRef)
    .reduce((s,l)=> s + (l.tipo==='Receita' ? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doMes = doCashTodos.filter(l=> mesKey(l.data)===mesRef);
  const dias = [...new Set(doMes.map(l=>l.data))].sort();

  let saldoCorrente = saldoInicialMes;
  const linhasDias = dias.map(dia=>{
    const doDia = doMes.filter(l=>l.data===dia);
    const entradas = doDia.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const saidas = doDia.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const saldoAbertura = saldoCorrente;
    saldoCorrente = saldoAbertura + entradas - saidas;
    const declaracoesDia = (DB.fechosCaixa||[]).filter(f=>f.data===dia);
    const totalContadoDia = declaracoesDia.reduce((s,f)=> s + (f.moeda==='KZ' ? Number(f.valorContado||0) : (Number(f.valorContado||0) * (taxaCambio(f.moeda,f.data)||1))), 0);
    const diferenca = declaracoesDia.length ? totalContadoDia - saldoCorrente : null;
    return {dia, saldoAbertura, entradas, saidas, saldoFecho:saldoCorrente, totalContadoDia, temDeclaracao:declaracoesDia.length>0, diferenca, nLanc:doDia.length};
  });

  const totalEntradasMes = linhasDias.reduce((s,l)=>s+l.entradas,0);
  const totalSaidasMes = linhasDias.reduce((s,l)=>s+l.saidas,0);
  const saldoFinalMes = linhasDias.length ? linhasDias[linhasDias.length-1].saldoFecho : saldoInicialMes;

  const opcoesMes = [...new Set(doCashTodos.map(l=>mesKey(l.data)).concat([hoje().slice(0,7)]))].sort().reverse();

  return `
  <h2 class="sub" style="font-size:15px;margin-top:22px;">📅 Controlo de Cash Diário — Caixa Tesouraria</h2>
  <p class="note">Saldo dia-a-dia da Caixa Tesouraria (conta CASH): saldo de abertura, entradas, saídas e saldo de fecho, com o saldo acumulado a transitar de um dia para o outro. Quando existe uma contagem física declarada no "Fecho de Caixa" para esse dia, mostra também a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:10px;">
    <div><label>Mês</label><select id="cashDiarioMesSel">${opcoesMes.map(m=>`<option value="${m}" ${m===mesRef?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">Saldo Inicial do Mês</div><div class="val">${fmt(saldoInicialMes)} Kz</div></div>
    <div class="card"><div class="lbl">Entradas do Mês</div><div class="val pos">${fmt(totalEntradasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saídas do Mês</div><div class="val neg">${fmt(totalSaidasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo Final do Mês</div><div class="val ${saldoFinalMes>=0?'pos':'neg'}">${fmt(saldoFinalMes)} Kz</div></div>
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th class="right">Saldo Abertura</th><th class="right">Entradas</th><th class="right">Saídas</th><th class="right">Saldo Fecho</th><th class="right">Contado (físico)</th><th class="right">Diferença</th></tr></thead>
    <tbody>${linhasDias.length ? linhasDias.map(l=>`
      <tr>
        <td>${l.dia}</td>
        <td class="right">${fmt(l.saldoAbertura)}</td>
        <td class="right">${fmt(l.entradas)}</td>
        <td class="right">${fmt(l.saidas)}</td>
        <td class="right"><b>${fmt(l.saldoFecho)}</b></td>
        <td class="right">${l.temDeclaracao ? fmt(l.totalContadoDia) : '—'}</td>
        <td class="right" style="${l.diferenca!==null && Math.abs(l.diferenca)>=0.5 ? 'color:var(--vermelho);font-weight:bold;' : ''}">${l.diferenca!==null ? fmt(l.diferenca) : '—'}</td>
      </tr>`).join('') : `<tr><td colspan="7" class="note">Sem movimentos na Caixa Tesouraria em ${mesRef}.</td></tr>`}
    </tbody></table>
  </div>`;
}

/* ---------- Controlo de Caixas (por Forma de Pagamento e por Unidade de Negócio) ---------- */
function viewControloCaixas(){

    const d = doForma.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);

/* ---------- Centro Financeiro — Bakery Line (consolidado das 3 lojas) ---------- */
function viewBakeryLine(){
  const LOJAS_BAKERY = UNIDADES_NEGOCIO.filter(u=>u.startsWith("BAKERY LINE"));
  const doBakery = DB.lancamentos.filter(l=> LOJAS_BAKERY.some(loja=>(l.origem||'').startsWith(loja)));
  const totRec = doBakery.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const totDesp = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='DESPESAS').reduce((s,l)=>s+valorEmKZ(l),0);
  const totCustos = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='CUSTOS').reduce((s,l)=>s+valorEmKZ(l),0);
  const totOutros = doBakery.filter(l=>l.tipo==='Despesa' && GRUPO_CATEGORIA[l.categoria]==='OUTRAS').reduce((s,l)=>s+valorEmKZ(l),0);
  const saldo = totRec - totDesp - totCustos - totOutros;

  const porLoja = LOJAS_BAKERY.map(loja=>{
    const doLoja = DB.lancamentos.filter(l=>(l.origem||'').startsWith(loja));
    const r = doLoja.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doLoja.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const cash = doLoja.filter(l=>(l.origem||'').endsWith('CASH')).reduce((s,l)=> s + (l.tipo==='Receita'?valorEmKZ(l):-valorEmKZ(l)), 0);
    const banco = doLoja.filter(l=>(l.origem||'').endsWith('BANCO')).reduce((s,l)=> s + (l.tipo==='Receita'?valorEmKZ(l):-valorEmKZ(l)), 0);
    return {nome:loja, receitas:r, despesas:d, saldo:r-d, cash, banco};
  });

  const doBakeryExplodido = explodirLancamentos(doBakery);
  const porCategoria = [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].map(cat=>({
    nome:cat, val: doBakeryExplodido.filter(l=>l.tipo==='Despesa'&&l.categoria===cat).reduce((s,l)=>s+valorEmKZ(l),0)
  })).filter(r=>r.val!==0);

  const ano=new Date().getFullYear();
  const doAno = doBakery.filter(l=>mesKey(l.data).startsWith(String(ano)));
  const linhasMes = MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = doAno.filter(l=>mesKey(l.data)===key);
    const r = doMes.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doMes.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return `<tr><td>${m}</td><td class="right">${fmt(r)}</td><td class="right">${fmt(d)}</td><td class="right"><b>${fmt(r-d)}</b></td></tr>`;
  }).join('');

  return `
  <h2 style="background:var(--castanho);">🥖 Centro Financeiro — Bakery Line</h2>
  <p class="note">Consolidado automático das 3 lojas (Main Store, CFM Store, New Store), a partir da Unidade de Negócio de cada lançamento.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Receitas (Bakery Line)</div><div class="val pos">${fmt(totRec)} Kz</div></div>
    <div class="card"><div class="lbl">Despesas</div><div class="val neg">${fmt(totDesp)} Kz</div></div>
    <div class="card"><div class="lbl">Custos (não despesas)</div><div class="val neg">${fmt(totCustos)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo</div><div class="val ${saldo>=0?'pos':'neg'}">${fmt(saldo)} Kz</div></div>
  </div>
  <h2 class="sub" style="font-size:15px;">Por Loja</h2>
  <div class="tablewrap"><table><thead><tr><th>Loja</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo</th><th class="right">Saldo Cash</th><th class="right">Saldo Banco</th></tr></thead><tbody>
    ${porLoja.map(l=>`<tr><td>${l.nome}</td><td class="right">${fmt(l.receitas)}</td><td class="right">${fmt(l.despesas)}</td><td class="right"><b>${fmt(l.saldo)}</b></td><td class="right">${fmt(l.cash)}</td><td class="right">${fmt(l.banco)}</td></tr>`).join('')}
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Despesas e Custos por Categoria</h2>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="right">Valor</th></tr></thead><tbody>
    ${porCategoria.length? porCategoria.map(c=>`<tr><td>${c.nome}</td><td class="right">${fmt(c.val)}</td></tr>`).join('') : `<tr><td colspan="2" class="note">Sem despesas/custos lançados ainda para a Bakery Line.</td></tr>`}
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Evolução Mensal (${ano})</h2>

}

function stockMensal(p){
  const ano = new Date().getFullYear();
  let inicial=0, custoMedio=0;
  return MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const entradas = entradasDoProduto(p.id,key);
    let qtdComEntradas = inicial, valorAcum = inicial*custoMedio;
    entradas.forEach(l=>{
      const q=Number(l.quantidade)||0; if(q<=0) return;
      const custoU = valorEmKZ(l)/q;
      valorAcum += q*custoU; qtdComEntradas += q;
    });
    custoMedio = qtdComEntradas>0 ? valorAcum/qtdComEntradas : custoMedio;
    const entradasQtd = entradas.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const finalKey = `${p.id}:${key}`;
    const temContagem = DB.existenciasStockFinal[finalKey]!==undefined && DB.existenciasStockFinal[finalKey]!=='';
    const final = temContagem ? Number(DB.existenciasStockFinal[finalKey]) : qtdComEntradas;
    const consumo = qtdComEntradas-final;
    const valorFinal = final*custoMedio;
    const linha = {mes:m,key,inicial,entradasQtd,final,consumo,custoMedio,valorFinal,finalKey,temContagem};
    inicial = final;
    return linha;
  });
}

function xmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n2(v){ return (Number(v)||0).toFixed(2); }

function gerarXmlSaftFacturacao(ano, mes){
  const cfg = DB.empresaConfig || {};
  const mesNum = String(mes).padStart(2,'0');
  const inicio = `${ano}-${mesNum}-01`;
  const fimData = new Date(ano, Number(mes), 0);
  const fim = `${ano}-${mesNum}-${String(fimData.getDate()).padStart(2,'0')}`;

  const linhasReceita = DB.lancamentos.filter(l=> l.tipo==='Receita' && l.nFatura && mesKey(l.data)===`${ano}-${mesNum}`);
  /* Agrupa por Nº de Fatura: uma fatura paga com 2-3 formas de pagamento gera várias
     linhas de lançamento (uma por conta/forma de pagamento) partilhando o mesmo nFatura —
     para o SAF-T interessa o total da fatura, não cada movimento de tesouraria em separado. */
  const gruposFatura = new Map();
  linhasReceita.forEach(l=>{
    if(!gruposFatura.has(l.nFatura)) gruposFatura.set(l.nFatura, {...l, valor:0});
    gruposFatura.get(l.nFatura).valor += Number(l.valor||0);
  });
  const faturas = Array.from(gruposFatura.values())
    .sort((a,b)=> a.data.localeCompare(b.data) || String(a.nFatura).localeCompare(String(b.nFatura)));

  /* Clientes únicos (por NIF, ou "Consumidor Final" quando não há NIF) */
  const clientesMap = new Map();
  faturas.forEach(l=>{
    const chave = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    if(!clientesMap.has(chave)){
      clientesMap.set(chave, { id: chave, nome: l.entidade || 'Consumidor Final', nif: (l.nif&&l.nif.trim())||'999999999' });
    }
  });

  const customersXml = Array.from(clientesMap.values()).map(c=>`
    <Customer>
      <CustomerID>${xmlEsc(c.id)}</CustomerID>
      <AccountID>Desconhecido</AccountID>
      <CustomerTaxID>${xmlEsc(c.nif)}</CustomerTaxID>
      <CompanyName>${xmlEsc(c.nome)}</CompanyName>
      <BillingAddress>
        <AddressDetail>Desconhecido</AddressDetail>
        <City>Luanda</City>
        <Country>AO</Country>
      </BillingAddress>
      <SelfBillingIndicator>0</SelfBillingIndicator>
    </Customer>`).join('');

  const taxCodeFromTaxa = (taxa)=> taxa>=0.14 ? 'NOR' : (taxa>0 ? 'RED' : 'ISE');
  const taxasUsadas = new Set(faturas.map(l=> l.iva==='Sim' ? Number(l.taxaIVA||0) : 0));
  if(taxasUsadas.size===0) taxasUsadas.add(0.14);
  const taxTableXml = Array.from(taxasUsadas).map(taxa=>`
    <TaxTableEntry>
      <TaxType>IVA</TaxType>
      <TaxCountryRegion>AO</TaxCountryRegion>
      <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
      <Description>${taxa===0?'IVA Isento':'IVA '+(taxa*100).toFixed(0)+'%'}</Description>
      <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
    </TaxTableEntry>`).join('');

  let totalDebit = 0, totalCredit = 0;
  const invoicesXml = faturas.map((l,idx)=>{
    const chaveCliente = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    const taxa = l.iva==='Sim' ? Number(l.taxaIVA||0) : 0;
    const bruto = Number(l.valor||0);
    const subtotal = taxa>0 ? bruto/(1+taxa) : bruto;
    const valorIVA = bruto - subtotal;
    totalCredit += bruto;
    const periodo = Number(mes);
    return `
    <Invoice>
      <InvoiceNo>${xmlEsc(l.nFatura)}</InvoiceNo>
      <DocumentStatus>
        <InvoiceStatus>N</InvoiceStatus>
        <InvoiceStatusDate>${xmlEsc(l.data)}T00:00:00</InvoiceStatusDate>
        <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
        <SourceBilling>M</SourceBilling>
      </DocumentStatus>
      <Period>${periodo}</Period>
      <InvoiceDate>${xmlEsc(l.data)}</InvoiceDate>
      <InvoiceType>FT</InvoiceType>
      <SpecialRegimes>
        <SelfBillingIndicator>0</SelfBillingIndicator>
        <CashVATSchemeIndicator>0</CashVATSchemeIndicator>
        <ThirdPartiesBillingIndicator>0</ThirdPartiesBillingIndicator>
      </SpecialRegimes>
      <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
      <SystemEntryDate>${xmlEsc(l.data)}T00:00:00</SystemEntryDate>
      <CustomerID>${xmlEsc(chaveCliente)}</CustomerID>
      <Line>
        <LineNumber>1</LineNumber>
        <ProductDescription>${xmlEsc(l.descricao||l.categoria||'Venda')}</ProductDescription>
        <Quantity>${xmlEsc(l.quantidade||1)}</Quantity>
        <UnitOfMeasure>UN</UnitOfMeasure>
        <UnitPrice>${n2(subtotal / (Number(l.quantidade)||1))}</UnitPrice>
        <TaxPointDate>${xmlEsc(l.data)}</TaxPointDate>
        <Description>${xmlEsc(l.descricao||l.categoria||'Venda')}</Description>
        <CreditAmount>${n2(subtotal)}</CreditAmount>
        <Tax>
          <TaxType>IVA</TaxType>
          <TaxCountryRegion>AO</TaxCountryRegion>
          <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
          <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
        </Tax>
      </Line>
      <DocumentTotals>
        <TaxPayable>${n2(valorIVA)}</TaxPayable>
        <NetTotal>${n2(subtotal)}</NetTotal>
        <GrossTotal>${n2(bruto)}</GrossTotal>
      </DocumentTotals>
    </Invoice>`;
  }).join('');

  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<AuditFile xmlns="urn:OECD:StandardAuditFile-Tax:AO_1.01_01" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:OECD:StandardAuditFile-Tax:AO_1.01_01 https://raw.githubusercontent.com/assoft-portugal/SAF-T-AO/master/XSD/SAFTAO1.01_01.xsd">
<Header>
<AuditFileVersion>1.01_01</AuditFileVersion>
<CompanyID>${xmlEsc(cfg.nif||'')} ${xmlEsc(cfg.nome||'')}</CompanyID>
<TaxRegistrationNumber>${xmlEsc(cfg.nif||'')}</TaxRegistrationNumber>
<TaxAccountingBasis>F</TaxAccountingBasis>
<CompanyName>${xmlEsc(cfg.nome||"ZOOM'S LODGE HOTELARIA E RESTAURAÇÃO")}</CompanyName>
<CompanyAddress>
<AddressDetail>${xmlEsc(cfg.morada||'Desconhecido')}</AddressDetail>
<City>${xmlEsc(cfg.cidade||'Luanda')}</City>
<Country>AO</Country>
</CompanyAddress>
<FiscalYear>${ano}</FiscalYear>
<StartDate>${inicio}</StartDate>
<EndDate>${fim}</EndDate>
<CurrencyCode>AOA</CurrencyCode>
<DateCreated>${hoje()}</DateCreated>
<TaxEntity>Global</TaxEntity>
<ProductID>ERP Tesouraria Zoom's Lodge</ProductID>
<ProductVersion>1.0</ProductVersion>
</Header>
<MasterFiles>${customersXml}
<TaxTable>${taxTableXml}
</TaxTable>
</MasterFiles>
<SourceDocuments>
<SalesInvoices>
<NumberOfEntries>${faturas.length}</NumberOfEntries>
<TotalDebit>${n2(totalDebit)}</TotalDebit>
<TotalCredit>${n2(totalCredit)}</TotalCredit>${invoicesXml}
</SalesInvoices>
</SourceDocuments>
</AuditFile>`;
  return xml;
}

function baixarFicheiro(nomeFicheiro, conteudo, tipo){
  const blob = new Blob([conteudo], {type: tipo||'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeFicheiro;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
