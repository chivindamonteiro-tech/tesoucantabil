    <p class="note" style="margin-top:12px;">
      <b>${numFaturasUnicas}</b> fatura(s) encontrada(s) para ${MESES[mes-1]}/${ano} — total faturado: <b>${fmt(total)} Kz</b>
      ${linhasReceitaSaft.length!==numFaturasUnicas?` <span style="color:var(--muted);">(${linhasReceitaSaft.length} lançamentos de tesouraria, por haver faturas pagas em mais do que uma forma de pagamento)</span>`:''}
    </p>
  </div>

  <div class="tablewrap">
    <table><thead><tr><th>Nº Fatura</th><th>Data</th><th>Cliente</th><th>NIF</th><th class="right">Valor</th></tr></thead>
    <tbody>${faturas.map(l=>`<tr><td>${l.nFatura}</td><td>${l.data}</td><td>${l.entidade||'Consumidor Final'}</td><td>${l.nif||'—'}</td><td class="right">${fmt(l.valor)}</td></tr>`).join('') || `<tr><td colspan="5" class="note">Sem faturas de venda neste período.</td></tr>`}</tbody></table>
  </div>`;
}

/* ---------- Reconciliação SAF-T vs Fecho de Caixa ---------- */
function viewReconciliacao(){
  const linhas = calcularReconciliacao();
  const divergentes = linhas.filter(l=>l.status==='divergente');
  const pendentes = linhas.filter(l=>l.status==='pendente');

  const badge = (status)=>{
    if(status==='ok') return `<span class="badge pago">✅ OK</span>`;
    if(status==='divergente') return `<span class="badge atraso">⚠️ Divergente</span>`;
    return `<span class="badge pendente">⏳ Sem fecho declarado</span>`;
  };

  const linhasHtml = linhas.map(l=>`
    <tr>
      <td>${l.data}</td>
      <td>${l.unidade}</td>
      <td class="right">${fmt(l.totalLancado)}</td>
      <td class="right">${fmt(l.totalDeclarado)}</td>
      <td class="right"><b>${fmt(l.diferenca)}</b></td>
      <td>${badge(l.status)}</td>
    </tr>`).join('') || `<tr><td colspan="6" class="note">Sem dados de lançamentos com fatura nem fechos de caixa declarados ainda.</td></tr>`;

  return `
  <h2 style="background:var(--vermelho);">🔎 Reconciliação — SAF-T (Lançamentos) vs Fecho de Caixa Declarado</h2>
  <p class="note">Compara, por dia e por Unidade de Negócio, o total das Receitas com Nº de Fatura (o que alimenta o ficheiro SAF-T) com o total que o(a) Caixa declarou ter contado fisicamente no fecho do dia. Tolerância de arredondamento: ${TOLERANCIA_RECONCILIACAO_KZ} Kz.</p>
  <div class="cards" style="margin-bottom:16px;">
    <div class="card"><div class="lbl">Dias/Unidades Analisados</div><div class="val">${linhas.length}</div></div>
    <div class="card"><div class="lbl">⚠️ Divergências</div><div class="val ${divergentes.length?'neg':'pos'}">${divergentes.length}</div></div>
    <div class="card"><div class="lbl">⏳ Sem Fecho Declarado</div><div class="val ${pendentes.length?'neg':'pos'}">${pendentes.length}</div></div>
  </div>
  ${divergentes.length? `<p class="note" style="border-color:var(--vermelho);">⚠️ Há ${divergentes.length} dia(s)/unidade(s) em que o total lançado no sistema (base do SAF-T) não bate com o valor que o caixa declarou ter contado. Reveja antes de submeter o SAF-T à AGT.</p>` : ''}
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th>Unidade</th><th class="right">Total Lançado (c/ Fatura)</th><th class="right">Total Declarado (Fecho de Caixa)</th><th class="right">Diferença</th><th>Status</th></tr></thead>
    <tbody>${linhasHtml}</tbody></table>
  </div>`;
}

/* ---------- DRE simplificada ---------- */
function viewDRE(){
  const grupos = {};
  explodirLancamentos(DB.lancamentos).forEach(l=>{
    grupos[l.categoria]=grupos[l.categoria]||{Receita:0,Despesa:0};
    grupos[l.categoria][l.tipo]+=valorEmKZ(l);
  });
  const receitaTotal = DB.lancamentos.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const despesaTotal = DB.lancamentos.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  const salariosTotal = DB.salarios.reduce((sum,s)=>{const b=Number(s.base||0)+Number(s.subsidios||0);return sum+b*1.08;},0);
  const resultado = receitaTotal - despesaTotal - salariosTotal;

  const linhas = Object.entries(grupos).map(([cat,v])=>`
    <tr><td>${cat}</td><td class="right">${fmt(v.Receita)}</td><td class="right">${fmt(v.Despesa)}</td></tr>`).join('') || `<tr><td colspan="3" class="note">Sem dados.</td></tr>`;

  const ano = new Date().getFullYear();
  const receitaAno = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)) && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) && l.tipo==='Receita')).reduce((s,l)=>s+valorEmKZ(l),0);
  const despesaAno = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)) && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) && l.tipo==='Despesa')).reduce((s,l)=>s+valorEmKZ(l),0);
  const resultadoOperacional = receitaAno - despesaAno;
  const amortAno = amortizacaoDoAno(ano);
  const provFeriasAno = provisaoFeriasDecimoTerceiroDoAno(ano);
  const provCobrancaAno = provisaoCobrancaDuvidosaAtual();
  const cambialAno = diferencaCambialDoAno(ano);
  const antesImposto = resultadoAntesImpostoDoAno(ano);
  const impostoAno = impostoIndustrialDoAno(ano);
  const liquidoAno = resultadoLiquidoDoAno(ano);

  return `
  <h2>📈 Demonstração de Resultados (simplificada)</h2>
  <p class="note">Tabela abaixo é o histórico completo (todos os anos, sem ajustamentos não-monetários). Para o Resultado do Exercício formal do ano corrente — já com Amortizações, Provisões, Diferenças Cambiais e Imposto Industrial — ver a demonstração ao fundo desta página.</p>
  <div class="tablewrap">
    <table><thead><tr><th>Categoria</th><th class="right">Receitas</th><th class="right">Despesas</th></tr></thead>
    <tbody>${linhas}</tbody></table>
  </div>
  <div class="cards" style="margin-top:16px;">
    <div class="card"><div class="lbl">Total Receitas (histórico)</div><div class="val pos">${fmt(receitaTotal)} Kz</div></div>
    <div class="card"><div class="lbl">Total Despesas (histórico)</div><div class="val neg">${fmt(despesaTotal)} Kz</div></div>
    <div class="card"><div class="lbl">Custo com Pessoal (INSS incl., histórico)</div><div class="val neg">${fmt(salariosTotal)} Kz</div></div>
    <div class="card"><div class="lbl">Resultado (histórico, sem ajustamentos)</div><div class="val ${resultado>=0?'pos':'neg'}">${fmt(resultado)} Kz</div></div>
  </div>

  <h2 class="sub" style="margin-top:26px;">Demonstração de Resultados do Exercício ${ano} (formal)</h2>
  <div class="tablewrap">
    <table><tbody>
      <tr><td>Receitas Operacionais</td><td class="right">${fmt(receitaAno)}</td></tr>
      <tr><td>Despesas e Custos Operacionais</td><td class="right">(${fmt(despesaAno)})</td></tr>
      <tr><td><b>Resultado Operacional</b></td><td class="right"><b>${fmt(resultadoOperacional)}</b></td></tr>
      <tr><td>Amortizações do Exercício</td><td class="right">(${fmt(amortAno)})</td></tr>
      <tr><td>Provisão de Férias e 13º Salário</td><td class="right">(${fmt(provFeriasAno)})</td></tr>
      <tr><td>Provisão de Cobrança Duvidosa</td><td class="right">(${fmt(provCobrancaAno)})</td></tr>
      <tr><td>Diferenças Cambiais (ganho/perda líquida do ano)</td><td class="right">${cambialAno>=0?fmt(cambialAno):`(${fmt(-cambialAno)})`}</td></tr>
      <tr><td><b>Resultado Antes de Impostos</b></td><td class="right"><b>${fmt(antesImposto)}</b></td></tr>
      <tr><td>Provisão de Imposto Industrial (${taxaImpostoIndustrial()}%)</td><td class="right">(${fmt(impostoAno)})</td></tr>
      <tr style="background:var(--bg);"><td><b>RESULTADO LÍQUIDO DO EXERCÍCIO</b></td><td class="right"><b>${fmt(liquidoAno)}</b></td></tr>
    </tbody></table>
  </div>
  <p class="note">Taxa de Imposto Industrial configurável em <b>💱 Tabela de Câmbio</b> não se aplica aqui — ajuste em <b>🏛️ Balanço Patrimonial</b>/<b>Capital Social</b> não inclui isto; a taxa e os parâmetros de provisão ajustam-se em "Configurações da Empresa" (campo <code>taxaImpostoIndustrial</code>, padrão 25%, Regime Geral). Só há provisão em anos com lucro — não considera prejuízos fiscais reportáveis de anos anteriores; confirme sempre com o contabilista/OCPCA antes de submissões oficiais.</p>`;
}

/* ---------- Eventos ---------- */
function bindEvents(){
  /* FaturaBot */
  const fbForn = document.getElementById('fbFornecedor');
  const ffb=document.getElementById('formFaturabot');
  const fbItensContainer = document.getElementById('fbItensContainer');

  /* Itens do formulário de NOVA fatura ficam numa lista em memória (fbItensFormulario),
     re-renderizada dentro do container sempre que muda — assim suportamos várias
     categorias de despesa na mesma fatura antes mesmo de ela existir em DB.faturabot. */
  const renderItensFormulario = ()=>{
    if(!fbItensContainer) return;
    fbItensContainer.innerHTML = fbItensFormulario.map((it,idx)=>`
      <div class="grid" style="grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end;margin-bottom:6px;">
        <div><label>Descrição do item</label><input data-fbf-campo="${idx}:descricao" value="${(it.descricao||'').replace(/"/g,'&quot;')}" placeholder="Ex.: cimento, combustível..."></div>
        <div><label>Valor</label><input type="number" step="0.01" data-fbf-campo="${idx}:valor" value="${it.valor||''}"></div>
        <div><label>Categoria</label><select data-fbf-campo="${idx}:categoria">${optsCategorias(it.categoria,'despesa')}</select></div>
        <div>${fbItensFormulario.length>1 ? `<button type="button" data-fbf-remover="${idx}">Remover</button>` : ''}</div>
      </div>`).join('');
    fbItensContainer.querySelectorAll('[data-fbf-campo]').forEach(el=>{
      const [idx,campo] = el.dataset.fbfCampo.split(':');
      el.onchange = ()=>{ fbItensFormulario[idx][campo] = el.value; if(campo==='valor') atualizarTotalFormulario(); };
    });
    fbItensContainer.querySelectorAll('[data-fbf-remover]').forEach(b=>b.onclick=()=>{
      fbItensFormulario.splice(Number(b.dataset.fbfRemover),1); renderItensFormulario(); atualizarTotalFormulario();
    });
    atualizarTotalFormulario();
  };
  const atualizarTotalFormulario = ()=>{
    const total = fbItensFormulario.reduce((s,i)=>s+(Number(i.valor)||0),0);
    const span = document.getElementById('fbTotalItens');
    if(span) span.textContent = fmt(total);
  };
  if(fbItensContainer){
    if(fbItensFormulario.length===0) fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  }
  const fbAddItemBtn = document.getElementById('fbAddItem');
  if(fbAddItemBtn) fbAddItemBtn.onclick = ()=>{
    fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  };

  if(fbForn) fbForn.oninput=()=>{
    const sug = faturabotSugestao(fbForn.value, '');
    const tag = document.getElementById('fbSugestaoTag');
    if(sug && fbItensFormulario[0]){
      fbItensFormulario[0].categoria = sug.categoria;
      if(sug.conta && ffb && ffb.elements.conta) ffb.elements.conta.value = sug.conta;
      renderItensFormulario();
      tag.textContent = `— 1º item sugerido (${sug.origemSugestao})`;
    } else if(tag) tag.textContent = '';
  };
  const fbNifEl = document.getElementById('fbNif');
  if(fbNifEl) fbNifEl.oninput=()=>{
    const tag = document.getElementById('fbNifTag');
    if(!tag) return;
    const v = validarNIF(fbNifEl.value);
    if(!fbNifEl.value.trim()){ tag.textContent=''; return; }
    tag.textContent = (v.valido===true?'✅ ':v.valido===null?'⚠️ ':'❌ ') + v.mensagem + (v.tipo?` (${v.tipo})`:'');
    tag.style.color = v.valido===true?'green':(v.valido===null?'#b8860b':'#b00');
  };

  const fbArquivo=document.getElementById('fbArquivo');
  if(fbArquivo) fbArquivo.onchange=async()=>{
    const arquivo = fbArquivo.files[0];
    if(!arquivo || !ffb) return;
    const tag = document.getElementById('fbOcrTag');
    const leitor = new FileReader();
    leitor.onload = async()=>{
      const dataUrl = leitor.result;
      const base64 = dataUrl.split(',')[1];
      if(tag) tag.textContent = '🔍 A ler o documento com IA...';
      try{
        if(!supa) throw new Error('sem Supabase');
        const { data, error } = await supa.functions.invoke('faturabot-ocr', { body:{ imageBase64: base64, mediaType: arquivo.type || 'image/jpeg' } });
        if(error) throw error;
        if(data && data.ok && data.campos){
          const c = data.campos;
          const set=(campo,val)=>{ if(val!==undefined && val!==null && val!=='' && ffb.elements[campo]) ffb.elements[campo].value = val; };
          set('fornecedor', c.fornecedor); set('nif', c.nif); set('nFatura', c.nFatura);
          set('data', c.data); set('vencimento', c.vencimento);
          set('moeda', c.moeda); set('iva', c.iva); set('taxaIVA', c.taxaIVA);
          /* A IA pode devolver "itens" (várias despesas na mesma fatura) ou só um valor/descrição total.
             A conta/forma de pagamento é sempre uma só, ao nível da fatura. */
          const sugConta = faturabotSugestao(c.fornecedor, '');
          if(sugConta && sugConta.conta && ffb.elements.conta) ffb.elements.conta.value = sugConta.conta;
          if(Array.isArray(c.itens) && c.itens.length){
            fbItensFormulario.length = 0;
            c.itens.forEach(it=>{
              const sug = faturabotSugestao(c.fornecedor, it.descricao) || {};
              fbItensFormulario.push({descricao:it.descricao||'', valor:it.valor||'', categoria:it.categoriaSugerida||sug.categoria||CATEGORIAS[0]});
            });
          } else if(c.valor){
            fbItensFormulario.length = 0;
            fbItensFormulario.push({descricao:c.descricao||'', valor:c.valor, categoria:CATEGORIAS[0]});
          }
          renderItensFormulario();
          if(fbForn) fbForn.oninput();
          if(tag) tag.textContent = '✅ Documento lido pela IA — confira os campos e itens antes de enviar.';
          toast('Documento lido automaticamente. Confira os campos.');
        } else {
          if(tag) tag.textContent = '⚠️ Não consegui ler automaticamente — preencha os campos manualmente.';
        }
      }catch(e){
        console.warn('OCR indisponível', e);
        if(tag) tag.textContent = '⚠️ Leitura automática indisponível (serviço OCR não ligado) — preencha os campos manualmente.';
      }
    };
    leitor.readAsDataURL(arquivo);
  };
  if(ffb) ffb.onsubmit=async e=>{
    e.preventDefault();
    const arquivo = document.getElementById('fbArquivo').files[0];
    const novo = Object.fromEntries(new FormData(ffb).entries());
    novo.taxaIVA = Number(novo.taxaIVA||0);
    novo.origem = origemAutomatica(novo.unidade, novo.formaPagamento);
    /* FaturaBot só regista despesas — saem sempre da Caixa Tesouraria (CASH). */
    novo.conta = 'CASH';
    novo.itens = fbItensFormulario.map(it=>({descricao:it.descricao||'', valor:Number(it.valor)||0, categoria:it.categoria}));
    novo.valor = novo.itens.reduce((s,i)=>s+i.valor,0);
    if(!novo.valor){ toast('Preencha o valor de pelo menos um item da fatura.'); return; }
    novo.id=uid(); novo.criado=new Date().toISOString(); novo.status='Pendente';
    const gravar=async()=>{
      DB.faturabot.push(novo);
      logar('FaturaBot: fatura recebida', `${novo.fornecedor} — ${fmt(novo.valor)} ${novo.moeda} (${novo.itens.length} item(ns))`);
      await saveDB(); toast('Fatura enviada para o FaturaBot — aguardando aprovação.'); ffb.reset();
      fbItensFormulario.length = 0; render();
    };
    if(arquivo){
      const leitor = new FileReader();
      leitor.onload = async()=>{ novo.anexoNome = arquivo.name; novo.anexoBase64 = leitor.result; await gravar(); };
      leitor.readAsDataURL(arquivo);
    } else await gravar();
  };
  document.querySelectorAll('[data-fb-campo]').forEach(el=>el.onchange=async()=>{
    const [id,campo]=el.dataset.fbCampo.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(f){ f[campo]=el.value; await saveDB(); }
  });
  document.querySelectorAll('[data-fb-toggle-itens]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.fbToggleItens;
    if(fbItensAbertos.has(id)) fbItensAbertos.delete(id); else fbItensAbertos.add(id);
    render();
  });
  document.querySelectorAll('[data-fb-item-campo]').forEach(el=>{
    const handler = async()=>{
      const [id,idx,campo] = el.dataset.fbItemCampo.split(':');
      const f = DB.faturabot.find(x=>x.id===id);
      if(!f) return;
      const itens = faturabotGetItens(f);
      itens[idx][campo] = campo==='valor' ? Number(el.value)||0 : el.value;
      f.itens = itens; f.valor = faturabotTotalItens(f);
      await saveDB(); render();
    };
    el.onchange = handler;
  });
  document.querySelectorAll('[data-fb-item-add]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbItemAdd);
    if(!f) return;
    const itens = faturabotGetItens(f);
    itens.push({descricao:'', valor:0, categoria:CATEGORIAS[0]});
    f.itens = itens; f.valor = faturabotTotalItens(f);
    await saveDB(); render();
  });
  document.querySelectorAll('[data-fb-item-remover]').forEach(b=>b.onclick=async()=>{
    const [id,idx] = b.dataset.fbItemRemover.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(!f) return;
    const itens = faturabotGetItens(f);
    if(itens.length<=1){ toast('A fatura precisa de pelo menos um item.'); return; }
    itens.splice(Number(idx),1);
    f.itens = itens; f.valor = faturabotTotalItens(f);
    await saveDB(); render();
  });
  document.querySelectorAll('[data-fb-aprovar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbAprovar);
    if(!f) return;
    const alertas = faturabotValidar(f);
    if(alertas.length && !confirm('Esta fatura tem alertas de validação:\n\n'+alertas.join('\n')+'\n\nAprovar mesmo assim?')) return;
    f.status='Aprovado';
    const itens = faturabotGetItens(f);
    const total = faturabotTotalItens(f);
    /* Um único Lançamento por fatura — é um único movimento de uma só conta.
       Com uma categoria só, o lançamento fica nessa categoria normalmente.
       Com várias categorias, o lançamento fica marcado como "DIVERSOS" e
       carrega o detalhe por categoria em itensDetalhe — os relatórios por
       categoria (Resumo Mensal, Orçamento, DRE) usam esse detalhe (via
       explodirLancamentos) para contar cada parte certa, sem fragmentar
       a Tesouraria em várias saídas de dinheiro para a mesma fatura. */
    const multiCategoria = itens.length>1;
    const lanc = {id:uid(), data:f.data, tipo:'Despesa', origem:f.origem||'', conta:f.conta, formaPagamento:f.formaPagamento||'',
      entidade:f.fornecedor, nif:f.nif||'', nFatura:f.nFatura, valor:total, moeda:f.moeda, iva:f.iva, taxaIVA:f.taxaIVA,
      categoria: multiCategoria ? CATEGORIA_DIVERSOS : itens[0].categoria,
      descricao: multiCategoria ? (f.descricao || `FaturaBot: ${f.fornecedor} (${itens.length} categorias)`) : (itens[0].descricao || f.descricao || `FaturaBot: ${f.fornecedor}`)};
    if(multiCategoria) lanc.itensDetalhe = itens.map(it=>({descricao:it.descricao, valor:it.valor, categoria:it.categoria}));
    DB.lancamentos.push(lanc);
    if(f.vencimento){
      DB.contasPagar.push({id:uid(), entidade:f.fornecedor, descricao:f.descricao||f.nFatura||'', vencimento:f.vencimento, valor:total, status:'Pendente'});
    }
    faturabotAprender(f);
    logar('FaturaBot: fatura aprovada e integrada', `${f.fornecedor} — ${fmt(total)} ${f.moeda}${multiCategoria?` (${itens.length} categorias — 1 lançamento)`:''} → Lançamentos${f.vencimento?' + Contas a Pagar':''}`);
    await saveDB(); toast('Fatura aprovada e integrada em Lançamentos.'); render();
  });
  document.querySelectorAll('[data-fb-rejeitar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbRejeitar);
    if(f){ f.status='Rejeitado'; logar('FaturaBot: fatura rejeitada', `${f.fornecedor} — ${fmt(faturabotTotalItens(f))} ${f.moeda}`); await saveDB(); render(); }
  });
  document.querySelectorAll('[data-fb-apagar]').forEach(b=>b.onclick=async()=>{
    DB.faturabot = DB.faturabot.filter(x=>x.id!==b.dataset.fbApagar); await saveDB(); render();
  });

  document.querySelectorAll('main [data-tab]').forEach(el=>el.onclick=()=>{ currentTab=el.dataset.tab; render(); });

  const formFC = document.getElementById('formFechoCaixaDeclarado');
  if(formFC) formFC.onsubmit = async(e)=>{
    e.preventDefault();
    const fd = new FormData(formFC);
    const novo = {
      id: uid(),
      data: fd.get('data'),
      unidade: fd.get('unidade')||'',
      operador: meuEmail||'',
      valorContado: Number(fd.get('valorContado')||0),
      moeda: fd.get('moeda')||'KZ',
      observacao: fd.get('observacao')||'',

    };

     - DESPESAS: a Conta fica SEMPRE travada em CAIXA TESOURARIA (CASH), seja qual for a
       Forma de Pagamento (Cash, Banco, TPA, etc.) — nenhuma despesa sai diretamente de
       uma conta bancária.
     - RECEITAS: mantém-se a regra anterior — só quando a Forma de Pagamento é "Cash" é
       que a Conta fica travada na Caixa Tesouraria; as restantes formas usam a conta
       bancária normal.
     Aplica-se ao Lançamento normal/Fecho de Caixa e ao FaturaBot (que é sempre despesa). */
  function travarContaCash(formaSelId, contaSelId, tipoSelId){
    const formaSel = document.getElementById(formaSelId);
    const contaSel = document.getElementById(contaSelId);
    const tipoSel = tipoSelId ? document.getElementById(tipoSelId) : null;
    if(!formaSel || !contaSel) return;
    const aplicar = ()=>{
      const ehDespesa = tipoSel ? tipoSel.value==='Despesa' : true; /* sem tipoSelId (ex.: FaturaBot) = sempre despesa */
      const travar = ehDespesa || formaSel.value==='Cash';
      if(travar){
        contaSel.value='CASH';
        contaSel.style.pointerEvents='none'; contaSel.style.opacity='0.65';
        contaSel.title = ehDespesa
          ? "Despesas saem sempre da CAIXA TESOURARIA (caixa geral único) — não é editável."
          : "Cash usa sempre a CAIXA TESOURARIA (caixa único) — não é editável.";
      } else {
        contaSel.style.pointerEvents=''; contaSel.style.opacity=''; contaSel.title='';
      }
    };
    formaSel.addEventListener('change', aplicar);
    contaSel.addEventListener('change', aplicar); // reforça caso a trava seja contornada (ex.: teclado)
    if(tipoSel) tipoSel.addEventListener('change', aplicar);
    aplicar();
  }

    const ativo = isFornecedor ? fornecedorContaCorrenteAtivo : clienteContaCorrenteAtivo;
    const entradas = DB[key].filter(c=>c.entidade===ativo);
    const movimentos = [];
    entradas.forEach(c=>{
      movimentos.push({data:c.data||c.vencimento, tipo:isFornecedor?'Compra a Crédito':'Venda a Crédito', descricao:c.descricao||'—', valor:Number(c.valor||0)});
      (c.pagamentos||[]).forEach(p=>movimentos.push({data:p.data, tipo:isFornecedor?'Pagamento Efetuado':'Pagamento Recebido', descricao:p.observacao||'Pagamento', valor:-Number(p.valor||0)}));
    });
    movimentos.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    let saldoCorrente = 0;
    const linhas = movimentos.map(m=>{ saldoCorrente += m.valor; return [m.data, m.tipo, m.descricao, m.valor>=0?fmt(m.valor)+' (D)':fmt(-m.valor)+' (C)', fmt(saldoCorrente)]; });
    abrirImpressao(printDocHTML({
      code:'CC', title:'Extrato de Conta Corrente',
      subtitle:`${isFornecedor?'Fornecedor':'Cliente'}: ${ativo}`,
      sections:[{heading:'Movimentos', rows: linhas.map(l=>[`${l[0]} — ${l[1]}: ${l[2]}`, `${l[3]} · Saldo: ${l[4]}`])}],
      note:`Saldo em aberto no fecho deste extrato: ${fmt(saldoCorrente)} Kz.`,
      signatures:['Emitido por · Data', `${isFornecedor?'Fornecedor':'Cliente'} (visto) · Data`],
    }));
  };

  document.querySelectorAll('[data-banco-tab]').forEach(el=>el.onclick=()=>{
    bancoTabAtivo = el.dataset.bancoTab; render();
  });
  const bancoAnoSelEl = document.getElementById('bancoAnoSel');
  if(bancoAnoSelEl) bancoAnoSelEl.onchange = e=>{ bancoAnoAtivo = Number(e.target.value); render(); };
  const fluxoCaixaAnoSel = document.getElementById('fluxoCaixaAnoSel');
  if(fluxoCaixaAnoSel) fluxoCaixaAnoSel.onchange = ()=>{ fluxoCaixaAnoAtivo = Number(fluxoCaixaAnoSel.value); render(); };
  document.querySelectorAll('[data-banco-config]').forEach(inp=>inp.onchange=async()=>{
    const [codigo,campo] = inp.dataset.bancoConfig.split(':');
    DB.bancosConfig[codigo] = DB.bancosConfig[codigo] || {};
    DB.bancosConfig[codigo][campo] = inp.value;
    await saveDB(); render();
  });
  document.querySelectorAll('[data-banco-manual]').forEach(inp=>inp.onchange=async()=>{
    const [codigo,ano,mesIdx,campo] = inp.dataset.bancoManual.split(':');
    const key = `${codigo}:${ano}:${mesIdx}`;
    DB.saldosBancarios[key] = DB.saldosBancarios[key] || {};
    DB.saldosBancarios[key][campo] = inp.value;
    await saveDB(); render();
  });

  /* Importação do Extrato Bancário Real: CSV/Excel (parsing local) ou Foto/PDF (OCR via IA) */
  const extratoArquivoCSV = document.getElementById('extratoArquivoCSV');
  if(extratoArquivoCSV) extratoArquivoCSV.onchange = async ()=>{
    const arquivo = extratoArquivoCSV.files[0];
    const contaCodigo = extratoArquivoCSV.dataset.conta;
    if(!arquivo || !contaCodigo) return;
    const tag = document.getElementById('extratoImportTag');
    if(tag) tag.textContent = '📄 A ler o ficheiro...';
    try{
      let linhas = [], numContaDetectado = '';
      if(/\.(xlsx|xls)$/i.test(arquivo.name)){
        const buffer = await arquivo.arrayBuffer();
        if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada');
        ({linhas, numContaDetectado} = parseXLSXExtrato(buffer));
      } else {
        const texto = await arquivo.text();
        ({linhas, numContaDetectado} = parseCSVExtrato(texto));
      }
      if(!linhas.length){
        if(tag) tag.textContent = '⚠️ Não consegui identificar linhas de Data/Descrição/Valor no ficheiro — confirme o formato.';
        return;
      }
      /* Confirma que o número de conta mencionado no próprio ficheiro corresponde à
         conta selecionada — cada conta do Plano de Contas está ligada a um número de
         conta bancário real (ex.: BFA-001 termina em "...001"). Se o ficheiro for de
         outra conta, a conciliação nunca vai bater por muito que o valor seja igual. */
      const contaSelecionada = CONTAS.find(c=>c.codigo===contaCodigo);
      const contaDetectada = detectarContaPorNumero(numContaDetectado);
      if(contaDetectada && contaDetectada.codigo!==contaCodigo){
        const prosseguir = confirm(`⚠️ Este ficheiro parece ser o extrato da conta "${contaDetectada.nome}" (nº ${contaDetectada.numConta}), mas estás a importar para "${contaSelecionada?.nome||contaCodigo}". Importar mesmo assim?`);
        if(!prosseguir){ if(tag) tag.textContent = '⚠️ Importação cancelada — confirme se está na aba da conta certa.'; return; }
      }
      DB.extratoImportado = DB.extratoImportado || {};
      DB.extratoImportado[contaCodigo] = (DB.extratoImportado[contaCodigo]||[]).concat(linhas);
      logar('Extrato importado (CSV/Excel)', `Conta ${contaCodigo} — ${linhas.length} linha(s)`);
      await saveDB();
      if(tag) tag.textContent = `✅ ${linhas.length} linha(s) importada(s) e conciliadas automaticamente.`;
      toast(`${linhas.length} linha(s) do extrato importadas.`);
      render();
    }catch(e){
      console.warn('Erro a importar extrato', e);
      if(tag) tag.textContent = '⚠️ Não consegui ler este ficheiro — confirme se é um CSV ou Excel válido.';
    }
  };

  const extratoArquivoOCR = document.getElementById('extratoArquivoOCR');
  if(extratoArquivoOCR) extratoArquivoOCR.onchange = async ()=>{
    const arquivo = extratoArquivoOCR.files[0];
    const contaCodigo = extratoArquivoOCR.dataset.conta;
    if(!arquivo || !contaCodigo) return;
    const tag = document.getElementById('extratoImportTag');
    const leitor = new FileReader();
    leitor.onload = async ()=>{
      const base64 = leitor.result.split(',')[1];
      if(tag) tag.textContent = '🔍 A ler o extrato com IA...';
      try{
        if(!supa) throw new Error('sem Supabase');
        const { data, error } = await supa.functions.invoke('extrato-ocr', { body:{ imageBase64: base64, mediaType: arquivo.type || 'image/jpeg' } });
        if(error) throw error;
        if(data && data.ok && Array.isArray(data.linhas) && data.linhas.length){
          const linhas = data.linhas
            .map(l=>({id:uid(), data:normalizarDataExtrato(l.data), descricao:String(l.descricao||''), valor:Number(l.valor)}))
            .filter(l=>l.data && !isNaN(l.valor));
          DB.extratoImportado = DB.extratoImportado || {};
          DB.extratoImportado[contaCodigo] = (DB.extratoImportado[contaCodigo]||[]).concat(linhas);
          logar('Extrato importado (OCR/IA)', `Conta ${contaCodigo} — ${linhas.length} linha(s)`);
          await saveDB();
          if(tag) tag.textContent = `✅ ${linhas.length} linha(s) lidas pela IA e conciliadas automaticamente. Confira antes de confiar cegamente — revise a lista abaixo.`;
          toast(`${linhas.length} linha(s) lidas do extrato.`);
          render();
        } else {
          if(tag) tag.textContent = '⚠️ Não consegui ler automaticamente este documento — tente o CSV/Excel em alternativa.';
        }
      }catch(e){
        console.warn('OCR de extrato indisponível', e);
        if(tag) tag.textContent = '⚠️ Leitura automática indisponível (função "extrato-ocr" não está configurada no Supabase) — use a importação por CSV/Excel.';
      }
    };
    leitor.readAsDataURL(arquivo);
  };

  const btnLimparExtratoImportado = document.getElementById('btnLimparExtratoImportado');
  if(btnLimparExtratoImportado) btnLimparExtratoImportado.onclick = async ()=>{
    const contaCodigo = btnLimparExtratoImportado.dataset.conta;
    if(!confirm(`Apagar todas as linhas do extrato importado da conta ${contaCodigo}? Os lançamentos do sistema não são afetados.`)) return;
    DB.extratoImportado = DB.extratoImportado || {};
    DB.extratoImportado[contaCodigo] = [];
    await saveDB(); render();
  };

  /* "+ Lançar" numa linha "só no extrato" da Conciliação Bancária: cria o lançamento
     directamente com a categoria sugerida (mesma lógica de categorização das Despesas),
     forma de pagamento TPA ou Banco conforme a descrição, e a entidade extraída quando
     reconhecível (ex.: pagamentos "TPA-... FORNECEDOR"). Depois de gravado, a linha passa
     a "Confere" automaticamente (mesmo valor/data/conta já existem nos Lançamentos). */
  document.querySelectorAll('[data-lancar-extrato]').forEach(b=>b.onclick=async()=>{
    const [contaCodigo, extratoId] = b.dataset.lancarExtrato.split(':');
    const linha = (DB.extratoImportado?.[contaCodigo]||[]).find(l=>l.id===extratoId);
    if(!linha) return;
    const valorAbs = Math.abs(Number(linha.valor));
    const tipo = Number(linha.valor)>=0 ? 'Receita' : 'Despesa';
    const sugestao = sugerirCategoriaExtrato(linha.descricao);
    const categoria = sugestao?.categoria || (tipo==='Despesa' ? 'Outros Custos Operacionais' : 'Outras Receitas Operacionais');
    const formaPagamento = (linha.descricao||'').toLowerCase().includes('tpa') ? 'TPA (Multicaixa)' : 'Banco';
    const lanc = {id:uid(), data:linha.data, tipo, categoria, conta:contaCodigo, formaPagamento, moeda:'KZ',
      entidade:sugestao?.entidade||'', valor:valorAbs, descricao:linha.descricao||'', origem:'Conciliação Bancária (extrato)'};
    DB.lancamentos.push(lanc);
    logar('Lançamento criado a partir do extrato bancário', `${linha.descricao} — ${fmt(valorAbs)} Kz (${categoria})`);
    await saveDB(); toast('Lançamento criado a partir do extrato.'); render();
  });

  document.querySelectorAll('[data-print-conta]').forEach(b=>b.onclick=()=>{
    const [key,id] = b.dataset.printConta.split(':');
    const c = (DB[key]||[]).find(x=>x.id===id);
    if(c) abrirImpressao(docContaImpressao(c, key==='contasPagar'?'pagar':'receber'));
  });
  document.querySelectorAll('[data-print-sal]').forEach(b=>b.onclick=()=>{
    const s = DB.salarios.find(x=>x.id===b.dataset.printSal);
    if(s) abrirImpressao(docReciboVencimento(s));
  });
  document.querySelectorAll('[data-print-fatura]').forEach(b=>b.onclick=()=>{
    const l = DB.lancamentos.find(x=>x.id===b.dataset.printFatura);
    if(!l) return;
    const grupo = DB.lancamentos.filter(x=> x.tipo==='Receita' && x.nFatura && x.nFatura===l.nFatura);
    abrirImpressao(docFaturaVenda(grupo.length?grupo:[l]));
  });
  ['saftNif','saftNome','saftMorada','saftCidade'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = async ()=>{
      const campo = id.replace('saft','').toLowerCase();
      DB.empresaConfig = DB.empresaConfig || {};
      DB.empresaConfig[campo] = el.value;
      await saveDB(); toast('Dados fiscais gravados.');
    };
  });
  const saftMesEl = document.getElementById('saftMes');
  if(saftMesEl) saftMesEl.onchange = e=>{ saftMesAtivo = Number(e.target.value); render(); };
  const saftAnoEl = document.getElementById('saftAno');
  if(saftAnoEl) saftAnoEl.onchange = e=>{ saftAnoAtivo = Number(e.target.value); render(); };
  const btnExportarSaft = document.getElementById('btnExportarSaft');
  if(btnExportarSaft) btnExportarSaft.onclick = ()=>{
    const cfg = DB.empresaConfig || {};
    if(!cfg.nif || !cfg.nome){ toast('Preencha o NIF e o Nome da empresa antes de exportar.'); return; }

    /* Alerta de reconciliação: verifica se, para o mês/ano do SAF-T a exportar, há
       dias/unidades divergentes ou sem fecho de caixa declarado. Não bloqueia a
       exportação (o utilizador pode ter motivo para prosseguir), mas exige confirmação
       explícita e regista no log que a exportação seguiu com pendências. */
    const chaveMesSaft = `${saftAnoAtivo}-${String(saftMesAtivo).padStart(2,'0')}`;
    const linhasMes = calcularReconciliacao().filter(l=> mesKey(l.data)===chaveMesSaft);
    const divergentesMes = linhasMes.filter(l=>l.status==='divergente');
    const pendentesMes = linhasMes.filter(l=>l.status==='pendente');

    if(divergentesMes.length || pendentesMes.length){
      const partes = [];
      if(divergentesMes.length) partes.push(`${divergentesMes.length} dia(s)/unidade(s) com valor DIVERGENTE entre o lançado e o fecho de caixa declarado`);
      if(pendentesMes.length) partes.push(`${pendentesMes.length} dia(s)/unidade(s) SEM fecho de caixa declarado`);
      const confirmar = window.confirm(
        `⚠️ Atenção: ${MESES[saftMesAtivo-1]}/${saftAnoAtivo} tem ${partes.join(' e ')}.\n\n` +
        `Isto significa que o SAF-T pode não bater com o que os caixas contaram fisicamente. ` +
        `Reveja em "Reconciliação SAF-T vs Caixa" antes de submeter à AGT.\n\n` +
        `Deseja exportar mesmo assim?`
      );
      if(!confirmar){
        currentTab = 'reconciliacao';
        render();
        return;
      }
      logar('Exportação SAF-T com pendências', `Facturação ${chaveMesSaft} — ${partes.join(' e ')} — confirmado pelo utilizador`);
    }

    const xml = gerarXmlSaftFacturacao(saftAnoAtivo, saftMesAtivo);
    const nomeFich = `SAFT_Facturacao_${saftAnoAtivo}-${String(saftMesAtivo).padStart(2,'0')}.xml`;
    baixarFicheiro(nomeFich, xml, 'application/xml');
    logar('Exportação SAF-T', `Facturação ${String(saftMesAtivo).padStart(2,'0')}/${saftAnoAtivo}`);
    saveDB();
  };

  document.querySelectorAll('[data-cambio]').forEach(inp=>inp.onchange=async()=>{
    const [key,moeda]=inp.dataset.cambio.split(':');
    DB.cambio[key]=DB.cambio[key]||{}; DB.cambio[key][moeda]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-existencia]').forEach(inp=>inp.onchange=async()=>{
    DB.existencias[inp.dataset.existencia]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-existencia-qtd]').forEach(inp=>inp.onchange=async()=>{
    DB.existenciasQtd[inp.dataset.existenciaQtd]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-orc]').forEach(inp=>inp.onchange=async()=>{
    DB.orcamento[inp.dataset.orc]=inp.value; await saveDB(); render();
  });
  const fi=document.getElementById('formImob');
  if(fi) fi.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fi).entries());
    novo.id=uid(); DB.imobilizado.push(novo); await saveDB(); toast('Bem adicionado.'); render();
  };
  document.querySelectorAll('[data-delimob]').forEach(b=>b.onclick=async()=>{
    DB.imobilizado=DB.imobilizado.filter(a=>a.id!==b.dataset.delimob); await saveDB(); render();
  });

  document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async()=>{
    const email=sel.dataset.role;
    const novoPapel=sel.value;
    await supa.from('team_roles').upsert({email, role: novoPapel});
    if(email===meuEmail) meuPapel = novoPapel;
    toast('Papel atualizado.'); await carregarMembros(); render();
  });

  const fs=document.getElementById('formSal');
  if(fs) fs.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fs).entries());
    novo.id=uid(); DB.salarios.push(novo); await saveDB(); toast('Trabalhador adicionado.'); render();
  };
  document.querySelectorAll('[data-delsal]').forEach(b=>b.onclick=async()=>{
    DB.salarios=DB.salarios.filter(s=>s.id!==b.dataset.delsal); await saveDB(); render();
  });
}

/* iniciar() já chamado acima */
</script>
</body>
</html>
