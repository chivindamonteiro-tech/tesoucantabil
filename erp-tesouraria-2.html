/* ---------- FATURABOT — motor de leitura e classificação de faturas de despesas ---------- */
/* Sementes de conhecimento: fornecedores/palavras-chave frequentes → sugestão inicial.
   Aprende e melhora sozinho a cada fatura aprovada (ver DB.faturabotAprendizado). */
const FATURABOT_SEED = [
  {chave:"ende", categoria:"GERAIS E FUNCIONAMENTO", origem:"", nota:"Energia elétrica"},
  {chave:"epal", categoria:"GERAIS E FUNCIONAMENTO", origem:"", nota:"Água"},

  {chave:"honorário", categoria:"SERVIÇOS DE TERCEIROS", origem:"", nota:"Honorários"},
  {chave:"escritório", categoria:"ADMINISTRATIVAS", origem:"", nota:"Material de escritório"},
  {chave:"manutenção", categoria:"GERAIS E FUNCIONAMENTO", origem:"", nota:"Serviços de manutenção"},
];
function faturabotSugestao(fornecedor, descricao){
  const alvo = `${fornecedor||''} ${descricao||''}`.toLowerCase().trim();
  if(!alvo) return null;
  const chaveExata = (fornecedor||'').toLowerCase().trim();
  if(DB.faturabotAprendizado[chaveExata]) return {...DB.faturabotAprendizado[chaveExata], origemSugestao:'histórico da empresa'};
  const s = FATURABOT_SEED.find(s=>alvo.includes(s.chave));
  if(s) return {categoria:s.categoria, conta:'', origemSugestao:`padrão conhecido (${s.nota})`};
  return null;
}
function faturabotAprender(fatura){
  const chave = (fatura.fornecedor||'').toLowerCase().trim();
  if(!chave) return;
  DB.faturabotAprendizado[chave] = {categoria:fatura.categoria, conta:fatura.conta, origem:fatura.origem};
}
function faturabotValidar(f){
  const alertas = [];
  if(!f.nif || f.nif.trim().length<5) alertas.push('NIF em falta ou com formato incompleto.');
  const dupFB = DB.faturabot.some(x=>x.id!==f.id && x.fornecedor===f.fornecedor && x.nFatura===f.nFatura && Number(x.valor)===Number(f.valor) && f.nFatura);
  const dupLanc = DB.lancamentos.some(l=>l.entidade===f.fornecedor && l.nFatura===f.nFatura && Number(l.valor)===Number(f.valor) && f.nFatura);
  if(dupFB || dupLanc) alertas.push('Possível documento duplicado (mesmo fornecedor + nº fatura + valor).');
  if(f.vencimento && f.data && f.vencimento < f.data) alertas.push('Data de vencimento anterior à data da fatura.');
  if(f.iva==='Sim' && (!f.taxaIVA || Number(f.taxaIVA)<=0)) alertas.push('Marcado como sujeito a IVA mas sem taxa definida.');
  if(!f.valor || Number(f.valor)<=0) alertas.push('Valor em falta ou inválido.');
  return alertas;
}

function mesKey(data){ return (data||hoje()).slice(0,7); }
function taxaCambio(moeda,data){
  if(moeda==='KZ') return 1;
  const r = DB.cambio[mesKey(data)];
  if(!r) return null;
  return moeda==='EUR' ? Number(r.EUR||0) : Number(r.USD||0);
}
function valorEmKZ(l){
  if(l.moeda==='KZ') return Number(l.valor)||0;
  const t = taxaCambio(l.moeda,l.data);
  return t ? (Number(l.valor)||0)*t : (Number(l.valor)||0);
}

async function loadDB(){
  try{
    const { data, error } = await supa.from('erp_data').select('data').eq('id','main').single();
    if(error) throw error;
    if(data && data.data) DB = Object.assign({}, DB, data.data);
  }catch(e){ console.warn('Erro ao carregar dados', e); toast('Não consegui carregar os dados do servidor.'); }
  render();
}
async function saveDB(){
  try{
    const { error } = await supa.from('erp_data').update({data: DB, updated_at: new Date().toISOString()}).eq('id','main');
    if(error) throw error;
  }
  catch(e){ console.warn(e); toast('Erro ao guardar no servidor. Tente novamente.'); }
}

function mostrarApp(mostrar){

async function carregarPapel(){
  meuPapel = 'colaborador';
  try{
    const { data, error } = await supa.from('team_roles').select('role').eq('email', meuEmail).maybeSingle();
    if(!error && data) meuPapel = data.role;
    else if(!error && !data){
      await supa.from('team_roles').insert({email: meuEmail, role: 'colaborador'});
    }
  }catch(e){ console.warn('Sem tabela team_roles ainda — a tratar todos como colaborador.', e); }
}
async function iniciar(){
  if(!supa){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('loginErro').textContent = 'Ainda não configurou a ligação ao Supabase (SUPABASE_URL / SUPABASE_ANON_KEY no topo do ficheiro).';
    document.getElementById('formLogin').style.display='none';
    return;
  }
  const { data: { session } } = await supa.auth.getSession();
  if(session){ meuEmail = session.user.email; await carregarPapel(); mostrarApp(true); await loadDB(); }
  else mostrarApp(false);

  supa.auth.onAuthStateChange(async (event, session)=>{
    /* O Supabase revalida a sessão sempre que a aba volta a ficar visível
       (ex.: ao voltar da câmara/galeria/seletor de ficheiros). Isso dispara
       este evento como "TOKEN_REFRESHED" ou "INITIAL_SESSION" — se
       recarregássemos a app nesses casos, o campo de ficheiro do FaturaBot
       (e qualquer formulário aberto) perdia o que estava selecionado.
       Só recarregamos a app em login/logout reais. */
    if(event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION'){
      if(session) meuEmail = session.user.email;
      return;
    }
    if(session){ meuEmail = session.user.email; await carregarPapel(); mostrarApp(true); await loadDB(); }
    else mostrarApp(false);
  });

  document.getElementById('trocaModo').onclick=()=>{
    modoLogin = modoLogin==='entrar' ? 'criar' : 'entrar';
    document.getElementById('btnLoginSubmit').textContent = modoLogin==='entrar' ? 'Entrar' : 'Criar Conta';
    document.getElementById('trocaModo').textContent = modoLogin==='entrar' ? 'Ainda não tem conta? Criar conta' : 'Já tem conta? Entrar';
    document.getElementById('loginErro').textContent='';
  };
  document.getElementById('formLogin').onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim();
    const senha=document.getElementById('loginSenha').value;
    const erroEl=document.getElementById('loginErro');
    erroEl.textContent='';
    const fn = modoLogin==='entrar' ? supa.auth.signInWithPassword({email,password:senha}) : supa.auth.signUp({email,password:senha});
    const { error } = await fn;
    if(error) erroEl.textContent = error.message;
    else if(modoLogin==='criar') erroEl.style.color='var(--verde)', erroEl.textContent='Conta criada! Verifique o e-mail se for pedida confirmação, depois entre.';
  };
}
iniciar();

/* ---------- Cálculo IRT ---------- */
function calcIRT(baseTributavel){
  const b = Number(baseTributavel)||0;
  const esc = IRT_ESCALOES.find(e=> b>e.inf && b<=e.sup) || IRT_ESCALOES[0];
  if(b<=150000) return 0;
  return esc.fixa + (b - esc.inf) * esc.taxa;
}

  const nomePapel = meuPapel==='administrador'?'Administrador':(meuPapel==='caixa'?'Caixa (Ponto de Venda)':'Colaborador');
  if(meuPapel==='caixa'){
    nav.innerHTML = `<h1>TESOUCANTABIL<br><span style="font-weight:normal;font-size:11px;opacity:.85">Powered By Zoom's Lodge</span></h1>
      <div style="padding:8px 16px;font-size:10.5px;opacity:.7;border-bottom:1px solid rgba(255,255,255,.15);">🔗 ${meuEmail||''} · ${nomePapel}</div>
      <div class="item active" data-tab="lancamento">📝 Fecho de Caixa</div>
      <div class="item" id="btnSair" style="margin-top:14px;border-top:1px solid rgba(255,255,255,.15);opacity:.75;">🚪 Sair</div>`;
    document.getElementById('btnSair').onclick=async()=>{ await supa.auth.signOut(); };
    currentTab='lancamento';
    return;
  }
  const visiveis = TABS.filter(([id])=>{
    if(id==='membros') return meuPapel==='administrador';
    if(MODULOS_RESTRITOS.includes(id)) return meuPapel==='administrador';
    return true;
  });
  nav.innerHTML = `<h1>TESOUCANTABIL<br><span style="font-weight:normal;font-size:11px;opacity:.85">Powered By Zoom's Lodge</span><br><span style="font-weight:normal;font-size:10px;opacity:.65">Made By MONTEIRO D.E S CHIVINDA</span></h1>
    <div style="padding:8px 16px;font-size:10.5px;opacity:.7;border-bottom:1px solid rgba(255,255,255,.15);">🔗 ${meuEmail||''} · ${nomePapel}</div>` +
   visiveis.map(([id,label])=>`<div class="item ${id===currentTab?'active':''}" data-tab="${id}">${label}</div>`).join('') +
   `<div class="item" id="btnSair" style="margin-top:14px;border-top:1px solid rgba(255,255,255,.15);opacity:.75;">🚪 Sair</div>`;
  nav.querySelectorAll('.item[data-tab]').forEach(el=>el.onclick=()=>{currentTab=el.dataset.tab; render();});
  document.getElementById('btnSair').onclick=async()=>{ await supa.auth.signOut(); };
  if(!visiveis.find(([id])=>id===currentTab)) currentTab='dashboard';
}

/* ---------- Render principal ---------- */
function render(){
  renderNav();
  const main=document.getElementById('main');
  if(meuPapel==='caixa'){ main.innerHTML = viewLancamento(true); bindEvents(); return; }
  if(MODULOS_RESTRITOS.includes(currentTab) && meuPapel!=='administrador'){ currentTab='dashboard'; }
  if(currentTab==='membros' && meuPapel!=='administrador'){ currentTab='dashboard'; }
  if(currentTab==="dashboard") main.innerHTML = viewDashboard();
  else if(currentTab==="faturabot") main.innerHTML = viewFaturabot();
  else if(currentTab==="resumo") main.innerHTML = viewResumo();
  else if(currentTab==="lancamento") main.innerHTML = viewLancamento();
  else if(currentTab==="observacoes") main.innerHTML = viewObservacoes();
  else if(currentTab==="pesquisa") main.innerHTML = viewPesquisa();
  else if(currentTab==="duplicados") main.innerHTML = viewDuplicados();
  else if(currentTab==="log") main.innerHTML = viewLog();
  else if(currentTab==="fecho") main.innerHTML = viewFecho();
  else if(currentTab==="cashControlo") main.innerHTML = viewCashControlo();
  else if(currentTab==="despesasFatura") main.innerHTML = viewDespesasFatura();
  else if(currentTab==="pagar") main.innerHTML = viewContas('contasPagar','Contas a Pagar','Fornecedor');
  else if(currentTab==="receber") main.innerHTML = viewContas('contasReceber','Contas a Receber','Cliente');
  else if(currentTab==="bancos") main.innerHTML = viewBancos();
  else if(currentTab==="planoTesouraria") main.innerHTML = viewPlanoTesouraria();
  else if(currentTab==="cambio") main.innerHTML = viewCambio();
  else if(currentTab==="planoContas") main.innerHTML = viewPlanoContas();
  else if(currentTab==="iva") main.innerHTML = viewIVA();
  else if(currentTab==="amortizacoes") main.innerHTML = viewAmortizacoes();
  else if(currentTab==="dre") main.innerHTML = viewDRE();
  else if(currentTab==="balanco") main.innerHTML = viewBalanco();
  else if(currentTab==="existencias") main.innerHTML = viewExistencias();
  else if(currentTab==="stocks") main.innerHTML = viewStocks();
  else if(currentTab==="orcamento") main.innerHTML = viewOrcamento();
  else if(currentTab==="salarios") main.innerHTML = viewSalarios();
  else if(currentTab==="membros") main.innerHTML = viewMembros();
  bindEvents();
}

/* ---------- Dashboard ---------- */
function viewDashboard(){
  const receitas = DB.lancamentos.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const despesas = DB.lancamentos.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  const saldo = receitas-despesas;
  const pendPagar = DB.contasPagar.filter(c=>c.status!=='Pago').reduce((s,c)=>s+Number(c.valor||0),0);
  const pendReceber = DB.contasReceber.filter(c=>c.status!=='Pago').reduce((s,c)=>s+Number(c.valor||0),0);

  const porCategoria = {};
  DB.lancamentos.filter(l=>l.tipo==='Despesa').forEach(l=>{
    porCategoria[l.categoria]=(porCategoria[l.categoria]||0)+valorEmKZ(l);
  });
  const maxCat = Math.max(1,...Object.values(porCategoria));
  const barras = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([cat,val])=>`
    <div style="margin:6px 0;">
      <div style="display:flex;justify-content:space-between;font-size:12px;"><span>${cat}</span><span>${fmt(val)} Kz</span></div>
      <div style="background:#eee;border-radius:4px;height:8px;"><div style="background:var(--verde);width:${(val/maxCat*100).toFixed(1)}%;height:8px;border-radius:4px;"></div></div>
    </div>`).join('') || '<p class="note">Sem despesas lançadas ainda.</p>';

  return `
  <h2>📊 Dashboard</h2>
  <div class="cards">
    <div class="card"><div class="lbl">Receitas (total)</div><div class="val pos">${fmt(receitas)} Kz</div></div>
    <div class="card"><div class="lbl">Despesas (total)</div><div class="val neg">${fmt(despesas)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo</div><div class="val ${saldo>=0?'pos':'neg'}">${fmt(saldo)} Kz</div></div>
    <div class="card"><div class="lbl">A Pagar (pendente)</div><div class="val neg">${fmt(pendPagar)} Kz</div></div>
    <div class="card"><div class="lbl">A Receber (pendente)</div><div class="val pos">${fmt(pendReceber)} Kz</div></div>
  </div>
  <div class="split">
    <div>
      <h2 class="sub" style="font-size:16px;">Despesas por Categoria</h2>
      ${barras}
    </div>
    <div>
      <h2 class="sub" style="font-size:16px;">Saldo por Conta</h2>
      ${CONTAS.map(c=>{
        const mov = DB.lancamentos.filter(l=>l.conta===c.codigo).reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0);
        return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--borda);font-size:13px;"><span>${c.nome}</span><b class="${mov>=0?'val pos':'val neg'}" style="font-size:13px;">${fmt(mov)}</b></div>`;
      }).join('')}
    </div>
  </div>
  <p class="note">Este resumo é calculado a partir dos Lançamentos, Contas a Pagar/Receber registados nesta ferramenta.</p>
  `;
}

/* ---------- FaturaBot ---------- */

  const linhaFatura = (f, comAcoes)=>{
    const alertas = faturabotValidar(f);
    const anexo = f.anexoBase64 ? `<a href="${f.anexoBase64}" target="_blank" title="Ver documento anexado">📎 ${f.anexoNome||'ver'}</a>` : '—';
    const badge = f.status==='Aprovado' ? 'pago' : f.status==='Rejeitado' ? 'atraso' : 'pendente';

      <td><input type="number" step="0.01" data-fb-campo="${f.id}:valor" value="${f.valor||''}" style="width:110px;"></td>

      <td><select data-fb-campo="${f.id}:categoria">${CATEGORIAS.map(c=>`<option ${f.categoria===c?'selected':''}>${c}</option>`).join('')}</select></td>
      <td><select data-fb-campo="${f.id}:conta">${CONTAS.map(c=>`<option value="${c.codigo}" ${f.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></td>

      <td><span class="badge ${badge}">${f.status}</span></td>
      ${comAcoes ? `<td style="white-space:nowrap;">
        <button data-fb-aprovar="${f.id}">✅ Aprovar</button>

        <button class="danger" data-fb-apagar="${f.id}">Apagar</button>
      </td>` : `<td><button class="danger" data-fb-apagar="${f.id}">Apagar</button></td>`}
    </tr>`;

  const rowsPendentes = pendentes.map(f=>linhaFatura(f,true)).join('') || `<tr><td colspan="12" class="note">Sem faturas por rever. Envie uma fatura acima para começar.</td></tr>`;

  <p class="note">Regra "Zero Digitação": envie a fatura (arrastar, escolher ficheiro ou foto) → a IA tenta ler o documento automaticamente e pré-preenche os campos → confirme/corrija → aprove. Ao aprovar, o sistema cria automaticamente o Lançamento e, se marcar, a Conta a Pagar — sem repetir digitação.
  <br><b>Nota:</b> a leitura automática (OCR) depende do serviço "faturabot-ocr" estar ligado no Supabase (ver instruções). Se não estiver ligado, ou se a leitura falhar, os campos ficam em branco para preencher à mão — o resto do fluxo (sugestão de categoria, validação, aprovação) funciona sempre.</p>

  <form class="inline" id="formFaturabot">
    <div class="grid">
      <div style="grid-column:1/-1;">
        <label>Documento da fatura (PDF, foto ou imagem — arraste para aqui ou escolha o ficheiro)</label>

      <div><label>Data de Vencimento</label><input type="date" name="vencimento"></div>
      <div><label>Valor</label><input type="number" step="0.01" name="valor" required></div>
      <div><label>Moeda</label><select name="moeda"><option>KZ</option><option>EUR</option><option>USD</option></select></div>
      <div><label>Sujeito a IVA?</label><select name="iva"><option>Não</option><option>Sim</option></select></div>
      <div><label>Taxa IVA</label><select name="taxaIVA"><option value="0.14">14%</option><option value="0.07">7%</option><option value="0.05">5%</option><option value="0">0%</option></select></div>
      <div><label>Categoria <span id="fbSugestaoTag" style="font-weight:normal;"></span></label><select name="categoria" id="fbCategoria">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>

      <div><label>Centro Financeiro / Origem</label><select name="origem"><option value="">—</option>${ORIGENS.map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div style="grid-column:1/-1;"><label>Descrição</label><input name="descricao" placeholder="Ex.: fatura mensal de eletricidade, referência..."></div>
    </div>
    <div class="actions"><button type="submit">📥 Enviar para o FaturaBot (Aguardando aprovação)</button></div>
    <p class="note">Ao digitar o Fornecedor, a categoria e conta são sugeridas automaticamente com base em faturas já aprovadas antes (ou em padrões conhecidos como ENDE, EPAL, Unitel, Sonangol). Corrija se necessário — o sistema aprende com a sua correção.</p>
  </form>

  <h2 class="sub">📋 Aguardando Aprovação (${pendentes.length})</h2>
  <div class="tablewrap">
    <table><thead><tr><th>Recebido</th><th>Anexo</th><th>Fornecedor</th><th>NIF</th><th>Nº Fatura</th><th>Data</th><th class="right">Valor</th><th>Moeda</th><th>Categoria</th><th>Conta</th><th>Validação</th><th>Estado</th><th></th></tr></thead>
    <tbody>${rowsPendentes}</tbody></table>
  </div>

  <h2 class="sub" style="margin-top:18px;">🗂️ Histórico Processado (últimas 50)</h2>
  <div class="tablewrap">
    <table><thead><tr><th>Recebido</th><th>Anexo</th><th>Fornecedor</th><th>NIF</th><th>Nº Fatura</th><th>Data</th><th class="right">Valor</th><th>Moeda</th><th>Categoria</th><th>Conta</th><th>Validação</th><th>Estado</th><th></th></tr></thead>
    <tbody>${rowsProcessadas}</tbody></table>
  </div>`;
}

/* ---------- Lançamentos ---------- */
let ultimoLancCaixa = null;
let filtrosLanc = {dataDe:'', dataAte:'', mes:'', tipo:'', categoria:'', origem:'', conta:''};
function viewLancamento(modoCaixa){
  const filtrados = DB.lancamentos.filter(l=>{
    if(filtrosLanc.dataDe && l.data < filtrosLanc.dataDe) return false;
    if(filtrosLanc.dataAte && l.data > filtrosLanc.dataAte) return false;
    if(filtrosLanc.mes && mesKey(l.data) !== filtrosLanc.mes) return false;
    if(filtrosLanc.tipo && l.tipo !== filtrosLanc.tipo) return false;
    if(filtrosLanc.categoria && l.categoria !== filtrosLanc.categoria) return false;
    if(filtrosLanc.origem && l.origem !== filtrosLanc.origem) return false;
    if(filtrosLanc.conta && l.conta !== filtrosLanc.conta) return false;
    return true;
  });
  const totFiltro = filtrados.reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const rows = filtrados.slice().reverse().map(l=>`
    <tr>
      <td>${l.data}</td>
      <td><span class="badge ${l.tipo==='Receita'?'pago':'atraso'}">${l.tipo}</span></td>
      <td>${l.origem||'—'}</td>
      <td>${l.categoria}</td>
      <td>${l.conta}</td>
      <td>${l.entidade||''}</td>
      <td>${l.nFatura||''}</td>
      <td class="right">${fmt(l.valor)}</td>
      <td>${l.moeda}</td>
      <td class="right">${l.quantidade? fmt(l.quantidade) : '—'}</td>
      <td>${l.produtoId ? (DB.produtos.find(p=>p.id===l.produtoId)||{}).nome || '' : ''}</td>
      <td>${l.iva==='Sim'? (l.taxaIVA*100).toFixed(0)+'%':'—'}</td>
      <td>${l.descricao||''}</td>
      <td><button class="danger" data-del-lanc="${l.id}">Apagar</button></td>
    </tr>`).join('') || `<tr><td colspan="14" class="note">Nenhum lançamento corresponde aos filtros.</td></tr>`;

  const confirmacaoCaixa = (modoCaixa && ultimoLancCaixa) ? `
    <div class="card" style="border:2px solid var(--verde);background:var(--verde-claro);margin-bottom:16px;">
      <div class="lbl">✅ Último lançamento gravado com sucesso</div>
      <div style="margin-top:6px;font-size:14px;">
        <b>${ultimoLancCaixa.tipo}</b> — ${ultimoLancCaixa.categoria} — <b>${fmt(ultimoLancCaixa.valor)} ${ultimoLancCaixa.moeda}</b>
        ${ultimoLancCaixa.origem?` — ${ultimoLancCaixa.origem}`:''} — ${ultimoLancCaixa.data}
      </div>
    </div>` : '';

  return `
  <h2 style="background:var(--verde);">📝 ${modoCaixa?'Fecho de Caixa':'Lançamentos'}</h2>
  ${confirmacaoCaixa}
  <form class="inline" id="formLanc">
    <div class="grid">
      <div><label>Data</label><input type="date" name="data" value="${hoje()}" required></div>
      <div><label>Tipo</label><select name="tipo"><option>Receita</option><option>Despesa</option></select></div>
      <div><label>Origem (caixa/unidade — ex.: qual loja/hotel)</label><select name="origem"><option value="">—</option>${ORIGENS.map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div><label>Categoria</label><select name="categoria">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label>Conta / Forma de Pagamento</label><select name="conta">${CONTAS.map(c=>`<option value="${c.codigo}">${c.nome}</option>`).join('')}</select></div>
      <div><label>Fornecedor/Cliente</label><input name="entidade" placeholder="Nome"></div>
      <div><label>Nº Fatura</label><input name="nFatura"></div>
      <div><label>Valor</label><input type="number" step="0.01" name="valor" required></div>
      <div><label>Moeda</label><select name="moeda"><option>KZ</option><option>EUR</option><option>USD</option></select></div>
      <div><label>Quantidade</label><input type="number" step="0.01" name="quantidade" placeholder="Un., Kg, L..."></div>
      <div><label>Produto (SKU)</label><select name="produtoId"><option value="">—</option>${DB.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div>
      <div><label>Sujeito a IVA?</label><select name="iva"><option>Não</option><option>Sim</option></select></div>
      <div><label>Taxa IVA</label><select name="taxaIVA"><option value="0.14">14%</option><option value="0.07">7%</option><option value="0.05">5%</option><option value="0">0%</option></select></div>
      <div style="grid-column:1/-1;"><label>Descrição</label><input name="descricao"></div>
    </div>
    <div class="actions"><button type="submit" id="btnSubmitLanc">${modoCaixa?'+ Lançar Fecho de Caixa':'+ Adicionar Lançamento'}</button></div>
    <p class="note">Duplicado = mesmo Fornecedor + Nº Fatura + Valor já lançados. O sistema avisa antes de gravar. A <b>Origem</b> identifica de qual caixa/loja veio o valor (Zoom's Lodge ou Bakery Line) — é isso que o Resumo e o Plano de Contas usam para agrupar as receitas, tal como na planilha.</p>
  </form>
  ${modoCaixa ? `<p class="note">Este acesso só permite lançar o fecho de caixa — não é possível ver os lançamentos de outros postos de venda. O quadro verde acima confirma que o último lançamento foi gravado.</p>` : `
  <form class="inline" id="formFiltroLanc">
    <div class="grid">
      <div><label>Data De</label><input type="date" name="dataDe" value="${filtrosLanc.dataDe}"></div>
      <div><label>Data Até</label><input type="date" name="dataAte" value="${filtrosLanc.dataAte}"></div>
      <div><label>Mês</label><input type="month" name="mes" value="${filtrosLanc.mes}"></div>
      <div><label>Tipo</label><select name="tipo"><option value="">Todos</option><option ${filtrosLanc.tipo==='Receita'?'selected':''}>Receita</option><option ${filtrosLanc.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div><label>Categoria</label><select name="categoria"><option value="">Todas</option>${CATEGORIAS.map(c=>`<option ${filtrosLanc.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div><label>Origem</label><select name="origem"><option value="">Todas</option>${ORIGENS.map(o=>`<option ${filtrosLanc.origem===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div><label>Conta</label><select name="conta"><option value="">Todas</option>${CONTAS.map(c=>`<option value="${c.codigo}" ${filtrosLanc.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltro">Limpar filtros</button></div>
  </form>
  <p class="note">${filtrados.length} de ${DB.lancamentos.length} lançamentos · Saldo do filtro: <b>${fmt(totFiltro)} Kz</b></p>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Origem</th><th>Categoria</th><th>Conta</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor</th><th>Moeda</th><th class="right">Quantidade</th><th>Produto</th><th>IVA</th><th>Descrição</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`}`;
}

/* ---------- Observações ---------- */
function viewObservacoes(){
  const rows = DB.observacoes.slice().reverse().map(o=>`
    <tr><td>${o.data}</td><td>${o.texto}</td><td><button class="danger" data-delobs="${o.id}">Apagar</button></td></tr>`).join('')

/* ---------- Pesquisa ---------- */
function viewPesquisa(){
  return `
  <h2>🔍 Pesquisa Geral</h2>
  <form class="inline" id="formPesquisa" onsubmit="return false;">
    <div class="grid">
      <div><label>Palavra-chave (entidade, descrição, nº fatura)</label><input id="pqTexto" placeholder="Digite e prima Pesquisar"></div>
      <div><label>De</label><input type="date" id="pqDe"></div>
      <div><label>Até</label><input type="date" id="pqAte"></div>
    </div>
    <div class="actions"><button id="btnPesquisar" type="button">Pesquisar</button></div>
  </form>
  <div id="resPesquisa" class="tablewrap"><table><tbody><tr><td class="note">Introduza um termo e clique em Pesquisar.</td></tr></tbody></table></div>`;
}
function executarPesquisa(){
  const termo=(document.getElementById('pqTexto').value||'').toLowerCase();
  const de=document.getElementById('pqDe').value, ate=document.getElementById('pqAte').value;
  const res = DB.lancamentos.filter(l=>{
    if(de && l.data<de) return false;
    if(ate && l.data>ate) return false;
    if(termo){
      const alvo = `${l.entidade||''} ${l.descricao||''} ${l.nFatura||''} ${l.categoria}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  });
  const html = res.length ? `<table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor</th><th>Descrição</th></tr></thead><tbody>
    ${res.map(l=>`<tr><td>${l.data}</td><td>${l.tipo}</td><td>${l.categoria}</td><td>${l.entidade||''}</td><td>${l.nFatura||''}</td><td class="right">${fmt(l.valor)}</td><td>${l.descricao||''}</td></tr>`).join('')}
    </tbody></table>` : `<table><tbody><tr><td class="note">Nenhum resultado encontrado.</td></tr></tbody></table>`;
  document.getElementById('resPesquisa').innerHTML = html;
}

/* ---------- Controlo de Duplicados ---------- */
function viewDuplicados(){
  const grupos = {};
  DB.lancamentos.forEach(l=>{
    if(!l.nFatura) return;
    const chave = `${(l.entidade||'').toLowerCase()}|${l.nFatura}|${Number(l.valor)}`;
    grupos[chave]=grupos[chave]||[]; grupos[chave].push(l);
  });
  const dups = Object.values(grupos).filter(g=>g.length>1);
  const rows = dups.flatMap(g=>g.map(l=>`
    <tr><td>${l.data}</td><td>${l.entidade}</td><td>${l.nFatura}</td><td class="right">${fmt(l.valor)}</td><td>${l.categoria}</td></tr>`)).join('')
    || `<tr><td colspan="5" class="note">Nenhum possível duplicado encontrado (mesma entidade + nº fatura + valor).</td></tr>`;
  return `
  <h2>🧬 Controlo de Duplicados</h2>
  <p class="note">Lançamentos com a mesma combinação Entidade + Nº Fatura + Valor. Reveja e apague o que estiver repetido em "Lançamentos".</p>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor</th><th>Categoria</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function viewPlanoContas(){
  const origemReceitas = ORIGENS.map(o=>({nome:o,val:DB.lancamentos.filter(l=>l.tipo==='Receita'&&l.origem===o).reduce((s,l)=>s+valorEmKZ(l),0)}));
  const totalOrigem = origemReceitas.reduce((s,r)=>s+r.val,0);
  const semOrigem = DB.lancamentos.filter(l=>l.tipo==='Receita'&&!l.origem).reduce((s,l)=>s+valorEmKZ(l),0);
  const saldos = {};
  DB.lancamentos.forEach(l=>{
    const c = contaDe(l.categoria);
    saldos[c.cod] = saldos[c.cod] || {nome:c.nome,tipo:c.tipo,debito:0,credito:0};
    const v = valorEmKZ(l);
    if(l.tipo==='Despesa') saldos[c.cod].debito += v; else saldos[c.cod].credito += v;
  });
  const linhasBanco = (()=>{ let d=0,c=0; DB.lancamentos.forEach(l=>{const v=valorEmKZ(l); if(l.tipo==='Receita')d+=v; else c+=v;}); return {d,c}; })();
  const rows = Object.entries(saldos).map(([cod,v])=>{
    const saldo = v.debito-v.credito;
    return `<tr><td>${cod}</td><td>${v.nome}</td><td>${v.tipo}</td><td class="right">${fmt(v.debito)}</td><td class="right">${fmt(v.credito)}</td><td class="right">${fmt(Math.abs(saldo))} ${saldo>=0?'D':'C'}</td></tr>`;
  }).join('') || `<tr><td colspan="6" class="note">Sem lançamentos ainda.</td></tr>`;
  return `
  <h2>📚 Plano de Contas / Balancete</h2>
  <p class="note">Antes de classificar em conta, primeiro identificamos a <b>origem</b> de cada receita (qual caixa/loja — Zoom's Lodge ou Bakery Line), tal como na planilha, e só depois agrupamos por classe de conta abaixo.</p>

  <div class="tablewrap"><table><thead><tr><th>Origem (caixa/loja)</th><th class="right">Valor</th></tr></thead><tbody>
    ${origemReceitas.map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.val)}</td></tr>`).join('')}
    ${semOrigem>0?`<tr><td>Sem origem indicada</td><td class="right">${fmt(semOrigem)}</td></tr>`:''}
    <tr><td><b>TOTAL RECEITAS</b></td><td class="right"><b>${fmt(totalOrigem+semOrigem)}</b></td></tr>
  </tbody></table></div>
  <h2 class="sub" style="font-size:15px;margin-top:16px;">2. Classificação por Conta (SNC-AO)</h2>
  <p class="note">Mapeamento simplificado das categorias de Lançamento para classes do SNC-AO — confirme os códigos finais com o seu contabilista antes de submissões oficiais.</p>
  <div class="tablewrap"><table><thead><tr><th>Código</th><th>Conta</th><th>Natureza</th><th class="right">Total Débito</th><th class="right">Total Crédito</th><th class="right">Saldo</th></tr></thead>
  <tbody>
    <tr><td>11/12</td><td>Caixa e Depósitos à Ordem (Bancos)</td><td>Ativo</td><td class="right">${fmt(linhasBanco.d)}</td><td class="right">${fmt(linhasBanco.c)}</td><td class="right">${fmt(Math.abs(linhasBanco.d-linhasBanco.c))} ${linhasBanco.d>=linhasBanco.c?'D':'C'}</td></tr>
    ${rows}
  </tbody></table></div>`;
}

/* ---------- IVA e Retenções ---------- */
function viewIVA(){
  const ano = new Date().getFullYear();
  let acumulado=0;
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key);
    const liquidado = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const dedutivel = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const apurado = liquidado-dedutivel;
    acumulado += apurado;
    const retServicos = doMes.filter(l=>l.tipo==='Despesa'&&l.categoria==='SERVIÇOS DE TERCEIROS').reduce((s,l)=>s+valorEmKZ(l),0)*0.065;
    return `<tr><td>${m}</td><td class="right">${fmt(liquidado)}</td><td class="right">${fmt(dedutivel)}</td><td class="right">${fmt(apurado)}</td><td class="right">${fmt(acumulado)}</td><td class="right">${fmt(retServicos)}</td></tr>`;
  }).join('');
  return `
  <h2>🧾 IVA e Retenções</h2>
  <p class="note">Estimativa a partir dos lançamentos com IVA marcado (Sim + taxa). Retenção estimada: 6,5% sobre despesas de "SERVIÇOS DE TERCEIROS". Confirme sempre com o contabilista/AGT antes de submeter.</p>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">IVA Liquidado</th><th class="right">IVA Dedutível</th><th class="right">IVA Apurado</th><th class="right">Acumulado</th><th class="right">Retenção Estimada (6,5%)</th></tr></thead>
  <tbody>${linhas}</tbody></table></div>`;
}

/* ---------- Balanço Patrimonial (simplificado) ---------- */
function viewBalanco(){
  const caixaBancos = CONTAS.reduce((s,c)=> s + DB.lancamentos.filter(l=>l.conta===c.codigo).reduce((s2,l)=> s2 + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0), 0);
  const contasReceber = DB.contasReceber.filter(c=>c.status!=='Pago').reduce((s,c)=>s+Number(c.valor||0),0);
  const contasPagar = DB.contasPagar.filter(c=>c.status!=='Pago').reduce((s,c)=>s+Number(c.valor||0),0);
  const imobilizadoLiquido = DB.imobilizado.reduce((s,a)=>{
    const anos=(new Date()-new Date(a.dataAquisicao))/(365.25*24*3600*1000);
    const amortAnual=Number(a.valor)/Number(a.vidaUtil||1);
    return s + Math.max(0, Number(a.valor)-Math.min(Number(a.valor),amortAnual*Math.max(0,anos)));
  },0);
  const ativoTotal = caixaBancos+contasReceber+imobilizadoLiquido;
  const passivoTotal = contasPagar;
  const capitalProprio = ativoTotal-passivoTotal;
  return `
  <h2>🏛️ Balanço Patrimonial (simplificado)</h2>
  <p class="note">Cálculo automático simplificado a partir de Lançamentos, Contas a Pagar/Receber e Mapa de Amortizações — não substitui um balanço contabilístico completo.</p>
  <div class="split">
    <div><h2 class="sub" style="font-size:16px;">ATIVO</h2>
      <table><tbody>
      <tr><td>Caixa e Bancos</td><td class="right">${fmt(caixaBancos)}</td></tr>
      <tr><td>Clientes (Contas a Receber)</td><td class="right">${fmt(contasReceber)}</td></tr>
      <tr><td>Ativo Fixo Líquido (Imobilizado)</td><td class="right">${fmt(imobilizadoLiquido)}</td></tr>
      <tr><td><b>Total do Ativo</b></td><td class="right"><b>${fmt(ativoTotal)}</b></td></tr>
      </tbody></table>
    </div>
    <div><h2 class="sub" style="font-size:16px;">PASSIVO + CAPITAL PRÓPRIO</h2>
      <table><tbody>
      <tr><td>Fornecedores (Contas a Pagar)</td><td class="right">${fmt(passivoTotal)}</td></tr>
      <tr><td>Capital Próprio / Resultados Acumulados</td><td class="right">${fmt(capitalProprio)}</td></tr>
      <tr><td><b>Total</b></td><td class="right"><b>${fmt(passivoTotal+capitalProprio)}</b></td></tr>
      </tbody></table>
    </div>
  </div>`;
}

/* ---------- Existências e CMV ---------- */
function viewExistencias(){
  const ano = new Date().getFullYear();
  let inicial = 0, inicialQtd = 0;
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key && l.categoria==='COMPRAS DE MERCADORIAS PARA REVENDA');
    const compras = doMes.reduce((s,l)=>s+valorEmKZ(l),0);
    const comprasQtd = doMes.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const final = Number(DB.existencias[key]||0);
    const finalQtd = Number(DB.existenciasQtd[key]||0);
    const cmv = inicial+compras-final;
    const consumoQtd = inicialQtd+comprasQtd-finalQtd;
    const linha = `<tr><td>${m}</td>
      <td class="right">${fmt(inicial)}</td><td class="right">${fmt(compras)}</td>
      <td><input type="number" step="0.01" data-existencia="${key}" value="${DB.existencias[key]||''}" placeholder="Valor" style="width:110px;"></td>
      <td class="right"><b>${fmt(cmv)}</b></td>
      <td class="right">${fmt(inicialQtd)}</td><td class="right">${fmt(comprasQtd)}</td>
      <td><input type="number" step="0.01" data-existencia-qtd="${key}" value="${DB.existenciasQtd[key]||''}" placeholder="Contagem" style="width:100px;"></td>
      <td class="right"><b>${fmt(consumoQtd)}</b></td></tr>`;
    inicial = final; inicialQtd = finalQtd;
    return linha;
  }).join('');
  return `
  <h2>📦 Existências e CMV</h2>
  <p class="note">Método de inventário periódico: CMV = Existências Iniciais + Compras do Mês − Existências Finais. As colunas de Quantidade vêm automaticamente do campo "Quantidade" dos Lançamentos (categoria "COMPRAS DE MERCADORIAS PARA REVENDA") — preencha só a contagem física do fim do mês (valor e/ou quantidade); o mês seguinte transita sozinho.</p>

/* ---------- Existências — Stocks (SKU) ---------- */
function entradasDoProduto(produtoId, key){
  return DB.lancamentos.filter(l=>l.produtoId===produtoId && l.quantidade && mesKey(l.data)===key);
}
function stockMensal(p){
  const ano = new Date().getFullYear();
  let inicial=0, custoMedio=0;
  return MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const entradas = entradasDoProduto(p.id,key);
    let qtdComEntradas = inicial, valorAcum = inicial*custoMedio;
    entradas.forEach(l=>{
      const q=Number(l.quantidade)||0; if(q<=0) return;
      const custoU = valorEmKZ(l)/q;
      valorAcum += q*custoU; qtdComEntradas += q;
    });
    custoMedio = qtdComEntradas>0 ? valorAcum/qtdComEntradas : custoMedio;
    const entradasQtd = entradas.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const finalKey = `${p.id}:${key}`;
    const temContagem = DB.existenciasStockFinal[finalKey]!==undefined && DB.existenciasStockFinal[finalKey]!=='';
    const final = temContagem ? Number(DB.existenciasStockFinal[finalKey]) : qtdComEntradas;
    const consumo = qtdComEntradas-final;
    const valorFinal = final*custoMedio;
    const linha = {mes:m,key,inicial,entradasQtd,final,consumo,custoMedio,valorFinal,finalKey,temContagem};
    inicial = final;
    return linha;
  });
}

  const rowsProd = DB.produtos.slice().reverse().map(p=>`

    const linhas = meses.map(l=>`

      </h2>
      <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">Exist. Inicial</th><th class="right">Entradas (Lançamento)</th><th>Exist. Final (contagem)</th><th class="right">Consumo</th><th class="right">Custo Médio</th><th class="right">Valor em Stock</th></tr></thead>

    <div class="card"><div class="lbl">Total Despesas</div><div class="val neg">${fmt(despesaTotal)} Kz</div></div>
    <div class="card"><div class="lbl">Custo com Pessoal (INSS incl.)</div><div class="val neg">${fmt(salariosTotal)} Kz</div></div>
    <div class="card"><div class="lbl">Resultado do Período</div><div class="val ${resultado>=0?'pos':'neg'}">${fmt(resultado)} Kz</div></div>
  </div>`;
}

/* ---------- Eventos ---------- */
function bindEvents(){
  /* FaturaBot */
  const fbForn = document.getElementById('fbFornecedor');
  if(fbForn) fbForn.oninput=()=>{
    const sug = faturabotSugestao(fbForn.value, '');
    const tag = document.getElementById('fbSugestaoTag');
    if(sug){
      document.getElementById('fbCategoria').value = sug.categoria;
      if(sug.conta) document.getElementById('fbConta').value = sug.conta;
      tag.textContent = `— sugerido (${sug.origemSugestao})`;
    } else tag.textContent = '';
  };
  const ffb=document.getElementById('formFaturabot');
  const fbArquivo=document.getElementById('fbArquivo');
  if(fbArquivo) fbArquivo.onchange=async()=>{
    const arquivo = fbArquivo.files[0];
    if(!arquivo || !ffb) return;
    const tag = document.getElementById('fbOcrTag');
    const leitor = new FileReader();
    leitor.onload = async()=>{
      const dataUrl = leitor.result;
      const base64 = dataUrl.split(',')[1];
      if(tag) tag.textContent = '🔍 A ler o documento com IA...';
      try{
        if(!supa) throw new Error('sem Supabase');
        const { data, error } = await supa.functions.invoke('faturabot-ocr', { body:{ imageBase64: base64, mediaType: arquivo.type || 'image/jpeg' } });
        if(error) throw error;
        if(data && data.ok && data.campos){
          const c = data.campos;
          const set=(campo,val)=>{ if(val!==undefined && val!==null && val!=='' && ffb.elements[campo]) ffb.elements[campo].value = val; };
          set('fornecedor', c.fornecedor); set('nif', c.nif); set('nFatura', c.nFatura);
          set('data', c.data); set('vencimento', c.vencimento); set('valor', c.valor);
          set('moeda', c.moeda); set('iva', c.iva); set('taxaIVA', c.taxaIVA); set('descricao', c.descricao);
          if(fbForn) fbForn.oninput();
          if(tag) tag.textContent = '✅ Documento lido pela IA — confira os campos antes de enviar.';
          toast('Documento lido automaticamente. Confira os campos.');
        } else {
          if(tag) tag.textContent = '⚠️ Não consegui ler automaticamente — preencha os campos manualmente.';
        }
      }catch(e){
        console.warn('OCR indisponível', e);
        if(tag) tag.textContent = '⚠️ Leitura automática indisponível (serviço OCR não ligado) — preencha os campos manualmente.';
      }
    };
    leitor.readAsDataURL(arquivo);
  };
  if(ffb) ffb.onsubmit=async e=>{
    e.preventDefault();
    const arquivo = document.getElementById('fbArquivo').files[0];
    const novo = Object.fromEntries(new FormData(ffb).entries());
    novo.taxaIVA = Number(novo.taxaIVA||0);
    novo.id=uid(); novo.criado=new Date().toISOString(); novo.status='Pendente';
    const gravar=async()=>{
      DB.faturabot.push(novo);
      logar('FaturaBot: fatura recebida', `${novo.fornecedor} — ${fmt(novo.valor)} ${novo.moeda}`);
      await saveDB(); toast('Fatura enviada para o FaturaBot — aguardando aprovação.'); ffb.reset(); render();
    };
    if(arquivo){
      const leitor = new FileReader();
      leitor.onload = async()=>{ novo.anexoNome = arquivo.name; novo.anexoBase64 = leitor.result; await gravar(); };
      leitor.readAsDataURL(arquivo);
    } else await gravar();
  };
  document.querySelectorAll('[data-fb-campo]').forEach(el=>el.onchange=async()=>{
    const [id,campo]=el.dataset.fbCampo.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(f){ f[campo]=el.value; await saveDB(); }
  });
  document.querySelectorAll('[data-fb-aprovar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbAprovar);
    if(!f) return;
    const alertas = faturabotValidar(f);
    if(alertas.length && !confirm('Esta fatura tem alertas de validação:\n\n'+alertas.join('\n')+'\n\nAprovar mesmo assim?')) return;
    f.status='Aprovado';
    const lanc = {id:uid(), data:f.data, tipo:'Despesa', origem:f.origem||'', categoria:f.categoria, conta:f.conta,
      entidade:f.fornecedor, nFatura:f.nFatura, valor:f.valor, moeda:f.moeda, iva:f.iva, taxaIVA:f.taxaIVA, descricao:f.descricao||`FaturaBot: ${f.fornecedor}`};
    DB.lancamentos.push(lanc);
    if(f.vencimento){
      DB.contasPagar.push({id:uid(), entidade:f.fornecedor, descricao:f.descricao||f.nFatura||'', vencimento:f.vencimento, valor:f.valor, status:'Pendente'});
    }
    faturabotAprender(f);
    logar('FaturaBot: fatura aprovada e integrada', `${f.fornecedor} — ${fmt(f.valor)} ${f.moeda} → Lançamentos${f.vencimento?' + Contas a Pagar':''}`);
    await saveDB(); toast('Fatura aprovada e integrada em Lançamentos.'); render();
  });
  document.querySelectorAll('[data-fb-rejeitar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbRejeitar);
    if(f){ f.status='Rejeitado'; logar('FaturaBot: fatura rejeitada', `${f.fornecedor} — ${fmt(f.valor)} ${f.moeda}`); await saveDB(); render(); }
  });
  document.querySelectorAll('[data-fb-apagar]').forEach(b=>b.onclick=async()=>{
    DB.faturabot = DB.faturabot.filter(x=>x.id!==b.dataset.fbApagar); await saveDB(); render();
  });

  const fl=document.getElementById('formLanc');
  if(fl) fl.onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(fl);
    const novo = Object.fromEntries(f.entries());
    novo.taxaIVA = Number(novo.taxaIVA||0);
    if(periodoFechado(novo.data) && !confirm('Este período (mês) está marcado como FECHADO em "Fecho de Períodos". Confirma mesmo assim o lançamento?')) return;
    const dup = DB.lancamentos.find(l=>l.entidade===novo.entidade && l.nFatura===novo.nFatura && Number(l.valor)===Number(novo.valor) && novo.nFatura);
    if(dup && !confirm('Possível duplicado (mesmo Fornecedor + Nº Fatura + Valor). Continuar mesmo assim?')) return;
    novo.id=uid(); DB.lancamentos.push(novo); logar('Lançamento adicionado', `${novo.tipo} ${novo.categoria} — ${fmt(novo.valor)} ${novo.moeda} (${novo.entidade||'s/ entidade'})`); await saveDB(); toast('Lançamento adicionado.'); render();
  };
  document.querySelectorAll('[data-del-lanc]').forEach(b=>b.onclick=async()=>{
    const l=DB.lancamentos.find(x=>x.id===b.dataset.delLanc);
    DB.lancamentos = DB.lancamentos.filter(l=>l.id!==b.dataset.delLanc);
    if(l) logar('Lançamento apagado', `${l.tipo} ${l.categoria} — ${fmt(l.valor)} ${l.moeda}`);
    await saveDB(); render();
  });

  const ffiltro=document.getElementById('formFiltroLanc');
  if(ffiltro) ffiltro.onsubmit=e=>{
    e.preventDefault();
    const f=Object.fromEntries(new FormData(ffiltro).entries());
    filtrosLanc = {dataDe:f.dataDe||'', dataAte:f.dataAte||'', mes:f.mes||'', tipo:f.tipo||'', categoria:f.categoria||'', origem:f.origem||'', conta:f.conta||''};
    render();
  };
  const btnLimpar=document.getElementById('btnLimparFiltro');
  if(btnLimpar) btnLimpar.onclick=()=>{
    filtrosLanc = {dataDe:'', dataAte:'', mes:'', tipo:'', categoria:'', origem:'', conta:''};
    render();
  };

  const fobs=document.getElementById('formObs');
  if(fobs) fobs.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fobs).entries());
    novo.id=uid(); DB.observacoes.push(novo); logar('Observação adicionada', novo.texto); await saveDB(); toast('Observação adicionada.'); render();
  };
  document.querySelectorAll('[data-delobs]').forEach(b=>b.onclick=async()=>{
    DB.observacoes=DB.observacoes.filter(o=>o.id!==b.dataset.delobs); await saveDB(); render();
  });

  const btnP=document.getElementById('btnPesquisar');
  if(btnP) btnP.onclick=executarPesquisa;

  const btnR=document.getElementById('btnResumo');
  if(btnR){ btnR.onclick=atualizarResumo; atualizarResumo(); }

  const fprod=document.getElementById('formProduto');
  if(fprod) fprod.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fprod).entries());
    novo.id=uid(); DB.produtos.push(novo); logar('Produto adicionado', novo.nome); await saveDB(); toast('Produto adicionado.'); render();
  };
  document.querySelectorAll('[data-delprod]').forEach(b=>b.onclick=async()=>{
    const pid=b.dataset.delprod;
    DB.produtos=DB.produtos.filter(p=>p.id!==pid);
    Object.keys(DB.existenciasStockFinal).forEach(k=>{ if(k.startsWith(pid+':')) delete DB.existenciasStockFinal[k]; });
    await saveDB(); render();
  });
  document.querySelectorAll('[data-stockfinal]').forEach(inp=>inp.onchange=async()=>{
    DB.existenciasStockFinal[inp.dataset.stockfinal]=inp.value; await saveDB(); render();
  });

  document.querySelectorAll('[data-fecho]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.fecho;
    const atual = DB.fechos[key]&&DB.fechos[key].fechado;
    DB.fechos[key]={fechado:!atual, data:new Date().toISOString()};
    logar(atual?'Período reaberto':'Período fechado', key);
    await saveDB(); render();
  });

  const fc=document.getElementById('formConta');
  if(fc) fc.onsubmit=async e=>{
    e.preventDefault();
    const key=fc.dataset.key;
    const novo=Object.fromEntries(new FormData(fc).entries());
    novo.id=uid(); novo.status='Pendente'; DB[key].push(novo); logar('Adicionado a '+(key==='contasPagar'?'Contas a Pagar':'Contas a Receber'), `${novo.entidade} — ${fmt(novo.valor)}`); await saveDB(); toast('Adicionado.'); render();
  };
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{
    const [key,id]=b.dataset.pay.split(':');
    DB[key]=DB[key].map(c=>c.id===id?{...c,status:'Pago'}:c);
    logar('Marcado como pago', key); await saveDB(); render();
  });
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{
    const [key,id]=b.dataset.delc.split(':');
    DB[key]=DB[key].filter(c=>c.id!==id); await saveDB(); render();
  });

  document.querySelectorAll('[data-saldo-extrato]').forEach(inp=>inp.onchange=async()=>{
    DB.saldosExtrato[inp.dataset.saldoExtrato]=inp.value; await saveDB(); render();
  });

  document.querySelectorAll('[data-cambio]').forEach(inp=>inp.onchange=async()=>{
    const [key,moeda]=inp.dataset.cambio.split(':');
    DB.cambio[key]=DB.cambio[key]||{}; DB.cambio[key][moeda]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-existencia]').forEach(inp=>inp.onchange=async()=>{
    DB.existencias[inp.dataset.existencia]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-existencia-qtd]').forEach(inp=>inp.onchange=async()=>{
    DB.existenciasQtd[inp.dataset.existenciaQtd]=inp.value; await saveDB(); render();
  });
  document.querySelectorAll('[data-orc]').forEach(inp=>inp.onchange=async()=>{
    DB.orcamento[inp.dataset.orc]=inp.value; await saveDB(); render();
  });
  const fi=document.getElementById('formImob');
  if(fi) fi.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fi).entries());
    novo.id=uid(); DB.imobilizado.push(novo); await saveDB(); toast('Bem adicionado.'); render();
  };
  document.querySelectorAll('[data-delimob]').forEach(b=>b.onclick=async()=>{
    DB.imobilizado=DB.imobilizado.filter(a=>a.id!==b.dataset.delimob); await saveDB(); render();
  });

  document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async()=>{
    const email=sel.dataset.role;
    const novoPapel=sel.value;
    await supa.from('team_roles').upsert({email, role: novoPapel});
    if(email===meuEmail) meuPapel = novoPapel;
    toast('Papel atualizado.'); await carregarMembros(); render();
  });

  const fs=document.getElementById('formSal');
  if(fs) fs.onsubmit=async e=>{
    e.preventDefault();
    const novo=Object.fromEntries(new FormData(fs).entries());
    novo.id=uid(); DB.salarios.push(novo); await saveDB(); toast('Trabalhador adicionado.'); render();
  };
  document.querySelectorAll('[data-delsal]').forEach(b=>b.onclick=async()=>{
    DB.salarios=DB.salarios.filter(s=>s.id!==b.dataset.delsal); await saveDB(); render();
  });
}

/* iniciar() já chamado acima */
</script>
</body>
</html>
