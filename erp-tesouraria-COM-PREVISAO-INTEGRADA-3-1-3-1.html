/* ---------- Entregas e Suprimentos de Caixa ----------
   Dinheiro que sai da Caixa Tesouraria para ficar à guarda de um departamento (Logística,
   Recursos Humanos) ou é entregue a um Prestador de Serviços, para pagamentos/compras
   diversas. Ao registar a entrega, o sistema já lança a saída em Cash na categoria
   "Adiantamentos e Suprimentos de Caixa a Justificar" (categoria neutra, fora do Resultado
   do Exercício — tal como Transferência entre Contas — porque ainda não é despesa real,
   é dinheiro à guarda de alguém). A justificação (prestação de contas, com comprovativos)
   é registada depois, por categoria real — e ESPELHA-SE de imediato num lançamento de
   Despesa nessa categoria (reduzindo o lançamento original "a justificar" no mesmo valor),
   para que a DRE reflita o gasto real assim que é comprovado, sem depender de reclassificar
   tudo manualmente no fim. Não é uma nova saída de caixa — o dinheiro já tinha saído na
   entrega; é a reclassificação desse valor da conta "a justificar" para a categoria certa.
   Quando a justificação é uma compra em Mercado Informal (sem fatura/NIF do vendedor), o
   lançamento fica marcado com semDocumentoFiscal:true (não aceite para efeitos de Imposto
   Industrial — ver lucroTributavelDoAno) e gera-se automaticamente uma Declaração de Compra
   em Mercado Informal (documento de controlo interno que substitui a fatura em falta).
   Se restar dinheiro por gastar, regista-se a Devolução (entra de volta na Caixa). */
let suprimentoAberto = new Set();
registrarFiltroModulo('suprimentos', {
  getLista: ()=> DB.suprimentos,
  campoData: 'data', campoOrigem: 'unidade',
  titulo: 'Adiantamentos de Caixa (Logística/RH/Prestadores)', subtitulo: 'Registo de movimentos de dinheiro entregue a Logística, Recursos Humanos e Prestadores de Serviços — não é investimento de sócio, ver "Controlo de Suprimentos de Sócios" para isso.',
  ficheiro: 'adiantamentos-caixa',
  cabecalhos: ['Data','Destinatário','Detalhe','Responsável','Unidade','Finalidade','Valor Entregue','Justificado','Devolvido','Saldo Pendente'],
  linha: s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,x)=>t+Number(x.valor||0),0);
    return [s.data,s.destinatario,s.destinatarioDetalhe||'',s.responsavel||'',s.unidade||'',s.finalidade||'',Number(s.valor||0),j,d,Number(s.valor||0)-j-d];
  },
  cabecalhosImpressao: ['Data','Destinatário','Responsável','Finalidade','Valor Entregue','Saldo Pendente'],
  linhaImpressao: s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);
    return [s.data,s.destinatario,s.responsavel||'',s.finalidade||'',fmt(s.valor),fmt(Number(s.valor||0)-j-d)];
  },
});
function viewSuprimentos(){
  const lista = listaFiltradaModulo('suprimentos').slice().reverse();
  const linhas = lista.map(s=>{
    const justificado = (s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const devolvido = (s.devolucoes||[]).reduce((t,d)=>t+Number(d.valor||0),0);
    const saldo = Number(s.valor||0) - justificado - devolvido;
    const estado = saldo<=0.5 ? 'Concluído' : (justificado>0||devolvido>0 ? 'Parcial' : 'Aberto');
    const badge = estado==='Concluído'?'pago':(estado==='Parcial'?'pendente':'atraso');
    const aberto = suprimentoAberto.has(s.id);
    const painel = aberto ? `
    <tr><td colspan="8" style="background:#f7f5ef;padding:10px 14px;">
      <b>Justificação / Prestação de Contas</b>
      <p class="note" style="margin:6px 0;">Registe aqui, por categoria real de despesa, no que este valor foi efetivamente gasto (com fornecedor/nº de documento como comprovativo). Se sobrar dinheiro por gastar, registe a Devolução à Caixa.</p>
      <table style="margin-bottom:8px;"><thead><tr><th>Data</th><th>Categoria Real</th><th>Comprovativo</th><th>Fornecedor/Beneficiário</th><th>Nº Doc./Recibo</th><th class="right">Valor</th><th>Descrição</th><th></th></tr></thead>
      <tbody>
        ${(s.liquidacoes||[]).map((l,idx)=>`<tr${l.origemDocumento==='mercado_informal'?' style="background:#fdf6e3;"':''}><td>${l.data}</td><td>${l.categoria}</td><td>${l.origemDocumento==='mercado_informal'?`<span class="badge pendente" title="Sem fatura/NIF — compra em mercado informal. Gerada Declaração de Controlo Interno; fica marcada como não aceite fiscalmente para efeitos de Imposto Industrial.">🏪 Mercado Informal</span>`:`<span class="badge pago">🧾 Fatura/Recibo</span>`}</td><td>${xmlEsc(l.fornecedor||'')}</td><td>${xmlEsc(l.nDocumento||'')}</td><td class="right">${fmt(l.valor)}</td><td>${xmlEsc(l.descricao||'')}</td><td>${l.origemDocumento==='mercado_informal'?`<button type="button" class="print" data-print-mi="${s.id}:${idx}" title="Emitir Declaração de Compra em Mercado Informal">📄 Declaração</button> `:''}<button class="danger" data-del-liquidacao="${s.id}:${idx}">Apagar</button></td></tr>`).join('') || `<tr><td colspan="8" class="note">Ainda sem justificação registada.</td></tr>`}
        ${(s.devolucoes||[]).map((d,idx)=>`<tr style="background:var(--verde-claro);"><td>${d.data}</td><td colspan="4"><b>Devolução à Caixa</b></td><td class="right">${fmt(d.valor)}</td><td>${xmlEsc(d.descricao||'')}</td><td><button class="danger" data-del-devolucao="${s.id}:${idx}">Apagar</button></td></tr>`).join('')}
      </tbody></table>
      <form class="grid formLiquidacao" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;" data-sup="${s.id}">
        <div><label>Data</label><input type="date" name="data" value="${hoje()}"></div>
        <div><label>Categoria Real de Despesa</label><select name="categoria">${optsCategorias('','despesa')}</select></div>
        <div><label>Comprovativo</label><select name="origemDocumento" class="selOrigemDoc">
          <option value="fatura">🧾 Fatura/Recibo com NIF</option>
          <option value="mercado_informal">🏪 Mercado Informal (sem fatura)</option>
        </select></div>
        <div class="campoFornecedor"><label>Fornecedor/Beneficiário</label><input name="fornecedor"></div>
        <div class="campoNDoc"><label>Nº Doc./Recibo</label><input name="nDocumento"></div>
        <div class="campoLocalMercado" style="display:none;"><label>Local/Vendedor no Mercado Informal</label><input name="localMercado" placeholder="Ex.: Mercado do Kikolo, vendedor de hortaliças"></div>
        <div><label>Valor</label><input type="number" step="0.01" name="valor"></div>
        <div style="grid-column:span 2;"><label>Descrição (o que foi comprado)</label><input name="descricao"></div>
        <div><button type="submit">+ Adicionar Justificação</button></div>
      </form>
      <p class="note" style="margin-top:4px;">🏪 <b>Mercado Informal</b>: quando não há fatura com NIF (comum em compras de mercado/rua), a despesa continua a espelhar-se na categoria real escolhida na DRE (é dinheiro efetivamente gasto no negócio) — mas fica marcada como <b>não aceite fiscalmente</b> para o cálculo do Imposto Industrial (é somada de volta ao lucro tributável, porque a AGT não aceita custo sem documento válido) e gera automaticamente uma Declaração de Compra em Mercado Informal — o documento de controlo interno que substitui a fatura em falta, para quem tiver de justificar o gasto numa fiscalização.</p>
      <form class="grid formDevolucao" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;margin-top:8px;" data-sup="${s.id}">
        <div><label>Data da Devolução</label><input type="date" name="data" value="${hoje()}"></div>
        <div><label>Valor Devolvido</label><input type="number" step="0.01" name="valor" placeholder="${saldo>0?fmt(saldo):'0.00'}"></div>
        <div style="grid-column:span 2;"><label>Observação</label><input name="descricao" placeholder="Ex.: sobra devolvida em numerário"></div>
        <div><button type="submit" class="sec">↩️ Registar Devolução</button></div>
      </form>
      <p class="note" style="margin-top:8px;">Justificado: <b>${fmt(justificado)}</b> · Devolvido: <b>${fmt(devolvido)}</b> · Saldo por justificar/devolver: <b>${fmt(saldo)}</b> — cada justificação já reflete automaticamente na categoria de despesa escolhida assim que é adicionada (não precisa de reclassificar nada manualmente).</p>
    </td></tr>` : '';
    return `<tr>
      <td>${s.data}</td>
      <td>${s.destinatario}${s.destinatarioDetalhe?` — ${s.destinatarioDetalhe}`:''}</td>
      <td>${s.responsavel||''}</td>
      <td>${s.finalidade||''}</td>
      <td class="right">${fmt(s.valor)}</td>
      <td class="right">${fmt(saldo)}</td>
      <td><span class="badge ${badge}">${estado}</span></td>
      <td><button class="sec" data-toggle-sup="${s.id}">${aberto?'Fechar':'Justificar'}</button> <button class="print" data-print-sup="${s.id}">Imprimir</button> <button class="danger" data-del-sup="${s.id}">Apagar</button></td>
    </tr>${painel}`;
  }).join('') || `<tr><td colspan="8" class="note">Nenhuma entrega de caixa registada ainda.</td></tr>`;

  const totalEntregue = lista.reduce((s,x)=>s+Number(x.valor||0),0);
  const totalPendente = lista.reduce((s,x)=>{
    const j=(x.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(x.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);
    return s + Math.max(0, Number(x.valor||0)-j-d);
  },0);

  return `
  <h2 style="background:var(--castanho);">🧾 Adiantamentos de Caixa (Logística/RH/Prestadores)</h2>
  <p class="note">Controlo de dinheiro que sai da Caixa Tesouraria para ficar à guarda de Logística, Recursos Humanos ou de um Prestador de Serviços, para pagamentos/compras diversas. Ao gravar, o sistema lança automaticamente a saída em Cash (categoria "Adiantamentos e Suprimentos de Caixa a Justificar", que fica fora do Resultado do Exercício até ser justificada). Depois, use "Justificar" para documentar em que foi gasto (por categoria real, com comprovativo) — este é o documento de controlo interno destes movimentos. <b>Isto não é investimento de sócio</b> — para dinheiro que os sócios metem ou tiram da empresa, use "🏦 Controlo de Suprimentos de Sócios".</p>
  <div class="cards">
    <div class="card"><div class="lbl">Total Entregue</div><div class="val neg">${fmt(totalEntregue)} Kz</div></div>
    <div class="card"><div class="lbl">Por Justificar/Devolver</div><div class="val ${totalPendente>0?'neg':'pos'}">${fmt(totalPendente)} Kz</div></div>
  </div>
  ${barraFiltroModuloHTML('suprimentos', {comPeriodo:true, comPosto:true, labelPosto:'Unidade de Negócio', listaPosto:UNIDADES_NEGOCIO})}
  <form class="inline" id="formSuprimento">
    <div class="grid">
      <div><label>Data</label><input type="date" name="data" value="${hoje()}" required></div>
      <div><label>Destinatário</label><select name="destinatario" id="supDestinatario">${DESTINATARIOS_SUPRIMENTO.map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div id="supDetalheRow" style="display:none;"><label>Nome do Prestador/Detalhe</label><input name="destinatarioDetalhe" id="supDestinatarioDetalhe"></div>
      <div><label>Responsável que recebeu o dinheiro</label><input name="responsavel" required></div>
      <div><label>Unidade de Negócio</label><select name="unidade"><option value="">—</option>${UNIDADES_NEGOCIO.map(u=>`<option>${u}</option>`).join('')}</select></div>
      <div><label>Valor</label><input type="number" step="0.01" name="valor" required></div>
      <div style="grid-column:1/-1;"><label>Finalidade</label><input name="finalidade" required placeholder="Ex.: compra de material de escritório, pagamento a fornecedor de manutenção..."></div>
    </div>
    <div class="actions"><button type="submit">+ Registar Entrega de Caixa</button></div>
  </form>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th>Destinatário</th><th>Responsável</th><th>Finalidade</th><th class="right">Valor Entregue</th><th class="right">Saldo</th><th>Estado</th><th></th></tr></thead>
    <tbody>${linhas}</tbody></table>
  </div>`;
}

/* ---------- Controlo de Suprimentos de Sócios ----------
   Dinheiro que os SÓCIOS emprestam/investem na empresa (aporte) e que a empresa lhes
   deve devolver (Passivo — conta 25 "Suprimentos de Sócios") — DIFERENTE dos
   "Adiantamentos de Caixa" acima, que é dinheiro da empresa entregue a um departamento/
   prestador para gastar. Cada aporte gera um lançamento (Receita, categoria "Suprimentos")
   e cada reembolso ao sócio gera um lançamento (Despesa, categoria "Suprimentos") — os
   mesmos que já alimentam o Balanço (conta 25) e a Demonstração de Fluxos de Caixa
   (Atividades de Financiamento), agora com o detalhe de A QUEM se deve e a taxa de juro
   acordada. Os juros, quando pagos/capitalizados, são registados à parte como Gasto
   Financeiro (categoria "Financeiras") — fiscalmente aceites apenas até ao limite da
   taxa de referência do BNA usada pela AGT (ver REGRAS_FISCAIS_AGT.suprimentosSocios). */
let socioAberto = new Set();
function diasEntreDatas(d1,d2){ return Math.max(0, Math.round((new Date(d2) - new Date(d1)) / 86400000)); }
function saldoAporteSocio(a){
  const reemb = (a.reembolsos||[]).reduce((s,r)=>s+Number(r.valor||0),0);
  return Number(a.valor||0) - reemb;
}
function jurosPagosAporte(a){ return (a.jurosRegistados||[]).reduce((s,j)=>s+Number(j.valor||0),0); }
function iacRetidoAporte(a){ return (a.jurosRegistados||[]).reduce((s,j)=>s+Number(j.retencaoIAC||0),0); }
/* Estimativa simples de juro corrido desde o último juro registado (ou desde o aporte,
   se ainda não houve nenhum), sobre o saldo em dívida atual — proporção linear de dias/365.
   É só uma sugestão de apoio, não substitui o cálculo do contabilista para efeitos fiscais. */
function jurosEstimadosAporte(a, ateData){
  const saldo = saldoAporteSocio(a);
  if(saldo<=0) return 0;
  const desde = (a.jurosRegistados&&a.jurosRegistados.length) ? a.jurosRegistados[a.jurosRegistados.length-1].data : a.data;
  const dias = diasEntreDatas(desde, ateData||hoje());
  const taxa = Number(a.taxaJuroAnual||0)/100;
  return saldo * taxa * dias/365;
}
registrarFiltroModulo('suprimentosSocios', {
  getLista: ()=> DB.suprimentosSocios,
  campoData: 'data',
  titulo: 'Controlo de Suprimentos de Sócios', subtitulo: 'Aportes de capital/empréstimos dos sócios à empresa, com taxa de juro e reembolsos.',
  ficheiro: 'suprimentos-socios',
  cabecalhos: ['Data','Sócio','Valor Aportado','Moeda','Taxa Juro Anual (%)','Reembolsado','Juros Pagos (Bruto)','IAC Retido (10%)','Saldo em Dívida'],
  linha: a=>[a.data,a.socio,Number(a.valor||0),a.moeda||'KZ',Number(a.taxaJuroAnual||0),(a.reembolsos||[]).reduce((s,r)=>s+Number(r.valor||0),0),jurosPagosAporte(a),iacRetidoAporte(a),saldoAporteSocio(a)],
  cabecalhosImpressao: ['Data','Sócio','Valor Aportado','Taxa Juro Anual (%)','Saldo em Dívida'],
  linhaImpressao: a=>[a.data,a.socio,fmt(a.valor),Number(a.taxaJuroAnual||0).toFixed(2),fmt(saldoAporteSocio(a))],
});
function viewSuprimentosSocios(){
  const lista = listaFiltradaModulo('suprimentosSocios').slice().reverse();
  const taxaAGT = (DB.suprimentosSociosConfig && DB.suprimentosSociosConfig.taxaReferenciaBNA!=null) ? Number(DB.suprimentosSociosConfig.taxaReferenciaBNA) : REGRAS_FISCAIS_AGT.suprimentosSocios.taxaReferenciaBNA;

  const socios = [...new Set(DB.suprimentosSocios.map(a=>a.socio).filter(Boolean))];
  const resumoPorSocio = socios.map(nome=>{
    const aportes = DB.suprimentosSocios.filter(a=>a.socio===nome);
    const saldo = aportes.reduce((s,a)=>s+saldoAporteSocio(a),0);
    const jurosPagos = aportes.reduce((s,a)=>s+jurosPagosAporte(a),0);
    return {nome, saldo, jurosPagos};
  }).filter(r=>r.saldo>0.5 || r.jurosPagos>0.5);

  const totalEmDivida = DB.suprimentosSocios.reduce((s,a)=>s+saldoAporteSocio(a),0);
  const totalJurosPagos = DB.suprimentosSocios.reduce((s,a)=>s+jurosPagosAporte(a),0);
  const totalIACRetido = DB.suprimentosSocios.reduce((s,a)=>s+iacRetidoAporte(a),0);
  const taxaIAC = REGRAS_FISCAIS_AGT.iac.taxaSuprimentosSocios;

  const linhas = lista.map(a=>{
    const saldo = saldoAporteSocio(a);
    const jurosPagos = jurosPagosAporte(a);
    const jurosEstimados = jurosEstimadosAporte(a);
    const excedeAGT = Number(a.taxaJuroAnual||0)/100 > taxaAGT;
    const aberto = socioAberto.has(a.id);
    const painel = aberto ? `
    <tr><td colspan="8" style="background:#f7f5ef;padding:10px 14px;">
      <b>Reembolsos ao Sócio</b>
      <table style="margin-bottom:8px;"><thead><tr><th>Data</th><th>Valor</th><th>Observação</th><th></th></tr></thead>
      <tbody>
        ${(a.reembolsos||[]).map((r,idx)=>`<tr><td>${r.data}</td><td class="right">${fmt(r.valor)}</td><td>${xmlEsc(r.observacao||'')}</td><td><button class="danger" data-del-reembolso-socio="${a.id}:${idx}">Apagar</button></td></tr>`).join('') || `<tr><td colspan="4" class="note">Ainda sem reembolsos.</td></tr>`}
      </tbody></table>
      <form class="grid formReembolsoSocio" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;" data-aporte="${a.id}">
        <div><label>Data do Reembolso</label><input type="date" name="data" value="${hoje()}"></div>
        <div><label>Valor Reembolsado</label><input type="number" step="0.01" name="valor" placeholder="${saldo>0?fmt(saldo):'0.00'}"></div>
        <div style="grid-column:span 2;"><label>Observação</label><input name="observacao" placeholder="Ex.: devolução parcial em numerário"></div>
        <div><button type="submit" class="sec">↩️ Registar Reembolso</button></div>
      </form>
      <b style="display:block;margin-top:14px;">Juros ao Sócio</b>
      <p class="note" style="margin:4px 0;">Taxa acordada: <b>${Number(a.taxaJuroAnual||0).toFixed(2)}%</b>/ano · Taxa de referência AGT/BNA em vigor: <b>${(taxaAGT*100).toFixed(2)}%</b>/ano ${excedeAGT?'· <span style="color:#a33;">a parte acima da taxa AGT/BNA não é dedutível ao Imposto Industrial</span>':''} · Juro corrido estimado desde o último registo: <b>${fmt(jurosEstimados)}</b> ${a.moeda||'KZ'}</p>
      <p class="note" style="margin:4px 0;">🏛️ <b>IAC — Imposto sobre a Aplicação de Capitais (${(taxaIAC*100).toFixed(0)}%):</b> ${xmlEsc(REGRAS_FISCAIS_AGT.iac.nota)} Prazo de entrega: ${REGRAS_FISCAIS_AGT.iac.prazoEntrega}.</p>
      <table style="margin-bottom:8px;"><thead><tr><th>Data</th><th class="right">Juro Bruto</th><th class="right">IAC Retido (${(taxaIAC*100).toFixed(0)}%)</th><th class="right">Líquido Pago ao Sócio</th><th>Observação</th><th></th></tr></thead>
      <tbody>
        ${(a.jurosRegistados||[]).map((j,idx)=>`<tr><td>${j.data}</td><td class="right">${fmt(j.valor)}</td><td class="right">${fmt(j.retencaoIAC||0)}</td><td class="right">${fmt(j.valorLiquido!=null?j.valorLiquido:j.valor)}</td><td>${xmlEsc(j.observacao||'')}</td><td><button class="danger" data-del-juro-socio="${a.id}:${idx}">Apagar</button></td></tr>`).join('') || `<tr><td colspan="6" class="note">Ainda sem juros registados.</td></tr>`}
      </tbody></table>
      <form class="grid formJuroSocio" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;" data-aporte="${a.id}">
        <div><label>Data</label><input type="date" name="data" value="${hoje()}"></div>
        <div><label>Valor Bruto do Juro</label><input type="number" step="0.01" name="valor" value="${jurosEstimados>0.5?jurosEstimados.toFixed(2):''}"></div>
        <div style="grid-column:span 2;"><label>Observação</label><input name="observacao" placeholder="Ex.: juro do 1º semestre, pago por Cash"></div>
        <div><button type="submit" class="sec">💰 Registar Juro Pago</button></div>
      </form>
      <p class="note" style="margin-top:4px;">Indique o <b>Valor Bruto do Juro</b> acordado — o sistema retém automaticamente ${(taxaIAC*100).toFixed(0)}% de IAC e lança em Tesouraria (Despesa em "Financeiras") apenas o Líquido efetivamente pago ao sócio; o IAC retido fica a entregar à AGT (ver 📅 Reporting Fiscal). O dinheiro deste juro NÃO altera o saldo em dívida do capital, só remunera o sócio pelo empréstimo.</p>
    </td></tr>` : '';
    return `<tr>
      <td>${a.data}</td>
      <td>${a.socio}</td>
      <td class="right">${fmt(a.valor)} ${a.moeda||'KZ'}</td>
      <td class="right">${Number(a.taxaJuroAnual||0).toFixed(2)}%${excedeAGT?' ⚠️':''}</td>
      <td class="right">${fmt(saldo)}</td>
      <td class="right">${fmt(jurosPagos)}</td>
      <td>${xmlEsc(a.observacao||'')}</td>
      <td><button class="sec" data-toggle-socio="${a.id}">${aberto?'Fechar':'Gerir'}</button> <button class="print" data-print-socio="${a.id}">Imprimir</button> <button class="danger" data-del-socio="${a.id}">Apagar</button></td>
    </tr>${painel}`;
  }).join('') || `<tr><td colspan="8" class="note">Nenhum suprimento de sócio registado ainda.</td></tr>`;

  return `
  <h2 style="background:var(--castanho);">🏦 Controlo de Suprimentos de Sócios</h2>
  <p class="note">Registo de dinheiro que os SÓCIOS metem na empresa (empréstimo/investimento de sócio — Passivo, conta 25) e dos reembolsos e juros pagos a cada sócio. <b>Isto não é o mesmo que os "Adiantamentos de Caixa"</b> (dinheiro da empresa entregue a Logística/RH/Prestadores) — são dois movimentos diferentes que só partilham a palavra "Suprimentos". Ao gravar um aporte, o sistema lança automaticamente uma Receita na categoria "Suprimentos" (entra dinheiro); ao registar um reembolso, lança uma Despesa na mesma categoria (sai dinheiro do capital); ao registar um juro, o sistema retém ${(taxaIAC*100).toFixed(0)}% de IAC e lança uma Despesa em "Financeiras" apenas pelo valor Líquido pago ao sócio.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Total em Dívida a Sócios</div><div class="val neg">${fmt(totalEmDivida)} Kz</div></div>
    <div class="card"><div class="lbl">Total de Juros Pagos (Bruto)</div><div class="val neg">${fmt(totalJurosPagos)} Kz</div></div>
    <div class="card"><div class="lbl">Total de IAC Retido (${(taxaIAC*100).toFixed(0)}%)</div><div class="val neg">${fmt(totalIACRetido)} Kz</div></div>
    <div class="card"><div class="lbl">Taxa de Referência AGT/BNA</div><div class="val">${(taxaAGT*100).toFixed(2)}%/ano</div></div>
  </div>
  ${resumoPorSocio.length ? `
  <div class="tablewrap">
    <table><thead><tr><th>Sócio</th><th class="right">Saldo em Dívida</th><th class="right">Juros Pagos</th></tr></thead>
    <tbody>${resumoPorSocio.map(r=>`<tr><td>${r.nome}</td><td class="right">${fmt(r.saldo)}</td><td class="right">${fmt(r.jurosPagos)}</td></tr>`).join('')}</tbody></table>
  </div>` : ''}
  <form class="inline" id="formTaxaAGTSocios">
    <div class="grid">
      <div><label>Taxa de Referência AGT/BNA em vigor (%/ano)</label><input type="number" step="0.01" name="taxa" value="${(taxaAGT*100).toFixed(2)}"></div>
    </div>
    <p class="note" style="margin:4px 0;">${xmlEsc(REGRAS_FISCAIS_AGT.suprimentosSocios.nota)} Ajuste este valor sempre que o BNA publicar uma nova taxa de referência — não é automático.</p>
    <div class="actions"><button type="submit" class="sec">Guardar Taxa</button></div>
  </form>
  ${barraFiltroModuloHTML('suprimentosSocios', {comPeriodo:true, comPosto:false})}
  <form class="inline" id="formSuprimentoSocio">
    <div class="grid">
      <div><label>Data</label><input type="date" name="data" value="${hoje()}" required></div>
      <div><label>Sócio</label><input name="socio" list="listaSocios" required></div>

    const doLoja = DB.lancamentos.filter(l=>(l.origem||'').startsWith(loja));

    const d = doLoja.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);

/* ---------- Existências — Stocks (SKU) ---------- */
function entradasDoProduto(produtoId, key){
  return DB.lancamentos.filter(l=>l.produtoId===produtoId && l.quantidade && mesKey(l.data)===key);
}
/* stockMensal(p, ano): calcula o histórico completo do produto (Custo Médio Ponderado é
   cumulativo por natureza) desde o ano mais antigo com entradas/contagens até ao ano
   pedido, e devolve só os 12 meses desse ano — assim a Exist. Inicial de Janeiro e o
   Custo Médio transitam corretamente de um ano para o outro, tal como já acontece de
   mês para mês. */
function stockMensal(p, ano){
  ano = ano || new Date().getFullYear();
  const anosEntradas = DB.lancamentos.filter(l=>l.produtoId===p.id && l.quantidade).map(l=>Number(mesKey(l.data).slice(0,4)));
  const anosContagem = Object.keys(DB.existenciasStockFinal||{}).filter(k=>k.startsWith(p.id+':')).map(k=>Number(k.split(':')[1].slice(0,4)));
  const anoInicio = Math.min(ano, ...(anosEntradas.concat(anosContagem).length ? anosEntradas.concat(anosContagem) : [ano]));
  let inicial=0, custoMedio=0, linhasAno=[];
  for(let a=anoInicio; a<=ano; a++){
    const linhasDoAno = MESES.map((m,i)=>{
      const key=`${a}-${String(i+1).padStart(2,'0')}`;
      const entradas = entradasDoProduto(p.id,key);
      let qtdComEntradas = inicial, valorAcum = inicial*custoMedio;
      entradas.forEach(l=>{
        const q=Number(l.quantidade)||0; if(q<=0) return;
        const custoU = valorEmKZ(l)/q;
        valorAcum += q*custoU; qtdComEntradas += q;
      });
      custoMedio = qtdComEntradas>0 ? valorAcum/qtdComEntradas : custoMedio;
      const entradasQtd = entradas.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
      const finalKey = `${p.id}:${key}`;
      const temContagem = DB.existenciasStockFinal[finalKey]!==undefined && DB.existenciasStockFinal[finalKey]!=='';
      const final = temContagem ? Number(DB.existenciasStockFinal[finalKey]) : qtdComEntradas;
      const consumo = qtdComEntradas-final;
      const valorFinal = final*custoMedio;
      const linha = {mes:m,key,inicial,entradasQtd,final,consumo,custoMedio,valorFinal,finalKey,temContagem};
      inicial = final;
      return linha;
    });
    if(a===ano) linhasAno = linhasDoAno;
  }
  return linhasAno;
}

/* ---------- Previsão de Produção/Compra (por SKU) ----------
   O sistema regista o stock ao nível MENSAL (contagem de fecho de mês por produto, ver
   stockMensal), não vendas diárias por SKU — por isso a previsão aqui é para "quanto
   produzir/comprar no próximo mês", não "quanto produzir amanhã". É uma previsão honesta
   dentro do que os dados existentes suportam:
     1) Usa os últimos meses com contagem de fecho registada (temContagem) como histórico
        de consumo real.
     2) Média móvel dos últimos 3 meses = base da previsão.
     3) Tendência = variação entre o bloco dos últimos 3 meses e o bloco dos 3 meses
        anteriores (se houver histórico suficiente); aplica-se essa tendência à média móvel,
        limitada a ±50% para não disparar com um único mês atípico.
     4) Sugestão de produção/compra = previsão do próximo mês − (stock atual acima do
        mínimo definido), nunca negativa.
   Produtos com menos de 2 meses de contagem ficam de fora (histórico insuficiente). */
function calcularPrevisaoProducao(){
  const anoAtual = new Date().getFullYear();
  return DB.produtos.map(p=>{
    // até 24 meses de histórico, cobrindo a virada de ano
    const meses = [...stockMensal(p, anoAtual-1), ...stockMensal(p, anoAtual)];
    const comContagem = meses.filter(m=>m.temContagem);
    if(comContagem.length<2) return {produto:p, historicoInsuficiente:true, meses:comContagem.length};

    const ultimos3 = comContagem.slice(-3);
    const mediaMovel3 = ultimos3.reduce((s,m)=>s+m.consumo,0)/ultimos3.length;

    let tendenciaPct = 0;
    if(comContagem.length>=6){
      const anteriores3 = comContagem.slice(-6,-3);
      const mediaAnterior = anteriores3.reduce((s,m)=>s+m.consumo,0)/anteriores3.length;
      if(mediaAnterior>0){
        tendenciaPct = (mediaMovel3-mediaAnterior)/mediaAnterior;
        tendenciaPct = Math.max(-0.5, Math.min(0.5, tendenciaPct)); // limita a ±50%
      }
    }
    const previsaoProximoMes = Math.max(0, mediaMovel3*(1+tendenciaPct));
    const estoqueAtual = comContagem[comContagem.length-1].final;
    const stockMinimo = Number(p.stockMinimo||0);
    const sugestaoProduzirComprar = Math.max(0, previsaoProximoMes - Math.max(0, estoqueAtual-stockMinimo));

    return {produto:p, historicoInsuficiente:false, meses:comContagem.length, mediaMovel3, tendenciaPct, previsaoProximoMes, estoqueAtual, stockMinimo, sugestaoProduzirComprar};
  });
}

function viewPrevisaoProducao(){
  const resultados = calcularPrevisaoProducao();
  const comDados = resultados.filter(r=>!r.historicoInsuficiente);

  <div class="tablewrap"><table>
    <thead><tr><th>Produto</th><th>Unid.</th><th class="right">Média Móvel (3 meses)</th><th class="right">Tendência</th><th class="right">Previsão Próximo Mês</th><th class="right">Estoque Atual</th><th class="right">Sugestão Produzir/Comprar</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div>
  <p class="note">"Sugestão Produzir/Comprar" = Previsão do próximo mês − estoque atual acima do mínimo definido (nunca negativa). Ajuste o Stock Mínimo de cada produto em 🏷️ Existências — Stocks para afinar a sugestão.</p>
  ${semDados.length ? `<h2 class="sub" style="font-size:14px;margin-top:16px;">Sem histórico suficiente (mínimo 2 meses com contagem fechada)</h2>
  <p class="note">${semDados.map(r=>`${r.produto.nome} (${r.meses} mês/meses)`).join(', ')} — feche a contagem de stock desses produtos em 🏷️ Existências — Stocks nos próximos meses para começarem a aparecer aqui.</p>` : ''}`;

async function carregarMembros(){
  try{
    /* Tenta com "posto"; se a coluna ainda não existir (SQL de migração por
       correr), volta a tentar só com "email, role" para o ecrã continuar a
       funcionar (a coluna Posto de Venda fica só sem dados nesse caso). */
    let { data, error } = await supa.from('team_roles').select('email, role, posto').order('email');

      const fallback = await supa.from('team_roles').select('email, role').order('email');
      data = fallback.data; error = fallback.error;
    }
    if(!error) membrosCache = data || [];
  }catch(e){ console.warn(e); }
  membrosJaCarregados = true;
}

  <details style="margin-top:14px;">
    <summary style="cursor:pointer;">⚙️ Como ativar (uma vez, no Supabase) — clique para ver as instruções</summary>
    <p class="note" style="margin-top:8px;">No painel do Supabase deste projeto, abra <b>SQL Editor</b> → <b>New query</b>, cole o código abaixo e clique em <b>Run</b>. Isto cria uma tabela de histórico (<code>erp_backups</code>) e agenda uma tarefa diária às 03:00 (hora UTC) que copia o estado atual dos dados para lá, mais uma limpeza automática de cópias com mais de 60 dias. Não mexe em nada do que já existe — <code>erp_data</code> continua a ser a única fonte "viva" dos dados; <code>erp_backups</code> é só um histórico paralelo, só de leitura pela aplicação.</p>
    <pre style="background:#f7f7f2;border:1px solid #ddd;padding:10px;overflow-x:auto;font-size:12px;white-space:pre-wrap;">-- 1) Tabela onde ficam guardadas as cópias diárias (histórico, não é a tabela principal)
create table if not exists erp_backups (
  id bigint generated by default as identity primary key,
  created_at timestamptz not null default now(),
  data jsonb not null
);

-- 2) Ativa o agendador de tarefas do Postgres (já vem disponível no Supabase)
create extension if not exists pg_cron;

-- 3) Agenda a cópia diária às 03:00 UTC
select cron.schedule(
  'backup-diario-erp',
  '0 3 * * *',
  $$ insert into erp_backups (data) select data from erp_data where id = 'main'; $$
);

-- 4) Agenda a limpeza de cópias com mais de 60 dias (às 03:30 UTC)
select cron.schedule(
  'limpeza-backups-antigos',
  '30 3 * * *',
  $$ delete from erp_backups where created_at < now() - interval '60 days'; $$
);

-- 5) Segurança: ativa RLS e permite leitura só a quem já pode ler erp_data
alter table erp_backups enable row level security;
create policy "Leitura de backups para utilizadores autenticados"
  on erp_backups for select
  to authenticated
  using (true);</pre>
    <p class="note" style="margin-top:8px;">Se a sua tabela <code>erp_data</code> tiver uma política de leitura diferente (ex.: restrita só a administradores), ajuste a política do passo 5 para ser igual — pergunte-me se precisar de ajuda a confirmar isso no seu projeto. Depois de correr o SQL, o primeiro backup automático só aparece às 03:00 UTC seguintes; para testar já, pode correr manualmente no SQL Editor: <code>insert into erp_backups (data) select data from erp_data where id = 'main';</code></p>
  </details>

  <h2 style="background:var(--vermelho);margin-top:24px;">🔒 Proteção Contra Gravações Simultâneas</h2>
  <p class="note">Todos os dados vivem numa única linha na base de dados, e cada gravação substitui essa linha inteira. Sem proteção, se duas pessoas usarem o sistema ao mesmo tempo (ex.: Tesouraria e Caixa em simultâneo), quem gravar por último pode apagar sem querer o que a outra pessoa lançou entretanto — em silêncio, sem nenhum aviso. Com a coluna <code>versao</code> configurada abaixo, o sistema deteta esse conflito e, em vez de gravar por cima, avisa e pede para repetir a última ação sobre os dados mais atualizados.${DB_SEM_COLUNA_VERSAO?' <b style="color:var(--vermelho);">⚠️ Esta proteção AINDA NÃO ESTÁ ATIVA no seu projeto — siga as instruções abaixo.</b>':' <b style="color:var(--verde);">✅ Proteção ativa.</b>'}</p>
  <details ${DB_SEM_COLUNA_VERSAO?'open':''} style="margin-top:14px;">
    <summary style="cursor:pointer;">⚙️ Como ativar (uma vez, no Supabase) — clique para ver as instruções</summary>
    <p class="note" style="margin-top:8px;">No painel do Supabase deste projeto, abra <b>SQL Editor</b> → <b>New query</b>, cole o código abaixo e clique em <b>Run</b>. Isto só acrescenta uma coluna contadora à tabela já existente — não apaga nem altera nenhum dado.</p>
    <pre style="background:#f7f7f2;border:1px solid #ddd;padding:10px;overflow-x:auto;font-size:12px;white-space:pre-wrap;">-- Acrescenta o contador de versão usado para detetar gravações simultâneas
alter table erp_data add column if not exists versao integer not null default 0;</pre>
    <p class="note" style="margin-top:8px;">Depois de correr o SQL, recarregue a página — a proteção fica ativa automaticamente para todos os utilizadores, sem mais nenhuma configuração.</p>
  </details>



  <h2 style="background:var(--vermelho);margin-top:24px;">☢️ Zona de Perigo — Apagar TODOS os Lançamentos</h2>

/* ---------- Exportação SAF-T (AO) — tipo Facturação ---------- */
let ultimoSaft = null;
let ultimoSaftCompras = null;
function xmlEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n2(v){ return (Number(v)||0).toFixed(2); }

function gerarXmlSaftFacturacao(ano, mes){
  const cfg = DB.empresaConfig || {};
  const mesNum = String(mes).padStart(2,'0');
  const inicio = `${ano}-${mesNum}-01`;
  const fimData = new Date(ano, Number(mes), 0);
  const fim = `${ano}-${mesNum}-${String(fimData.getDate()).padStart(2,'0')}`;

  const linhasReceita = DB.lancamentos.filter(l=> l.tipo==='Receita' && l.nFatura && mesKey(l.data)===`${ano}-${mesNum}`);
  /* Agrupa por Nº de Fatura: uma fatura paga com 2-3 formas de pagamento gera várias
     linhas de lançamento (uma por conta/forma de pagamento) partilhando o mesmo nFatura —
     para o SAF-T interessa o total da fatura, não cada movimento de tesouraria em separado. */
  const gruposFatura = new Map();
  linhasReceita.forEach(l=>{
    if(!gruposFatura.has(l.nFatura)) gruposFatura.set(l.nFatura, {...l, valor:0});
    gruposFatura.get(l.nFatura).valor += Number(l.valor||0);
  });
  const faturas = Array.from(gruposFatura.values())
    .sort((a,b)=> a.data.localeCompare(b.data) || String(a.nFatura).localeCompare(String(b.nFatura)));

  /* Clientes únicos (por NIF, ou "Consumidor Final" quando não há NIF) */
  const clientesMap = new Map();
  faturas.forEach(l=>{
    const chave = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    if(!clientesMap.has(chave)){
      clientesMap.set(chave, { id: chave, nome: l.entidade || 'Consumidor Final', nif: (l.nif&&l.nif.trim())||'999999999' });
    }
  });

  const customersXml = Array.from(clientesMap.values()).map(c=>`
    <Customer>
      <CustomerID>${xmlEsc(c.id)}</CustomerID>
      <AccountID>Desconhecido</AccountID>
      <CustomerTaxID>${xmlEsc(c.nif)}</CustomerTaxID>
      <CompanyName>${xmlEsc(c.nome)}</CompanyName>
      <BillingAddress>
        <AddressDetail>Desconhecido</AddressDetail>
        <City>Luanda</City>
        <Country>AO</Country>
      </BillingAddress>
      <SelfBillingIndicator>0</SelfBillingIndicator>
    </Customer>`).join('');

  const taxCodeFromTaxa = (taxa)=> taxa>=0.14 ? 'NOR' : (taxa>0 ? 'RED' : 'ISE');
  const taxasUsadas = new Set(faturas.map(l=> l.iva==='Sim' ? Number(l.taxaIVA||0) : 0));
  if(taxasUsadas.size===0) taxasUsadas.add(0.14);
  const taxTableXml = Array.from(taxasUsadas).map(taxa=>`
    <TaxTableEntry>
      <TaxType>IVA</TaxType>
      <TaxCountryRegion>AO</TaxCountryRegion>
      <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
      <Description>${taxa===0?'IVA Isento':'IVA '+(taxa*100).toFixed(0)+'%'}</Description>
      <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
    </TaxTableEntry>`).join('');

  let totalDebit = 0, totalCredit = 0;
  const invoicesXml = faturas.map((l,idx)=>{
    const chaveCliente = (l.nif && l.nif.trim()) ? l.nif.trim() : 'CF';
    const taxa = l.iva==='Sim' ? Number(l.taxaIVA||0) : 0;
    const bruto = Number(l.valor||0);
    const subtotal = taxa>0 ? bruto/(1+taxa) : bruto;
    const valorIVA = bruto - subtotal;
    totalCredit += bruto;
    const periodo = Number(mes);
    return `
    <Invoice>
      <InvoiceNo>${xmlEsc(l.nFatura)}</InvoiceNo>
      <DocumentStatus>
        <InvoiceStatus>N</InvoiceStatus>
        <InvoiceStatusDate>${xmlEsc(l.data)}T00:00:00</InvoiceStatusDate>
        <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
        <SourceBilling>M</SourceBilling>
      </DocumentStatus>
      <Period>${periodo}</Period>
      <InvoiceDate>${xmlEsc(l.data)}</InvoiceDate>
      <InvoiceType>FT</InvoiceType>
      <SpecialRegimes>
        <SelfBillingIndicator>0</SelfBillingIndicator>
        <CashVATSchemeIndicator>0</CashVATSchemeIndicator>
        <ThirdPartiesBillingIndicator>0</ThirdPartiesBillingIndicator>
      </SpecialRegimes>
      <SourceID>${xmlEsc(l.unidade||'GERAL')}</SourceID>
      <SystemEntryDate>${xmlEsc(l.data)}T00:00:00</SystemEntryDate>
      <CustomerID>${xmlEsc(chaveCliente)}</CustomerID>
      <Line>
        <LineNumber>1</LineNumber>
        <ProductDescription>${xmlEsc(l.descricao||l.categoria||'Venda')}</ProductDescription>
        <Quantity>${xmlEsc(l.quantidade||1)}</Quantity>
        <UnitOfMeasure>UN</UnitOfMeasure>
        <UnitPrice>${n2(subtotal / (Number(l.quantidade)||1))}</UnitPrice>
        <TaxPointDate>${xmlEsc(l.data)}</TaxPointDate>
        <Description>${xmlEsc(l.descricao||l.categoria||'Venda')}</Description>
        <CreditAmount>${n2(subtotal)}</CreditAmount>
        <Tax>
          <TaxType>IVA</TaxType>
          <TaxCountryRegion>AO</TaxCountryRegion>
          <TaxCode>${taxCodeFromTaxa(taxa)}</TaxCode>
          <TaxPercentage>${(taxa*100).toFixed(6)}</TaxPercentage>
        </Tax>
      </Line>
      <DocumentTotals>
        <TaxPayable>${n2(valorIVA)}</TaxPayable>
        <NetTotal>${n2(subtotal)}</NetTotal>
        <GrossTotal>${n2(bruto)}</GrossTotal>
      </DocumentTotals>
    </Invoice>`;
  }).join('');

  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<AuditFile xmlns="urn:OECD:StandardAuditFile-Tax:AO_1.01_01" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:OECD:StandardAuditFile-Tax:AO_1.01_01 https://raw.githubusercontent.com/assoft-portugal/SAF-T-AO/master/XSD/SAFTAO1.01_01.xsd">
<Header>
<AuditFileVersion>1.01_01</AuditFileVersion>
<CompanyID>${xmlEsc(cfg.nif||'')} ${xmlEsc(cfg.nome||'')}</CompanyID>
<TaxRegistrationNumber>${xmlEsc(cfg.nif||'')}</TaxRegistrationNumber>
<TaxAccountingBasis>F</TaxAccountingBasis>
<CompanyName>${xmlEsc(cfg.nome||"ZOOM'S LODGE HOTELARIA E RESTAURAÇÃO")}</CompanyName>
<CompanyAddress>
<AddressDetail>${xmlEsc(cfg.morada||'Desconhecido')}</AddressDetail>
<City>${xmlEsc(cfg.cidade||'Luanda')}</City>
<Country>AO</Country>
</CompanyAddress>
<FiscalYear>${ano}</FiscalYear>
<StartDate>${inicio}</StartDate>
<EndDate>${fim}</EndDate>
<CurrencyCode>AOA</CurrencyCode>
<DateCreated>${hoje()}</DateCreated>
<TaxEntity>Global</TaxEntity>
<ProductID>ERP Tesouraria Zoom's Lodge</ProductID>
<ProductVersion>1.0</ProductVersion>
</Header>
<MasterFiles>${customersXml}
<TaxTable>${taxTableXml}
</TaxTable>
</MasterFiles>
<SourceDocuments>
<SalesInvoices>
<NumberOfEntries>${faturas.length}</NumberOfEntries>
<TotalDebit>${n2(totalDebit)}</TotalDebit>
<TotalCredit>${n2(totalCredit)}</TotalCredit>${invoicesXml}
</SalesInvoices>
</SourceDocuments>
</AuditFile>`;
  return xml;
}

function baixarFicheiro(nomeFicheiro, conteudo, tipo){
  const blob = new Blob([conteudo], {type: tipo||'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeFicheiro;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Contabilidade Analítica (Centros de Custo) ----------
   Repartição do resultado por Unidade de Negócio. Cada lançamento com Unidade preenchida
   entra como direto dessa unidade. Despesas cujas categorias estejam marcadas abaixo como
   "Custo Indireto" (ex.: Administrativas, Financeiras) são somadas num único total e rateadas
   entre as unidades operacionais segundo o % configurado — a soma dos % deve fechar em 100%.
   Lançamentos sem Unidade (e que não sejam custo indireto) caem em "Não Alocado". Não altera
   nenhum lançamento nem o Balanço/DRE oficiais — é só uma reorganização analítica do mesmo
   histórico, por isso o TOTAL desta tabela deve bater com o Resultado (histórico) da DRE. */
const UNIDADES_RATEIO = UNIDADES_NEGOCIO.filter(u=>u!=='SUPRIMENTOS');
function configAnalitica(){
  DB.analitica = DB.analitica || {categoriasIndiretas:[], rateio:{}};
  DB.analitica.categoriasIndiretas = DB.analitica.categoriasIndiretas || [];
  DB.analitica.rateio = DB.analitica.rateio || {};
  return DB.analitica;
}
function calcularContabAnalitica(de, ate){
  const cfg = configAnalitica();
  const categoriasIndiretas = new Set(cfg.categoriasIndiretas);
  let lista = explodirLancamentos(DB.lancamentos).filter(l=>!CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);

  const porUnidade = {};
  UNIDADES_RATEIO.forEach(u=> porUnidade[u] = {receitas:0, despesasDiretas:0, despesasIndiretas:0, resultado:0});
  let naoAlocadoReceitas = 0, naoAlocadoDespesas = 0, poolIndireto = 0;

  lista.forEach(l=>{
    const valor = valorEmKZ(l);
    const unidade = (l.unidade||'').trim();
    if(l.tipo==='Receita'){
      if(porUnidade[unidade]) porUnidade[unidade].receitas += valor;
      else naoAlocadoReceitas += valor;
    } else if(l.tipo==='Despesa'){
      if(categoriasIndiretas.has(l.categoria)){
        poolIndireto += valor;
      } else if(porUnidade[unidade]){
        porUnidade[unidade].despesasDiretas += valor;
      } else {
        naoAlocadoDespesas += valor;
      }
    }
  });

  const somaRateio = UNIDADES_RATEIO.reduce((s,u)=>s+Number(cfg.rateio[u]||0),0);
  UNIDADES_RATEIO.forEach(u=>{
    const pct = Number(cfg.rateio[u]||0);
    porUnidade[u].despesasIndiretas = poolIndireto * (pct/100);
    porUnidade[u].resultado = porUnidade[u].receitas - porUnidade[u].despesasDiretas - porUnidade[u].despesasIndiretas;
  });

  return {porUnidade, naoAlocadoReceitas, naoAlocadoDespesas, poolIndireto, somaRateio, cfg};
}
let filtroAnalitica = {de:'', ate:''};
let ultimoAnalitica = null;
function viewContabAnalitica(){
  const {porUnidade, naoAlocadoReceitas, naoAlocadoDespesas, poolIndireto, somaRateio, cfg} = calcularContabAnalitica(filtroAnalitica.de, filtroAnalitica.ate);

  const totalReceitas = UNIDADES_RATEIO.reduce((s,u)=>s+porUnidade[u].receitas,0) + naoAlocadoReceitas;
  const totalDespesasDiretas = UNIDADES_RATEIO.reduce((s,u)=>s+porUnidade[u].despesasDiretas,0) + naoAlocadoDespesas;
  const totalResultado = UNIDADES_RATEIO.reduce((s,u)=>s+porUnidade[u].resultado,0) + naoAlocadoReceitas - naoAlocadoDespesas;

  const linhasUnidade = UNIDADES_RATEIO.map(u=>{
    const d = porUnidade[u];

/* 1. Garante DB.centrosCusto inicializado (com os 12 pré-configurados na primeira vez). */

}
/* 2. */ function ccPorCodigo(codigo){ return configCC().find(c=>c.codigo===codigo); }
/* 3. */ function ccAtivos(){ return configCC().filter(c=>c.ativo!==false); }
/* 4. Unidade-base (ZL/BL) a partir da Unidade de Negócio do lançamento. */
function unidadeBaseCC(l){

/* 6a. Mapa explícito Categoria → Centro de Custo, cobrindo TODAS as categorias de custos e

/* 6c. Sugestão automática de Centro de Custo com base na Unidade + Categoria do lançamento.
   Usa os mapas explícitos acima (6a/6b); para Bakery Line, a loja identificada pela Unidade
   do lançamento (BL-LOJA1/2/3) tem prioridade — exceto para categorias de Produção/Distribuição,
   que são sempre fábrica/logística centralizada, independentemente da loja de origem. */
function sugerirCC(l){
  const base = unidadeBaseCC(l);
  if(!base) return null;
  const cat = l.categoria||'';
  if(base==='ZL') return CATEGORIA_CC_ZOOMS_LODGE[cat] || 'ZL-ADMIN';
  const loja = lojaBakeryCC(l);
  const ccCategoria = CATEGORIA_CC_BAKERY_LINE[cat] || 'BL-ADMIN';
  if(ccCategoria==='BL-PROD' || ccCategoria==='BL-DIST') return ccCategoria;
  return loja || ccCategoria;
}
/* 7. Base de lançamentos (explodidos, sem categorias excluídas do Resultado) para um período. */
function lancamentosBaseCC(de, ate){
  let lista = explodirLancamentos(DB.lancamentos).filter(l=>!CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);
  return lista;
}
/* 8. Resumo (Receitas/Despesas/Resultado) por Centro de Custo, num período. */
function resumoPorCC(de, ate){
  const ccs = ccAtivos();
  const porCC = {};
  ccs.forEach(c=> porCC[c.codigo] = {receitas:0, despesas:0, resultado:0});
  let naoAlocadoReceitas=0, naoAlocadoDespesas=0;
  lancamentosBaseCC(de,ate).forEach(l=>{
    const valor = valorEmKZ(l);
    const aloc = (Array.isArray(l.alocacaoCC) && l.alocacaoCC.length) ? l.alocacaoCC : null;
    if(!aloc){
      if(l.tipo==='Receita') naoAlocadoReceitas += valor;
      else if(l.tipo==='Despesa') naoAlocadoDespesas += valor;
      return;
    }
    aloc.forEach(a=>{
      if(!porCC[a.cc]) return; // Centro de Custo inativo/removido — ignora na análise
      const parte = valor * (Number(a.pct)||0)/100;
      if(l.tipo==='Receita') porCC[a.cc].receitas += parte;
      else if(l.tipo==='Despesa') porCC[a.cc].despesas += parte;
    });
  });
  ccs.forEach(c=> porCC[c.codigo].resultado = porCC[c.codigo].receitas - porCC[c.codigo].despesas);
  return {porCC, naoAlocadoReceitas, naoAlocadoDespesas, ccs};
}
/* 9. Série mensal (Receitas/Despesas/Resultado + Variação vs mês anterior) para 1 Centro de Custo. */
function resumoMensalCC(codigoCC, de, ate){
  const meses = {};
  lancamentosBaseCC(de, ate).forEach(l=>{
    const aloc = Array.isArray(l.alocacaoCC) ? l.alocacaoCC.find(a=>a.cc===codigoCC) : null;
    if(!aloc) return;
    const mk = mesKey(l.data);
    meses[mk] = meses[mk] || {receitas:0, despesas:0};
    const parte = valorEmKZ(l) * (Number(aloc.pct)||0)/100;
    if(l.tipo==='Receita') meses[mk].receitas += parte;
    else if(l.tipo==='Despesa') meses[mk].despesas += parte;
  });
  const chaves = Object.keys(meses).sort();
  return chaves.map((mk,i)=>{
    const atual = meses[mk];
    const resultado = atual.receitas - atual.despesas;
    const anterior = i>0 ? meses[chaves[i-1]] : null;
    const resultadoAnterior = anterior ? (anterior.receitas-anterior.despesas) : null;
    const variacaoAbs = anterior!==null ? (resultado-resultadoAnterior) : null;
    const variacaoPct = (anterior!==null && resultadoAnterior) ? (variacaoAbs/Math.abs(resultadoAnterior))*100 : null;
    return {mes:mk, receitas:atual.receitas, despesas:atual.despesas, resultado, variacaoAbs, variacaoPct};
  });
}
/* ---------- 📊 Rentabilidade por Unidade/Produto (Dashboard) ----------
   Agrega o mesmo histórico já usado em Contabilidade Analítica / Centros de Custo, por
   Centro de Custo (granularidade de produto/serviço: Hospedagem, Restauração, Bar, cada
   loja da Bakery Line, etc.) — Receita, Despesas Diretas, Lucro e Margem%, comparado com
   o período anterior equivalente (tendência ↑/↓/→) e ordenado do mais para o menos
   lucrativo. Não altera nenhum lançamento nem Balanço/DRE. Para lançamentos ainda sem
   alocação manual (l.alocacaoCC), usa a mesma sugestão automática (sugerirCC) só para
   esta agregação, apenas para a visão do Dashboard ficar completa mesmo sem alocação
   feita à mão — não grava nada; para o detalhe exato/editável, ver 🎯 Centros de Custo. */
function periodoAnteriorEquivalente(de, ate){
  const fim = ate || hoje();
  const inicio = de || (fim.slice(0,7)+'-01');
  const msDia = 86400000;
  const dInicio = new Date(inicio+'T00:00:00');
  const dFim = new Date(fim+'T00:00:00');
  const dias = Math.max(1, Math.round((dFim-dInicio)/msDia)+1);
  const antFim = new Date(dInicio.getTime() - msDia);
  const antInicio = new Date(antFim.getTime() - (dias-1)*msDia);
  const iso = d => d.toISOString().slice(0,10);
  return { de: iso(antInicio), ate: iso(antFim) };
}
function calcularRentabilidadePorCC(de, ate){
  const ccs = ccAtivos();
  const porCC = {};
  ccs.forEach(c=> porCC[c.codigo] = {codigo:c.codigo, nome:c.nome, unidade:c.unidade, receitas:0, despesas:0});
  let naoAlocadoReceitas=0, naoAlocadoDespesas=0;
  lancamentosBaseCC(de,ate).forEach(l=>{
    const valor = valorEmKZ(l);
    let aloc = (Array.isArray(l.alocacaoCC) && l.alocacaoCC.length) ? l.alocacaoCC : null;
    if(!aloc){
      const sug = sugerirCC(l);
      aloc = sug ? [{cc:sug, pct:100}] : null;
    }
    if(!aloc){
      if(l.tipo==='Receita') naoAlocadoReceitas += valor; else if(l.tipo==='Despesa') naoAlocadoDespesas += valor;
      return;
    }
    aloc.forEach(a=>{
      if(!porCC[a.cc]) return;
      const parte = valor*(Number(a.pct)||0)/100;
      if(l.tipo==='Receita') porCC[a.cc].receitas += parte; else if(l.tipo==='Despesa') porCC[a.cc].despesas += parte;
    });
  });
  return {porCC, naoAlocadoReceitas, naoAlocadoDespesas};
}
function calcularRankingRentabilidade(de, ate){
  configCC();
  const atual = calcularRentabilidadePorCC(de, ate);
  const antPeriodo = periodoAnteriorEquivalente(de, ate);
  const anterior = calcularRentabilidadePorCC(antPeriodo.de, antPeriodo.ate);
  const linhas = Object.values(atual.porCC).map(c=>{
    const lucro = c.receitas - c.despesas;
    const margem = c.receitas>0 ? (lucro/c.receitas*100) : null;
    const ant = anterior.porCC[c.codigo];
    const lucroAnterior = ant ? (ant.receitas-ant.despesas) : 0;
    let tendencia = '→';
    if(lucro > lucroAnterior + 1) tendencia = '↑';
    else if(lucro < lucroAnterior - 1) tendencia = '↓';
    return {...c, lucro, margem, lucroAnterior, tendencia};
  }).filter(c=>c.receitas>0 || c.despesas>0)
    .sort((a,b)=>b.lucro-a.lucro);
  return {linhas, naoAlocadoReceitas:atual.naoAlocadoReceitas, naoAlocadoDespesas:atual.naoAlocadoDespesas, periodoAnterior:antPeriodo};
}

/* ---------- Metas por Unidade ----------
   Meta de lucro mensal por Centro de Custo (definida manualmente pelo utilizador em
   DB.metasUnidades), comparada com o Realizado do mês — reaproveitando exatamente o
   mesmo cálculo de lucro por CC já usado no Ranking de Rentabilidade
   (calcularRentabilidadePorCC). Não introduz nenhuma lógica financeira nova, só
   acompanha metas já definidas contra o resultado real. */
function calcularMetasUnidades(mesAno){
  configCC();
  const [ano, mes] = mesAno.split('-').map(Number);
  const de = `${mesAno}-01`;
  const ultimoDia = new Date(ano, mes, 0).getDate();
  const ate = `${mesAno}-${String(ultimoDia).padStart(2,'0')}`;
  const {porCC} = calcularRentabilidadePorCC(de, ate);
  const metas = DB.metasUnidades || {};
  const linhas = ccAtivos().map(cc=>{
    const dados = porCC[cc.codigo] || {receitas:0, despesas:0};
    const lucro = dados.receitas - dados.despesas;
    const meta = Number((metas[cc.codigo]||{})[mesAno] || 0);
    const pctCumprido = meta>0 ? (lucro/meta*100) : null;
    let status = 'sem-meta';
    if(meta>0){
      if(pctCumprido>=100) status = 'cumpriu';
      else if(pctCumprido>=80) status = 'perto';
      else status = 'abaixo';
    }
    return {codigo:cc.codigo, nome:cc.nome, unidade:cc.unidade, receitas:dados.receitas, despesas:dados.despesas, lucro, meta, pctCumprido, status};
  }).sort((a,b)=>{
    // ranking saudável: quem cumpre/está mais perto da meta primeiro; sem meta definida vai para o fim
    const pa = a.pctCumprido===null ? -Infinity : a.pctCumprido;
    const pb = b.pctCumprido===null ? -Infinity : b.pctCumprido;
    return pb-pa;
  });
  return {mesAno, de, ate, linhas};
}

function viewMetasUnidades(){
  if(!metasUnidadesMesAtivo) metasUnidadesMesAtivo = hoje().slice(0,7);
  const r = calcularMetasUnidades(metasUnidadesMesAtivo);
  const iconeStatus = {cumpriu:'✅', perto:'🟡', abaixo:'🔴', 'sem-meta':'⚪'};
  const textoStatus = {cumpriu:'Meta cumprida', perto:'Perto da meta (≥80%)', abaixo:'Abaixo da meta', 'sem-meta':'Sem meta definida'};
  const linhas = r.linhas.map(l=>`
    <tr>
      <td>${iconeStatus[l.status]} ${l.nome} <span class="note" style="display:inline;padding:1px 5px;">${l.unidade}</span></td>
      <td class="right">${fmt(l.lucro)}</td>
      <td class="right"><input type="number" step="1000" data-meta-cc="${l.codigo}" value="${l.meta||0}" style="width:120px;text-align:right;"></td>
      <td class="right ${l.pctCumprido===null?'':(l.pctCumprido>=100?'pos':'neg')}"><b>${l.pctCumprido===null?'—':l.pctCumprido.toFixed(0)+'%'}</b></td>
      <td>${textoStatus[l.status]}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="note">Nenhum Centro de Custo ativo. Configure em 🎯 Centros de Custo.</td></tr>`;

  const cumpriram = r.linhas.filter(l=>l.status==='cumpriu').length;
  const comMeta = r.linhas.filter(l=>l.meta>0).length;
  const top = r.linhas.find(l=>l.pctCumprido!==null);

  return `
  <h2>🎮 Metas por Unidade</h2>
  <p class="note">Defina uma meta de lucro mensal para cada Centro de Custo e acompanhe o cumprimento face ao Realizado do mês — calculado com a mesma lógica do 🎯 Ranking de Rentabilidade no Dashboard (Receitas − Despesas Diretas, por Centro de Custo). Um ranking saudável ajuda cada equipa a ver como está a controlar os custos, sem comparar diretamente o tamanho de cada unidade — cada uma compete contra a sua própria meta.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Mês</label><input type="month" id="metasMesSel" value="${r.mesAno}"></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">Unidades com meta definida</div><div class="val">${comMeta} / ${r.linhas.length}</div></div>
    <div class="card"><div class="lbl">Cumpriram a meta este mês</div><div class="val ${cumpriram>0?'pos':''}">${cumpriram}</div></div>
    ${top ? `<div class="card"><div class="lbl">🏆 Melhor desempenho vs. meta</div><div class="val">${top.nome}</div></div>` : ''}
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Centro de Custo</th><th class="right">Realizado (Lucro)</th><th class="right">Meta de Lucro (Kz)</th><th class="right">% Cumprido</th><th>Status</th></tr></thead>
    <tbody>${linhas}</tbody></table>
  </div>
  <div class="actions" style="margin-top:10px;">
    <button type="button" id="btnSalvarMetas">💾 Guardar Metas</button>
  </div>
  <p class="note" style="margin-top:10px;">As metas ficam guardadas por mês e por Centro de Custo — pode planear metas diferentes para meses futuros com antecedência. Deixe a meta em 0 para não acompanhar essa unidade.</p>`;
}


/* 10. Lançamentos por Alocar (migração) — Receitas/Despesas sem l.alocacaoCC, num período. */
function lancamentosSemAlocacaoCC(de, ate){
  let lista = DB.lancamentos.filter(l=>
    (l.tipo==='Receita'||l.tipo==='Despesa') &&
    !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) &&
    !(Array.isArray(l.alocacaoCC) && l.alocacaoCC.length));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);
  return lista.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
/* 11. Aplica alocação rápida (100% a um único Centro de Custo). */
async function aplicarAlocacaoCCRapida(id, codigoCC){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return;
  l.alocacaoCC = [{cc:codigoCC, pct:100}];
  logar('Alocação a Centro de Custo', `Lançamento de ${fmt(l.valor)} (${l.categoria||''}) alocado a ${codigoCC}.`);
  await saveDB(); toast('Alocado a '+codigoCC+'.'); render();
}
/* 12. Remove a alocação de um lançamento (volta a "Não Alocado"). */
async function removerAlocacaoCC(id){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return;
  delete l.alocacaoCC;
  logar('Alocação a Centro de Custo removida', `Lançamento de ${fmt(l.valor)} voltou a "Não Alocado".`);
  await saveDB(); toast('Alocação removida.'); render();
}
/* 13. Aplica a sugestão automática, em massa, a todos os lançamentos por alocar num período. */
async function aplicarTodasSugestoesCC(de, ate){
  const lista = lancamentosSemAlocacaoCC(de, ate);
  let n=0;
  lista.forEach(l=>{ const sug=sugerirCC(l); if(sug){ l.alocacaoCC=[{cc:sug, pct:100}]; n++; } });
  if(!n){ toast('Nenhuma sugestão disponível para os lançamentos pendentes (verifique a Unidade de Negócio dos lançamentos).'); return; }
  logar('Alocação automática em massa', `${n} lançamento(s) alocado(s) por sugestão automática de Centro de Custo.`);
  await saveDB(); toast(`${n} lançamento(s) alocado(s) automaticamente.`); render();
}
/* 14. Aplica uma divisão por vários Centros de Custo (percentuais devem somar 100%). */
async function aplicarAlocacaoCCMultipla(id, alocacoes){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return false;
  const soma = alocacoes.reduce((s,a)=>s+Number(a.pct||0),0);
  if(Math.abs(soma-100)>0.5){ toast(`A soma das percentagens deve ser 100% (atual: ${soma.toFixed(1)}%).`); return false; }
  l.alocacaoCC = alocacoes.filter(a=>Number(a.pct||0)>0);
  logar('Alocação a Centro de Custo (dividida)', `Lançamento de ${fmt(l.valor)} dividido por ${l.alocacaoCC.length} centro(s) de custo.`);
  await saveDB(); toast('Alocação guardada.');
  ccDividindoId = null; render();
  return true;
}

function bindCentrosCustoEvents(){
  document.querySelectorAll('[data-ccsub]').forEach(b=>b.onclick=()=>{ ccSubView = b.dataset.ccsub; ccDividindoId=null; render(); });

  const formNovoCC = document.getElementById('formNovoCC');
  if(formNovoCC) formNovoCC.onsubmit = async e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(formNovoCC).entries());
    const codigo = (f.codigo||'').trim().toUpperCase();
    if(!codigo || !f.nome){ toast('Preencha código e nome.'); return; }
    const ccs = configCC();
    if(ccs.some(c=>c.codigo===codigo)){ toast('Já existe um Centro de Custo com este código.'); return; }
    ccs.push({codigo, nome:f.nome.trim(), unidade:f.unidade||'', ativo:true});
    logar('Centro de Custo criado', `${codigo} — ${f.nome}`);
    await saveDB(); toast('Centro de Custo criado.'); render();
  };

  const btnGuardarCCGestao = document.getElementById('btnGuardarCCGestao');
  if(btnGuardarCCGestao) btnGuardarCCGestao.onclick = async ()=>{
    const ccs = configCC();
    document.querySelectorAll('[data-cc-nome]').forEach(inp=>{
      const c = ccs.find(x=>x.codigo===inp.dataset.ccNome); if(c && inp.value.trim()) c.nome = inp.value.trim();
    });
    document.querySelectorAll('[data-cc-ativo]').forEach(chk=>{
      const c = ccs.find(x=>x.codigo===chk.dataset.ccAtivo); if(c) c.ativo = chk.checked;
    });
    logar('Centros de Custo atualizados', `${ccs.filter(c=>c.ativo!==false).length} ativo(s) de ${ccs.length}.`);
    await saveDB(); toast('Alterações guardadas.'); render();
  };

  document.querySelectorAll('[data-cc-remover]').forEach(b=>b.onclick=async ()=>{
    const codigo = b.dataset.ccRemover;
    if(!confirm(`Remover o Centro de Custo ${codigo}? Lançamentos já alocados a ele passam a "Não Alocado" nas análises.`)) return;
    DB.centrosCusto = configCC().filter(c=>c.codigo!==codigo);
    logar('Centro de Custo removido', codigo);
    await saveDB(); toast('Centro de Custo removido.'); render();
  });

  const formFiltroCC = document.getElementById('formFiltroCC');
  if(formFiltroCC) formFiltroCC.onsubmit = e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(formFiltroCC).entries()); filtroCC={de:f.de||'', ate:f.ate||''}; render(); };
  const btnLimparFiltroCC = document.getElementById('btnLimparFiltroCC');

let ocEditandoId = null;
let ocStatusFiltro = 'Todos'; // Todos, Pendente, Aprovada, Rejeitada, Convertida

function calcularAprovacoesRequeridas(valor){
  const config = DB.config.aprovacoes;
  if(!config.ativaMultiNivel) return 1;
  /* Trata "maximo" em falta (ex.: o escalão "Acima de 500k Kz") como sem teto,
     em vez de deixar `valor <= undefined` (sempre falso) decidir por acaso via
     o fallback abaixo. Assim o resultado fica correto mesmo que os escalões
     configurados mudem ou percam a ordenação por maximo crescente. */
  const limite = config.limites.find(l => valor <= (l.maximo ?? Infinity));
  return limite ? limite.requerAprovacoes : 2;
}

/* ---------- PONTO 3: Detecção de Anomalias nos Lançamentos ----------
   Detecta valores anormalmente altos/baixos comparados à média histórica da categoria/fornecedor.
   Implementação simples (MVP): compara o valor estimado com a média de OCs anteriores da mesma categoria.
   Pode ser refinada depois com: desvio padrão, análise por fornecedor, períodos de tempo, etc. */
function detectarAnomalias(categoria, valor){
  if(!categoria || valor <= 0) return { temAnomalia: false, tipo: null, mensagem: '' };
  
  const ocsDamesmaCategoria = (DB.ordensCompra || [])
    .filter(o => o.categoria === categoria && o.estado !== 'Rejeitada' && Number(o.valorEstimado||0) > 0)
    .map(o => Number(o.valorEstimado || 0));
  
  if(ocsDamesmaCategoria.length < 3) 
    return { temAnomalia: false, tipo: null, mensagem: '(Poucos históricos para alertar — >3 OCs recomendado)' };
  
  const media = ocsDamesmaCategoria.reduce((a,b)=>a+b,0) / ocsDamesmaCategoria.length;
  const maxHistorico = Math.max(...ocsDamesmaCategoria);
  const minHistorico = Math.min(...ocsDamesmaCategoria);
  
  // Limites de detecção: 50% acima da média ou abaixo de 50% da média = alerta
  const limiteAlta = media * 1.5;
  const limiteBaixa = media * 0.5;
  
  if(valor > limiteAlta){
    const percentualAlta = Math.round(((valor - media) / media) * 100);
    return { 
      temAnomalia: true, 
      tipo: 'alta', 
      mensagem: `⚠️ VALOR ELEVADO: ${fmt(valor)} é ${percentualAlta}% acima da média histórica (${fmt(media)}) desta categoria.`,
      mediaHistorica: media,
      maxHistorico: maxHistorico,
      minHistorico: minHistorico
    };
  }
  
  if(valor < limiteBaixa && valor > 0){
    const percentualBaixa = Math.round(((media - valor) / media) * 100);
    return { 
      temAnomalia: true, 
      tipo: 'baixa', 
      mensagem: `ℹ️ VALOR REDUZIDO: ${fmt(valor)} é ${percentualBaixa}% abaixo da média histórica (${fmt(media)}) desta categoria.`,
      mediaHistorica: media,
      maxHistorico: maxHistorico,
      minHistorico: minHistorico
    };
  }
  
  return { temAnomalia: false, tipo: null, mensagem: '', mediaHistorica: media, maxHistorico: maxHistorico, minHistorico: minHistorico };
}

function criarOC(dados){
  const oc = {
    id: 'OC-'+hoje().replace(/-/g,'')+'-'+uid().substring(0,6).toUpperCase(),
    dataCriacao: new Date().toISOString(),
    solicitante: meuEmail || '',
    descricao: dados.descricao || '',
    quantidade: Number(dados.quantidade || 1),
    unidade: dados.unidade || 'unidade',
    valorEstimado: Number(dados.valorEstimado || 0),
    moeda: 'AKZ',
    centroCusto: dados.centroCusto || '',
    categoria: dados.categoria || '',
    estado: 'Pendente',
    dataAprovacao: null,
    aprovadoPor: null,
    motivoRejeicao: null,
    faturaLinkedId: null,
    notas: dados.notas || '',
    requerAprovacoes: calcularAprovacoesRequeridas(Number(dados.valorEstimado || 0)),
    aprovacoes: [],
    anomalia: detectarAnomalias(dados.categoria || '', Number(dados.valorEstimado || 0)),
    historico: [
      { quando: new Date().toISOString(), acao: 'Criada', por: meuEmail || '', detalhe: 'Ordem de Compra criada' }
    ]
  };
  return oc;
}

function atualizarEstadoOC(ocId, novoEstado, detalhes){
  const oc = DB.ordensCompra.find(o=>o.id===ocId);
  if(!oc) return false;
  const estadoAnterior = oc.estado;
  oc.estado = novoEstado;
  oc.historico.push({
    quando: new Date().toISOString(),
    acao: 'Estado Alterado',
    por: meuEmail || '',
    detalhe: `${estadoAnterior} → ${novoEstado}. ${detalhes || ''}`
  });
  return true;
}

function aprovarOC(ocId, nivelAprovacao){
  const oc = DB.ordensCompra.find(o=>o.id===ocId);
  if(!oc) return { ok:false, msg:'OC não encontrada' };
  if(!oc.aprovacoes) oc.aprovacoes = [];

  const config = DB.config.aprovacoes || {};
  const aprovadores = config.usuariosAprovadores || [];
  if(aprovadores.length && !aprovadores.includes(meuEmail)){
    return { ok:false, msg:'Não estás na lista de aprovadores autorizados (ver configuração em Ordens de Compra).' };
  }
  if(!config.permitirAutoAprovacao && oc.solicitante && oc.solicitante===meuEmail){
    return { ok:false, msg:'Não podes aprovar uma OC que tu próprio(a) criaste (auto-aprovação desativada).' };
  }

  const jaAprovouEsteNivel = oc.aprovacoes.find(a=>a.nivel===nivelAprovacao);
  if(jaAprovouEsteNivel && jaAprovouEsteNivel.status==='Aprovado')
    return { ok:false, msg:`Nível ${nivelAprovacao} já foi aprovado por ${jaAprovouEsteNivel.por}` };
  if(oc.aprovacoes.some(a=>a.status==='Aprovado' && a.por===meuEmail)){
    return { ok:false, msg:'Já aprovaste esta OC noutro nível — é necessária uma pessoa diferente em cada nível.' };
  }

  const aprovacao = {
    nivel: nivelAprovacao,
    status: 'Aprovado',
    por: meuEmail || '',
    quando: new Date().toISOString(),
    comentario: ''
  };
  oc.aprovacoes.push(aprovacao);
  
  const apenasAprovadas = oc.aprovacoes.filter(a=>a.status==='Aprovado').length;
  if(apenasAprovadas >= oc.requerAprovacoes){
    oc.estado = 'Aprovada';
    oc.dataAprovacao = new Date().toISOString();
    oc.aprovadoPor = meuEmail || '';
  } else {
    oc.estado = 'Aguarda 2ª Aprovação';
  }
  
  oc.historico.push({
    quando: new Date().toISOString(),
    acao: `Aprovação Nível ${nivelAprovacao}`,
    por: meuEmail || '',
    detalhe: `Aprovado por ${meuEmail}`
  });
  
  return { ok:true, msg:'OC aprovada com sucesso' };
}

function rejeitarOC(ocId, motivo){
  const oc = DB.ordensCompra.find(o=>o.id===ocId);
  if(!oc) return { ok:false, msg:'OC não encontrada' };

  /* Mesma regra de acesso que aprovarOC: se houver uma lista de aprovadores
     configurada, só quem lá está pode rejeitar. Antes desta correção, rejeitar
     não tinha qualquer verificação — bastava ter acesso à interface para
     travar uma OC, contornando por completo a configuração de aprovadores. */
  const config = DB.config.aprovacoes || {};
  const aprovadores = config.usuariosAprovadores || [];
  if(aprovadores.length && !aprovadores.includes(meuEmail)){
    return { ok:false, msg:'Não estás na lista de aprovadores autorizados (ver configuração em Ordens de Compra).' };
  }

  oc.estado = 'Rejeitada';
  oc.motivoRejeicao = motivo;
  oc.historico.push({
    quando: new Date().toISOString(),
    acao: 'Rejeitada',
    por: meuEmail || '',
    detalhe: motivo
  });
  return { ok:true };
}

/* Converte uma OC já Aprovada numa Conta a Pagar real, ligando as duas pela chave
   origemOCId — antes disso não existia nenhum caminho no código que levasse uma OC
   aprovada a gerar de facto uma Conta a Pagar; o filtro "Convertidas" ficava sempre vazio. */
function converterOCEmContaPagar(ocId, fornecedor, vencimento){
  const oc = DB.ordensCompra.find(o=>o.id===ocId);
  if(!oc) return { ok:false, msg:'OC não encontrada' };
  if(oc.estado!=='Aprovada') return { ok:false, msg:'Só é possível converter OCs já Aprovadas.' };
  const novaConta = {
    id: uid(),
    entidade: fornecedor || oc.descricao,
    descricao: oc.descricao,
    /* Antes ficava sempre com vencimento = hoje(), o que fazia a conta
       aparecer "em atraso" já no dia seguinte à conversão, independentemente
       do prazo de pagamento real combinado com o fornecedor. Agora aceita a
       data indicada e só recai em hoje() se nada for fornecido. */
    vencimento: vencimento || hoje(),
    valor: Number(oc.valorEstimado||0),
    valorPago: 0,
    status: 'Pendente',
    centroCusto: oc.centroCusto,
    origemOCId: oc.id
  };
  DB.contasPagar.push(novaConta);
  oc.estado = 'Convertida';
  oc.contaPagarId = novaConta.id;
  oc.historico.push({
    quando: new Date().toISOString(),
    acao: 'Convertida em Conta a Pagar',
    por: meuEmail || '',
    detalhe: `Conta a Pagar ${novaConta.id} criada (${fornecedor||'—'}).`
  });
  return { ok:true, contaPagarId: novaConta.id };
}

            const nivel = i+1;
            const aprovacao = (oc.aprovacoes||[]).find(a=>a.nivel===nivel);

            <div style="background:var(--linha-alt);padding:8px;border-radius:6px;text-align:center;">

          }).join('')}
        </div>
      </div>

      <div style="margin-top:16px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:8px;">Histórico:</div>
        <div style="max-height:200px;overflow-y:auto;font-size:12px;">
          ${(oc.historico||[]).map(h=>`
          <div style="padding:6px;border-bottom:1px solid var(--borda);"><strong>${h.acao}</strong> — ${(h.por||'').split('@')[0]} — ${h.quando.substring(0,10)} ${h.quando.substring(11,16)}<br>${h.detalhe||''}</div>
          `).join('')}

      </div>

      <div class="actions" style="margin-top:16px;">
        ${['Pendente','Aguarda 2ª Aprovação'].includes(oc.estado) ? `
          <button data-oc-aprovar-agora="${oc.id}">✅ Aprovar Nível ${(oc.aprovacoes||[]).filter(a=>a.status==='Aprovado').length+1}</button>
          <button class="danger" data-oc-rejeitar="${oc.id}">❌ Rejeitar</button>
        ` : ''}
        ${oc.estado==='Aprovada' ? `<button data-oc-converter="${oc.id}">🔄 Converter em Conta a Pagar</button>` : ''}
        <button class="sec" onclick="ocEditandoId=null;render();">← Fechar</button>
      </div>
    </div>
  </div>`;
}

  <h2 class="sub">Ordens de Compra Aguardando Aprovação</h2>
  ${ocs.length===0 ? `<p class="note" style="text-align:center;">✅ Não há OCs pendentes de aprovação</p>` : `
  <div class="tablewrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Descrição</th><th>Valor</th><th>Estado</th><th>Anomalia</th><th>Aprovações</th><th>Ação</th></tr>

      <tbody>
        ${ocs.map(oc=>`

            <td><small>${oc.id}</small></td>
            <td>${oc.descricao}</td>
            <td class="right">${fmt(oc.valorEstimado)}</td>
            <td><span class="badge pendente">${oc.estado}</span></td>
            <td>
              <small style="color:${(oc.anomalia && oc.anomalia.temAnomalia) ? 'var(--vermelho)' : 'var(--muted)'};">
                ${(oc.anomalia && oc.anomalia.temAnomalia) ? `⚠️ ${oc.anomalia.tipo === 'alta' ? '↑ Elevado' : '↓ Reduzido'}` : '—'}
              </small>
            </td>
            <td>
              <small>
                Requer: ${oc.requerAprovacoes} 
                | Recebido: ${(oc.aprovacoes||[]).filter(a=>a.status==='Aprovado').length}
              </small>
            </td>
            <td>
              <button class="danger" data-oc-aprovar="${oc.id}" style="font-size:11px;padding:4px 8px;">✅ Aprovar</button>

      </tbody>

  <p class="note" style="margin-top:16px;">ℹ️ Este módulo trata apenas de aprovações de Ordens de Compra. Contas a Pagar não têm, para já, um fluxo de aprovação próprio — são geridas diretamente em 💳 Contas a Pagar.</p>`;

  return html;
}

/* ---------- Eventos ---------- */
function bindEvents(){
  /* Barra genérica de Filtro por Período/Posto + Exportar/Imprimir (todos os módulos registados em MODULOS_FILTRO) */
  bindBarraFiltroModulo();

  /* 🤖 Pergunte à Tesouraria — assistente de padrões de pergunta (sem API externa) */
  const formAssistente = document.getElementById('formAssistentePergunta');
  if(formAssistente) formAssistente.onsubmit = e=>{
    e.preventDefault();
    const inputEl = document.getElementById('assistentePerguntaInput');
    const texto = (inputEl.value||'').trim();
    if(!texto) return;
    const r = responderPerguntaTesouraria(texto);
    historicoAssistente.push({pergunta: texto, resposta: r.resposta, tab: r.tab||null});
    if(historicoAssistente.length>50) historicoAssistente = historicoAssistente.slice(-50);
    render();
    setTimeout(()=>{
      const conv = document.getElementById('assistenteConversa');
      if(conv) conv.scrollTop = conv.scrollHeight;
      const inp = document.getElementById('assistentePerguntaInput');
      if(inp) inp.focus();
    },0);
  };
  const btnAssistenteLimpar = document.getElementById('btnAssistenteLimpar');
  if(btnAssistenteLimpar) btnAssistenteLimpar.onclick = ()=>{ historicoAssistente=[]; render(); };
  document.querySelectorAll('[data-assistente-ir]').forEach(a=>a.onclick=(ev)=>{ ev.preventDefault(); currentTab=a.dataset.assistenteIr; render(); });

  /* Relatório de Impacto de Neutralizações — filtro de Ano */
  const impactoAnoSel = document.getElementById('impactoAnoSel');
  if(impactoAnoSel) impactoAnoSel.onchange = ()=>{ filtroImpactoAno = impactoAnoSel.value; render(); };

  /* Reconciliação SAF-T vs Caixa — expandir/colapsar detalhe de cada linha (clicável) e
     guardar a observação/justificação de uma divergência (persistida em DB.reconciliacaoObservacoes). */
  document.querySelectorAll('[data-recrow]').forEach(tr=>tr.onclick=(ev)=>{
    if(ev.target.closest('input,button')) return;
    const det = document.querySelector(`[data-recdetail="${CSS.escape(tr.dataset.recrow)}"]`);
    if(det) det.style.display = det.style.display==='none' ? '' : 'none';
  });
  document.querySelectorAll('[data-recobs-salvar]').forEach(b=>b.onclick=async(ev)=>{
    ev.stopPropagation();
    const chave = b.dataset.recobsSalvar;
    const inputEl = document.querySelector(`[data-recobs="${CSS.escape(chave)}"]`);
    DB.reconciliacaoObservacoes = DB.reconciliacaoObservacoes || {};
    const texto = (inputEl && inputEl.value || '').trim();
    if(texto) DB.reconciliacaoObservacoes[chave] = texto; else delete DB.reconciliacaoObservacoes[chave];
    await saveDB(); toast('Observação guardada.'); render();
  });

  /* Contabilidade Analítica — configuração de rateio, filtro de período, exportar/imprimir */
  const formAnaliticaConfig = document.getElementById('formAnaliticaConfig');
  if(formAnaliticaConfig) formAnaliticaConfig.onsubmit = async e=>{
    e.preventDefault();
    const novoRateio = {};
    document.querySelectorAll('[data-analitica-rateio]').forEach(inp=>{
      novoRateio[inp.dataset.analiticaRateio] = Number(inp.value||0);
    });
    const novasCategorias = [];
    document.querySelectorAll('[data-analitica-cat]').forEach(chk=>{
      if(chk.checked) novasCategorias.push(chk.dataset.analiticaCat);
    });
    DB.analitica = {rateio:novoRateio, categoriasIndiretas:novasCategorias};
    logar('Configuração de Rateio Analítico atualizada', `${novasCategorias.length} categoria(s) indireta(s) — soma do rateio: ${UNIDADES_RATEIO.reduce((s,u)=>s+Number(novoRateio[u]||0),0).toFixed(2)}%`);
    await saveDB(); toast('Configuração guardada.'); render();
  };
  const formFiltroAnalitica = document.getElementById('formFiltroAnalitica');
  if(formFiltroAnalitica) formFiltroAnalitica.onsubmit = e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(formFiltroAnalitica).entries());
    filtroAnalitica = {de:f.de||'', ate:f.ate||''};
    render();
  };
  const btnLimparFiltroAnalitica = document.getElementById('btnLimparFiltroAnalitica');
  if(btnLimparFiltroAnalitica) btnLimparFiltroAnalitica.onclick = ()=>{ filtroAnalitica={de:'',ate:''}; render(); };
  const btnExportarAnalitica = document.getElementById('btnExportarAnalitica');
  if(btnExportarAnalitica) btnExportarAnalitica.onclick = ()=>{
    if(!ultimoAnalitica) return;
    exportarExcel('contabilidade-analitica','Analítica', ultimoAnalitica.cabecalhos, ultimoAnalitica.linhas);
  };
  const btnImprimirAnalitica = document.getElementById('btnImprimirAnalitica');
  if(btnImprimirAnalitica) btnImprimirAnalitica.onclick = ()=>{
    if(!ultimoAnalitica) return;
    imprimirRelatorioGenerico('Contabilidade Analítica — Resultado por Centro de Custo', `Período: ${ultimoAnalitica.periodo}.`,
      ultimoAnalitica.cabecalhos, ultimoAnalitica.linhas.map(l=>[l[0],fmt(l[1]),fmt(l[2]),fmt(l[3]),fmt(l[4])]));
  };

  /* Centros de Custo — módulo de contabilidade analítica avançada (alocação detalhada) */
  bindCentrosCustoEvents();

  /* Balanço Patrimonial — Exportar/Imprimir do snapshot atual (ultimoBalanco, calculado em viewBalanco) */

    if(!secoes.length){ toast('Preencha pelo menos uma secção antes de imprimir.'); return; }
    const corpo = secoes.map(s=>`<h3 class="print-section-title">${s.titulo}</h3><p style="font-size:13px;white-space:pre-wrap;margin:0 0 14px;">${xmlEsc(s.texto)}</p>`).join('');

      </div>
      <p class="print-subtitle">Exercício de ${anoRef} — anexo explicativo ao Balanço Patrimonial e à Demonstração de Resultados.</p>
      ${corpo}`);
  };

  /* IVA e Retenções — Exportar/Imprimir do apuramento mensal do ano corrente */
  const btnExportarIVA = document.getElementById('btnExportarIVA');

      dadosMensais.map(d=>[d.mes,d.liquidado,d.dedutivel,d.apurado,d.acumulado]));

  const btnImprimirIVA = document.getElementById('btnImprimirIVA');
  if(btnImprimirIVA) btnImprimirIVA.onclick=()=>{
    const {c, ano, dadosMensais} = exportarIVAAtual();

      dadosMensais.map(d=>[d.mes,fmt(d.liquidado),fmt(d.dedutivel),fmt(d.apurado),fmt(d.acumulado)]));
  };

  /* Fluxo de Caixa — Exportar/Imprimir do ano selecionado (ultimoFluxoCaixa, calculado em viewFluxoCaixa) */
  const btnExportarFluxoCaixa = document.getElementById('btnExportarFluxoCaixa');

  /* Existências e CMV — Exportar/Imprimir do ano corrente (ultimoExistencias) */

  if(btnExportarExistencias) btnExportarExistencias.onclick=()=>{
