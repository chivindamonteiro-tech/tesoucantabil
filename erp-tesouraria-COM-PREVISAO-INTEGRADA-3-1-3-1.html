  };

  /* SAF-T (Facturação) — Exportar/Imprimir da lista de faturas do mês (ultimoSaft), à parte do .xml */
  const btnExportarSaftExcel = document.getElementById('btnExportarSaftExcel');
  if(btnExportarSaftExcel) btnExportarSaftExcel.onclick=()=>{
    if(!ultimoSaft) return;
    exportarExcel(`saft-faturas-${ultimoSaft.ano}-${String(ultimoSaft.mes).padStart(2,'0')}`,'Faturas',['Nº Fatura','Data','Cliente','NIF','Valor'],ultimoSaft.linhas);
  };
  const btnImprimirSaft = document.getElementById('btnImprimirSaft');
  if(btnImprimirSaft) btnImprimirSaft.onclick=()=>{
    if(!ultimoSaft) return;
    imprimirRelatorioGenerico(`Faturas de Venda — ${MESES[ultimoSaft.mes-1]}/${ultimoSaft.ano}`, 'Base do ficheiro SAF-T deste período.', ['Nº Fatura','Data','Cliente','NIF','Valor'], ultimoSaft.linhas.map(l=>[l[0],l[1],l[2],l[3],fmt(l[4])]));
  };
  const btnExportarSaftComprasExcel = document.getElementById('btnExportarSaftComprasExcel');
  if(btnExportarSaftComprasExcel) btnExportarSaftComprasExcel.onclick=()=>{
    if(!ultimoSaftCompras) return;
    exportarExcel(`saft-compras-${ultimoSaftCompras.ano}-${String(ultimoSaftCompras.mes).padStart(2,'0')}`,'Compras',['Nº Fatura','Data','Fornecedor','NIF','Valor'],ultimoSaftCompras.linhas);
  };
  const btnImprimirSaftCompras = document.getElementById('btnImprimirSaftCompras');
  if(btnImprimirSaftCompras) btnImprimirSaftCompras.onclick=()=>{
    if(!ultimoSaftCompras) return;
    imprimirRelatorioGenerico(`Faturas de Compra/Despesa — ${MESES[ultimoSaftCompras.mes-1]}/${ultimoSaftCompras.ano}`, 'Base do ficheiro SAF-T de Compras deste período (registo interno).', ['Nº Fatura','Data','Fornecedor','NIF','Valor'], ultimoSaftCompras.linhas.map(l=>[l[0],l[1],l[2],l[3],fmt(l[4])]));
  };

  /* Plano de Tesouraria — Exportar/Imprimir (ultimoPlanoTesouraria) */
  const btnExportarPlanoTesouraria = document.getElementById('btnExportarPlanoTesouraria');
  if(btnExportarPlanoTesouraria) btnExportarPlanoTesouraria.onclick=()=>{
    if(!ultimoPlanoTesouraria) return;
    exportarExcel('plano-tesouraria-'+ultimoPlanoTesouraria.ano,'Receitas',ultimoPlanoTesouraria.cabecalhos,ultimoPlanoTesouraria.linhasReceitas);
  };
  const btnImprimirPlanoTesouraria = document.getElementById('btnImprimirPlanoTesouraria');
  if(btnImprimirPlanoTesouraria) btnImprimirPlanoTesouraria.onclick=()=>{
    if(!ultimoPlanoTesouraria) return;
    imprimirRelatorioGenerico(`Plano de Tesouraria ${ultimoPlanoTesouraria.ano} — Receitas`, 'Créditos/Receitas por conta.', ultimoPlanoTesouraria.cabecalhos, ultimoPlanoTesouraria.linhasReceitas.map(l=>l.map((v,i)=>i===0?v:fmt(v))));
  };

  /* FaturaBot */
  const fbForn = document.getElementById('fbFornecedor');
  const ffb=document.getElementById('formFaturabot');
  const fbItensContainer = document.getElementById('fbItensContainer');

  /* Itens do formulário de NOVA fatura ficam numa lista em memória (fbItensFormulario),
     re-renderizada dentro do container sempre que muda — assim suportamos várias
     categorias de despesa na mesma fatura antes mesmo de ela existir em DB.faturabot. */
  const renderItensFormulario = ()=>{
    if(!fbItensContainer) return;
    fbItensContainer.innerHTML = fbItensFormulario.map((it,idx)=>`
      <div class="grid" style="grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end;margin-bottom:6px;">
        <div><label>Descrição do item</label><input data-fbf-campo="${idx}:descricao" value="${xmlEsc(it.descricao||'')}" placeholder="Ex.: cimento, combustível..."></div>
        <div><label>Valor</label><input type="number" step="0.01" data-fbf-campo="${idx}:valor" value="${it.valor||''}"></div>
        <div><label>Categoria</label><select data-fbf-campo="${idx}:categoria">${optsCategorias(it.categoria,'despesa')}</select></div>
        <div>${fbItensFormulario.length>1 ? `<button type="button" data-fbf-remover="${idx}">Remover</button>` : ''}</div>
      </div>`).join('');
    fbItensContainer.querySelectorAll('[data-fbf-campo]').forEach(el=>{
      const [idx,campo] = el.dataset.fbfCampo.split(':');
      el.onchange = ()=>{ fbItensFormulario[idx][campo] = el.value; if(campo==='valor') atualizarTotalFormulario(); };
    });
    fbItensContainer.querySelectorAll('[data-fbf-remover]').forEach(b=>b.onclick=()=>{
      fbItensFormulario.splice(Number(b.dataset.fbfRemover),1); renderItensFormulario(); atualizarTotalFormulario();
    });
    atualizarTotalFormulario();
  };
  const atualizarTotalFormulario = ()=>{
    const total = fbItensFormulario.reduce((s,i)=>s+(Number(i.valor)||0),0);
    const span = document.getElementById('fbTotalItens');
    if(span) span.textContent = fmt(total);
  };
  if(fbItensContainer){
    if(fbItensFormulario.length===0) fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  }
  const fbAddItemBtn = document.getElementById('fbAddItem');
  if(fbAddItemBtn) fbAddItemBtn.onclick = ()=>{
    fbItensFormulario.push({descricao:'', valor:'', categoria:CATEGORIAS[0]});
    renderItensFormulario();
  };

  if(fbForn) fbForn.oninput=()=>{
    const sug = faturabotSugestao(fbForn.value, '');
    const tag = document.getElementById('fbSugestaoTag');
    if(sug && fbItensFormulario[0]){
      fbItensFormulario[0].categoria = sug.categoria;
      if(sug.conta && ffb && ffb.elements.conta) ffb.elements.conta.value = sug.conta;
      renderItensFormulario();
      tag.textContent = `— 1º item sugerido (${sug.origemSugestao})`;
    } else if(tag) tag.textContent = '';
  };
  const fbNifEl = document.getElementById('fbNif');
  if(fbNifEl) fbNifEl.oninput=()=>{
    const tag = document.getElementById('fbNifTag');
    if(!tag) return;
    const v = validarNIF(fbNifEl.value);
    if(!fbNifEl.value.trim()){ tag.textContent=''; return; }
    tag.textContent = (v.valido===true?'✅ ':v.valido===null?'⚠️ ':'❌ ') + v.mensagem + (v.tipo?` (${v.tipo})`:'');
    tag.style.color = v.valido===true?'green':(v.valido===null?'#b8860b':'#b00');
  };

  const fbArquivo=document.getElementById('fbArquivo');
  if(fbArquivo) fbArquivo.onchange=async()=>{
    const arquivo = fbArquivo.files[0];
    if(!arquivo || !ffb) return;
    const tag = document.getElementById('fbOcrTag');
    const leitor = new FileReader();
    leitor.onload = async()=>{
      const dataUrl = leitor.result;
      const base64 = dataUrl.split(',')[1];
      if(tag) tag.textContent = '🔍 A ler o documento com IA...';
      try{
        if(!supa) throw new Error('sem Supabase');
        const { data, error } = await supa.functions.invoke('faturabot-ocr', { body:{ imageBase64: base64, mediaType: arquivo.type || 'image/jpeg' } });
        if(error) throw error;
        if(data && data.ok && data.campos){
          const c = data.campos;
          const set=(campo,val)=>{ if(val!==undefined && val!==null && val!=='' && ffb.elements[campo]) ffb.elements[campo].value = val; };
          set('fornecedor', c.fornecedor); set('nif', c.nif); set('nFatura', c.nFatura);
          set('data', c.data); set('vencimento', c.vencimento);
          set('moeda', c.moeda); set('iva', c.iva); set('taxaIVA', c.taxaIVA);
          /* A IA pode devolver "itens" (várias despesas na mesma fatura) ou só um valor/descrição total.
             A conta/forma de pagamento é sempre uma só, ao nível da fatura. */
          const sugConta = faturabotSugestao(c.fornecedor, '');
          if(sugConta && sugConta.conta && ffb.elements.conta) ffb.elements.conta.value = sugConta.conta;
          if(Array.isArray(c.itens) && c.itens.length){
            fbItensFormulario.length = 0;
            c.itens.forEach(it=>{
              const sug = faturabotSugestao(c.fornecedor, it.descricao) || {};
              fbItensFormulario.push({descricao:it.descricao||'', valor:it.valor||'', categoria:it.categoriaSugerida||sug.categoria||CATEGORIAS[0]});
            });
          } else if(c.valor){
            fbItensFormulario.length = 0;
            fbItensFormulario.push({descricao:c.descricao||'', valor:c.valor, categoria:CATEGORIAS[0]});
          }
          renderItensFormulario();
          if(fbForn) fbForn.oninput();
          if(tag) tag.textContent = '✅ Documento lido pela IA — confira os campos e itens antes de enviar.';
          toast('Documento lido automaticamente. Confira os campos.');
        } else {
          if(tag) tag.textContent = '⚠️ Não consegui ler automaticamente — preencha os campos manualmente.';
        }
      }catch(e){
        console.warn('OCR indisponível', e);
        if(tag) tag.textContent = '⚠️ Leitura automática indisponível (serviço OCR não ligado) — preencha os campos manualmente.';
      }
    };
    leitor.readAsDataURL(arquivo);
  };

  /* Importação em Lote (CSV/Excel) — cria uma fatura "Pendente" por linha válida,
     mesma lógica de leitura de colunas do Extrato Bancário. Não substitui a aprovação:
     cada linha ainda passa por "✅ Aprovar" antes de gerar o Lançamento. */
  const fbArquivoCSV = document.getElementById('fbArquivoCSV');
  if(fbArquivoCSV) fbArquivoCSV.onchange = async ()=>{
    const arquivo = fbArquivoCSV.files[0];
    if(!arquivo) return;
    const tag = document.getElementById('fbImportTag');
    if(tag) tag.textContent = '📄 A ler o ficheiro...';
    try{
      let faturas = [];
      if(/\.(xlsx|xls)$/i.test(arquivo.name)){
        const buffer = await arquivo.arrayBuffer();
        if(typeof XLSX==='undefined') throw new Error('Biblioteca de Excel não carregada');
        faturas = parseXLSXFaturaBot(buffer);
      } else {
        const texto = await arquivo.text();
        faturas = parseCSVFaturaBot(texto);
      }
      if(!faturas.length){
        if(tag) tag.textContent = '⚠️ Não consegui identificar linhas de Fornecedor/Data/Valor no ficheiro — confirme o formato e o cabeçalho das colunas.';
        return;
      }
      let importadas = 0, ignoradasDuplicadas = 0;
      faturas.forEach(row=>{
        const dup = DB.faturabot.some(x=>x.fornecedor===row.fornecedor && x.nFatura===row.nFatura && Number(x.valor)===Number(row.valor) && row.nFatura);
        if(dup){ ignoradasDuplicadas++; return; }
        const sug = faturabotSugestao(row.fornecedor, row.descricao) || {};
        const formaPagamento = FORMAS_PAGAMENTO.find(f=>f.toLowerCase()===row.formaPagamento.toLowerCase()) || 'Cash';
        const conta = 'CASH'; // conta por defeito na importação em lote — revista e corrigida manualmente abaixo
        const novo = {
          id: uid(), fornecedor: row.fornecedor, nif: row.nif, nFatura: row.nFatura,
          data: row.data, vencimento:'', moeda: row.moeda||'KZ',
          conta, formaPagamento,
          iva:'Não', taxaIVA:0, unidade: row.unidade||'',
          itens:[{descricao: row.descricao||row.fornecedor, valor: row.valor, categoria: row.categoria||sug.categoria||CATEGORIAS[0]}],
          valor: row.valor,
          origem: origemAutomatica(row.unidade||'', formaPagamento),
          criado: new Date().toISOString(), status:'Pendente',
        };
        DB.faturabot.push(novo);
        importadas++;
      });
      logar('FaturaBot: importação em lote (CSV/Excel)', `${importadas} fatura(s) importada(s)${ignoradasDuplicadas?`, ${ignoradasDuplicadas} ignorada(s) por duplicado`:''}`);
      await saveDB();
      if(tag) tag.textContent = `✅ ${importadas} fatura(s) importada(s) como Pendente${ignoradasDuplicadas?` — ${ignoradasDuplicadas} ignorada(s) por parecer duplicado (mesmo Fornecedor + Nº Fatura + Valor)`:''}. Reveja e aprove abaixo.`;
      toast(`${importadas} fatura(s) importada(s) para o FaturaBot.`);
      render();
    }catch(e){
      console.warn('Erro a importar faturas em lote', e);
      if(tag) tag.textContent = '⚠️ Não consegui ler este ficheiro — confirme se é um CSV ou Excel válido.';
    }
  };

  if(ffb) ffb.onsubmit=async e=>{
    e.preventDefault();
    const arquivo = document.getElementById('fbArquivo').files[0];
    const novo = Object.fromEntries(new FormData(ffb).entries());
    novo.taxaIVA = Number(novo.taxaIVA||0);
    novo.origem = origemAutomatica(novo.unidade, novo.formaPagamento);
    /* A Conta é a que estiver selecionada no formulário (fbConta) — trava sozinha em
       CAIXA TESOURARIA apenas quando a Forma de Pagamento é "Cash" (ver travarContaCash);
       para TPA/Banco/Transferência/M.Express, o utilizador escolhe a conta bancária real
       de onde a despesa está a sair (ou fica pré-preenchida pelo padrão configurado). */
    novo.itens = fbItensFormulario.map(it=>({descricao:it.descricao||'', valor:Number(it.valor)||0, categoria:it.categoria}));
    novo.valor = novo.itens.reduce((s,i)=>s+i.valor,0);
    if(!novo.valor){ toast('Preencha o valor de pelo menos um item da fatura.'); return; }
    novo.id=uid(); novo.criado=new Date().toISOString(); novo.status='Pendente';
    const gravar=async()=>{
      DB.faturabot.push(novo);
      logar('FaturaBot: fatura recebida', `${xmlEsc(novo.fornecedor)} — ${fmt(novo.valor)} ${novo.moeda} (${novo.itens.length} item(ns))`);
      await saveDB(); toast('Fatura enviada para o FaturaBot — aguardando aprovação.'); ffb.reset();
      fbItensFormulario.length = 0; render();
    };
    if(arquivo){
      const leitor = new FileReader();
      leitor.onload = async()=>{ novo.anexoNome = arquivo.name; novo.anexoBase64 = leitor.result; await gravar(); };
      leitor.readAsDataURL(arquivo);
    } else await gravar();
  };
  document.querySelectorAll('[data-fb-campo]').forEach(el=>el.onchange=async()=>{
    const [id,campo]=el.dataset.fbCampo.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(f){ f[campo]=el.value; await saveDB(); }
  });
  document.querySelectorAll('[data-fb-toggle-itens]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.fbToggleItens;
    if(fbItensAbertos.has(id)) fbItensAbertos.delete(id); else fbItensAbertos.add(id);
    render();
  });
  document.querySelectorAll('[data-fb-item-campo]').forEach(el=>{
    const handler = async()=>{
      const [id,idx,campo] = el.dataset.fbItemCampo.split(':');
      const f = DB.faturabot.find(x=>x.id===id);
      if(!f) return;
      const itens = faturabotGetItens(f);
      itens[idx][campo] = campo==='valor' ? Number(el.value)||0 : el.value;
      f.itens = itens; f.valor = faturabotTotalItens(f);
      await saveDB(); render();
    };
    el.onchange = handler;
  });
  document.querySelectorAll('[data-fb-item-add]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbItemAdd);
    if(!f) return;
    const itens = faturabotGetItens(f);
    itens.push({descricao:'', valor:0, categoria:CATEGORIAS[0]});
    f.itens = itens; f.valor = faturabotTotalItens(f);
    await saveDB(); render();
  });
  document.querySelectorAll('[data-fb-item-remover]').forEach(b=>b.onclick=async()=>{
    const [id,idx] = b.dataset.fbItemRemover.split(':');
    const f = DB.faturabot.find(x=>x.id===id);
    if(!f) return;
    const itens = faturabotGetItens(f);
    if(itens.length<=1){ toast('A fatura precisa de pelo menos um item.'); return; }
    itens.splice(Number(idx),1);
    f.itens = itens; f.valor = faturabotTotalItens(f);
    await saveDB(); render();
  });
  document.querySelectorAll('[data-fb-aprovar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbAprovar);
    if(!f) return;
    const alertas = faturabotValidar(f);
    if(alertas.length && !confirm('Esta fatura tem alertas de validação:\n\n'+alertas.join('\n')+'\n\nAprovar mesmo assim?')) return;
    f.status='Aprovado';
    const itens = faturabotGetItens(f);
    const total = faturabotTotalItens(f);
    /* Um único Lançamento por fatura — é um único movimento de uma só conta.
       Com uma categoria só, o lançamento fica nessa categoria normalmente.
       Com várias categorias, o lançamento fica marcado como "DIVERSOS" e
       carrega o detalhe por categoria em itensDetalhe — os relatórios por
       categoria (Resumo Mensal, Orçamento, DRE) usam esse detalhe (via
       explodirLancamentos) para contar cada parte certa, sem fragmentar
       a Tesouraria em várias saídas de dinheiro para a mesma fatura. */
    const multiCategoria = itens.length>1;
    const lanc = {id:uid(), data:f.data, tipo:'Despesa', origem:f.origem||'', conta:f.conta, formaPagamento:f.formaPagamento||'',
      entidade:f.fornecedor, nif:f.nif||'', nFatura:f.nFatura, valor:total, moeda:f.moeda, iva:f.iva, taxaIVA:f.taxaIVA,
      categoria: multiCategoria ? CATEGORIA_DIVERSOS : itens[0].categoria,
      descricao: multiCategoria ? (f.descricao || `FaturaBot: ${xmlEsc(f.fornecedor)} (${itens.length} categorias)`) : (itens[0].descricao || f.descricao || `FaturaBot: ${xmlEsc(f.fornecedor)}`)};
    if(multiCategoria) lanc.itensDetalhe = itens.map(it=>({descricao:it.descricao, valor:it.valor, categoria:it.categoria}));
    DB.lancamentos.push(lanc);
    if(f.vencimento){
      DB.contasPagar.push({id:uid(), entidade:f.fornecedor, descricao:f.descricao||f.nFatura||'', vencimento:f.vencimento, valor:total, status:'Pendente'});
    }
    faturabotAprender(f);
    logar('FaturaBot: fatura aprovada e integrada', `${xmlEsc(f.fornecedor)} — ${fmt(total)} ${f.moeda}${multiCategoria?` (${itens.length} categorias — 1 lançamento)`:''} → Lançamentos${f.vencimento?' + Contas a Pagar':''}`);
    await saveDB(); toast('Fatura aprovada e integrada em Lançamentos.'); render();
  });
  document.querySelectorAll('[data-fb-rejeitar]').forEach(b=>b.onclick=async()=>{
    const f = DB.faturabot.find(x=>x.id===b.dataset.fbRejeitar);
    if(f){ f.status='Rejeitado'; logar('FaturaBot: fatura rejeitada', `${xmlEsc(f.fornecedor)} — ${fmt(faturabotTotalItens(f))} ${f.moeda}`); await saveDB(); render(); }
  });
  document.querySelectorAll('[data-fb-apagar]').forEach(b=>b.onclick=async()=>{
    DB.faturabot = DB.faturabot.filter(x=>x.id!==b.dataset.fbApagar); await saveDB(); render();
  });

  document.querySelectorAll('main [data-tab]').forEach(el=>el.onclick=()=>{ currentTab=el.dataset.tab; render(); });

  const formFC = document.getElementById('formFechoCaixaDeclarado');
  if(formFC) formFC.onsubmit = async(e)=>{
    e.preventDefault();
    const fd = new FormData(formFC);
    const novo = {
      id: uid(),
      data: fd.get('data'),
      unidade: fd.get('unidade')||'',
      turno: fd.get('turno')||'',
      operador: meuEmail||'',
      valorContado: Number(fd.get('valorContado')||0),
      moeda: fd.get('moeda')||'KZ',
      observacao: fd.get('observacao')||'',
      criadoEm: new Date().toISOString()
    };
    DB.fechosCaixa.push(novo);
    logar('Fecho de Caixa declarado', `${novo.data} — ${novo.unidade||'s/ unidade'}${novo.turno?' — turno '+novo.turno:''} — ${fmt(novo.valorContado)} ${novo.moeda} (por ${novo.operador})`);
    await saveDB();
    toast('Fecho de caixa declarado. Obrigado!');
    render();
  };

  ['divisaoData','divisaoUnidade','divisaoTurno','divisaoEntidade','divisaoNif','divisaoDescricao','divisaoIva','divisaoTaxaIVA','divisaoValorTotal'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      const campo = id.replace('divisao','');
      const chave = campo.charAt(0).toLowerCase()+campo.slice(1);
      if(chave==='data') divisaoData = el.value;
      else if(chave==='unidade') divisaoUnidade = el.value;
      else if(chave==='turno') divisaoTurno = el.value;
      else if(chave==='entidade') divisaoEntidade = el.value;
      else if(chave==='nif') divisaoNif = el.value;
      else if(chave==='descricao') divisaoDescricao = el.value;
      else if(chave==='iva') divisaoIva = el.value;
      else if(chave==='taxaIVA') divisaoTaxaIVA = el.value;
      else if(chave==='valorTotal') divisaoValorTotal = el.value;
      render();
    };
  });
  document.querySelectorAll('[data-div-idx]').forEach(el=>el.onchange=()=>{
    const idx = Number(el.dataset.divIdx);
    const campo = el.dataset.divCampo;
    if(!divisaoPagamento[idx]) return;
    divisaoPagamento[idx][campo] = el.value;
    /* Ao mudar a Forma de Pagamento desta linha para Cash, trava a Conta na Caixa
       Tesouraria; para as restantes formas, a Conta é sempre escolhida manualmente
       pelo utilizador (sem pré-preenchimento automático). */
    if(campo==='forma'){
      if(el.value==='Cash') divisaoPagamento[idx].conta = 'CASH';
    }
    render();
  });
  document.querySelectorAll('[data-div-remover]').forEach(b=>b.onclick=()=>{
    const idx = Number(b.dataset.divRemover);
    divisaoPagamento.splice(idx,1);
    render();
  });
  document.querySelectorAll('[data-lancsub]').forEach(b=>b.onclick=()=>{
    lancSubView = b.dataset.lancsub; render();
  });

      const jaJustificado = (s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
      const jaDevolvido = (s.devolucoes||[]).reduce((t,d)=>t+Number(d.valor||0),0);
      const saldoDisp = Number(s.valor||0) - jaJustificado - jaDevolvido;

  /* Caixa Tesouraria: caixa geral único que espelha o dinheiro em NUMERÁRIO de ambas as

     - A Conta fica travada em CAIXA TESOURARIA (CASH) apenas quando a Forma de Pagamento
       é "Cash".
     - Para as restantes formas (Banco, TPA, Multicaixa Express, Transferência Bancária) —
       em Receita OU Despesa — a Conta é livre: usa-se a conta bancária real de onde o
       dinheiro sai/entra no momento do lançamento (sugerida pelo padrão configurado, mas
       sempre editável). Ex.: uma despesa paga por transferência sai diretamente da conta
       bancária escolhida, não passa pela Caixa Tesouraria.
     Aplica-se ao Lançamento normal/Fecho de Caixa e ao FaturaBot (que é sempre despesa). */
  function travarContaCash(formaSelId, contaSelId, tipoSelId){
    const formaSel = document.getElementById(formaSelId);
    const contaSel = document.getElementById(contaSelId);
    if(!formaSel || !contaSel) return;
    const aplicar = ()=>{
      /* A CAIXA TESOURARIA (CASH) só recebe lançamentos cuja Forma de Pagamento é "Cash" —
         tanto Receita como Despesa. Todas as outras formas (TPA, Banco, Multicaixa Express,
         Transferência Bancária) usam a conta bancária REAL de onde o dinheiro sai ou para
         onde entra, escolhida (ou sugerida pelo padrão configurado) no momento do lançamento
         — inclui despesas: uma despesa paga por transferência sai diretamente da conta
         bancária certa, não passa pela Caixa Tesouraria. */
      const travar = formaSel.value==='Cash';
      if(travar){
        contaSel.value='CASH';
        contaSel.style.pointerEvents='none'; contaSel.style.opacity='0.65';
        contaSel.title = "Cash usa sempre a CAIXA TESOURARIA (caixa único) — não é editável.";
      } else {
        contaSel.style.pointerEvents=''; contaSel.style.opacity=''; contaSel.title='';
      }
    };
    formaSel.addEventListener('change', aplicar);
    contaSel.addEventListener('change', aplicar); // reforça caso a trava seja contornada (ex.: teclado)
    if(tipoSelId){ const tipoSel = document.getElementById(tipoSelId); if(tipoSel) tipoSel.addEventListener('change', aplicar); }
    aplicar();
  }

  };
  if(fl) fl.onsubmit=async e=>{

    novo.taxaIVA = Number(novo.taxaIVA||0);

    /* Reforço: a Conta só é forçada para a Caixa Tesouraria (CASH) quando a Forma de
       Pagamento é "Cash" — garante a regra mesmo que o bloqueio visual seja contornado.

    if(periodoFechado(l.data) && !confirm('Este período (mês) está marcado como FECHADO em "Fecho de Períodos". Confirma mesmo assim o estorno?')) return;
    if(l.transferenciaId){
      const par = DB.lancamentos.find(x=>x.transferenciaId===l.transferenciaId && x.id!==l.id);
      if(par && !confirm(`Este lançamento faz parte de uma Transferência entre Contas (${l.tipo==='Despesa'?'saída':'entrada'} de ${fmt(l.valor)} Kz). A outra perna (${par.tipo==='Despesa'?'saída':'entrada'} em ${(CONTAS.find(c=>c.codigo===par.conta)||{}).nome||par.conta}) NÃO será estornada automaticamente — vai ficar desemparelhada. Continuar mesmo assim?`)) return;
    }
    const motivo = prompt(`Motivo do estorno de "${l.categoria} — ${fmt(l.valor)} ${l.moeda}" (${l.data}):`, '');
    if(motivo===null) return; // cancelou
    /* Um lançamento lançado nunca desaparece: cria-se um lançamento de reversão (mesma
       conta/categoria/valor, tipo invertido, data de hoje) que anula o efeito do original
       nos relatórios — o original mantém-se no histórico, marcado como Estornado, e ambos
       ficam visíveis e ligados um ao outro. */
    const estorno = {
      ...l, id:uid(), data:hoje(), tipo: l.tipo==='Receita' ? 'Despesa' : 'Receita',
      descricao:`ESTORNO de: ${xmlEsc(l.descricao || l.categoria)} (lançamento original de ${l.data})`,
      estornoDeId:l.id, historico:[], neutralizado:false, motivoNeutralizacao:undefined,
      estornado:false, nFatura: undefined,
    };
    DB.lancamentos.push(estorno);
    l.estornado = true;
    l.estornoId = estorno.id;
    if(!l.historico) l.historico=[];
    l.historico.push({quando:new Date().toISOString(), por:meuEmail||'', acao:'Lançamento estornado (reversão lançada)', alteracoes:[{campo:'Estado', de:'Ativo', para:'Estornado'},{campo:'Motivo', de:'—', para:motivo||'(sem motivo indicado)'}]});
    logar('Lançamento estornado', `${l.data} — ${l.tipo} ${l.categoria} — ${fmt(l.valor)} ${l.moeda} — Motivo: ${motivo||'(sem motivo indicado)'} — reversão lançada em ${estorno.data}`);
    if(editandoLancId===l.id) editandoLancId=null;
    await saveDB(); toast('Lançamento estornado — o original mantém-se no histórico, a reversão foi lançada.'); render();

    const nomeFich = `SAFT_Compras_${saftComprasAnoAtivo}-${String(saftComprasMesAtivo).padStart(2,'0')}.xml`;
    baixarFicheiro(nomeFich, xml, 'application/xml');
    logar('Exportação SAF-T Compras', `Compras/Despesas ${String(saftComprasMesAtivo).padStart(2,'0')}/${saftComprasAnoAtivo}`);

    const cfg = DB.empresaConfig || {};
    if(!cfg.nif || !cfg.nome){ toast('Preencha o NIF e o Nome da empresa antes de exportar.'); return; }

    /* Alerta de reconciliação: verifica se, para o mês/ano do SAF-T a exportar, há
       dias/unidades divergentes ou sem fecho de caixa declarado. Não bloqueia a
       exportação (o utilizador pode ter motivo para prosseguir), mas exige confirmação
       explícita e regista no log que a exportação seguiu com pendências. */
    const chaveMesSaft = `${saftAnoAtivo}-${String(saftMesAtivo).padStart(2,'0')}`;
    const linhasMes = calcularReconciliacao().filter(l=> mesKey(l.data)===chaveMesSaft);
    const divergentesMes = linhasMes.filter(l=>l.status==='divergente');
    const pendentesMes = linhasMes.filter(l=>l.status==='pendente');

    if(divergentesMes.length || pendentesMes.length){
      const partes = [];
      if(divergentesMes.length) partes.push(`${divergentesMes.length} dia(s)/unidade(s)/turno(s) com valor DIVERGENTE entre o lançado e o fecho de caixa declarado`);
      if(pendentesMes.length) partes.push(`${pendentesMes.length} dia(s)/unidade(s)/turno(s) SEM fecho de caixa declarado`);
      const confirmar = window.confirm(
        `⚠️ Atenção: ${MESES[saftMesAtivo-1]}/${saftAnoAtivo} tem ${partes.join(' e ')}.\n\n` +
        `Isto significa que o SAF-T pode não bater com o que os caixas contaram fisicamente. ` +
        `Reveja em "Reconciliação SAF-T vs Caixa" antes de submeter à AGT.\n\n` +
        `Deseja exportar mesmo assim?`
      );
      if(!confirmar){
        currentTab = 'reconciliacao';
        render();
        return;
      }
      logar('Exportação SAF-T com pendências', `Facturação ${chaveMesSaft} — ${partes.join(' e ')} — confirmado pelo utilizador`);
    }

    const xml = gerarXmlSaftFacturacao(saftAnoAtivo, saftMesAtivo);
    const nomeFich = `SAFT_Facturacao_${saftAnoAtivo}-${String(saftMesAtivo).padStart(2,'0')}.xml`;

  const fs=document.getElementById('formSal');

  const simReceitaEl = document.getElementById('simReceita');

      injecao: document.getElementById('simInjecao'),

    const atualizarSimulador = ()=>{
      const params = {
        varReceita: Number(els.receita.value)||0,
        varCustosFixos: Number(els.fixos.value)||0,
        varCustosVariaveis: Number(els.variaveis.value)||0,

        injecaoCaixa: Number(els.injecao.value)||0,
      };
      document.getElementById('simReceitaVal').textContent = (params.varReceita>=0?'+':'')+params.varReceita+'%';
      document.getElementById('simFixosVal').textContent = (params.varCustosFixos>=0?'+':'')+params.varCustosFixos+'%';
      document.getElementById('simVariaveisVal').textContent = (params.varCustosVariaveis>=0?'+':'')+params.varCustosVariaveis+'%';
      document.getElementById('simDespesaVal').textContent = (params.varDespesaDiaria>=0?'+':'')+params.varDespesaDiaria+'%';
      const r = calcularCenarioSimulado(params);
      document.getElementById('simOutReceitaSim').textContent = fmtKz(r.simulado.receita);
      document.getElementById('simOutFixosSim').textContent = fmtKz(r.simulado.custosFixos);
      document.getElementById('simOutVariaveisSim').textContent = fmtKz(r.simulado.custosVariaveis);
      document.getElementById('simOutMargemSim').textContent = fmtPct(r.simulado.margem);
      const peSimEl = document.getElementById('simOutPESim');
      peSimEl.textContent = r.simulado.pontoEquilibrio===null?'—':fmtKz(r.simulado.pontoEquilibrio);
      document.getElementById('simOutSaldoSim').textContent = fmtKz(r.simulado.saldoTotal);
      const diasSimEl = document.getElementById('simOutDiasSim');
      diasSimEl.textContent = fmtDias(r.simulado.dias);
      diasSimEl.style.color = (r.simulado.dias!==null && r.simulado.dias<15) ? 'var(--vermelho)' : '';

      const veredicto = document.getElementById('simVeredicto');
      const partes = [];
      if(r.simulado.pontoEquilibrio!==null && r.atual.pontoEquilibrio!==null){
        const deltaPE = r.simulado.pontoEquilibrio - r.atual.pontoEquilibrio;
        partes.push(deltaPE>0
          ? `O Ponto de Equilíbrio sobe ${fmtKz(Math.abs(deltaPE))} — precisaria de vender mais para cobrir os custos.`
          : (deltaPE<0 ? `O Ponto de Equilíbrio desce ${fmtKz(Math.abs(deltaPE))} — fica mais fácil cobrir os custos.` : ''));
      }
      if(r.simulado.dias!==null && r.atual.dias!==null){
        const deltaDias = r.simulado.dias - r.atual.dias;
        if(Math.abs(deltaDias)>=1) partes.push(deltaDias>0
          ? `A caixa aguentaria mais ${deltaDias.toFixed(0)} dia(s) de operação.`
          : `A caixa aguentaria menos ${Math.abs(deltaDias).toFixed(0)} dia(s) de operação.`);
      }
      veredicto.textContent = partes.length ? '📌 '+partes.join(' ') : 'Ajuste os controlos à esquerda para ver o impacto no cenário.';
    };
    Object.values(els).forEach(el=>{ el.oninput = atualizarSimulador; });
    const resetBtn = document.getElementById('simReset');
    if(resetBtn) resetBtn.onclick = ()=>{
      els.receita.value=0; els.fixos.value=0; els.variaveis.value=0; els.despesa.value=0; els.injecao.value=0;
      atualizarSimulador();
    };
    atualizarSimulador();
  }
}

/* ---------- 🔁 Lançamentos Recorrentes ----------
   Modelos de lançamento que se repetem todo mês (renda, salários, subscrições, etc.). Ao
   carregar os dados (ver loadDB), o sistema gera automaticamente os lançamentos em falta
   desde o mês de início do modelo até ao mês atual (um por mês, no Dia do Mês
   configurado), marcando cada lançamento gerado com recorrenteId+mesRecorrencia para nunca
   duplicar — mesmo reabrindo a app várias vezes no mesmo mês. Meses com o período
   Fechado/Encerrado são saltados (ficam pendentes até serem reabertos). Nunca gera
   lançamentos para meses futuros, só até ao mês corrente. Os lançamentos gerados entram
   como lançamentos normais em 📝 Lançamentos — podem ser editados/eliminados como
   qualquer outro; eliminar/pausar o MODELO aqui não apaga lançamentos já gerados. */
function configRecorrentes(){
  if(!Array.isArray(DB.recorrentes)) DB.recorrentes = [];
  return DB.recorrentes;
}
function mesesRecorrenciaEmFalta(rec){
  const inicio = (rec.dataInicio||hoje()).slice(0,7);
  const fimLimite = rec.dataFim ? rec.dataFim.slice(0,7) : null;
  const mesAtual = mesKey(hoje());
  const gerados = new Set(rec.mesesGerados||[]);
  const meses = [];
  let [ano,mes] = inicio.split('-').map(Number);
  if(!ano || !mes) return meses;
  let m = inicio, guarda = 0;
  while(m <= mesAtual && (!fimLimite || m <= fimLimite) && guarda<1200){
    guarda++;
    if(!gerados.has(m)) meses.push(m);
    mes++; if(mes>12){ mes=1; ano++; }
    m = `${ano}-${String(mes).padStart(2,'0')}`;
  }
  return meses;
}
function criarLancamentoDeRecorrente(rec, mesRef){
  const [ano,mes] = mesRef.split('-').map(Number);
  const ultimoDia = new Date(ano, mes, 0).getDate();
  const dia = Math.min(Math.max(Number(rec.diaDoMes)||1,1), ultimoDia);
  const data = `${mesRef}-${String(dia).padStart(2,'0')}`;
  const formaPagamento = rec.formaPagamento||'Banco';
  return {
    id: uid(), historico:[],
    data, tipo: rec.tipo, unidade: rec.unidade||'', formaPagamento,
    categoria: rec.categoria, conta: formaPagamento==='Cash' ? 'CASH' : (rec.conta||''),
    entidade: rec.entidade||'', nif:'', nFatura:'', valor: Number(rec.valor)||0, moeda: rec.moeda||'KZ',
    quantidade:'', produtoId:'', iva:'Não', taxaIVA:0,
    descricao: `${rec.descricao||''} (lançamento recorrente automático)`.trim(),
    origem: origemAutomatica(rec.unidade, formaPagamento),
    recorrenteId: rec.id, mesRecorrencia: mesRef,
  };
}
/* Gera todos os lançamentos em falta de todos os modelos ativos, até ao mês atual. Salta
   meses com período Fechado/Encerrado (ficam para gerar depois, quando reabertos). Chamada
   automaticamente ao carregar os dados — silenciosa se não houver nada a gerar, a menos
   que mostrarToastSeNada seja true (usado pelo botão manual "Gerar pendentes agora"). */
async function gerarLancamentosRecorrentesPendentes(mostrarToastSeNada){
  const recs = configRecorrentes().filter(r=>r.ativo!==false);
  let gerados = 0, saltados = 0;
  recs.forEach(rec=>{
    if(!rec.mesesGerados) rec.mesesGerados = [];
    mesesRecorrenciaEmFalta(rec).forEach(mesRef=>{
      const dataTeste = `${mesRef}-01`;
      if(anoEncerrado(dataTeste) || periodoFechado(dataTeste)){ saltados++; return; }
      DB.lancamentos.push(criarLancamentoDeRecorrente(rec, mesRef));
      rec.mesesGerados.push(mesRef);
      gerados++;
    });
  });
  if(gerados){
    logar('Lançamentos Recorrentes gerados automaticamente', `${gerados} lançamento(s) gerado(s)${saltados?` (${saltados} mês(es) saltado(s) por período fechado/encerrado)`:''}.`);
    await saveDB();
    toast(`🔁 ${gerados} lançamento(s) recorrente(s) gerado(s) automaticamente.`);
  } else if(mostrarToastSeNada){
    toast(saltados ? `Nada gerado — ${saltados} mês(es) pendente(s) por período fechado/encerrado.` : 'Nada pendente para gerar.');
  }
  return {gerados, saltados};
}

let recorrenteEditando = null; // null = form fechado; '' = novo modelo; id = a editar

      <td class="right">${fmt(r.valor)} ${r.moeda||'KZ'}</td>
      <td>Dia ${r.diaDoMes||1}</td>

      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="9" class="note">Nenhum modelo de lançamento recorrente configurado.</td></tr>';

  return `
  <h2>🔁 Lançamentos Recorrentes</h2>
  <p class="note">Modelos de lançamentos que se repetem todo mês (renda, salários, subscrições, etc.). O sistema gera automaticamente o lançamento do mês em falta sempre que os dados são carregados — sem precisar de lembrar de lançar à mão. Cada lançamento gerado fica marcado "(lançamento recorrente automático)" na descrição e pode ser editado/eliminado normalmente em 📝 Lançamentos, como qualquer outro. Pausar ou eliminar um modelo aqui não apaga lançamentos já gerados.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Modelos Ativos</div><div class="val">${modelos.filter(r=>r.ativo!==false).length}</div></div>
    <div class="card"><div class="lbl">Impacto Mensal Estimado (ativos)</div><div class="val ${totalMensalAtivos>=0?'pos':'neg'}">${fmt(totalMensalAtivos)} Kz</div></div>
  </div>
  <div class="actions" style="margin-bottom:12px;"><button type="button" id="btnGerarRecorrentesAgora">🔁 Gerar pendentes agora</button> <button type="button" class="sec" id="btnNovoRecorrente">+ Novo Modelo Recorrente</button></div>

  ${(recorrenteEditando!==null) ? `
  <form class="inline" id="formRecorrente">
    <div class="grid">
      <div><label>Descrição</label><input name="descricao" required value="${xmlEsc(rEd?.descricao||'')}" placeholder="Ex.: Renda da loja"></div>
      <div><label>Tipo</label><select name="tipo" id="recTipo"><option ${rEd?.tipo==='Receita'?'selected':''}>Receita</option><option ${!rEd||rEd?.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div><label>Categoria</label><select name="categoria" id="recCategoria">${optsCategorias(rEd?.categoria, (rEd?.tipo||'Despesa')==='Despesa'?'despesa':'receita')}</select></div>
      <div><label>Valor</label><input type="number" step="0.01" name="valor" required value="${rEd?.valor??''}"></div>
      <div><label>Moeda</label><select name="moeda"><option ${!rEd||rEd?.moeda==='KZ'?'selected':''}>KZ</option><option ${rEd?.moeda==='EUR'?'selected':''}>EUR</option><option ${rEd?.moeda==='USD'?'selected':''}>USD</option></select></div>
      <div><label>Dia do Mês</label><input type="number" min="1" max="28" name="diaDoMes" required value="${rEd?.diaDoMes||1}"></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento" id="recFormaPagamento">${FORMAS_PAGAMENTO.map(f=>`<option ${rEd?.formaPagamento===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label>Conta Bancária/Caixa</label><select name="conta">${CONTAS.map(c=>`<option value="${c.codigo}" ${rEd?.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Unidade de Negócio</label><select name="unidade"><option value="">—</option>${UNIDADES_NEGOCIO.map(u=>`<option ${rEd?.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>

      <div><label>Data Final (opcional)</label><input type="date" name="dataFim" value="${rEd?.dataFim||''}"></div>
    </div>
    <div class="actions"><button type="submit">💾 ${rEd?'Guardar Alterações':'Criar Modelo'}</button> <button type="button" class="sec" id="btnCancelarRecorrente">Cancelar</button></div>
  </form>` : ''}

}
function bindRecorrentes(){
  const btnNovo = document.getElementById('btnNovoRecorrente');
  if(btnNovo) btnNovo.onclick=()=>{ recorrenteEditando=''; render(); };
  const btnCancelar = document.getElementById('btnCancelarRecorrente');
  if(btnCancelar) btnCancelar.onclick=()=>{ recorrenteEditando=null; render(); };
  const recTipoEl = document.getElementById('recTipo');
  if(recTipoEl) recTipoEl.onchange=()=>{
    const sel = document.getElementById('recCategoria');
    if(sel) sel.innerHTML = optsCategorias('', recTipoEl.value==='Despesa'?'despesa':'receita');
  };
  document.querySelectorAll('[data-editar-recorrente]').forEach(b=>b.onclick=()=>{ recorrenteEditando=b.dataset.editarRecorrente; render(); });
  document.querySelectorAll('[data-pausar-recorrente]').forEach(b=>b.onclick=async()=>{
    const r = DB.recorrentes.find(x=>x.id===b.dataset.pausarRecorrente); if(!r) return;
    r.ativo = r.ativo===false ? true : false;
    logar('Lançamento Recorrente '+(r.ativo?'reativado':'pausado'), r.descricao||'');
    await saveDB(); toast(r.ativo?'Modelo reativado.':'Modelo pausado.'); render();
  });
  document.querySelectorAll('[data-eliminar-recorrente]').forEach(b=>b.onclick=async()=>{
    const r = DB.recorrentes.find(x=>x.id===b.dataset.eliminarRecorrente); if(!r) return;
    if(!confirm(`Eliminar o modelo "${r.descricao}"? Os lançamentos já gerados NÃO são apagados (continuam em Lançamentos) — só o modelo deixa de gerar novos.`)) return;
    DB.recorrentes = DB.recorrentes.filter(x=>x.id!==r.id);
    logar('Lançamento Recorrente eliminado', r.descricao||'');
    await saveDB(); toast('Modelo eliminado.'); render();
  });
  const btnGerarAgora = document.getElementById('btnGerarRecorrentesAgora');
  if(btnGerarAgora) btnGerarAgora.onclick=async()=>{ await gerarLancamentosRecorrentesPendentes(true); render(); };
  const fRec = document.getElementById('formRecorrente');
  if(fRec) fRec.onsubmit=async e=>{
    e.preventDefault();
    const f = new FormData(fRec);
    const novo = Object.fromEntries(f.entries());
    novo.valor = Number(novo.valor)||0;
    novo.diaDoMes = Math.min(Math.max(Number(novo.diaDoMes)||1,1),28);
    if(recorrenteEditando){
      const alvo = DB.recorrentes.find(r=>r.id===recorrenteEditando);
      if(alvo){
        Object.assign(alvo, novo, {id:alvo.id, mesesGerados:alvo.mesesGerados||[], ativo:alvo.ativo});
        logar('Lançamento Recorrente editado', alvo.descricao||'');
      }
    } else {
      novo.id = uid(); novo.ativo = true; novo.mesesGerados = [];
      DB.recorrentes.push(novo);
      logar('Lançamento Recorrente criado', novo.descricao||'');
    }
    recorrenteEditando = null;
    await saveDB();
    await gerarLancamentosRecorrentesPendentes(false);
    toast('Modelo guardado.'); render();
  };
}
