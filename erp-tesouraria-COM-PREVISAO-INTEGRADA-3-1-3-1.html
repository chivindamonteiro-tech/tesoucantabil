    ${(transfContaOrigem && transfContaDestino && !mesmaConta) ? `<p class="note" style="margin-top:8px;">Vai criar: <b>Despesa</b> de ${fmt(Number(transfValor)||0)} Kz em <b>${origemNome}</b> + <b>Receita</b> de ${fmt(Number(transfValor)||0)} Kz em <b>${destinoNome}</b>.</p>` : ''}
    <div class="actions" style="margin-top:10px;">
      <button type="button" id="btnLancarTransferencia" ${(!transfContaOrigem||!transfContaDestino||mesmaConta||!valorValido)?'disabled':''}>+ Lançar Transferência</button>
    </div>
  </div>`;
}

function viewLancamento(modoCaixa){
  const filtrados = DB.lancamentos.filter(l=>{
    if(filtrosLanc.dataDe && l.data < filtrosLanc.dataDe) return false;
    if(filtrosLanc.dataAte && l.data > filtrosLanc.dataAte) return false;
    if(filtrosLanc.mes && mesKey(l.data) !== filtrosLanc.mes) return false;
    if(filtrosLanc.tipo && l.tipo !== filtrosLanc.tipo) return false;
    if(filtrosLanc.categoria && l.categoria !== filtrosLanc.categoria) return false;
    if(filtrosLanc.origem && l.origem !== filtrosLanc.origem) return false;
    if(filtrosLanc.conta && l.conta !== filtrosLanc.conta) return false;
    if(filtrosLanc.formaPagamento && l.formaPagamento !== filtrosLanc.formaPagamento) return false;
    if(filtrosLanc.turno && (l.turno||'') !== filtrosLanc.turno) return false;
    // Filtro de lançamentos neutros
    if(!filtrosLanc.mostraNeutros && l.neutralizado) return false;
    return true;
  });
  
  // Estatísticas de neutros
  const lancNeutros = filtrados.filter(l => l.neutralizado).length;
  const lancAtivos = filtrados.length - lancNeutros;
  const totFiltro = filtrados.reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const rows = filtrados.slice().reverse().map(l=>{
    const hist = l.historico||[];
    const linhaHist = lancHistoricoAberto.has(l.id) ? `
    <tr class="hist-row"><td colspan="17" style="background:#f7f7f2;">
      ${hist.length? `<b>Histórico de alterações (${hist.length})</b><table style="margin-top:6px;"><thead><tr><th>Quando</th><th>Por</th><th>Campo</th><th>De</th><th>Para</th></tr></thead><tbody>
        ${hist.slice().reverse().map(h=>h.alteracoes.map((a,i)=>`<tr>${i===0?`<td rowspan="${h.alteracoes.length}">${new Date(h.quando).toLocaleString('pt-PT')}</td><td rowspan="${h.alteracoes.length}">${h.por||'—'}</td>`:''}<td>${a.campo}</td><td>${a.de}</td><td>${a.para}</td></tr>`).join('')).join('')}
      </tbody></table>` : `<span class="note">Sem alterações registadas desde a criação deste lançamento.</span>`}
    </td></tr>` : '';
    const estiloNeutro = (l.neutralizado||l.estornado) ? 'style="opacity:0.6;text-decoration:line-through;background:#f3f3f0;"' : '';
    const badgeEstorno = l.estornado ? ` <span class="badge" style="background:#eadfc4;color:#6b5a1e;cursor:help;" title="Corrigido por estorno — o lançamento original mantém-se no histórico, a reversão está lançada separadamente.">↩️ Estornado</span>` : '';
    const badgeEhEstorno = l.estornoDeId ? ` <span class="badge" style="background:#eadfc4;color:#6b5a1e;" title="Lançamento de reversão (estorno) de outro lançamento.">↩️ Estorno</span>` : '';
    const botaoApagar = (l.estornado || l.estornoDeId) ? '' : ` <button class="danger" data-del-lanc="${l.id}" title="Corrige por estorno/reversão — o lançamento original não é apagado, fica no histórico.">↩️ Estornar</button>`;
    const botoesEdicao = (l.estornado || l.estornoDeId) ? '' : `<button data-edit-lanc="${l.id}">Editar</button> `;
    return `
    <tr ${estiloNeutro}>
      <td>${l.data}</td>
      <td>${l.turno||'—'}</td>
      <td><span class="badge ${l.tipo==='Receita'?'pago':'atraso'}">${l.tipo}</span>${l.neutralizado ? ` <span class="badge" style="background:#ccc;color:#666;cursor:help;" title="${xmlEsc(l.motivoNeutralizacao||'(sem motivo indicado)')}">🧹 Neutro</span>` : ''}${badgeEstorno}${badgeEhEstorno}</td>
      <td>${xmlEsc(l.origem||'—')}</td>
      <td>${xmlEsc(l.categoria)}</td>
      <td>${xmlEsc(l.conta)}</td>
      <td>${xmlEsc(l.formaPagamento||'—')}${l.fechoTpaSeq>1?` <span class="note">(${l.fechoTpaSeq}º fecho TPA do dia)</span>`:''}</td>
      <td>${xmlEsc(l.entidade||'')}</td>
      <td>${xmlEsc(l.nif||'')}</td>
      <td>${xmlEsc(l.nFatura||'')}</td>
      <td class="right" ${l.neutralizado?'style="text-decoration:line-through;"':''}>${fmt(l.valor)}</td>
      <td>${l.moeda}</td>
      <td class="right">${l.quantidade? fmt(l.quantidade) : '—'}</td>
      <td>${l.produtoId ? xmlEsc((DB.produtos.find(p=>p.id===l.produtoId)||{}).nome || '') : ''}</td>
      <td>${l.iva==='Sim'? (l.taxaIVA*100).toFixed(0)+'%':'—'}</td>
      <td>${xmlEsc(l.descricao||'')}</td>
      <td>${botoesEdicao}<button class="sec" data-hist-lanc="${l.id}">Histórico${hist.length?` (${hist.length})`:''}</button> ${l.tipo==='Receita' && l.nFatura ? `<button class="print" data-print-fatura="${l.id}">Fatura</button>` : ''} ${(l.estornado || l.estornoDeId) ? '' : (l.neutralizado ? `<button class="sec" data-desneutralizar-linha="${l.id}" title="Reverter neutralização só deste lançamento">↩️ Desneutralizar</button>` : `<button class="sec" data-neutralizar-linha="${l.id}" title="Neutralizar só este lançamento">🧹 Neutralizar</button>`)}${botaoApagar}</td>
    </tr>${linhaHist}`;
  }).join('') || `<tr><td colspan="17" class="note">Nenhum lançamento corresponde aos filtros.</td></tr>`;

  const lancEditando = editandoLancId ? DB.lancamentos.find(l=>l.id===editandoLancId) : null;

  const confirmacaoCaixa = (modoCaixa && ultimoLancCaixa) ? `
    <div class="card" style="border:2px solid var(--verde);background:var(--verde-claro);margin-bottom:16px;">

        <b>${ultimoLancCaixa.tipo}</b> — ${ultimoLancCaixa.categoria} — <b>${fmt(ultimoLancCaixa.valor)} ${ultimoLancCaixa.moeda}</b>
        ${ultimoLancCaixa.origem?` — ${ultimoLancCaixa.origem}`:''} — ${ultimoLancCaixa.data}
      </div>
    </div>` : '';

  return `
  <h2 style="background:var(--verde);">📝 ${modoCaixa?'Fecho de Caixa':(lancEditando?'Editar Lançamento':'Lançamentos')}</h2>
  ${!lancEditando ? `<p class="note" style="border:2px solid var(--verde);padding:8px;">💡 Esta secção lança <b>Receitas</b> (faturação dividida por forma de pagamento) e edita lançamentos já existentes. Para lançar uma <b>Despesa</b> nova, vá a "🤖 FaturaBot" — pode preencher à mão, anexar foto/PDF, ou importar várias de uma vez em CSV/Excel.</p>` : ''}

  ${lancEditando?`<p class="note" style="border:2px solid var(--castanho);padding:8px;">✏️ A editar o lançamento de ${lancEditando.data} — ${lancEditando.categoria} — ${fmt(lancEditando.valor)} ${lancEditando.moeda}. As alterações ficam registadas no histórico.</p>`:''}

  ${!lancEditando ? `

    <p class="note" style="margin-top:4px;">Consolida TODOS os lançamentos da data escolhida num único documento de controlo interno (por forma de pagamento, com totais e conferência da contagem física) — em vez de imprimir uma fatura separada por cada lançamento.</p>
    <div class="grid" style="margin-top:8px;">
      <div><label>Data</label><input type="date" id="resumoCxData" value="${resumoCaixaSel.data||hoje()}"></div>
      ${!modoCaixa ? `<div><label>Unidade de Negócio (opcional)</label><select id="resumoCxUnidade"><option value="">Todas</option>${UNIDADES_NEGOCIO.map(u=>`<option ${resumoCaixaSel.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>` : `<div><label>Unidade de Negócio (Posto de Venda)</label><input value="${meuPosto||''}" disabled></div>`}
      <div><label>Turno (opcional)</label><select id="resumoCxTurno"><option value="">Dia inteiro / todos os turnos</option>${TURNOS.map(t=>`<option ${resumoCaixaSel.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="actions" style="margin-top:8px;"><button type="button" class="print" id="btnImprimirResumoCaixa">🖨️ Imprimir Resumo do Dia</button></div>
  </div>` : ''}

  ${(!lancEditando) ? `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
    <button type="button" class="tab-conta ${lancSubView==='dividido'?'active':''}" data-lancsub="dividido">🔀 Dividir por Forma de Pagamento</button>
    ${modoCaixa ? `<button type="button" class="tab-conta ${lancSubView==='contagem'?'active':''}" data-lancsub="contagem">🔒 Contagem Física do Dia</button>` : ''}
    ${!modoCaixa ? `<button type="button" class="tab-conta ${lancSubView==='transferencia'?'active':''}" data-lancsub="transferencia">🔁 Transferência entre Contas</button>` : ''}
  </div>` : ''}

  ${(!lancEditando && lancSubView==='dividido') ? viewFechoCaixaDividido() : ''}
  ${(!lancEditando && lancSubView==='transferencia' && !modoCaixa) ? viewTransferenciaEntreContas() : ''}

  ${lancEditando ? `
  <form class="inline" id="formLanc">
    <div class="grid">
      <div><label>Data</label><input type="date" name="data" value="${lancEditando?lancEditando.data:hoje()}" required></div>
      <div><label>Tipo</label><select name="tipo" id="lancTipo"><option ${lancEditando?.tipo==='Receita'?'selected':''}>Receita</option><option ${lancEditando?.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div><label>Unidade de Negócio (Origem — qual loja/hotel)</label><select name="unidade" id="lancUnidade"><option value="">—</option>${UNIDADES_NEGOCIO.map(u=>`<option ${lancEditando?.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div><label>Turno (opcional)</label><select name="turno" id="lancTurno"><option value="" ${!lancEditando?.turno?'selected':''}>Dia inteiro / turno único</option>${TURNOS.map(t=>`<option ${lancEditando?.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento" id="lancFormaPagamento">${FORMAS_PAGAMENTO.map(f=>`<option ${lancEditando?.formaPagamento===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div id="lancTipoVendaRow" style="display:none;"><label>Tipo de Venda (Zoom's Lodge)</label><select id="lancTipoVenda"><option value="">—</option>${Object.keys(TIPOS_VENDA_ZOOMS_LODGE).map(t=>`<option ${lancEditando?.categoria===TIPOS_VENDA_ZOOMS_LODGE[t]?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>Categoria <span id="lancSugestaoTag" style="font-weight:normal;font-size:12px;color:var(--muted);"></span></label><select name="categoria" id="lancCategoria">${optsCategorias(lancEditando?.categoria, (lancEditando?.tipo||'Receita')==='Despesa'?'despesa':'receita')}</select></div>
      <div><label>Conta Bancária/Caixa</label><select name="conta" id="lancConta">${CONTAS.map(c=>`<option value="${c.codigo}" ${lancEditando?.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Fornecedor/Cliente</label><input name="entidade" id="lancEntidade" placeholder="Nome" value="${xmlEsc(lancEditando?.entidade||'')}"></div>
      <div><label>NIF <span id="lancNifTag" style="font-weight:normal;font-size:12px;"></span></label><input name="nif" id="lancNif" placeholder="NIF do fornecedor/cliente" value="${xmlEsc(lancEditando?.nif||'')}"></div>
      <div><label>Nº Fatura</label><input name="nFatura" id="lancNFatura" value="${xmlEsc(lancEditando?.nFatura||'')}"></div>
      <div id="lancGerarFaturaRow" style="display:flex;align-items:flex-end;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;">
          <input type="checkbox" id="lancGerarFatura" style="width:auto;" ${!lancEditando?'checked':''}>
          Gerar nº de fatura sequencial ao gravar
        </label>
      </div>
      <div><label>Valor</label><input type="number" step="0.01" name="valor" required value="${lancEditando?.valor??''}"></div>
      <div><label>Moeda</label><select name="moeda"><option ${lancEditando?.moeda==='KZ'?'selected':''}>KZ</option><option ${lancEditando?.moeda==='EUR'?'selected':''}>EUR</option><option ${lancEditando?.moeda==='USD'?'selected':''}>USD</option></select></div>
      <div><label>Quantidade</label><input type="number" step="0.01" name="quantidade" placeholder="Un., Kg, L..." value="${lancEditando?.quantidade??''}"></div>
      <div><label>Produto (SKU)</label><select name="produtoId"><option value="">—</option>${DB.produtos.map(p=>`<option value="${p.id}" ${lancEditando?.produtoId===p.id?'selected':''}>${p.nome}</option>`).join('')}</select></div>
      <div><label>Sujeito a IVA?</label><select name="iva"><option ${lancEditando?.iva!=='Sim'?'selected':''}>Não</option><option ${lancEditando?.iva==='Sim'?'selected':''}>Sim</option></select></div>
      <div><label>Taxa IVA</label><select name="taxaIVA"><option value="0.14" ${String(lancEditando?.taxaIVA)==='0.14'?'selected':''}>14%</option><option value="0.07" ${String(lancEditando?.taxaIVA)==='0.07'?'selected':''}>7%</option><option value="0.05" ${String(lancEditando?.taxaIVA)==='0.05'?'selected':''}>5%</option><option value="0" ${String(lancEditando?.taxaIVA)==='0'?'selected':''}>0%</option></select></div>
      <div style="grid-column:1/-1;"><label>Descrição</label><input name="descricao" value="${xmlEsc(lancEditando?.descricao||'')}"></div>
    </div>
    <div class="actions"><button type="submit" id="btnSubmitLanc">${modoCaixa?'+ Lançar Fecho de Caixa':(lancEditando?'💾 Guardar Alterações':'+ Adicionar Lançamento')}</button> ${lancEditando?`<button type="button" class="sec" id="btnCancelarEdicao">Cancelar edição</button>`:''}</div>
    <details style="margin-top:10px;">
      <summary style="cursor:pointer;color:var(--muted);font-size:12.5px;">ℹ️ Como o sistema preenche os campos automaticamente (toque para ver)</summary>
      <p class="note">Duplicado = mesmo Fornecedor + Nº Fatura + Valor já lançados. O sistema avisa antes de gravar. Em Despesas, a <b>Categoria</b> é sugerida automaticamente ao digitar o Fornecedor (com base em faturas/lançamentos já classificados antes, ou em padrões conhecidos) — corrija se necessário, o sistema aprende com a correção. A <b>Origem</b> é calculada automaticamente a partir da Unidade de Negócio + Forma de Pagamento (ex.: Zoom's Lodge + Cash → "ZOOM'S LODGE CASH") — é isso que o Resumo e o Plano de Contas usam para agrupar as receitas, tal como na planilha. Em Receitas, a <b>Categoria</b> (Receitas Operacionais) também se preenche sozinha: Zoom's Lodge pede o <b>Tipo de Venda</b> (Hospedagem/Restauração/Bar/Outros) e espelha na categoria certa; Bakery Line espelha sempre em "Receitas de Loja / Comércio a Retalho"; Suprimentos fica em "Suprimentos" — pode sempre corrigir à mão. A <b>Conta</b> fica travada em <b>CAIXA TESOURARIA</b> apenas quando a Forma de Pagamento é "Cash" (Receita ou Despesa) — a Caixa Tesouraria é o caixa geral único que espelha o dinheiro em numerário de ambas as unidades (Zoom's Lodge e Bakery Line), não há caixas separados por loja/hotel. Para todas as outras formas (TPA, Banco, Multicaixa Express, Transferência Bancária) — em Receita OU Despesa — a Conta fica livre para escolher a conta bancária real de onde o dinheiro sai ou para onde entra, e pré-preenche sozinha com o padrão configurado em 🏦 Conciliação Bancária, se houver um definido.</p>
    </details>
  </form>` : ''}

  ${(modoCaixa && !lancEditando) ? `

      <div><label>Data</label><input type="date" name="data" id="fcData" value="${hoje()}" required></div>

      <div><label>Turno (opcional)</label><select name="turno" id="fcTurno"><option value="">Dia inteiro / turno único</option>${TURNOS.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div><label>Valor Total Contado</label><input type="number" step="0.01" name="valorContado" id="fcValor" required></div>
      <div><label>Moeda</label><select name="moeda" id="fcMoeda"><option>KZ</option><option>EUR</option><option>USD</option></select></div>
      <div style="grid-column:1/-1;"><label>Observação</label><input name="observacao" id="fcObs" placeholder="Ex.: diferença de troco, nota rasgada, etc."></div>
    </div>
    <div class="actions"><button type="submit">✅ Declarar Fecho de Caixa</button></div>
  </form>` : ''}` : ''}
  ${(!modoCaixa && !lancEditando) ? `
  <form class="inline" id="formFiltroLanc">
    <div class="grid">
      <div><label>Data De</label><input type="date" name="dataDe" value="${filtrosLanc.dataDe}"></div>
      <div><label>Data Até</label><input type="date" name="dataAte" value="${filtrosLanc.dataAte}"></div>
      <div><label>Mês</label><input type="month" name="mes" value="${filtrosLanc.mes}"></div>
      <div><label>Tipo</label><select name="tipo"><option value="">Todos</option><option ${filtrosLanc.tipo==='Receita'?'selected':''}>Receita</option><option ${filtrosLanc.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div><label>Categoria</label><select name="categoria"><option value="">Todas</option>${optsCategorias(filtrosLanc.categoria)}</select></div>
      <div><label>Origem</label><select name="origem"><option value="">Todas</option>${ORIGENS.map(o=>`<option ${filtrosLanc.origem===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div><label>Conta</label><select name="conta"><option value="">Todas</option>${CONTAS.map(c=>`<option value="${c.codigo}" ${filtrosLanc.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento"><option value="">Todas</option>${FORMAS_PAGAMENTO.map(f=>`<option ${filtrosLanc.formaPagamento===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label>Turno</label><select name="turno"><option value="">Todos</option>${TURNOS.map(t=>`<option ${filtrosLanc.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <label style="margin-bottom:0;display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="mostraNeutros" ${filtrosLanc.mostraNeutros?'checked':''} style="width:auto;">
          Mostrar Neutros <span style="font-size:11px;opacity:0.7;">(${lancNeutros} de ${filtrados.length})</span>
        </label>
      </div>
    </div>
    <div class="actions"><button type="submit">🔍 Filtrar</button> <button type="button" class="sec" id="btnLimparFiltro">Limpar filtros</button> <button type="button" class="sec" id="btnExportarLanc">⬇️ Exportar (Excel)</button> <button type="button" class="print" id="btnImprimirLanc">Imprimir / PDF</button></div>
  </form>
  <p class="note">${filtrados.length} de ${DB.lancamentos.length} lançamentos (${lancAtivos} ativo${lancAtivos!==1?'s':''} ${lancNeutros > 0 ? `+ ${lancNeutros} neutro${lancNeutros!==1?'s':''} <span style="opacity:0.7;">🧹</span>` : ''}) · Saldo do filtro: <b>${fmt(totFiltro)} Kz</b></p>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Data</th><th>Turno</th><th>Tipo</th><th>Origem</th><th>Categoria</th><th>Conta</th><th>Forma Pagamento</th><th>Entidade</th><th>NIF</th><th>Nº Fatura</th><th class="right">Valor</th><th>Moeda</th><th class="right">Quantidade</th><th>Produto</th><th>IVA</th><th>Descrição</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>

function executarPesquisa(){
  const termo=(document.getElementById('pqTexto').value||'').toLowerCase();
  const de=document.getElementById('pqDe').value, ate=document.getElementById('pqAte').value;
  const origem=document.getElementById('pqOrigem').value;

  const resLanc = DB.lancamentos.filter(l=>{
    if(de && l.data<de) return false;
    if(ate && l.data>ate) return false;
    if(origem && l.origem!==origem) return false;
    if(termo){
      const alvo = `${xmlEsc(l.entidade||'')} ${xmlEsc(l.descricao||'')} ${xmlEsc(l.nFatura||'')} ${l.categoria}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  }).map(l=>({origemTipo:'Lançamento', data:l.data, tipo:l.tipo, categoria:l.categoria, entidade:l.entidade||'', nFatura:l.nFatura||'', valor:l.valor, moeda:l.moeda, descricao:l.descricao||''}));

  const resDeContas = (key,label)=> !origem ? DB[key].filter(c=>{
    const dataRef = c.vencimento || c.data || '';
    if(de && dataRef<de) return false;
    if(ate && dataRef>ate) return false;
    if(termo){
      const alvo = `${xmlEsc(c.entidade||'')} ${xmlEsc(c.descricao||'')}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  }).map(c=>({origemTipo:label, data:c.vencimento||c.data||'', tipo:label, categoria:'—', entidade:c.entidade||'', nFatura:'', valor:c.valor, moeda:'KZ', descricao:c.descricao||''})) : [];

  const res = [...resLanc, ...resDeContas('contasPagar','Conta a Pagar'), ...resDeContas('contasReceber','Conta a Receber'), ...resDeContas('prestadoresServicos','Pagamento a Prestador de Serviço')]
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  ultimaPesquisaGeral = res;

  const html = res.length ? `<table><thead><tr><th>Origem</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor</th><th>Descrição</th></tr></thead><tbody>
    ${res.map(l=>`<tr><td>${xmlEsc(l.origemTipo)}</td><td>${l.data}</td><td>${xmlEsc(l.tipo)}</td><td>${xmlEsc(l.categoria)}</td><td>${xmlEsc(l.entidade)}</td><td>${xmlEsc(l.nFatura)}</td><td class="right">${fmt(l.valor)}</td><td>${xmlEsc(l.descricao)}</td></tr>`).join('')}
    </tbody></table>` : `<table><tbody><tr><td class="note">Nenhum resultado encontrado.</td></tr></tbody></table>`;
  document.getElementById('resPesquisa').innerHTML = html;
}

/* ---------- Controlo de Duplicados ---------- */
function calcularDuplicados(){
  const grupos = {};
  DB.lancamentos.forEach(l=>{
    if(!l.nFatura) return;
    const chave = `${(l.entidade||'').toLowerCase()}|${xmlEsc(l.nFatura)}|${Number(l.valor)}`;
    grupos[chave]=grupos[chave]||[]; grupos[chave].push(l);
  });
  return Object.values(grupos).filter(g=>g.length>1).flat();
}

/* ---------- Fecho de Períodos ---------- */
/* Resultado do Exercício de um ano — agora contabilidade completa, não só o cash das
   Receitas/Despesas: inclui também os lançamentos automáticos não-monetários (gastos
   que não passam pela Tesouraria mas reduzem o lucro na mesma) — Amortização do
   Imobilizado, Provisão de Férias/13º Salário, Provisão de Cobrança Duvidosa e o efeito
   líquido das Diferenças Cambiais do ano. Exclui Suprimentos (Passivo/dívida a sócios,
   não é lucro) e os pagamentos que apenas liquidam provisões já reconhecidas (senão
   contavam a despesa duas vezes: uma na provisão, outra no pagamento). */
const CATEGORIAS_EXCLUIDAS_RESULTADO = ['Suprimentos','Imposto Industrial (Pagamento)','Férias/13º Salário (Pagamento)','Transferência entre Contas','Adiantamentos e Suprimentos de Caixa a Justificar'];
function resultadoAntesImpostoDoAno(ano){
  const doAno = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)) && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) && !l.neutralizado));
  const r = doAno.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const d = doAno.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  const amortizacao = amortizacaoDoAno(ano);
  const provisaoFerias = provisaoFeriasDecimoTerceiroDoAno(ano);
  const provisaoCobranca = Number(ano)===new Date().getFullYear() ? provisaoCobrancaDuvidosaAtual() : 0;
  const diferencaCambial = diferencaCambialDoAno(ano); // já vem com sinal: ganho soma, perda subtrai
  return r - d - amortizacao - provisaoFerias - provisaoCobranca + diferencaCambial;
}
/* Resultado Líquido do Exercício = Resultado Antes de Impostos − Provisão de Imposto
   Industrial do ano. É este número (já depois de todos os ajustamentos e do imposto)
   que deve aparecer no Balanço, no Encerramento Anual, e em qualquer "Resultado do
   Exercício" formal do sistema. */
function resultadoLiquidoDoAno(ano){
  return resultadoAntesImpostoDoAno(ano) - impostoIndustrialDoAno(ano);
}
function resultadoDoAno(ano){ return resultadoLiquidoDoAno(ano); }

function viewFecho(){
  const anosLanc = Array.from(new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4)))));
  const anosFechos = Array.from(new Set(Object.keys(DB.fechos||{}).map(k=>Number(k.slice(0,4)))));
  const anos = Array.from(new Set([...anosLanc, ...anosFechos, new Date().getFullYear()])).sort((a,b)=>b-a);
  if(!anos.includes(fechoAnoAtivo)) fechoAnoAtivo = anos[0];
  const ano = fechoAnoAtivo;
  const rows = MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const f = DB.fechos[key]||{};
    const lancamentosDoMes = DB.lancamentos.filter(l=>mesKey(l.data)===key);
    const lancamentosNeutros = lancamentosDoMes.filter(l=>l.neutralizado);
    const lancamentosAtivos = lancamentosDoMes.filter(l=>!l.neutralizado);
    const info = lancamentosDoMes.length > 0 ? `<small style="opacity:0.7; display:block; margin-top:3px;">${lancamentosAtivos.length} ativo(s)${lancamentosNeutros.length > 0 ? ` / ${lancamentosNeutros.length} neutralizado(s)` : ''} de ${lancamentosDoMes.length} total</small>` : '';
    const btnDesneutralizar = lancamentosNeutros.length > 0 ? `<button class="print" data-desneutralizar="${key}" title="Reverter neutralização">↩️ Desneutralizar</button>` : '';
    return `<tr><td>${m} ${ano}${info}</td>
      <td>${f.fechado?'<span class="badge atraso">Fechado</span>':'<span class="badge pago">Aberto</span>'}</td>

  }).join('');
  return `

  <p class="note">Ao fechar um período, novos lançamentos com data dentro desse mês passam a exigir confirmação extra antes de gravar — protege dados já conferidos e reportados. Isto é um bloqueio "leve" (mês a mês, contornável com confirmação). Para um fecho definitivo e formal do ANO inteiro, use <b>🔐 Encerramento Anual de Exercício</b>. Use o botão <b>🧹 Neutralizar</b> para marcar todos os lançamentos do período como neutros (não contam nos totais do mês) — vai ser pedido um motivo, que fica registado no histórico de cada lançamento. Use <b>↩️ Desneutralizar</b> para reverter. Para neutralizar/desneutralizar um lançamento individual (sem afetar o resto do mês), use o botão junto a cada linha em 📝 Lançamentos. Para ver o impacto acumulado (quanto e porquê), consulte <b>📊 Relatório de Impacto</b>.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Ano</label><select id="fechoAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>

/* ---------- Relatório de Impacto de Neutralizações ----------
   Mostra quanto valor está de fora dos totais por via de neutralizações (por período,
   por período e por lançamento individual). Ajuda a responder "quanto é que isto está
   a custar-nos em visibilidade" e a auditar os motivos indicados. */
function ultimaAcaoNeutralizacao(l){
  const hist = (l.historico||[]).slice().reverse();
  return hist.find(h => (h.alteracoes||[]).some(a=>a.campo==='Estado' && a.para==='Neutralizado')) || null;
}
function viewRelatorioImpacto(){
  const anosComMovimento = [...new Set(DB.lancamentos.map(l=>mesKey(l.data).slice(0,4)))].sort((a,b)=>b-a);
  const anoFiltro = filtroImpactoAno;
  const neutros = DB.lancamentos.filter(l=>l.neutralizado && (!anoFiltro || mesKey(l.data).startsWith(anoFiltro)));

  const totalValor = neutros.reduce((s,l)=>s+valorEmKZ(l),0);
  const totalReceitas = neutros.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const totalDespesas = neutros.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);

  const porMes = {};
  neutros.forEach(l=>{
    const k = mesKey(l.data);
    if(!porMes[k]) porMes[k] = {qtd:0, valor:0};
    porMes[k].qtd++; porMes[k].valor += valorEmKZ(l);
  });
  const linhasMes = Object.keys(porMes).sort().reverse().map(k=>{
    const [anoK,mesK] = k.split('-');
    return `<tr><td>${MESES[Number(mesK)-1]} ${anoK}</td><td class="right">${porMes[k].qtd}</td><td class="right">${fmt(porMes[k].valor)}</td></tr>`;
  }).join('') || `<tr><td colspan="3" class="note">Sem lançamentos neutralizados${anoFiltro?` em ${anoFiltro}`:''}.</td></tr>`;

  const porCat = {};
  neutros.forEach(l=>{
    if(!porCat[l.categoria]) porCat[l.categoria] = {qtd:0, valor:0};
    porCat[l.categoria].qtd++; porCat[l.categoria].valor += valorEmKZ(l);
  });
  const linhasCat = Object.entries(porCat).sort((a,b)=>b[1].valor-a[1].valor).map(([cat,v])=>
    `<tr><td>${cat}</td><td class="right">${v.qtd}</td><td class="right">${fmt(v.valor)}</td></tr>`
  ).join('') || `<tr><td colspan="3" class="note">Sem lançamentos neutralizados${anoFiltro?` em ${anoFiltro}`:''}.</td></tr>`;

  const linhasDetalhe = neutros.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(l=>{
    const acao = ultimaAcaoNeutralizacao(l);
    return `<tr>
      <td>${l.data}</td>
      <td><span class="badge ${l.tipo==='Receita'?'pago':'atraso'}">${l.tipo}</span></td>
      <td>${l.categoria}</td>
      <td class="right">${fmt(l.valor)} ${l.moeda}</td>
      <td>${l.motivoNeutralizacao?xmlEsc(l.motivoNeutralizacao):'<span class="note">(sem motivo indicado)</span>'}</td>
      <td>${acao?(acao.por||'—'):'—'}</td>
      <td>${acao?new Date(acao.quando).toLocaleString('pt-PT'):'—'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="note">Sem lançamentos neutralizados${anoFiltro?` em ${anoFiltro}`:''}.</td></tr>`;

  return `
  <h2 style="background:var(--castanho);">📊 Relatório de Impacto de Neutralizações</h2>
  <p class="note">Quantifica o que está a ficar de fora dos totais por via de neutralizações — quantos lançamentos, quanto Kz, em que meses e categorias, e o motivo indicado em cada caso. Lançamentos neutralizados continuam no histórico normal; só deixam de contar aqui e nos relatórios do mês.</p>
  <form class="inline" onsubmit="return false;">
    <div class="grid" style="grid-template-columns:220px;">
      <div><label>Ano</label><select id="impactoAnoSel"><option value="">Todos os anos</option>${anosComMovimento.map(a=>`<option value="${a}" ${anoFiltro===a?'selected':''}>${a}</option>`).join('')}</select></div>
    </div>
  </form>
  <div class="cards">
    <div class="card"><div class="lbl">Lançamentos Neutralizados</div><div class="val">${neutros.length}</div></div>
    <div class="card"><div class="lbl">Valor Total Neutralizado</div><div class="val">${fmt(totalValor)} Kz</div></div>
    <div class="card"><div class="lbl">Receitas Neutralizadas</div><div class="val pos">${fmt(totalReceitas)} Kz</div></div>
    <div class="card"><div class="lbl">Despesas Neutralizadas</div><div class="val neg">${fmt(totalDespesas)} Kz</div></div>
  </div>
  <h2 class="sub" style="font-size:16px;">Por Período</h2>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">Qtd.</th><th class="right">Valor (Kz)</th></tr></thead><tbody>${linhasMes}</tbody></table></div>
  <h2 class="sub" style="font-size:16px;margin-top:16px;">Por Categoria</h2>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="right">Qtd.</th><th class="right">Valor (Kz)</th></tr></thead><tbody>${linhasCat}</tbody></table></div>

function viewEncerramentoAnual(){
  const anoAtual = new Date().getFullYear();
  const anosComMovimento = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))];
  const anos = [...new Set(anosComMovimento.concat([anoAtual]))].sort((a,b)=>b-a);

  const rows = anos.map(ano=>{
    const enc = (DB.encerramentosAnuais||{})[ano] || {};
    const resultado = resultadoDoAno(ano);
    const mesesDoAno = MESES.map((m,i)=>`${ano}-${String(i+1).padStart(2,'0')}`);
    const todosMesesFechados = mesesDoAno.every(k=> DB.fechos[k] && DB.fechos[k].fechado);
    return `<tr>
      <td>${ano}</td>

  prestadoresServicos: {cor:'var(--azul-nav)', icone:'🛠️', acaoData:'Prestação de Serviço', wording:'Prestador de Serviço', ccPlural:'Prestadores de Serviços', direcao:'pagar',   titulo:'Pagamentos a Prestadores de Serviços', slug:'prestadores-de-servicos', categoriaDefault:'Serviços de Terceiros'},

/* Aplica a Retenção na Fonte sobre Serviços de Terceiros (Fonte: AGT) a um registo de
   Prestador de Serviços. A taxa e a base vêm de REGRAS_FISCAIS_AGT.retencaoServicos (única
   tabela de taxas fiscais do sistema — ver nota no topo do ficheiro). O valor retido é
   registado de imediato como um "pagamento" sem Forma de Pagamento/Conta bancária real
   (não é uma saída de Caixa/Banco, não gera Lançamento de Tesouraria) — serve apenas para
   que o saldo em aberto do registo passe a refletir o Valor Líquido a Pagar ao prestador.
   O imposto retido é entregue à AGT separadamente (ver 🧾 IVA e Retenções / 📑 Mapas Fiscais). */
function aplicarRetencaoAGT(novo, dadosForm, valorBase){
  novo.iva = dadosForm.iva || 'Não';
  novo.taxaIVA = Number(dadosForm.taxaIVA||0);
  novo.retencaoAplicavel = (dadosForm.retencaoAplicavel||'Sim') === 'Sim';
  novo.taxaRetencao = REGRAS_FISCAIS_AGT.retencaoServicos.taxa;
  novo.valorRetencao = novo.retencaoAplicavel ? Math.round(Number(valorBase||0)*novo.taxaRetencao*100)/100 : 0;
  novo.valorLiquido = Math.round((Number(valorBase||0) - novo.valorRetencao)*100)/100;
  if(novo.valorRetencao>0){
    novo.pagamentos.push({
      id: uid(), data: novo.data||hoje(), valor: novo.valorRetencao,
      observacao: `Retenção na Fonte sobre Serviços de Terceiros — ${(novo.taxaRetencao*100).toFixed(1)}% (Fonte: AGT)`,
      formaPagamento: 'Retenção na Fonte (AGT)', conta: ''
    });
    novo.valorPago = novo.valorRetencao;
  }
}

/* ---------- Conta Corrente (Clientes, Fornecedores ou Prestadores de Serviços) ---------- */
let contaCorrenteAtivo = {};
function viewContaCorrente(key){
  const cfg = CONTA_CFG[key] || {wording:'Entidade', ccPlural:'Entidades', direcao:'pagar'};
  const isFornecedor = cfg.direcao === 'pagar';
  const titulo = `Conta Corrente de ${cfg.ccPlural}`;
  const labelEntidade = cfg.wording;
  const tipoDebito = isFornecedor ? 'Débito (Compra/Serviço a Crédito)' : 'Débito (Venda a Crédito)';
  const tipoCredito = isFornecedor ? 'Crédito (Pagamento Efetuado)' : 'Crédito (Pagamento Recebido)';

  const entidades = [...new Set(DB[key].map(c=>c.entidade).filter(Boolean))].sort();
  let ativo = contaCorrenteAtivo[key] || '';
  if(!ativo && entidades.length) ativo = entidades[0];

  const saldoDaEntidade = (nome)=> DB[key].filter(c=>c.entidade===nome)
    .reduce((s,c)=> s + (Number(c.valor||0) - Number(c.valorPago||0)), 0);

  const resumo = entidades.map(nome=>({nome, saldo: saldoDaEntidade(nome)}))
    .sort((a,b)=> b.saldo - a.saldo);

  let linhasLedger = '', totalEmAberto = 0;
  if(ativo){
    const entradas = DB[key].filter(c=>c.entidade===ativo);
    const movimentos = [];
    entradas.forEach(c=>{
      movimentos.push({data:c.data||c.vencimento, tipo:tipoDebito, descricao:c.descricao||'—', valor:Number(c.valor||0)});
      (c.pagamentos||[]).forEach(p=>{
        const viaConta = p.formaPagamento ? ` (${p.formaPagamento}${p.conta?' — '+((CONTAS.find(cc=>cc.codigo===p.conta)||{}).nome||p.conta):''})` : '';
        movimentos.push({data:p.data, tipo:tipoCredito, descricao:(p.observacao||'Pagamento')+viaConta, valor:-Number(p.valor||0)});
      });
    });
    movimentos.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    let saldoCorrente = 0;
    linhasLedger = movimentos.map(m=>{
      saldoCorrente += m.valor;
      return `<tr><td>${m.data}</td><td>${m.tipo}</td><td>${xmlEsc(m.descricao)}</td>
        <td class="right">${m.valor>=0?fmt(m.valor):'—'}</td>
        <td class="right">${m.valor<0?fmt(-m.valor):'—'}</td>
        <td class="right"><b>${fmt(saldoCorrente)}</b></td></tr>`;
    }).join('') || `<tr><td colspan="6" class="note">Sem movimentos para ${labelEntidade.toLowerCase()} selecionado(a).</td></tr>`;
    totalEmAberto = saldoCorrente;
  }

  return `
  <h2>🧾 ${titulo}</h2>
  <p class="note">Histórico completo de cada ${labelEntidade.toLowerCase()}: todos os movimentos a crédito (débito) e todos os pagamentos ${isFornecedor?'efetuados':'recebidos'} (crédito), com saldo a transitar — tal como um extrato bancário. Os pagamentos registam-se no módulo de origem.</p>

  <div class="tablewrap" style="margin-bottom:18px;">
    <table><thead><tr><th>${labelEntidade}</th><th class="right">Saldo em Aberto</th><th></th></tr></thead>
    <tbody>${resumo.map(r=>`<tr${r.nome===ativo?' style="background:var(--bg);"':''}>
      <td>${r.nome}</td><td class="right">${fmt(r.saldo)}</td>
      <td><button class="sec" data-cc="${key}:${r.nome.replace(/"/g,'&quot;')}">Ver Extrato</button></td>
    </tr>`).join('') || `<tr><td colspan="3" class="note">Ainda sem registos em ${titulo}.</td></tr>`}</tbody></table>
  </div>

  ${ativo ? `
  <h2 class="sub" style="font-size:15px;">Extrato — ${ativo}</h2>
  <div class="actions" style="margin-bottom:10px;"><button type="button" class="print" id="btnImprimirContaCorrente" data-cc-print="${key}">Imprimir Extrato</button></div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="right">Débito</th><th class="right">Crédito</th><th class="right">Saldo</th></tr></thead>
    <tbody>${linhasLedger}</tbody></table>
  </div>
  <div class="card" style="margin-top:14px;background:${totalEmAberto>0.5?'#fdeceb':'var(--verde-claro)'};border-color:${totalEmAberto>0.5?'var(--vermelho)':'var(--verde)'};">
    Saldo em Aberto de <b>${ativo}</b>: <b>${fmt(totalEmAberto)} Kz</b> ${totalEmAberto<=0.5?`✅ ${isFornecedor?'Sem dívida a esta entidade':'Sem dívida'}`:`⚠️ ${isFornecedor?'Ainda devemos a esta entidade':'Cliente ainda deve'}`}
  </div>` : ''}`;
}

/* ---------- Conciliação Bancária ---------- */
const MESES_CONCILIACAO = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function viewBancos(){
  const contasBanco = CONTAS.filter(c=>c.codigo!=='CASH');
  if(!contasBanco.find(c=>c.codigo===bancoTabAtivo)) bancoTabAtivo = contasBanco[0].codigo;
  const conta = contasBanco.find(c=>c.codigo===bancoTabAtivo);
  const ano = bancoAnoAtivo;

  const cfg = (DB.bancosConfig && DB.bancosConfig[conta.codigo]) || {};
  const anoBase = anoBaseContaBanco(conta.codigo);
  const saldoAbertura = saldoAberturaContaAno(conta.codigo, ano);
  const ajustes = Number(cfg.ajustes||0);

  function manual(mesIdx, campo){
    const key = `${conta.codigo}:${ano}:${mesIdx}`;
    const r = (DB.saldosBancarios && DB.saldosBancarios[key]) || {};
    return Number(r[campo]||0);
  }

  /* Propositadamente NÃO se usa valorEmKZ aqui: cada conta bancária tem a sua própria
     moeda (BAI-EUR-001 é EUR, BAI-USD-002 é USD) e o extrato do banco vem nessa mesma
     moeda nativa — por isso os saldos ficam na moeda da própria conta, para bater certo
     com o extrato real. Isto é diferente do Balanço/DRE, que somam TODAS as contas
     juntas num único total em Kz. */
  const saldoInicial=[], movimento=[], saldoContabNosso=[], saldoDispNosso=[], saldoDispExtrato=[], diferenca=[];
  for(let m=0;m<12;m++){
    saldoInicial[m] = m===0 ? saldoAbertura : saldoContabNosso[m-1];
    const chaveMes = `${ano}-${String(m+1).padStart(2,'0')}`;
    /* Faltava excluir lançamentos neutralizados — o próprio sistema define
       "neutralizado" como fora de TODOS os relatórios oficiais (não só da
       lista de Lançamentos), e todos os outros cálculos de saldo por conta
       (Reavaliação Cambial, Fluxo de Caixa, Conta Corrente) já filtram
       !l.neutralizado. A Conciliação Bancária era a exceção — um lançamento
       neutralizado continuava a mexer no "Saldo Contabilístico (nosso,
       calculado)", criando uma diferença falsa face ao extrato real do banco. */
    movimento[m] = DB.lancamentos.filter(l=>l.conta===conta.codigo && !l.neutralizado && mesKey(l.data)===chaveMes)
      .reduce((s,l)=> s + (l.tipo==='Receita'? Number(l.valor||0) : -Number(l.valor||0)), 0);
    saldoContabNosso[m] = saldoInicial[m] + movimento[m];
    saldoDispNosso[m] = saldoContabNosso[m] - ajustes;
    saldoDispExtrato[m] = manual(m,'saldoDisponivel');
    diferenca[m] = saldoDispExtrato[m] - saldoDispNosso[m];
  }

  const tabs = contasBanco.map(c=>`<button type="button" class="tab-conta ${c.codigo===conta.codigo?'active':''}" data-banco-tab="${c.codigo}">${c.codigo}<br><small>${c.banco||''} · ${c.moeda||''}</small></button>`).join('');

  const linhaCalc = (label,arr,forte)=> `<tr${forte?' style="font-weight:bold;"':''}><td>${label}</td>${arr.map(v=>`<td class="right">${fmt(v)}</td>`).join('')}</tr>`;

  const linhaEstado = `<tr><td>Estado</td>${diferenca.map(v=> `<td class="right">${Math.round(v*100)===0? '<span class="badge pago">✓</span>' : '<span class="badge atraso">⚠</span>'}</td>`).join('')}</tr>`;

  const linhaManual = (label,campo)=> `<tr><td>${label}</td>${MESES_CONCILIACAO.map((m,i)=>`<td><input type="number" step="0.01" data-banco-manual="${conta.codigo}:${ano}:${i}:${campo}" value="${manual(i,campo)||''}" style="width:100px;"></td>`).join('')}</tr>`;

  const anosLanc = Array.from(new Set(DB.lancamentos.map(l=> Number(mesKey(l.data).slice(0,4))))).filter(a=>a);
  const anos = Array.from(new Set([...anosLanc, new Date().getFullYear()])).sort();

  const nContaExtrato = extraiNumeroContaBancaria(conta.numConta);
  const bancoExtrato = extraiCodigoBanco(conta.codigo) || extraiCodigoBanco(conta.banco);
  const semCorrelacao = lancamentosExtratoSemCorrelacao().filter(l=>l.conta===conta.codigo);

  return `
  <h2>🏦 Conciliação Bancária</h2>
  <p class="note">Dados das contas reais da empresa. Preencha o Saldo de Abertura e os Ajustes uma vez; preencha o Saldo Disponível do extrato todo mês para conferir com o sistema. Mais abaixo, importe o extrato real (CSV/Excel ou foto/PDF) para conferir transação a transação.</p>

  <div class="actions" style="margin-bottom:14px;">
    <button type="button" class="print" onclick="imprimirFichaConciliacaoAtual()">Imprimir ficha de conciliação</button>
  </div>



  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${tabs}</div>

  <div class="card" style="margin-bottom:18px;">
    <h3 style="margin:0 0 10px;font-family:Cambria,Georgia,serif;">CONTA ${conta.codigo} — ${conta.banco||''} (${conta.moeda||''})</h3>
    <table style="width:100%;font-size:12.5px;border:none;">
      <tr>
        <td class="lbl2">Banco:</td><td>${conta.banco||'—'}</td>
        <td class="lbl2">Nome da Conta:</td><td colspan="3">${conta.nomeConta||'—'}</td>
        <td class="lbl2">Moeda:</td><td>${conta.moeda||'—'}</td>
        <td class="lbl2">Natureza:</td><td>${conta.natureza||'—'}</td>
      </tr>
      <tr>
        <td class="lbl2">Nº de Conta:</td><td>${conta.numConta||'—'}</td>
        <td class="lbl2">IBAN:</td><td colspan="3">${conta.iban||'—'}</td>
        <td class="lbl2">SWIFT/BIC:</td><td colspan="2">${conta.swift||'—'}</td>
      </tr>
    </table>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;">
      <div>
        <label>Ano</label>
        <select id="bancoAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div>
        <label>Saldo de abertura em 01/Jan/${ano} ${ano>anoBase?`(transitado automaticamente do fecho de ${ano-1})`:`(ano base desta conta — valor inicial manual)`}</label>
        ${ano>anoBase
          ? `<input type="number" step="0.01" value="${saldoAbertura}" disabled title="Calculado automaticamente a partir do saldo de fecho de ${ano-1}. Para corrigir, ajuste os lançamentos de ${ano-1} ou o saldo de abertura do ano base (${anoBase}).">`
          : `<input type="number" step="0.01" data-banco-config-ano="${conta.codigo}:${anoBase}:saldoAbertura" value="${saldoAbertura}">`}
      </div>
      <div>
        <label>Ajustes conhecidos (cheques por compensar, tarifas não lançadas, etc.)</label>
        <input type="number" step="0.01" data-banco-config="${conta.codigo}:ajustes" value="${ajustes}">
      </div>
      <div>
        <label>🚨 Limite Mínimo de Saldo (Kz) — dispara alerta se o saldo cair abaixo</label>
        <input type="number" step="0.01" min="0" data-banco-config="${conta.codigo}:limiteMinimo" value="${Number(cfg.limiteMinimo||0)||''}" placeholder="Ex.: 500000">
      </div>
    </div>
  </div>

  <div class="tablewrap" style="margin-bottom:22px;">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaCalc('Saldo Inicial do Mês (calculado)', saldoInicial)}
        ${linhaCalc('(+/-) Movimento do Mês (calculado do LANÇAMENTO)', movimento)}
        ${linhaCalc('SALDO CONTABILÍSTICO (nosso, calculado)', saldoContabNosso, true)}
        ${linhaCalc('SALDO DISPONÍVEL (nosso, calculado)', saldoDispNosso, true)}
        ${linhaCalc('Saldo Disponível (extrato bancário) — igual ao lançamento manual abaixo', saldoDispExtrato)}
        ${linhaCalc('DIFERENÇA (Extrato − Saldo Disponível)', diferenca, true)}
        ${linhaEstado}
      </tbody>
    </table>
  </div>

  <h2 class="sub">LANÇAMENTO MANUAL — VALORES DO EXTRATO BANCÁRIO (preencher todo mês)</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Descrição</th>${MESES_CONCILIACAO.map(m=>`<th class="right">${m}</th>`).join('')}</tr></thead>
      <tbody>
        ${linhaManual('Saldo Transitado (extrato bancário)','saldoTransitado')}
        ${linhaManual('Saldo Contabilístico (extrato bancário)','saldoContabilistico')}
        ${linhaManual('Saldo Disponível (extrato bancário)','saldoDisponivel')}
      </tbody>
    </table>
  </div>

  <p class="note" style="background:var(--verde-claro);border-color:var(--verde);margin-top:22px;">
    ℹ️ Esta conta está configurada como: <strong>${conta.nome}</strong>
    <br><code>${bancoExtrato||'—'}–${nContaExtrato||'—'}</code> (Banco: ${bancoExtrato?bancoExtrato.toUpperCase():'—'}, Conta: ${nContaExtrato||'—'})
    <br>Os lançamentos criados a partir desta conta (botão "+ Lançar" abaixo) gravam este mesmo par Banco/Nº de Conta, para rastreabilidade.
  </p>
  ${semCorrelacao.length ? `
  <p class="note" style="border-color:var(--amarelo);background:#FFFAED;">
    ⚠️ <b>${semCorrelacao.length} lançamento(s) desta conta</b> tem/têm dados de extrato (Banco/Nº de Conta) que não correspondem a nenhuma conta do Plano de Contas — provavelmente um lançamento antigo editado à mão. Reveja:
    <ul style="margin:8px 0;">
      ${semCorrelacao.map(l=>`<li><code>${l.nContaExtrato}@${l.bancoExtrato}</code> — ${l.data} ${xmlEsc(l.descricao||'')} (${fmt(l.valor)} Kz)</li>`).join('')}
    </ul>
  </p>` : ''}
  ${viewConciliacaoExtratoImportado(conta.codigo)}`;
}

/* ---------- Conciliação de Extrato Bancário Importado (transação a transação) ---------- */
function viewConciliacaoExtratoImportado(contaCodigo){
  const {linhas, nConfere, nSoExtrato, nSoSistema, total} = calcularConciliacaoExtrato(contaCodigo);
  const badge = (status)=> status==='confere' ? '<span class="badge pago">✓ Confere</span>'
    : status==='so_extrato' ? '<span class="badge atraso">⚠ Só no extrato</span>'
    : '<span class="badge pendente">⚠ Só no sistema</span>';
  const linhasHtml = linhas.map(l=>{
    const sugestaoHtml = l.status==='so_extrato'
      ? `${l.categoriaSugerida?`<div style="font-size:12px;">💡 ${l.categoriaSugerida}${l.entidadeSugerida?` — ${xmlEsc(l.entidadeSugerida)}`:''}</div>`:'<div class="note" style="font-size:12px;">Sem sugestão</div>'}
         <button type="button" data-lancar-extrato="${contaCodigo}:${l.id}" style="font-size:12px;padding:2px 8px;">+ Lançar</button>`
      : '';
    return `<tr><td>${l.data||'—'}</td><td>${xmlEsc(l.descricao||'—')}</td><td class="right">${fmt(l.valor)}</td><td>${badge(l.status)}</td><td>${sugestaoHtml}</td></tr>`;
  }).join('') || `<tr><td colspan="5" class="note">Ainda não importaste o extrato desta conta.</td></tr>`;

  /* Resumo do mês corrente: tudo o que está "só no extrato" (pagamentos que já saíram do
     banco mas ainda não foram lançados no sistema) agrupado pela categoria sugerida — dá
     o cálculo, no fim do mês, de quanto falta lançar em cada categoria de despesa/receita
     usando a MESMA lógica de categorização automática que já existe nas Despesas. */
  const mesAtual = hoje().slice(0,7);
  const soExtratoMes = linhas.filter(l=>l.status==='so_extrato' && (l.data||'').startsWith(mesAtual));
  const porCategoria = {};
  soExtratoMes.forEach(l=>{
    const cat = l.categoriaSugerida || 'Sem categoria sugerida';
    porCategoria[cat] = porCategoria[cat]||{qtd:0,total:0};
    porCategoria[cat].qtd++; porCategoria[cat].total += Number(l.valor)||0;
  });
  const resumoMesHtml = Object.entries(porCategoria).map(([cat,v])=>
    `<tr><td>${cat}</td><td class="right">${v.qtd}</td><td class="right">${fmt(v.total)}</td></tr>`).join('');

  return `
  <h2 class="sub" style="font-size:15px;margin-top:24px;">🔎 Conciliação Automática — Extrato Real vs Lançamentos (transação a transação)</h2>
  <p class="note">Mesma lógica da Reconciliação SAF-T vs Fecho de Caixa, mas aqui compara-se o <b>extrato bancário real</b> desta conta com os lançamentos pagos/recebidos por Banco/TPA/Transferência — incluindo pagamentos a fornecedores por banco. Importa o extrato em CSV/Excel (mais fiável) ou tira uma foto/PDF para leitura automática por IA. Linhas "Só no extrato" recebem uma categoria sugerida (mesma lógica de categorização automática das Despesas) — clique "+ Lançar" para criar o lançamento já com essa categoria, ajustando depois se for preciso.</p>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px;">
    <div><label>Importar CSV ou Excel (.csv, .xls, .xlsx)</label><input type="file" id="extratoArquivoCSV" accept=".csv,.xls,.xlsx" data-conta="${contaCodigo}"></div>
    <div><label>Importar Foto ou PDF do Extrato (leitura por IA)</label><input type="file" id="extratoArquivoOCR" accept="image/*,application/pdf" data-conta="${contaCodigo}"></div>
  </div>
  <div id="extratoImportTag" class="note" style="margin-bottom:10px;"></div>
  ${total>0?`<div class="actions" style="margin-bottom:10px;"><button type="button" class="danger" id="btnLimparExtratoImportado" data-conta="${contaCodigo}">Limpar extrato importado desta conta</button></div>`:''}

  ${total>0?`
  <div class="cards" style="margin-bottom:10px;">
    <div class="card"><div class="lbl">Confere</div><div class="val pos">${nConfere}</div></div>
    <div class="card"><div class="lbl">Só no Extrato (falta lançar)</div><div class="val neg">${nSoExtrato}</div></div>
    <div class="card"><div class="lbl">Só no Sistema (não aparece no banco)</div><div class="val neg">${nSoSistema}</div></div>
  </div>`:''}
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="right">Valor</th><th>Estado</th><th>Sugestão</th></tr></thead>
  <tbody>${linhasHtml}</tbody></table></div>

  ${resumoMesHtml?`
  <h2 class="sub" style="font-size:15px;margin-top:20px;">📆 Resumo do Mês — Pagamentos ao Banco por Categoria (só extrato, ${mesAtual})</h2>
  <p class="note">Tudo o que saiu/entrou nesta conta este mês e ainda não tem lançamento correspondente, agrupado pela categoria sugerida — use como checklist para fechar o mês sem deixar nada por lançar.</p>
  <div class="tablewrap"><table><thead><tr><th>Categoria</th><th class="right">Qtd.</th><th class="right">Total</th></tr></thead>
  <tbody>${resumoMesHtml}</tbody></table></div>`:''}`;
}

/* ---------- Tabela de Câmbio ---------- */
const MESES=["01-JAN","02-FEV","03-MAR","04-ABR","05-MAI","06-JUN","07-JUL","08-AGO","09-SET","10-OUT","11-NOV","12-DEZ"];
function viewCambio(){
  const anosLanc = Array.from(new Set(DB.lancamentos.filter(l=>l.moeda!=='KZ').map(l=>Number(mesKey(l.data).slice(0,4)))));
  const anosCambio = Array.from(new Set(Object.keys(DB.cambio||{}).map(k=>Number(k.slice(0,4)))));
  const anos = Array.from(new Set([...anosLanc, ...anosCambio, new Date().getFullYear()])).sort((a,b)=>b-a);
  if(!anos.includes(cambioAnoAtivo)) cambioAnoAtivo = anos[0];
  const ano = cambioAnoAtivo;
  const semTaxaComMovimento = MESES.some((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const temMovEstrangeiro = DB.lancamentos.some(l=>l.moeda!=='KZ' && mesKey(l.data)===key);
    const r = DB.cambio[key]||{};
    return temMovEstrangeiro && (!r.EUR && !r.USD);
  });
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const r = DB.cambio[key]||{};
    const temEUR = DB.lancamentos.some(l=>l.moeda==='EUR' && mesKey(l.data)===key);
    const temUSD = DB.lancamentos.some(l=>l.moeda==='USD' && mesKey(l.data)===key);
    return `<tr>
      <td>${m} ${ano}</td>
      <td><input type="number" step="0.01" data-cambio="${key}:EUR" value="${r.EUR||''}" placeholder="Taxa EUR→KZ" style="width:130px;${temEUR&&!r.EUR?'border-color:var(--vermelho);':''}"></td>
      <td><input type="number" step="0.01" data-cambio="${key}:USD" value="${r.USD||''}" placeholder="Taxa USD→KZ" style="width:130px;${temUSD&&!r.USD?'border-color:var(--vermelho);':''}"></td>
      <td>${(temEUR&&!r.EUR)||(temUSD&&!r.USD)?'<span class="badge atraso" title="Há lançamentos em moeda estrangeira neste mês sem taxa preenchida — estão a ser convertidos para Kz como se 1 EUR/USD = 1 Kz.">⚠️ Falta taxa</span>':''}</td>
    </tr>`;
  }).join('');
  return `
  <h2>💱 Tabela de Câmbio (${ano})</h2>
  <p class="note">Preencha a taxa média mensal (1 EUR / 1 USD = X Kz). É usada para converter automaticamente os lançamentos em EUR/USD para Kz no Dashboard, Conciliação e DRE. Consulte o câmbio oficial do BNA. ${semTaxaComMovimento?'<b style="color:var(--vermelho);">⚠️ Há meses com lançamentos em EUR/USD sem taxa preenchida — esses valores estão a ser tratados como se já estivessem em Kz, o que distorce Balanço, DRE, Bancos e Reconciliação. Preencha a taxa desses meses assinalados abaixo.</b>':''}</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Ano</label><select id="cambioAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Taxa EUR → KZ</th><th>Taxa USD → KZ</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`;
}

/* ---------- Plano de Contas / Balancete ---------- */
let diarioMesAtivo = hoje().slice(0,7);

  const {contas, totalDebito, totalCredito} = calcularBalancetePartidasDobradas();
  const linhasBalancete = Object.values(contas).sort((a,b)=>a.cod.localeCompare(b.cod)).map(c=>{
    const saldo = c.debito - c.credito;
    return `<tr><td>${c.cod}</td><td>${c.nome}</td><td class="right">${fmt(c.debito)}</td><td class="right">${fmt(c.credito)}</td><td class="right"><b>${fmt(Math.abs(saldo))} ${saldo>=0?'D':'C'}</b></td></tr>`;
  }).join('') || `<tr><td colspan="5" class="note">Sem lançamentos ainda.</td></tr>`;
  const bate = Math.abs(totalDebito-totalCredito) < 0.5;

  const livroMes = gerarLivroDiario().filter(l=>mesKey(l.data)===diarioMesAtivo);
  const opcoesMes = [...new Set(gerarLivroDiario().map(l=>mesKey(l.data)).concat([hoje().slice(0,7)]))].sort().reverse();
  const linhasDiario = livroMes.map(l=>`
    <tr><td>${l.data}</td><td>${xmlEsc(l.descricao)}</td>

      <td>${l.credito.cod} — ${l.credito.nome}</td>

      <td><span class="note" style="margin:0;">${l.origem}</span></td></tr>`).join('') || `<tr><td colspan="6" class="note">Sem movimentos em ${diarioMesAtivo}.</td></tr>`;

  return `
  <h2>📚 Plano de Contas / Balancete — Partidas Dobradas</h2>
  <p class="note">Cada lançamento (e cada Conta a Pagar/Receber em aberto) gera automaticamente um par Débito/Crédito no Livro Diário — é contabilidade de dupla entrada real, não apenas soma de receitas e despesas. O Balancete abaixo agrega esse livro por conta. Confirme os códigos finais (SNC-AO) com o seu contabilista antes de submissões oficiais.</p>
  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};margin-bottom:14px;">
    Total Débito: <b>${fmt(totalDebito)} Kz</b> &nbsp;|&nbsp; Total Crédito: <b>${fmt(totalCredito)} Kz</b> &nbsp;|&nbsp;
    ${bate?'✅ Partidas dobradas batem (Débito = Crédito)':'⚠️ Diferença encontrada — reveja os lançamentos'}
  </div>
  <div class="tablewrap"><table><thead><tr><th>Código</th><th>Conta</th><th class="right">Total Débito</th><th class="right">Total Crédito</th><th class="right">Saldo</th></tr></thead>
  <tbody>${linhasBalancete}</tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:22px;">📖 Livro Diário — lançamentos por mês</h2>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:10px;">
    <div><label>Mês</label><select id="diarioMesSel">${opcoesMes.map(m=>`<option value="${m}" ${m===diarioMesAtivo?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Débito</th><th>Crédito</th><th class="right">Valor</th><th>Origem</th></tr></thead>
  <tbody>${linhasDiario}</tbody></table></div>`;
}
