/* ========== MÓDULO: ASSISTENTE "PERGUNTE À TESOURARIA" (v1 — padrões de pergunta) ==========
   Assistente conversacional simples: interpreta a pergunta do utilizador por
   reconhecimento de PADRÕES (palavras-chave/regex) e responde sempre a partir dos
   dados já calculados pelos módulos deste ERP (Previsão de Tesouraria, Contas a
   Pagar/Receber, Alertas, Dias de Caixa, Ponto de Equilíbrio). NÃO liga a nenhuma
   API de IA externa — é uma versão inicial, propositadamente limitada a um conjunto
   conhecido de perguntas; o que não reconhecer, mostra exemplos em vez de inventar
   uma resposta. O histórico da conversa (historicoAssistente) vive só em memória —
   não é gravado no DB nem persiste entre sessões, à semelhança de ultimoResumo. */
const ASSISTENTE_EXEMPLOS = [
  'Qual é o saldo atual?',
  'Qual vai ser o saldo daqui a 15 dias?',
  'Como está a previsão de tesouraria dos próximos 30 dias?',
  'O que tenho para pagar esta semana?',
  'Tenho contas a pagar em atraso?',
  'Tenho contas a receber em atraso?',
  'Quais são os alertas financeiros?',
  'Quantos dias de caixa tenho disponíveis?',
  'Qual é o ponto de equilíbrio este ano?',
];
/* Extrai um número de dias da pergunta — de forma literal ("10 dias") ou de
   expressões comuns ("amanhã", "esta semana", "quinzena", "este mês"). Devolve
   null se não encontrar nenhuma referência temporal (o chamador decide o default). */
function extrairNumeroDiasPergunta(texto){
  const m = texto.match(/(\d+)\s*dias?/);
  if(m) return Math.max(1, Math.min(365, Number(m[1])));
  if(/amanh[ãa]/.test(texto)) return 1;
  if(/esta semana|pr[óo]xima semana|1 semana|uma semana/.test(texto)) return 7;
  if(/quinzena|15 dias/.test(texto)) return 15;
  if(/este m[êe]s|pr[óo]ximo m[êe]s|um m[êe]s/.test(texto)) return 30;
  return null;
}
function responderPerguntaTesouraria(perguntaOriginal){
  const p = (perguntaOriginal||'').toLowerCase().trim();
  if(!p) return { resposta: 'Escreva uma pergunta sobre a tesouraria — ex.: "Qual é o saldo atual?".' };
  const listaExemplos = () => ASSISTENTE_EXEMPLOS.map(e=>`• ${e}`).join('<br>');

  if(/ajuda|o que posso perguntar|exemplos|como funciona/.test(p)){
    return { resposta: `Pode perguntar-me coisas como:<br>${listaExemplos()}` };
  }

  // Saldo atual (só dispara se NÃO houver referência a dias/previsão — isso vai para o bloco seguinte)
  if(/saldo (atual|de hoje|agora)|quanto (tenho|h[áa]|existe) em caixa|quanto dinheiro (tenho|h[áa])|caixa dispon[íi]vel agora/.test(p) && !/dias|previs|amanh[ãa]|semana|m[êe]s/.test(p)){
    const saldo = calcularSaldoAtual();
    return { resposta: `O saldo atual (todas as contas, exceto Suprimentos de Sócios) é de <b>${fmt(saldo)} Kz</b>.`, tab:'previsaoTesouraria' };
  }

  // Saldo projetado daqui a N dias
  const nDias = extrairNumeroDiasPergunta(p);
  if(nDias && /saldo|previs[ãa]o|vou ter|vou ficar/.test(p)){
    const r = gerarPrevisaoFluxoCaixa(Math.min(nDias,90));
    if(!r.ok) return { resposta: `Ainda não consigo calcular a previsão: ${r.msg}.` };
    const ultimo = r.previsao[r.previsao.length-1];
    return { resposta: `Com base no histórico, o saldo projetado daqui a ${nDias} dia(s) (${fmtData(new Date(ultimo.data+'T00:00:00'))}) é de <b>${fmt(ultimo.saldoProjetado)} Kz</b>${ultimo.emRisco?' — ⚠️ abaixo do limite de segurança de 50.000 Kz.':'.'}`, tab:'previsaoTesouraria' };
  }

  // Resumo da previsão 30/60/90 dias, risco de caixa
  if(/previs[ãa]o de tesouraria|pr[óo]ximos (30|60|90) dias|risco de caixa|vou ficar sem dinheiro|fluxo de caixa/.test(p)){
    const r = resumoPrevisaoTesouraria();
    if(!r.ok) return { resposta: `Ainda não consigo calcular a previsão: ${r.msg}.` };
    return { resposta: `Saldo atual: <b>${fmt(r.saldoAtual)} Kz</b>.<br>
      Próx. 30 dias: saldo final ${fmt(r.proximos30.saldoFinal)} Kz (mínimo ${fmt(r.proximos30.minimo)} Kz, ${r.proximos30.diasEmRisco} dia(s) em risco).<br>
      Próx. 60 dias: saldo final ${fmt(r.proximos60.saldoFinal)} Kz.<br>
      Próx. 90 dias: saldo final ${fmt(r.proximos90.saldoFinal)} Kz.${r.alerta ? '<br>⚠️ '+r.alerta : ''}`, tab:'previsaoTesouraria' };
  }

  // Contas a pagar em atraso
  if(/pagar.*(atraso|vencid)|(atraso|vencid).*pagar/.test(p)){
    const hojeStr = hoje();
    const vencidas = DB.contasPagar.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5 && c.vencimento < hojeStr);
    if(!vencidas.length) return { resposta: 'Não há contas a pagar em atraso neste momento. ✅', tab:'pagar' };
    const total = vencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0);
    return { resposta: `Há <b>${vencidas.length}</b> conta(s) a pagar em atraso, totalizando <b>${fmt(total)} Kz</b>:<br>` + vencidas.slice(0,10).map(c=>`• ${c.entidade} — ${fmt(Number(c.valor||0)-Number(c.valorPago||0))} Kz (venceu em ${fmtData(new Date(c.vencimento+'T00:00:00'))})`).join('<br>'), tab:'pagar' };
  }

  // Contas a pagar em geral / nos próximos N dias
  if(/(o que|quanto).*(tenho|h[áa]).*pagar|contas a pagar|quanto vou pagar/.test(p)){
    const dias = nDias || 7;
    const hojeStr = hoje();
    const limite = new Date(hojeStr); limite.setDate(limite.getDate()+dias);
    const limiteStr = limite.toISOString().slice(0,10);
    const aPagar = DB.contasPagar.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5 && c.vencimento>=hojeStr && c.vencimento<=limiteStr);
    if(!aPagar.length) return { resposta: `Não há contas a pagar a vencer nos próximos ${dias} dias.`, tab:'pagar' };
    const total = aPagar.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0);
    return { resposta: `Nos próximos ${dias} dias há <b>${aPagar.length}</b> conta(s) a pagar, totalizando <b>${fmt(total)} Kz</b>:<br>` + aPagar.slice(0,10).map(c=>`• ${c.entidade} — ${fmt(Number(c.valor||0)-Number(c.valorPago||0))} Kz (vence em ${fmtData(new Date(c.vencimento+'T00:00:00'))})`).join('<br>'), tab:'pagar' };
  }

  // Contas a receber em atraso
  if(/receber.*(atraso|vencid)|(atraso|vencid).*receber/.test(p)){
    const hojeStr = hoje();
    const vencidas = DB.contasReceber.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5 && c.vencimento < hojeStr);
    if(!vencidas.length) return { resposta: 'Não há contas a receber em atraso neste momento. ✅', tab:'receber' };
    const total = vencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0);
    return { resposta: `Há <b>${vencidas.length}</b> conta(s) a receber em atraso, totalizando <b>${fmt(total)} Kz</b>:<br>` + vencidas.slice(0,10).map(c=>`• ${c.entidade} — ${fmt(Number(c.valor||0)-Number(c.valorPago||0))} Kz (venceu em ${fmtData(new Date(c.vencimento+'T00:00:00'))})`).join('<br>'), tab:'receber' };
  }

  // Contas a receber em geral
  if(/contas a receber|quem me deve|quanto vou receber/.test(p)){
    const receberAberto = DB.contasReceber.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
    if(!receberAberto.length) return { resposta: 'Não há contas a receber em aberto.', tab:'receber' };
    const total = receberAberto.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0);
    return { resposta: `Há <b>${receberAberto.length}</b> conta(s) a receber em aberto, totalizando <b>${fmt(total)} Kz</b>.`, tab:'receber' };
  }

  // Alertas financeiros
  if(/alerta|aviso/.test(p)){
    const alertas = calcularAlertasFinanceiros();
    if(!alertas.length) return { resposta: 'Sem alertas financeiros ativos neste momento. ✅', tab:'alertas' };
    return { resposta: `Há <b>${alertas.length}</b> alerta(s) ativo(s):<br>` + alertas.slice(0,10).map(a=>`• ${a.texto}`).join('<br>'), tab:'alertas' };
  }

  // Dias de caixa disponível
  if(/dias de caixa|quanto tempo (aguento|dura|sobrevivo)|autonomia de caixa/.test(p)){
    const r = calcularDiasCaixaDisponivel();
    if(r.dias==null) return { resposta: 'Ainda não há despesa média suficiente nos últimos 90 dias para calcular os dias de caixa disponível.' };
    return { resposta: `Ao ritmo médio de despesa dos últimos 90 dias (${fmt(r.despesaMediaDiaria)} Kz/dia), o saldo atual de ${fmt(r.saldoTotal)} Kz dá para <b>${r.dias.toFixed(0)} dia(s)</b> de operação.` };
  }

  // Ponto de equilíbrio
  if(/ponto de equil[íi]brio|break.?even/.test(p)){
    const r = calcularPontoEquilibrio();
    if(r.pontoEquilibrio==null) return { resposta: 'Ainda não há dados suficientes este ano para calcular o Ponto de Equilíbrio (falta margem de contribuição positiva ou classificação de custos em Fixo/Variável).', tab:'orcamento' };
    return { resposta: `Ponto de Equilíbrio de ${r.ano}: receita anual necessária de <b>${fmt(r.pontoEquilibrio)} Kz</b> (custos fixos ${fmt(r.custosFixos)} Kz, margem de contribuição ${(r.margemContribuicaoPct*100).toFixed(1)}%).${r.categoriasPendentes.length?` ⚠️ ${r.categoriasPendentes.length} categoria(s) ainda por classificar em Fixo/Variável.`:''}`, tab:'orcamento' };
  }

  // Fallback — não inventa resposta, mostra o que já sabe responder
  return { resposta: `Ainda não sei responder a essa pergunta — esta é uma primeira versão, baseada em padrões conhecidos, sem ligação a nenhuma IA externa. Pode tentar perguntas como:<br>${listaExemplos()}` };
}

/* uid() gerava IDs com Math.random().toString(36) — não é garantidamente único; com volume
   suficiente de lançamentos há risco real de colisão, o que corromperia referências como
   estornoDeId ou transferenciaId (dois registos diferentes a partilhar o mesmo id). Usa-se
   agora crypto.randomUUID() quando disponível (praticamente todos os browsers atuais),
   com um fallback para crypto.getRandomValues() em ambientes mais antigos — em qualquer
   dos casos, com entropia criptográfica real em vez de Math.random(). */
function uid(){
  if(typeof crypto!=='undefined' && typeof crypto.randomUUID==='function') return crypto.randomUUID();
  if(typeof crypto!=='undefined' && typeof crypto.getRandomValues==='function'){
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40; bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
    return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
  }
  // último recurso (ambiente sem Web Crypto) — mantém o comportamento antigo apenas como rede de segurança
  return Math.random().toString(36).slice(2,10)+Date.now().toString(36);
}
function fmt(n){ return (Number(n)||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function hoje(){ return new Date().toISOString().slice(0,10); }

/* ---------- Cálculo IRT ---------- */
function calcIRT(baseTributavel){
  const b = Number(baseTributavel)||0;
  const esc = IRT_ESCALOES.find(e=> b>e.inf && b<=e.sup) || IRT_ESCALOES[0];
  if(b<=150000) return 0;
  return esc.fixa + (b - esc.inf) * esc.taxa;
}

/* ---------- Barra genérica de Filtro por Período/Posto + Exportação + Impressão ----------
   Reutilizável em qualquer módulo com lista (FaturaBot, Salários, Suprimentos, Log, DRE,
   Amortizações, etc.) sem duplicar a lógica já existente em Lançamentos/Contas a Pagar-Receber.
   MODULOS_FILTRO regista, por módulo (chave), como obter a lista, o campo de data e (opcional)
   o campo de posto/origem a filtrar, e como transformar cada registo numa linha para
   Exportar (Excel) / Imprimir (PDF). */
let filtrosModulo = {};
function fmod(key){ filtrosModulo[key] = filtrosModulo[key] || {de:'', ate:'', origem:'', turno:''}; return filtrosModulo[key]; }
const MODULOS_FILTRO = {}; // preenchido mais abaixo, junto de cada view (registrarFiltroModulo)
function registrarFiltroModulo(key, cfg){ MODULOS_FILTRO[key] = cfg; }
function listaFiltradaModulo(key){
  const cfg = MODULOS_FILTRO[key]; if(!cfg) return [];
  const f = fmod(key);
  return cfg.getLista().filter(item=>{
    const d = cfg.campoData ? item[cfg.campoData] : null;
    if(cfg.campoData){
      if(f.de && (!d || d < f.de)) return false;
      if(f.ate && (!d || d > f.ate)) return false;
    }
    if(cfg.campoOrigem && f.origem && item[cfg.campoOrigem] !== f.origem) return false;
    if(cfg.campoTurno && f.turno && (item[cfg.campoTurno]||'') !== f.turno) return false;
    return true;
  });
}
function barraFiltroModuloHTML(key, opts){
  const cfg = opts||{};
  const f = fmod(key);
  return `
  <form class="inline" id="formFiltroMod_${key}" onsubmit="return false;">
    <div class="grid">
      ${cfg.comPeriodo!==false ? `
      <div><label>De</label><input type="date" data-fm-campo="de" data-fm-key="${key}" value="${f.de}"></div>
      <div><label>Até</label><input type="date" data-fm-campo="ate" data-fm-key="${key}" value="${f.ate}"></div>` : ''}
      ${cfg.comPosto ? `<div><label>${cfg.labelPosto||'Posto (Origem)'}</label><select data-fm-campo="origem" data-fm-key="${key}"><option value="">Todos</option>${(cfg.listaPosto||ORIGENS).map(o=>`<option ${f.origem===o?'selected':''}>${o}</option>`).join('')}</select></div>` : ''}
      ${cfg.comTurno ? `<div><label>${cfg.labelTurno||'Turno'}</label><select data-fm-campo="turno" data-fm-key="${key}"><option value="">Todos</option>${TURNOS.map(t=>`<option ${f.turno===t?'selected':''}>${t}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="actions">
      <button type="button" data-fm-limpar="${key}" class="sec">Limpar filtros</button>
      <button type="button" data-fm-exportar="${key}" class="sec">⬇️ Exportar (Excel)</button>
      <button type="button" data-fm-imprimir="${key}" class="print">Imprimir / PDF</button>
    </div>
  </form>`;
}
function bindBarraFiltroModulo(){
  document.querySelectorAll('[data-fm-campo]').forEach(el=>el.onchange=()=>{
    const key = el.dataset.fmKey, campo = el.dataset.fmCampo;
    fmod(key)[campo] = el.value; render();
  });
  document.querySelectorAll('[data-fm-limpar]').forEach(b=>b.onclick=()=>{
    filtrosModulo[b.dataset.fmLimpar] = {de:'',ate:'',origem:'',turno:''}; render();

  document.querySelectorAll('[data-fm-exportar]').forEach(b=>b.onclick=()=>{
    const key = b.dataset.fmExportar, cfg = MODULOS_FILTRO[key]; if(!cfg) return;
    const lista = listaFiltradaModulo(key);
    if(!lista.length){ toast('Sem registos para exportar com este filtro.'); return; }

  document.querySelectorAll('[data-fm-imprimir]').forEach(b=>b.onclick=()=>{

  });
}

function imprimirFichaConciliacaoAtual(){
  const contasBanco = CONTAS.filter(c=>c.codigo!=='CASH');
  const conta = contasBanco.find(c=>c.codigo===bancoTabAtivo) || contasBanco[0];
  const ano = bancoAnoAtivo;
  const cfg = (DB.bancosConfig && DB.bancosConfig[conta.codigo]) || {};
  const saldoAbertura = saldoAberturaContaAno(conta.codigo, ano);
  const ajustes = Number(cfg.ajustes||0);
  const meses = [];
  let saldoContab = saldoAbertura;
  for(let m=0;m<12;m++){
    const chaveMes = `${ano}-${String(m+1).padStart(2,'0')}`;
    const mov = DB.lancamentos.filter(l=>l.conta===conta.codigo && mesKey(l.data)===chaveMes)
      .reduce((s,l)=> s + (l.tipo==='Receita'? Number(l.valor||0) : -Number(l.valor||0)), 0);
    const inicial = m===0 ? saldoAbertura : saldoContab;
    saldoContab = inicial + mov;
    const dispNosso = saldoContab - ajustes;
    const key = `${conta.codigo}:${ano}:${m}`;
    const r = (DB.saldosBancarios && DB.saldosBancarios[key]) || {};
    const dispExtrato = Number(r.saldoDisponivel||0);
    meses.push({sistema:dispNosso, extrato:dispExtrato, diferenca:dispExtrato-dispNosso});
  }
  abrirImpressao(docFichaConciliacao(conta,ano,meses));
}

/* ---------- Resumo Diário de Caixa (documento ÚNICO de controlo interno) ----------
   Em vez de imprimir uma Fatura separada por cada lançamento/Nº de Fatura do dia (o que
   gerava vários papéis para o mesmo fecho), esta função consolida TODOS os lançamentos
   de uma data (e, opcionalmente, de uma Unidade de Negócio e/ou Turno) num único documento:
   lista os lançamentos, agrupa por Forma de Pagamento (Receita/Despesa/Líquido) e confere com
   a Contagem Física declarada nesse dia/turno, se existir. "turno" é opcional — quando não é
   indicado, mantém-se o comportamento antigo (junta o dia inteiro, todos os turnos). */
function linhasResumoCaixaDia(data, unidade, turno){
  const doDia = DB.lancamentos.filter(l=> l.data===data && (!unidade || l.unidade===unidade || l.origem===unidade) && (!turno || (l.turno||'')===turno));
  const porForma = {};
  FORMAS_PAGAMENTO.forEach(f=> porForma[f] = {receita:0, despesa:0});
  let totalReceitas=0, totalDespesas=0;
  doDia.forEach(l=>{
    const v = valorEmKZ(l);
    const forma = l.formaPagamento || 'Cash';
    porForma[forma] = porForma[forma] || {receita:0, despesa:0};
    if(l.tipo==='Receita'){ porForma[forma].receita += v; totalReceitas += v; }
    else { porForma[forma].despesa += v; totalDespesas += v; }
  });
  const declaracao = (DB.fechosCaixa||[]).find(f=> f.data===data && (!unidade || f.unidade===unidade) && (!turno || (f.turno||'')===turno));
  return { doDia, porForma, totalReceitas, totalDespesas, saldoLiquido: totalReceitas-totalDespesas, declaracao };
}
function docResumoFechoCaixa(data, unidade, turno){
  /* Reforço: papel "caixa" nunca imprime resumo de outro posto, mesmo que "unidade"
     chegue diferente por algum motivo — trava sempre no Posto de Venda atribuído. */
  if(meuPapel==='caixa') unidade = meuPosto||'';
  const {doDia, porForma, totalReceitas, totalDespesas, saldoLiquido, declaracao} = linhasResumoCaixaDia(data, unidade, turno);
  const gridMov = `
  <h3 class="print-section-title">Lançamentos do Dia (${doDia.length})</h3>
  <table class="print-grid-table">
    <thead><tr><th>Tipo</th><th>Categoria</th><th>Forma</th><th>Entidade</th><th>Nº Fatura</th><th class="right">Valor (Kz)</th></tr></thead>
    <tbody>${doDia.length? doDia.slice().sort((a,b)=>(a.tipo).localeCompare(b.tipo)).map(l=>`<tr><td>${l.tipo}</td><td>${l.categoria}</td><td>${l.formaPagamento||'—'}</td><td>${xmlEsc(l.entidade||'—')}</td><td>${xmlEsc(l.nFatura||'—')}</td><td class="right">${fmt(valorEmKZ(l))}</td></tr>`).join('') : `<tr><td colspan="6">Sem lançamentos nesta data${unidade?' / unidade':''}${turno?' / turno':''}.</td></tr>`}</tbody>
  </table>`;
  const linhasForma = Object.entries(porForma).filter(([,v])=> v.receita>0.5 || v.despesa>0.5)
    .map(([forma,v])=>[forma, fmt(v.receita)+' Kz', fmt(v.despesa)+' Kz', fmt(v.receita-v.despesa)+' Kz']);
  const gridForma = `
  <h3 class="print-section-title">Resumo por Forma de Pagamento</h3>
  <table class="print-grid-table">
    <thead><tr><th>Forma de Pagamento</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Líquido</th></tr></thead>
    <tbody>${linhasForma.length? linhasForma.map(l=>`<tr>${l.map((v,i)=>`<td${i>0?' class="right"':''}>${v}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="4">Sem movimentos.</td></tr>`}
    <tr style="font-weight:bold;"><td>TOTAL</td><td class="right">${fmt(totalReceitas)} Kz</td><td class="right">${fmt(totalDespesas)} Kz</td><td class="right">${fmt(saldoLiquido)} Kz</td></tr>
    </tbody>
  </table>`;
  const conferenciaHTML = printSectionHTML('Conferência com Contagem Física Declarada',
    declaracao ? [
      ['Valor Contado (declarado pelo operador)', fmt(Number(declaracao.valorContado||0))+' '+declaracao.moeda],
      ['Saldo Líquido Lançado no Sistema', fmt(saldoLiquido)+' Kz'],
      ['Diferença', fmt(saldoLiquido - Number(declaracao.valorContado||0))+' Kz'],
      ['Observação do operador', declaracao.observacao||'—'],
    ] : [['Estado', `Ainda sem Contagem Física declarada para ${data}${unidade?' / '+unidade:''}${turno?' / turno '+turno:''}.`]],
    true);
  return printDocHTML({
    code: turno ? `DOC-CX-${data.replace(/-/g,'')}-${turno.slice(0,3).toUpperCase()}` : 'DOC-CX-'+data.replace(/-/g,''),
    title:'Resumo de Fecho de Caixa (Documento Único do Dia/Turno)',
    subtitle:`Documento de controlo interno que consolida TODOS os lançamentos do dia (ou do turno, quando indicado) num único documento — substitui a impressão separada de cada lançamento/fatura. Data: ${data}${unidade?' · Unidade: '+unidade:''}${turno?' · Turno: '+turno:''}.`,
    sections:[
      {heading:'Identificação', rows:[
        ['Data', data],
        ['Unidade de Negócio', unidade||'Todas'],
        ['Turno', turno||'Dia inteiro / turno único'],
        ['Nº de Lançamentos', String(doDia.length)],
      ]},
    ],
    gridHTML: gridMov + gridForma + conferenciaHTML,
    note:'Este documento deve ser o único suporte impresso do fecho de caixa do dia (ou do turno) — não imprima faturas individuais para o mesmo fecho.',
    signatures:['Operador de Caixa · Data','Conferido por (Tesouraria/Administração) · Data'],
  });
}

function docFaturaVenda(linhas){
  /* Aceita um único lançamento ou um grupo de lançamentos com o mesmo Nº de Fatura
     (caso de faturas com pagamento dividido por mais do que uma forma de pagamento). */
  const grupo = Array.isArray(linhas) ? linhas : [linhas];
  const l = grupo[0];
  const totalGeral = grupo.reduce((s,x)=> s + Number(x.valor||0), 0);
  const subtotalGeral = grupo.reduce((s,x)=>{
    const st = x.iva==='Sim' ? Number(x.valor||0)/(1+Number(x.taxaIVA||0)) : Number(x.valor||0);
    return s + st;
  }, 0);
  const ivaGeral = totalGeral - subtotalGeral;
  const produto = l.produtoId ? (DB.produtos.find(p=>p.id===l.produtoId)||{}).nome : '';
  const pagamentosRows = grupo.map(x=>[`${x.formaPagamento||'—'} (${x.conta||'—'})`, fmt(x.valor)+' '+x.moeda]);
  return printDocHTML({
    code:'FATURA', title:'Fatura',
    subtitle:'Documento emitido manualmente pelo caixa — sujeito a comunicação periódica à AGT via ficheiro SAF-T, nos termos do Regime Jurídico das Facturas.',
    sections:[
      {heading:'Identificação', rows:[
        ['Nº da Fatura', l.nFatura||'—'],
        ['Data', l.data||'—'],
        ['Unidade / Loja', l.unidade||'—'],
        ['Cliente', l.entidade||'Consumidor Final'],
        ['NIF do Cliente', l.nif||'—'],
      ]},
      {heading:'Descrição', rows:[
        ['Descrição', l.descricao || produto || '—'],
        ['Quantidade', l.quantidade ? fmt(l.quantidade) : '1'],
      ]},
      {heading: grupo.length>1 ? 'Formas de Pagamento (fatura dividida)' : 'Forma de Pagamento', rows:
        grupo.length>1 ? pagamentosRows : [['Forma de Pagamento', `${l.formaPagamento||'—'} (${l.conta||'—'})`]]
      },
      {heading:'Valores', rows:[
        ['Subtotal (s/ IVA)', fmt(subtotalGeral)+' '+l.moeda],

        ['Valor de IVA', fmt(ivaGeral)+' '+l.moeda],
        ['TOTAL', fmt(totalGeral)+' '+l.moeda],
      ], highlight:true},
    ],
    note:'Fatura emitida em regime manual, nos termos previstos para contribuintes ainda não obrigados à faturação eletrónica certificada. Os dados desta fatura são incluídos no ficheiro SAF-T submetido periodicamente à AGT.',
    signatures:['Emitido por (Caixa) · Data', 'Cliente (se aplicável) · Data'],
  });
}

function docReciboVencimento(s){
  const bruto = Number(s.base||0)+Number(s.subsidios||0);
  const inssTrab = bruto*INSS_TAXA_TRABALHADOR;
  const baseIRT = bruto - inssTrab;
  const irt = calcIRT(baseIRT);
  const outros = Number(s.outrosDesc||0);
  const liquido = bruto - inssTrab - irt - outros;
  const inssEmp = bruto*INSS_TAXA_EMPRESA;
  const custoTotal = bruto + inssEmp;
  return printDocHTML({
    code:'DOC-RH-01', title:'Recibo de Vencimento',
    subtitle:'Contra-recibo de pagamento de salário — a preencher e assinar em duplicado (trabalhador e arquivo da empresa).',
    sections:[
      {heading:'Identificação do Trabalhador', rows:[
        ['Nome completo', s.nome],
        ['Função', s.funcao||'—'],
      ]},
      {heading:'Composição da Remuneração', rows:[
        ['Salário Base', fmt(s.base)+' Kz'],
        ['Subsídios / Abonos', fmt(s.subsidios||0)+' Kz'],

        ['INSS Trabalhador (3%)', fmt(inssTrab)+' Kz'],

}

/* ---------- Alertas Financeiros ---------- */
function calcularAlertasFinanceiros(){
  const alertas = [];
  const hojeStr = hoje();
  const emDias = (d,n)=>{ const dt=new Date(hojeStr); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); };
  const daqui7 = emDias(hojeStr,7);

  // Contas a Pagar vencidas / a vencer
  const pagarAberto = DB.contasPagar.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const pagarVencidas = pagarAberto.filter(c=>c.vencimento < hojeStr);
  const pagarAVencer = pagarAberto.filter(c=>c.vencimento >= hojeStr && c.vencimento <= daqui7);
  if(pagarVencidas.length) alertas.push({nivel:'alto', tab:'pagar', texto:`${pagarVencidas.length} conta(s) a pagar em atraso, totalizando ${fmt(pagarVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});
  if(pagarAVencer.length) alertas.push({nivel:'medio', tab:'pagar', texto:`${pagarAVencer.length} conta(s) a pagar vencem nos próximos 7 dias, totalizando ${fmt(pagarAVencer.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // ⚠️ Lembrete específico: Conta a Pagar vence AMANHÃ (alerta inteligente em tempo real)
  const amanhaStr = emDias(hojeStr,1);
  const pagarAmanha = pagarAberto.filter(c=>c.vencimento === amanhaStr);
  if(pagarAmanha.length) alertas.push({nivel:'alto', tab:'pagar', texto:`⚠️ Lembrete de pagamento: ${pagarAmanha.length} conta(s) a pagar vence(m) AMANHÃ (${fmtData(new Date(amanhaStr+'T00:00:00'))}), totalizando ${fmt(pagarAmanha.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz — ${pagarAmanha.map(c=>c.entidade).join(', ')}.`});

  // Contas a Receber vencidas
  const receberAberto = DB.contasReceber.filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const receberVencidas = receberAberto.filter(c=>c.vencimento < hojeStr);
  if(receberVencidas.length) alertas.push({nivel:'alto', tab:'receber', texto:`${receberVencidas.length} conta(s) a receber em atraso, totalizando ${fmt(receberVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // 💳 TPA de cliente em atraso — cobranças esperadas via TPA (Multicaixa) que já venceram
  const receberVencidasTPA = receberVencidas.filter(c=>c.formaPagamentoEsperada==='TPA (Multicaixa)');
  if(receberVencidasTPA.length) alertas.push({nivel:'alto', tab:'receber', texto:`💳 ${receberVencidasTPA.length} cobrança(s) via TPA de cliente em atraso, totalizando ${fmt(receberVencidasTPA.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz — ${receberVencidasTPA.map(c=>c.entidade).join(', ')}.`});

  // ❌ Ordens de Compra a aguardar aprovação há mais de 2 dias (cobrar aprovador)
  const ocsPendentesAprovacao = (DB.ordensCompra||[]).filter(o=> (o.estado==='Pendente' || o.estado==='Aguarda 2ª Aprovação') && o.dataCriacao);
  const ocsAtrasadas = ocsPendentesAprovacao.filter(o=> diasEntre(hojeStr, o.dataCriacao.slice(0,10)) > 2);
  if(ocsAtrasadas.length){
    const aprovadoresConfig = (DB.config && DB.config.aprovacoes && DB.config.aprovacoes.usuariosAprovadores) || [];
    const quemCobrar = aprovadoresConfig.length ? aprovadoresConfig.join(', ') : 'os aprovadores configurados em Ordens de Compra';
    alertas.push({nivel:'alto', tab:'ordensCompra', texto:`❌ ${ocsAtrasadas.length} Ordem(ns) de Compra aguardam aprovação há mais de 2 dias, totalizando ${fmt(ocsAtrasadas.reduce((s,o)=>s+Number(o.valorEstimado||0),0))} Kz — cobrar aprovador(es): ${quemCobrar}.`});
  }

  // Pagamentos a Prestadores de Serviços vencidos / a vencer
  const prestAberto = (DB.prestadoresServicos||[]).filter(c=>(Number(c.valor||0)-Number(c.valorPago||0))>0.5);
  const prestVencidas = prestAberto.filter(c=>c.vencimento < hojeStr);
  const prestAVencer = prestAberto.filter(c=>c.vencimento >= hojeStr && c.vencimento <= daqui7);
  if(prestVencidas.length) alertas.push({nivel:'alto', tab:'prestadores', texto:`${prestVencidas.length} pagamento(s) a prestador(es) de serviços em atraso, totalizando ${fmt(prestVencidas.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});
  if(prestAVencer.length) alertas.push({nivel:'medio', tab:'prestadores', texto:`${prestAVencer.length} pagamento(s) a prestador(es) de serviços vencem nos próximos 7 dias, totalizando ${fmt(prestAVencer.reduce((s,c)=>s+(Number(c.valor||0)-Number(c.valorPago||0)),0))} Kz.`});

  // Despesas de "Serviços de Terceiros" lançadas fora do módulo Prestadores de Serviços
  // (via Lançamentos/FaturaBot) — não passam pelo cálculo de Retenção na Fonte (AGT).
  // Exclui pagamentos que já vêm de um registo de Contas a Pagar marcado como Prestador de
  // Serviço (esses já têm o espelho com Retenção AGT em Prestadores — ver "ehPrestadorServico").
  const servicosForaPrestadores = DB.lancamentos.filter(l=>
    l.tipo==='Despesa' && l.categoria==='Serviços de Terceiros' &&
    !(l.contaCorrenteChave==='contasPagar' && (DB.contasPagar||[]).some(c=>c.id===l.contaCorrenteId && c.ehPrestadorServico)) &&
    !(DB.prestadoresServicos||[]).some(p=> p.entidade===l.entidade && Math.abs(Number(p.valor||0)-Number(l.valor||0))<0.5)
  );
  if(servicosForaPrestadores.length) alertas.push({nivel:'baixo', tab:'prestadores', texto:`${servicosForaPrestadores.length} despesa(s) de "Serviços de Terceiros" lançada(s) fora de 🛠️ Prestadores de Serviços — não tiveram Retenção na Fonte (AGT) calculada. Considere lançá-las (ou as futuras) em Prestadores de Serviços para aplicar IVA/Retenção corretamente.`});

  // Saldo negativo por conta / 🚨 Saldo abaixo do limite mínimo configurado (ver 🏦 Conciliação Bancária)
  CONTAS.forEach(c=>{
    const mov = DB.lancamentos.filter(l=>l.conta===c.codigo).reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0);
    if(mov < 0) alertas.push({nivel:'alto', tab:'lancamento', texto:`Saldo negativo em ${c.nome}: ${fmt(mov)} Kz.`});
    const limiteMinimo = Number((DB.bancosConfig && DB.bancosConfig[c.codigo] && DB.bancosConfig[c.codigo].limiteMinimo) || 0);
    if(limiteMinimo > 0 && mov >= 0 && mov < limiteMinimo) alertas.push({nivel:'alto', tab:'bancos', texto:`🚨 Saldo de ${c.nome} (${fmt(mov)} Kz) está abaixo do limite mínimo definido (${fmt(limiteMinimo)} Kz).`});
  });

  // Duplicados de fatura
  const grupos = {};
  DB.lancamentos.forEach(l=>{
    if(!l.nFatura) return;
    const chave = `${(l.entidade||'').toLowerCase()}|${xmlEsc(l.nFatura)}|${Number(l.valor)}`;
    grupos[chave]=grupos[chave]||[]; grupos[chave].push(l);
  });
  const nDups = Object.values(grupos).filter(g=>g.length>1).length;
  if(nDups) alertas.push({nivel:'medio', tab:'duplicados', texto:`${nDups} possível(is) lançamento(s) duplicado(s) por identificar (mesma entidade + nº fatura + valor).`});

  // 📈 Orçamento ultrapassado — destaque especial (nível alto) quando o desvio já passa de 20%
  [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].forEach(cat=>{
    const orc = Number(DB.orcamento[cat]||0);
    if(!orc) return;
    const realizado = explodirLancamentos(DB.lancamentos).filter(l=>l.categoria===cat && l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    if(realizado <= orc) return;
    const pctExcesso = ((realizado-orc)/orc)*100;
    if(pctExcesso >= 20) alertas.push({nivel:'alto', tab:'orcamento', texto:`📈 Categoria "${cat}" ultrapassou o orçamento anual em ${pctExcesso.toFixed(0)}% (realizado ${fmt(realizado)} Kz vs orçamento ${fmt(orc)} Kz).`});
    else alertas.push({nivel:'medio', tab:'orcamento', texto:`Categoria "${cat}" já ultrapassou o orçamento anual (realizado ${fmt(realizado)} Kz vs orçamento ${fmt(orc)} Kz).`});
  });

  // Entregas/Suprimentos de Caixa por justificar há mais de 15 dias
  const suprimentosPendentes = (DB.suprimentos||[]).filter(s=>{
    const j=(s.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);
    const d=(s.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);
    return (Number(s.valor||0)-j-d) > 0.5;
  });
  const suprimentosAtrasados = suprimentosPendentes.filter(s=>s.data <= emDias(hojeStr,-15));
  if(suprimentosAtrasados.length) alertas.push({nivel:'alto', tab:'suprimentos', texto:`${suprimentosAtrasados.length} entrega(s) de caixa (Logística/RH/Prestadores) há mais de 15 dias por justificar ou devolver.`});
  else if(suprimentosPendentes.length) alertas.push({nivel:'baixo', tab:'suprimentos', texto:`${suprimentosPendentes.length} entrega(s) de caixa ainda por justificar/devolver, totalizando ${fmt(suprimentosPendentes.reduce((s,x)=>{const j=(x.liquidacoes||[]).reduce((t,l)=>t+Number(l.valor||0),0);const d=(x.devolucoes||[]).reduce((t,dv)=>t+Number(dv.valor||0),0);return s+(Number(x.valor||0)-j-d);},0))} Kz.`});

  // Utilizador(a) com papel "Caixa" sem Posto de Venda atribuído — fica bloqueado(a) ao
  // fazer login (ver carregarPapel/render) sem que um administrador se aperceba disso a
  // menos que entre em Membros e Acessos; este alerta traz isso para o Dashboard.
  const caixasSemPosto = (membrosCache||[]).filter(m=>m.role==='caixa' && !m.posto);
  if(caixasSemPosto.length) alertas.push({nivel:'medio', tab:'membros', texto:`${caixasSemPosto.length} utilizador(es) com papel "Caixa" sem Posto de Venda atribuído (${caixasSemPosto.map(m=>m.email).join(', ')}) — ficam bloqueados(as) ao entrar. Atribua o posto em 👥 Membros e Acessos.`});

  // Divergências entre o SAF-T (lançamentos) e o Fecho de Caixa declarado pelos postos
  const divergReconciliacao = calcularReconciliacao().filter(l=>l.status==='divergente');
  if(divergReconciliacao.length) alertas.push({nivel:'alto', tab:'reconciliacao', texto:`${divergReconciliacao.length} dia(s)/posto(s)/turno(s) com divergência entre o total lançado (SAF-T) e o Fecho de Caixa declarado.`});

  // Lançamentos de extrato bancário importado que não batem com nenhuma conta do Plano de Contas
  const semCorrelacaoExtrato = lancamentosExtratoSemCorrelacao();
  if(semCorrelacaoExtrato.length) alertas.push({nivel:'medio', tab:'bancos', texto:`${semCorrelacaoExtrato.length} lançamento(s) com dados de extrato bancário que não correspondem a nenhuma conta do Plano de Contas.`});

  // Prazos fiscais (AGT) a vencer — mesma lógica de cálculo do Motor Fiscal 🏛️, aqui usada
  // para gerar avisos antecipados: 15 dias antes (nível médio) e 3 dias antes (nível alto),
  // cobrindo os 3 prazos que o Motor Fiscal acompanha (IVA mensal + Imposto Industrial anual,
  // Regime Geral e Declaração Simplificada).
  try{
    const hojeD = new Date(hojeStr);
    const addMeses = (data,n)=>{ const d=new Date(data); d.setMonth(d.getMonth()+n); return d; };
    const anoAtual = hojeD.getFullYear();
    const prazoIvaEsteMes = ultimoDiaUtilDoMes(anoAtual, hojeD.getMonth());
    const mesAnteriorD = addMeses(new Date(anoAtual, hojeD.getMonth(), 1), -1);
    let prazoIvaProximo = prazoIvaEsteMes, mesDeclarado = MESES[mesAnteriorD.getMonth()];
    if(hojeD > prazoIvaEsteMes){
      const mesSeguinte = addMeses(new Date(anoAtual, hojeD.getMonth(), 1), 1);
      prazoIvaProximo = ultimoDiaUtilDoMes(mesSeguinte.getFullYear(), mesSeguinte.getMonth());
      mesDeclarado = MESES[hojeD.getMonth()];
    }
    let prazoModelo1Geral = ultimoDiaUtilDoMes(anoAtual, 4); // Maio
    let prazoModelo1Simplificado = ultimoDiaUtilDoMes(anoAtual, 3); // Abril
    let exercicioGeral = anoAtual-1, exercicioSimplificado = anoAtual-1;
    if(hojeD > prazoModelo1Geral){ prazoModelo1Geral = ultimoDiaUtilDoMes(anoAtual+1, 4); exercicioGeral = anoAtual; }
    if(hojeD > prazoModelo1Simplificado){ prazoModelo1Simplificado = ultimoDiaUtilDoMes(anoAtual+1, 3); exercicioSimplificado = anoAtual; }

    const prazosFiscais = [
      {nome:`Declaração Periódica de IVA (${mesDeclarado})`, data:prazoIvaProximo},
      {nome:`Imposto Industrial — Modelo 1 (Regime Geral, exercício ${exercicioGeral})`, data:prazoModelo1Geral},
      {nome:`Imposto Industrial — Declaração Simplificada (exercício ${exercicioSimplificado})`, data:prazoModelo1Simplificado},
    ];
    prazosFiscais.forEach(p=>{
      const dias = Math.ceil((p.data - hojeD)/86400000);
      if(dias>=0 && dias<=3) alertas.push({nivel:'alto', tab:'motorFiscal', texto:`⚠️ ${p.nome} vence em ${dias} dia(s) — ${fmtData(p.data)}.`});
      else if(dias>3 && dias<=15) alertas.push({nivel:'medio', tab:'motorFiscal', texto:`${p.nome} vence em ${dias} dias — ${fmtData(p.data)}. Prepare a documentação com antecedência.`});
    });
  }catch(e){ /* não bloqueia os restantes alertas se o cálculo de prazos falhar */ }

  // Stock abaixo do mínimo definido (Existências — Stocks, SKU)
  const produtosAbaixoMinimo = (DB.produtos||[]).filter(p=>{
    if(!(Number(p.stockMinimo||0)>0)) return false;
    const meses = stockMensal(p);
    const ultimo = meses[meses.length-1];
    return ultimo && ultimo.final < Number(p.stockMinimo);
  });
  if(produtosAbaixoMinimo.length) alertas.push({nivel:'medio', tab:'stocks', texto:`${produtosAbaixoMinimo.length} produto(s) abaixo do stock mínimo definido: ${produtosAbaixoMinimo.map(p=>p.nome).join(', ')}.`});

  // Faturas do FaturaBot pendentes de revisão/aprovação há mais de 5 dias
  const faturabotAtrasadas = (DB.faturabot||[]).filter(f=>f.status==='Pendente' && f.criado && f.criado.slice(0,10) <= emDias(hojeStr,-5));
  if(faturabotAtrasadas.length) alertas.push({nivel:'medio', tab:'faturabot', texto:`${faturabotAtrasadas.length} fatura(s) no FaturaBot pendente(s) de revisão há mais de 5 dias.`});

  // Caixa disponível a ficar apertada, ao ritmo de despesa dos últimos 90 dias
  const caixaDisp = calcularDiasCaixaDisponivel();
  if(caixaDisp.dias!==null && caixaDisp.dias<7) alertas.push({nivel:'alto', tab:'dashboard', texto:`Caixa disponível para apenas ${caixaDisp.dias.toFixed(0)} dia(s) ao ritmo de despesa atual (últimos 90 dias).`});
  else if(caixaDisp.dias!==null && caixaDisp.dias<15) alertas.push({nivel:'medio', tab:'dashboard', texto:`Caixa disponível para ${caixaDisp.dias.toFixed(0)} dia(s) ao ritmo de despesa atual (últimos 90 dias).`});

  // Categorias de despesa/custo com movimento este ano ainda sem classificação Fixo/Variável
  // — o Ponto de Equilíbrio no Dashboard fica incompleto enquanto isto não for preenchido.
  const pePendentes = calcularPontoEquilibrio().categoriasPendentes;
  if(pePendentes.length) alertas.push({nivel:'baixo', tab:'orcamento', texto:`${pePendentes.length} categoria(s) de despesa/custo por classificar como Fixo/Variável (${pePendentes.join(', ')}) — o Ponto de Equilíbrio no Dashboard está incompleto até serem classificadas.`});

  const ordem = {alto:0, medio:1, baixo:2};
  return alertas.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
}
function viewAlertas(){
  const alertas = calcularAlertasFinanceiros();
  const corNivel = {alto:'var(--vermelho)', medio:'var(--amarelo)', baixo:'var(--verde)'};

/* ---------- Sugestões Automáticas de Otimização ----------
   Motor de regras (determinístico, sem IA externa) que analisa os lançamentos e contas
   já existentes na base de dados e aponta oportunidades concretas de poupança:
     A) Fornecedor com preço médio acima da média da sua categoria de despesa.
     B) Categoria de despesa em forte crescimento (trimestre atual vs trimestre anterior).
     C) Fornecedor de alto volume pago sistematicamente a curto prazo — candidato a
        negociação de prazo de pagamento mais longo.
   Todas as sugestões partem de dados reais já lançados no sistema; nada é inventado nem
   enviado para serviços externos. */
function calcularSugestoesOtimizacao(){
  const sugestoes = [];
  const hojeStr = hoje();

  /* ---- A) Fornecedor mais caro que a média da categoria (≥15% acima) ---- */
  const despesas = explodirLancamentos(DB.lancamentos.filter(l=>
    l.tipo==='Despesa' && !l.neutralizado && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) && l.entidade
  ));
  const porCategoriaFornecedor = {}; // { categoria: { fornecedor: {total, qtd} } }
  despesas.forEach(l=>{
    const cat = l.categoria || 'Sem categoria';
    const forn = (l.entidade||'').trim();
    if(!forn) return;
    porCategoriaFornecedor[cat] = porCategoriaFornecedor[cat] || {};
    porCategoriaFornecedor[cat][forn] = porCategoriaFornecedor[cat][forn] || {total:0, qtd:0};
    porCategoriaFornecedor[cat][forn].total += valorEmKZ(l);
    porCategoriaFornecedor[cat][forn].qtd += 1;
  });
  Object.entries(porCategoriaFornecedor).forEach(([cat, porFornecedor])=>{
    const fornecedores = Object.entries(porFornecedor).filter(([,v])=>v.qtd>=2); // exige recorrência mínima
    if(fornecedores.length<2) return; // precisa de pelo menos 2 fornecedores para comparar
    const medias = fornecedores.map(([,v])=>v.total/v.qtd);
    const mediaGeral = medias.reduce((s,v)=>s+v,0)/medias.length;
    if(mediaGeral<=0) return;
    fornecedores.forEach(([forn,v])=>{
      const mediaForn = v.total/v.qtd;
      const percAcima = (mediaForn/mediaGeral-1)*100;
      if(percAcima>=15){
        sugestoes.push({
          tipo:'fornecedor_caro', tab:'pagar',
          titulo:`${forn} está ${percAcima.toFixed(0)}% mais caro que a média em "${cat}"`,
          detalhe:`Valor médio por lançamento: ${fmt(mediaForn)} Kz, contra uma média de ${fmt(mediaGeral)} Kz entre os fornecedores desta categoria (${v.qtd} lançamento(s) analisado(s)). Considere comparar preços ou renegociar com ${forn}.`,
          impactoEstimado: (mediaForn-mediaGeral)*v.qtd
        });
      }
    });
  });

  /* ---- B) Categoria em forte crescimento (últimos 90 dias vs 90 dias anteriores) ---- */
  const emDiasSug = (d,n)=>{ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); };
  const inicioAtual = emDiasSug(hojeStr,-90);
  const inicioAnterior = emDiasSug(hojeStr,-180);
  const porCategoriaPeriodo = {}; // { categoria: {atual, anterior} }
  despesas.forEach(l=>{
    const cat = l.categoria || 'Sem categoria';
    porCategoriaPeriodo[cat] = porCategoriaPeriodo[cat] || {atual:0, anterior:0};
    if(l.data>=inicioAtual && l.data<=hojeStr) porCategoriaPeriodo[cat].atual += valorEmKZ(l);
    else if(l.data>=inicioAnterior && l.data<inicioAtual) porCategoriaPeriodo[cat].anterior += valorEmKZ(l);
  });
  Object.entries(porCategoriaPeriodo).forEach(([cat,v])=>{
    if(v.anterior<=0 || v.atual<=0) return;
    const crescimento = (v.atual/v.anterior-1)*100;
    if(crescimento>=25){
      sugestoes.push({
        tipo:'categoria_crescimento', tab:'dashboard',
        titulo:`Categoria "${cat}" cresceu ${crescimento.toFixed(0)}% nos últimos 90 dias`,
        detalhe:`Passou de ${fmt(v.anterior)} Kz para ${fmt(v.atual)} Kz face ao período homólogo anterior (90 dias). Vale a pena investigar a causa — por exemplo, avaliar contratos de manutenção preventiva em vez de reparações pontuais, ou rever consumo/desperdício.`,
        impactoEstimado: v.atual-v.anterior
      });
    }
  });

  /* ---- C) Fornecedor de alto volume com prazo médio de pagamento curto (<30 dias) ---- */
  const porFornecedorPrazo = {}; // { fornecedor: {somaDias, qtd, totalPago} }
  DB.contasPagar.filter(c=>c.entidade && c.data && c.vencimento).forEach(c=>{
    const forn = c.entidade.trim();
    const dias = diasEntreDatas(c.data, c.vencimento);
    porFornecedorPrazo[forn] = porFornecedorPrazo[forn] || {somaDias:0, qtd:0, totalPago:0};
    porFornecedorPrazo[forn].somaDias += dias;
    porFornecedorPrazo[forn].qtd += 1;
    porFornecedorPrazo[forn].totalPago += Number(c.valor||0);
  });
  const volumesTotais = Object.values(porFornecedorPrazo).map(v=>v.totalPago);
  const volumeMedio = volumesTotais.length ? volumesTotais.reduce((s,v)=>s+v,0)/volumesTotais.length : 0;
  Object.entries(porFornecedorPrazo).forEach(([forn,v])=>{
    if(v.qtd<3) return; // exige histórico mínimo
    const prazoMedio = v.somaDias/v.qtd;
    if(prazoMedio<30 && v.totalPago>=volumeMedio && volumeMedio>0){
      sugestoes.push({
        tipo:'prazo_pagamento', tab:'pagar',
        titulo:`Prazo curto praticado com ${forn} (${prazoMedio.toFixed(0)} dias em média)`,
        detalhe:`Volume total de compras com este fornecedor: ${fmt(v.totalPago)} Kz em ${v.qtd} conta(s). Como é um fornecedor de volume acima da média, pode valer a pena negociar um prazo de pagamento mais longo (ex.: 60 dias) em troca de compromisso de volume — isso melhora o fluxo de caixa sem custo direto.`,
        impactoEstimado: v.totalPago*0.02 // referência: ~2% equivalente a custo de capital evitado
      });
    }
  });

  return sugestoes.sort((a,b)=>(b.impactoEstimado||0)-(a.impactoEstimado||0));
}

/* Dias de Caixa Disponível (cash runway): saldo total nas contas de caixa/banco a dividir
   pela despesa média diária real dos últimos 90 dias. O saldo por conta usa a mesma lógica
   já existente no Dashboard (inclui lançamentos neutralizados, porque o saldo de conta
   reflete dinheiro que realmente entrou/saiu — não é um relatório oficial; ver a nota em
   calcularReconciliacao sobre a Conciliação Bancária ser a mesma exceção). A despesa média
   diária, por outro lado, exclui neutralizados e categorias internas (Suprimentos,
   Transferência entre Contas, etc.) para refletir só a despesa operacional real. */
function calcularDiasCaixaDisponivel(){
  const hojeStr = hoje();
  const saldoTotal = CONTAS.reduce((tot,c)=>{
    const mov = DB.lancamentos.filter(l=>l.conta===c.codigo).reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0);
    return tot+mov;
  },0);
  const d90 = new Date(hojeStr); d90.setDate(d90.getDate()-90);
  const inicio90 = d90.toISOString().slice(0,10);
  const despesas90 = explodirLancamentos(DB.lancamentos.filter(l=>
    l.tipo==='Despesa' && !l.neutralizado && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) &&
    l.data>=inicio90 && l.data<=hojeStr
  )).reduce((s,l)=>s+valorEmKZ(l),0);
  const despesaMediaDiaria = despesas90/90;
  const dias = despesaMediaDiaria>0 ? saldoTotal/despesaMediaDiaria : null;
  return {saldoTotal, despesaMediaDiaria, dias};
}

/* Ponto de Equilíbrio (break-even), pela lógica de Margem de Contribuição:
   Margem de Contribuição % = (Receita − Custos Variáveis) / Receita
   Ponto de Equilíbrio (Kz de receita/ano) = Custos Fixos / Margem de Contribuição %
   Usa o ano corrente e a mesma base do Resultado do Exercício (exclui neutralizados e
   categorias internas). Só entram no cálculo as categorias de Despesa/Custo já
   classificadas em 🎯 Orçamento vs Realizado (DB.classificacaoCustos) — categorias por
   classificar ficam de fora e são contadas em "categoriasPendentes", para o Dashboard
   avisar que o número ainda não é completo. */
function calcularPontoEquilibrio(){
  const ano = new Date().getFullYear();
  const doAno = l => mesKey(l.data).startsWith(String(ano)) && !l.neutralizado && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria);
  const receitaAno = explodirLancamentos(DB.lancamentos.filter(l=>doAno(l) && l.tipo==='Receita')).reduce((s,l)=>s+valorEmKZ(l),0);
  const despesasCustosAno = explodirLancamentos(DB.lancamentos.filter(l=>doAno(l) && l.tipo==='Despesa' && [...CATEGORIAS_DESPESAS,...CATEGORIAS_CUSTOS].includes(l.categoria)));
  let custosFixos=0, custosVariaveis=0;
  const categoriasComMovimento = new Set(despesasCustosAno.map(l=>l.categoria));
  despesasCustosAno.forEach(l=>{
    const classe = DB.classificacaoCustos[l.categoria];
    if(classe==='Fixo') custosFixos+=valorEmKZ(l);
    else if(classe==='Variável') custosVariaveis+=valorEmKZ(l);
  });
  const categoriasPendentes = [...categoriasComMovimento].filter(c=>!DB.classificacaoCustos[c]);
  const margemContribuicaoPct = receitaAno>0 ? (receitaAno-custosVariaveis)/receitaAno : null;
  const pontoEquilibrio = (margemContribuicaoPct!==null && margemContribuicaoPct>0) ? custosFixos/margemContribuicaoPct : null;
  return {ano, receitaAno, custosFixos, custosVariaveis, margemContribuicaoPct, pontoEquilibrio, categoriasPendentes};
}

/* ---------- Simulador "E se...?" ----------
   Recalcula Ponto de Equilíbrio, Margem de Contribuição e Dias de Caixa Disponível
   aplicando variações percentuais hipotéticas (receita, custos fixos, custos variáveis,
   despesa operacional diária) e uma injeção/retirada de caixa pontual — tudo em memória,
   sem alterar nenhum lançamento real. Reaproveita calcularPontoEquilibrio() e
   calcularDiasCaixaDisponivel() como base "atual". */
function calcularCenarioSimulado(params){
  const {varReceita=0, varCustosFixos=0, varCustosVariaveis=0, varDespesaDiaria=0, injecaoCaixa=0} = params;
  const pe = calcularPontoEquilibrio();
  const cx = calcularDiasCaixaDisponivel();

  const receitaSim = pe.receitaAno * (1+varReceita/100);
  const custosFixosSim = pe.custosFixos * (1+varCustosFixos/100);
  const custosVariaveisBaseSim = pe.custosVariaveis * (1+varCustosVariaveis/100);
  // custos variáveis também acompanham a variação de receita (são proporcionais ao volume),
  // depois aplica-se por cima a variação manual de custos variáveis (ex.: negociar preço)
  const custosVariaveisSim = custosVariaveisBaseSim * (1+varReceita/100);
  const margemContribuicaoSim = receitaSim>0 ? (receitaSim-custosVariaveisSim)/receitaSim : null;
  const pontoEquilibrioSim = (margemContribuicaoSim!==null && margemContribuicaoSim>0) ? custosFixosSim/margemContribuicaoSim : null;

  const saldoTotalSim = cx.saldoTotal + injecaoCaixa;
  const despesaMediaDiariaSim = cx.despesaMediaDiaria * (1+varDespesaDiaria/100);
  const diasSim = despesaMediaDiariaSim>0 ? saldoTotalSim/despesaMediaDiariaSim : null;

  return {
    atual:{ receita:pe.receitaAno, custosFixos:pe.custosFixos, custosVariaveis:pe.custosVariaveis,
      margem:pe.margemContribuicaoPct, pontoEquilibrio:pe.pontoEquilibrio,
      saldoTotal:cx.saldoTotal, despesaMediaDiaria:cx.despesaMediaDiaria, dias:cx.dias },
    simulado:{ receita:receitaSim, custosFixos:custosFixosSim, custosVariaveis:custosVariaveisSim,
      margem:margemContribuicaoSim, pontoEquilibrio:pontoEquilibrioSim,
      saldoTotal:saldoTotalSim, despesaMediaDiaria:despesaMediaDiariaSim, dias:diasSim },
    ano:pe.ano
  };
}

function viewDashboard(){

  const receitas = lancFiltrados.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const despesas = lancFiltrados.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  const saldo = receitas-despesas;
  const pendPagar = DB.contasPagar.reduce((s,c)=>s+Math.max(0,Number(c.valor||0)-Number(c.valorPago||0)),0);
  const pendReceber = DB.contasReceber.reduce((s,c)=>s+Math.max(0,Number(c.valor||0)-Number(c.valorPago||0)),0);
  const caixaDisp = calcularDiasCaixaDisponivel();
  const pe = calcularPontoEquilibrio();

  const porCategoria = {};
  explodirLancamentos(lancFiltrados.filter(l=>l.tipo==='Despesa')).forEach(l=>{
    porCategoria[l.categoria]=(porCategoria[l.categoria]||0)+valorEmKZ(l);
  });
  const maxCat = Math.max(1,...Object.values(porCategoria));
  const barras = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([cat,val])=>`
    <div style="margin:6px 0;">
      <div style="display:flex;justify-content:space-between;font-size:12px;"><span>${cat}</span><span>${fmt(val)} Kz</span></div>
      <div style="background:#eee;border-radius:4px;height:8px;"><div style="background:var(--verde);width:${(val/maxCat*100).toFixed(1)}%;height:8px;border-radius:4px;"></div></div>
    </div>`).join('') || '<p class="note">Sem despesas lançadas neste filtro.</p>';

  /* Resultado e Margem por Unidade de Negócio (do filtro do Dashboard) — mesma base de
     cálculo do Resultado do Exercício (explodirLancamentos + exclui neutralizados e
     categorias internas), agrupada por Unidade em vez do total da empresa. */
  const porUnidadeResultado = UNIDADES_NEGOCIO.filter(u=>u!=='SUPRIMENTOS').map(u=>{
    const doUnidade = explodirLancamentos(lancFiltrados.filter(l=>
      (l.origem||'').startsWith(u) && !l.neutralizado && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria)
    ));
    const r = doUnidade.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doUnidade.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return {nome:u, receitas:r, despesas:d, resultado:r-d, margem: r>0 ? (r-d)/r*100 : null};
  }).filter(u=>u.receitas>0 || u.despesas>0);

  const fDash = fmod('dashboard');
  const rankingRentabilidade = calcularRankingRentabilidade(fDash.de, fDash.ate);
  const divergenciasReconciliacao = calcularReconciliacao().filter(l=>l.status==='divergente');
  const alertasFinanceiros = calcularAlertasFinanceiros();
  const alertasAltos = alertasFinanceiros.filter(a=>a.nivel==='alto').length;
  const sugestoesOtimizacao = calcularSugestoesOtimizacao();

  return `
  <h2>📊 Dashboard</h2>
  ${alertasFinanceiros.length ? `<p class="note" style="border-color:${alertasAltos?'var(--vermelho)':'var(--amarelo)'};cursor:pointer;" data-tab="alertas">🔔 <b>${alertasFinanceiros.length} alerta(s) financeiro(s)</b>${alertasAltos?` (${alertasAltos} urgente(s))`:''} — contas vencidas, saldos ou orçamento. Clique para ver em Alertas Financeiros.</p>` : ''}
  ${sugestoesOtimizacao.length ? `<p class="note" style="border-color:var(--castanho);cursor:pointer;" data-tab="sugestoesOtimizacao">💡 <b>${sugestoesOtimizacao.length} sugestão/sugestões de otimização</b> disponível(is), com impacto estimado de ~${fmt(sugestoesOtimizacao.reduce((s,x)=>s+(x.impactoEstimado||0),0))} Kz. Clique para ver em Sugestões de Otimização.</p>` : ''}
  ${divergenciasReconciliacao.length ? `<p class="note" style="border-color:var(--vermelho);cursor:pointer;" data-tab="reconciliacao">⚠️ <b>${divergenciasReconciliacao.length} divergência(s)</b> entre o SAF-T (lançamentos) e o Fecho de Caixa declarado. Clique para ver em Reconciliação SAF-T vs Caixa.</p>` : ''}
  ${lancamentosExtratoSemCorrelacao().length ? `<p class="note" style="border-color:var(--amarelo);background:#FFFAED;cursor:pointer;" data-tab="bancos">⚠️ <b>${lancamentosExtratoSemCorrelacao().length} lançamento(s) de extrato</b> não conseguem ser correlacionados com uma conta do Plano de Contas. Clique para ver em Conciliação Bancária.</p>` : ''}
  ${caixaDisp.dias!==null && caixaDisp.dias<15 ? `<p class="note" style="border-color:var(--vermelho);">💸 <b>Caixa disponível para ${caixaDisp.dias.toFixed(0)} dia(s)</b> ao ritmo de despesa atual. Considere rever pagamentos ou acelerar recebimentos.</p>` : ''}
  ${pe.categoriasPendentes.length ? `<p class="note" style="border-color:var(--amarelo);background:#FFFAED;cursor:pointer;" data-tab="orcamento">📐 <b>${pe.categoriasPendentes.length} categoria(s)</b> de despesa/custo com movimento em ${pe.ano} ainda sem classificação Fixo/Variável — o Ponto de Equilíbrio abaixo está incompleto. Classifique em 🎯 Orçamento vs Realizado.</p>` : ''}
  ${barraFiltroModuloHTML('dashboard', {comPeriodo:true, comPosto:true})}
  <div class="cards">
    <div class="card"><div class="lbl">Receitas (do filtro)</div><div class="val pos">${fmt(receitas)} Kz</div></div>
    <div class="card"><div class="lbl">Despesas (do filtro)</div><div class="val neg">${fmt(despesas)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo (do filtro)</div><div class="val ${saldo>=0?'pos':'neg'}">${fmt(saldo)} Kz</div></div>
    <div class="card"><div class="lbl">A Pagar (pendente, total)</div><div class="val neg">${fmt(pendPagar)} Kz</div></div>
    <div class="card"><div class="lbl">A Receber (pendente, total)</div><div class="val pos">${fmt(pendReceber)} Kz</div></div>
    <div class="card"><div class="lbl">Dias de Caixa Disponível</div><div class="val ${caixaDisp.dias===null?'':(caixaDisp.dias<15?'neg':'pos')}">${caixaDisp.dias===null?'—':caixaDisp.dias.toFixed(0)+' dias'}</div></div>
    <div class="card"><div class="lbl">Ponto de Equilíbrio (${pe.ano})</div><div class="val">${pe.pontoEquilibrio===null?'—':fmt(pe.pontoEquilibrio)+' Kz'}</div></div>
  </div>
  <div class="split">
    <div>
      <h2 class="sub" style="font-size:16px;">Despesas por Categoria</h2>
      ${barras}
    </div>
    <div>
      <h2 class="sub" style="font-size:16px;">Saldo por Conta (do filtro)</h2>
      ${CONTAS.map(c=>{
        const mov = lancFiltrados.filter(l=>l.conta===c.codigo).reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)),0);
        return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--borda);font-size:13px;"><span>${c.nome}</span><b class="${mov>=0?'val pos':'val neg'}" style="font-size:13px;">${fmt(mov)}</b></div>`;
      }).join('')}
    </div>
  </div>
  <h2 class="sub" style="font-size:16px;margin-top:16px;">Resultado e Margem por Unidade de Negócio (do filtro)</h2>
  <div class="tablewrap"><table><thead><tr><th>Unidade</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Resultado</th><th class="right">Margem</th></tr></thead><tbody>
    ${porUnidadeResultado.map(u=>`<tr><td>${u.nome}</td><td class="right">${fmt(u.receitas)}</td><td class="right">${fmt(u.despesas)}</td><td class="right ${u.resultado>=0?'pos':'neg'}"><b>${fmt(u.resultado)}</b></td><td class="right">${u.margem===null?'—':u.margem.toFixed(1)+'%'}</td></tr>`).join('') || '<tr><td colspan="5" class="note">Sem movimento neste filtro.</td></tr>'}
  </tbody></table></div>
  <h2 class="sub" style="font-size:16px;margin-top:16px;">📊 Rentabilidade por Unidade/Produto (Ranking, com tendência)</h2>
  <p class="note">Lucro real por Unidade/Produto (Receita − Custos Diretos), do mais para o menos lucrativo, com a tendência vs período anterior equivalente (${rankingRentabilidade.periodoAnterior.de} a ${rankingRentabilidade.periodoAnterior.ate}). Granularidade de Centro de Custo (ex.: Restauração e Bar separados de Hospedagem, cada loja da Bakery Line separada). Lançamentos sem alocação manual entram aqui por sugestão automática só para esta visão — para alocar/corrigir de verdade, use 🎯 Centros de Custo.</p>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>Unidade/Produto</th><th class="right">Receita</th><th class="right">Custos Diretos</th><th class="right">Lucro</th><th class="right">Margem</th><th class="right">Tendência</th></tr></thead><tbody>
    ${rankingRentabilidade.linhas.map((c,i)=>`<tr><td>${i+1}º</td><td>${c.nome} <span class="note" style="display:inline;padding:1px 5px;">${c.unidade}</span></td><td class="right">${fmt(c.receitas)}</td><td class="right">${fmt(c.despesas)}</td><td class="right ${c.lucro>=0?'pos':'neg'}"><b>${fmt(c.lucro)}</b></td><td class="right">${c.margem===null?'—':c.margem.toFixed(1)+'%'}</td><td class="right" title="Lucro no período anterior: ${fmt(c.lucroAnterior)} Kz">${c.tendencia}</td></tr>`).join('') || '<tr><td colspan="7" class="note">Sem movimento alocável a Centros de Custo neste filtro.</td></tr>'}
    ${(rankingRentabilidade.naoAlocadoReceitas || rankingRentabilidade.naoAlocadoDespesas) ? `<tr style="background:var(--bg);"><td>—</td><td>Não Alocável <span class="note" style="display:inline;padding:1px 5px;">(sem Unidade de Negócio reconhecida)</span></td><td class="right">${fmt(rankingRentabilidade.naoAlocadoReceitas)}</td><td class="right">${fmt(rankingRentabilidade.naoAlocadoDespesas)}</td><td class="right"><b>${fmt(rankingRentabilidade.naoAlocadoReceitas-rankingRentabilidade.naoAlocadoDespesas)}</b></td><td class="right">—</td><td class="right">—</td></tr>` : ''}
  </tbody></table></div>
  <h2 class="sub" style="font-size:16px;margin-top:16px;">Ponto de Equilíbrio (${pe.ano})</h2>
  <div class="cards">
    <div class="card"><div class="lbl">Custos Fixos (${pe.ano})</div><div class="val neg">${fmt(pe.custosFixos)} Kz</div></div>
    <div class="card"><div class="lbl">Custos Variáveis (${pe.ano})</div><div class="val neg">${fmt(pe.custosVariaveis)} Kz</div></div>
    <div class="card"><div class="lbl">Margem de Contribuição</div><div class="val">${pe.margemContribuicaoPct===null?'—':(pe.margemContribuicaoPct*100).toFixed(1)+'%'}</div></div>
    <div class="card"><div class="lbl">Receita Necessária (Ponto de Equilíbrio)</div><div class="val">${pe.pontoEquilibrio===null?'—':fmt(pe.pontoEquilibrio)+' Kz'}</div></div>
    <div class="card"><div class="lbl">Receita Real (${pe.ano})</div><div class="val ${pe.pontoEquilibrio!==null && pe.receitaAno>=pe.pontoEquilibrio ? 'pos':'neg'}">${fmt(pe.receitaAno)} Kz</div></div>
  </div>
  <p class="note">Ponto de Equilíbrio = Custos Fixos ÷ Margem de Contribuição (Receita − Custos Variáveis, em %). Considera só as categorias de Despesa/Custo já classificadas como Fixo ou Variável em 🎯 Orçamento vs Realizado; classifique todas para o número ficar completo. Sem Margem de Contribuição positiva (custos variáveis ≥ receita), o Ponto de Equilíbrio não é calculável.</p>
  <p class="note">Este resumo é calculado a partir dos Lançamentos, Contas a Pagar/Receber registados nesta ferramenta. "A Pagar"/"A Receber" mostram sempre o total pendente atual (não seguem o filtro de período). "Dias de Caixa Disponível" usa o saldo atual em todas as contas de caixa/banco a dividir pela despesa operacional média dos últimos 90 dias (não segue o filtro de período/posto). "Resultado e Margem por Unidade" exclui lançamentos neutralizados e categorias internas (Suprimentos, Transferências), tal como o Resultado do Exercício.</p>
  `;
}

/* ---------- FaturaBot ---------- */
registrarFiltroModulo('faturabotHistorico', {
  getLista: ()=> DB.faturabot.filter(f=>f.status!=='Pendente'),
  campoData: 'data', campoOrigem: 'unidade',
  titulo: 'FaturaBot — Histórico Processado', subtitulo: 'Despesas aprovadas/rejeitadas pelo FaturaBot.',
  ficheiro: 'faturabot-historico',
  cabecalhos: ['Recebido','Fornecedor','NIF','Nº Fatura','Data','Total','Moeda','Estado','Unidade'],
  linha: f=>[f.criado?f.criado.slice(0,10):'', f.fornecedor||'', f.nif||'', f.nFatura||'', f.data||'', Number(faturabotTotalItens(f)||f.valor||0), f.moeda||'KZ', f.status||'', f.unidade||''],
});
function viewFaturabot(){
  const pendentes = DB.faturabot.filter(f=>f.status==='Pendente').slice().reverse();
  const processadas = listaFiltradaModulo('faturabotHistorico').slice().reverse().slice(0,50);

  const linhaItemEditavel = (f, item, idx, comAcoes)=>`
    <tr class="fb-item-sub">
      <td></td><td></td>
      <td colspan="3"><input data-fb-item-campo="${f.id}:${idx}:descricao" value="${xmlEsc(item.descricao||'')}" placeholder="Descrição do item" ${comAcoes?'':'disabled'} style="width:100%;"></td>
      <td colspan="2"><input type="number" step="0.01" data-fb-item-campo="${f.id}:${idx}:valor" value="${item.valor||''}" ${comAcoes?'':'disabled'} style="width:100%;"></td>
      <td colspan="3"><select data-fb-item-campo="${f.id}:${idx}:categoria" ${comAcoes?'':'disabled'}>${optsCategorias(item.categoria,'despesa')}</select></td>
      <td colspan="2">${comAcoes ? `<button class="danger" data-fb-item-remover="${f.id}:${idx}">Remover item</button>` : ''}</td>
    </tr>`;

  const linhaFatura = (f, comAcoes)=>{
    const alertas = faturabotValidar(f);
    const anexo = f.anexoBase64 ? `<a href="${f.anexoBase64}" target="_blank" title="Ver documento anexado">📎 ${f.anexoNome||'ver'}</a>` : '—';
    const badge = f.status==='Aprovado' ? 'pago' : f.status==='Rejeitado' ? 'atraso' : 'pendente';
    const itens = faturabotGetItens(f);
    const total = faturabotTotalItens(f);
    const categoriasResumo = [...new Set(itens.map(i=>i.categoria))];
    const resumoTxt = categoriasResumo.length>1 ? `${categoriasResumo.length} categorias` : (categoriasResumo[0]||'—');
    const linhaPrincipal = `<tr data-fb-linha="${f.id}">
      <td>${f.criado ? f.criado.slice(0,10) : ''}</td>
      <td>${anexo}</td>
      <td><input data-fb-campo="${f.id}:fornecedor" value="${xmlEsc(f.fornecedor||'')}" placeholder="Fornecedor" style="min-width:130px;"></td>
      <td><input data-fb-campo="${f.id}:nif" value="${xmlEsc(f.nif||'')}" placeholder="NIF" style="width:110px;"></td>
      <td><input data-fb-campo="${f.id}:nFatura" value="${xmlEsc(f.nFatura||'')}" placeholder="Nº Fatura" style="width:100px;"></td>
      <td><input type="date" data-fb-campo="${f.id}:data" value="${f.data||''}" style="width:135px;"></td>
      <td class="right"><b>${fmt(total)}</b></td>
      <td><select data-fb-campo="${f.id}:moeda"><option ${f.moeda==='KZ'?'selected':''}>KZ</option><option ${f.moeda==='EUR'?'selected':''}>EUR</option><option ${f.moeda==='USD'?'selected':''}>USD</option></select></td>
      <td><select data-fb-campo="${f.id}:conta">${CONTAS.map(c=>`<option value="${c.codigo}" ${f.conta===c.codigo?'selected':''}>${c.nome}</option>`).join('')}</select></td>
      <td><button type="button" class="sec" data-fb-toggle-itens="${f.id}">🧾 ${resumoTxt} (${itens.length})</button></td>
      <td>${alertas.length ? `<span class="badge atraso" title="${alertas.join(' | ')}">⚠️ ${alertas.length}</span>` : '<span class="badge pago">OK</span>'}</td>
      <td><span class="badge ${badge}">${f.status}</span></td>
      ${comAcoes ? `<td style="white-space:nowrap;">
        <button data-fb-aprovar="${f.id}">✅ Aprovar</button>
        <button class="sec" data-fb-rejeitar="${f.id}">Rejeitar</button>
        <button class="danger" data-fb-apagar="${f.id}">Apagar</button>
      </td>` : `<td><button class="danger" data-fb-apagar="${f.id}">Apagar</button></td>`}
    </tr>`;
    const aberto = fbItensAbertos.has(f.id);
    const linhaItens = aberto ? `<tr class="fb-itens-painel" data-fb-painel="${f.id}">
      <td colspan="13" style="background:#f7f5ef;padding:8px 12px;">
        <table style="width:100%;"><tbody>
          ${itens.map((it,idx)=>linhaItemEditavel(f,it,idx,comAcoes)).join('')}
        </tbody></table>
        ${comAcoes ? `<button type="button" data-fb-item-add="${f.id}" style="margin-top:6px;">+ Adicionar item</button>` : ''}
      </td>
    </tr>` : '';
    return linhaPrincipal + linhaItens;
  };

  const rowsPendentes = pendentes.map(f=>linhaFatura(f,true)).join('') || `<tr><td colspan="13" class="note">Sem faturas por rever. Envie uma fatura acima para começar.</td></tr>`;
  const rowsProcessadas = processadas.map(f=>linhaFatura(f,false)).join('') || `<tr><td colspan="13" class="note">Ainda sem faturas aprovadas/rejeitadas.</td></tr>`;

  return `
  <h2 style="background:var(--azul-nav);">🤖 FaturaBot — Motor Inteligente de Leitura de Faturas de Despesas</h2>
  <p class="note">Regra "Zero Digitação" (quando anexa documento): envie a fatura (arrastar, escolher ficheiro ou foto) → a IA tenta ler o documento automaticamente e pré-preenche os campos → confirme/corrija → aprove. <b>Se não tiver foto/PDF, não há problema — pode preencher todos os campos abaixo à mão e enviar na mesma</b>, é a forma normal de lançar despesas manualmente. Ao aprovar, o sistema cria automaticamente o Lançamento (e, se marcar, a Conta a Pagar) — sem repetir digitação.
  <br><b>Nota:</b> a leitura automática (OCR) depende do serviço "faturabot-ocr" estar ligado no Supabase (ver instruções). Se não estiver ligado, ou se a leitura falhar, os campos ficam em branco para preencher à mão — o resto do fluxo (sugestão de categoria, validação, aprovação) funciona sempre.
  <br>Uma fatura pode ter <b>várias categorias de despesa</b> ao mesmo tempo (ex.: cimento + combustível + material de escritório). Use "+ Adicionar item" para separar cada parte. A fatura continua a gerar <b>um único Lançamento</b> (um só movimento, uma só conta/forma de pagamento) — quando há mais de uma categoria, esse lançamento fica marcado como "${CATEGORIA_DIVERSOS}" e o detalhe por categoria alimenta os relatórios (Resumo Mensal, Orçamento vs Realizado, DRE) sem duplicar saídas na Tesouraria.</p>

  <form class="inline" id="formFaturabot">
    <div class="grid">
      <div style="grid-column:1/-1;">
        <label>Documento da fatura (opcional — pode preencher tudo à mão sem anexar nada)</label>
        <input type="file" id="fbArquivo" accept="image/*,application/pdf" style="padding:14px 8px;border:2px dashed var(--verde);background:var(--verde-claro);">
        <div id="fbOcrTag" style="font-size:12.5px;color:var(--muted);margin-top:6px;"></div>
      </div>
      <div style="grid-column:1/-1;">
        <label>Ou importar VÁRIAS despesas de uma vez (CSV ou Excel — .csv, .xls, .xlsx)</label>
        <input type="file" id="fbArquivoCSV" accept=".csv,.xls,.xlsx" style="padding:14px 8px;border:2px dashed var(--castanho);background:#fbf4e6;">
        <div id="fbImportTag" style="font-size:12.5px;color:var(--muted);margin-top:6px;"></div>
        <p class="note" style="margin-top:4px;">Colunas reconhecidas pelo cabeçalho (qualquer ordem): Fornecedor, NIF, Nº Fatura, Data, Valor, Categoria, Forma de Pagamento, Unidade, Descrição — só Fornecedor, Data e Valor são obrigatórias. Cada linha entra como fatura "Pendente", igual a uma leitura por IA, e passa pela mesma aprovação antes de virar Lançamento.</p>
      </div>
      <div><label>Fornecedor</label><input name="fornecedor" id="fbFornecedor" required placeholder="Ex.: Sonangol, Unitel, ENDE..."></div>
      <div><label>NIF <span id="fbNifTag" style="font-weight:normal;font-size:12px;"></span></label><input name="nif" id="fbNif" placeholder="NIF do fornecedor"></div>
      <div><label>Nº Fatura</label><input name="nFatura"></div>
      <div><label>Data da Fatura</label><input type="date" name="data" value="${hoje()}" required></div>
      <div><label>Data de Vencimento</label><input type="date" name="vencimento"></div>
      <div><label>Moeda</label><select name="moeda"><option>KZ</option><option>EUR</option><option>USD</option></select></div>
      <div><label>Conta Bancária/Caixa</label><select name="conta" id="fbConta">${CONTAS.map(c=>`<option value="${c.codigo}">${c.nome}</option>`).join('')}</select></div>
      <div><label>Forma de Pagamento</label><select name="formaPagamento" id="fbFormaPagamento">${FORMAS_PAGAMENTO.map(f=>`<option>${f}</option>`).join('')}</select></div>
      <div><label>Sujeito a IVA?</label><select name="iva"><option>Não</option><option>Sim</option></select></div>
      <div><label>Taxa IVA</label><select name="taxaIVA"><option value="0.14">14%</option><option value="0.07">7%</option><option value="0.05">5%</option><option value="0">0%</option></select></div>
      <div><label>Unidade de Negócio (Origem)</label><select name="unidade"><option value="">—</option>${UNIDADES_NEGOCIO.map(u=>`<option>${u}</option>`).join('')}</select></div>
    </div>
    <p class="note">A Origem é calculada automaticamente (Unidade + Forma de Pagamento) — não precisa de escolher a string combinada à mão. O FaturaBot regista despesas, por isso a Conta fica sempre travada em <b>CAIXA TESOURARIA</b> — é o único caixa responsável por pagar despesas da empresa, seja qual for a Forma de Pagamento.</p>

    <h3 style="margin:14px 0 6px;">Itens da despesa (por categoria) <span id="fbSugestaoTag" style="font-weight:normal;font-size:12.5px;"></span></h3>
    <div id="fbItensContainer"></div>
    <button type="button" id="fbAddItem" style="margin-top:6px;">+ Adicionar item</button>
    <p style="margin-top:8px;"><b>Total:</b> <span id="fbTotalItens">0,00</span></p>

    <div class="actions"><button type="submit">📥 Enviar para o FaturaBot (Aguardando aprovação)</button></div>
    <p class="note">Ao digitar o Fornecedor, a categoria do primeiro item é sugerida automaticamente com base em faturas já aprovadas antes (ou em padrões conhecidos como ENDE, EPAL, Unitel, Sonangol). Corrija se necessário — o sistema aprende com a sua correção. Se a fatura tiver várias despesas diferentes, adicione um item por categoria; a conta/forma de pagamento é sempre uma só, para a fatura toda.</p>
  </form>

function gerarNumeroFatura(unidade, dataStr){
  const anoRef = (dataStr||hoje()).slice(0,4);
  const chave = `${unidade||'GERAL'}:${anoRef}`;
  const atual = DB.faturaSeries[chave] || 0;
  const prefixo = ((unidade||'GER').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4)) || 'GER';
  DB.faturaSeries[chave] = atual+1;
  return `${prefixo}/${anoRef}/${String(atual+1).padStart(5,'0')}`;
}

/* Verifica se, dentro da mesma série de faturação (Unidade + Ano), já existe uma fatura
   emitida (Receita, com Nº de Fatura preenchido) com data POSTERIOR à data deste lançamento.
   Como a numeração é sempre sequencial-crescente (gerarNumeroFatura nunca reordena nem
   reaproveita números), gravar agora uma fatura com data mais antiga do que outra já emitida
   na mesma série vai resultar num Nº de Fatura mais alto associado a uma data mais antiga —
   ou seja, a numeração deixa de bater certo com a ordem cronológica. Não bloqueia o lançamento
   (às vezes é mesmo preciso lançar algo em atraso) — só avisa, devolvendo a fatura mais recente
   já emitida na série para o utilizador decidir se quer continuar mesmo assim. */
function faturaForaDeOrdem(unidade, dataStr, excluirId){
  const ano = String(dataStr||'').slice(0,4);
  if(!ano) return null;
  const maisRecente = DB.lancamentos
    .filter(l=> l.id!==excluirId && l.tipo==='Receita' && l.nFatura && String(l.nFatura).trim()!=='' &&
      (l.unidade||'GERAL')===(unidade||'GERAL') && String(l.data||'').slice(0,4)===ano)
    .reduce((max,l)=> (!max || l.data>max.data) ? l : max, null);
  if(maisRecente && dataStr < maisRecente.data) return maisRecente;
  return null;
}

/* ---------- Validação de Continuidade da Numeração de Faturas ----------
   Faturação certificada exige numeração sequencial, sem furos, dentro de cada série
   (Prefixo/Ano). gerarNumeroFatura() nunca reordena nem reaproveita números — mas o
   campo Nº de Fatura é um input de texto livre, por isso ainda é possível escrever
   manualmente um número fora da série, duplicado, ou saltar um número. Esta validação
   varre TODOS os lançamentos de Receita com Nº de Fatura, agrupa-os por série
   (Prefixo+Ano, extraído do próprio número — formato PREFIXO/ANO/NNNNN gerado pelo
   sistema) e reporta: duplicados (mesmo número usado 2x+) e furos (números em falta
   entre o menor e o maior da série). Números fora do padrão automático (escritos à mão,
   ou de outro formato) ficam à parte, para revisão manual. */
const REGEX_NUM_FATURA = /^([A-Z0-9]{1,6})\/(\d{4})\/(\d+)$/;
function validarNumeracaoFaturas(){
  const comFatura = DB.lancamentos.filter(l=> l.tipo==='Receita' && l.nFatura && String(l.nFatura).trim()!=='');
  const porSerie = {};
  const foraDoPadrao = [];
  comFatura.forEach(l=>{
    const m = REGEX_NUM_FATURA.exec(String(l.nFatura).trim());
    if(!m){ foraDoPadrao.push(l); return; }
    const [,prefixo,ano,numStr] = m;
    const chave = `${prefixo}/${ano}`;
    porSerie[chave] = porSerie[chave] || {prefixo, ano, ocorrencias:[]};
    porSerie[chave].ocorrencias.push({numero:Number(numStr), lanc:l});
  });
  const series = Object.entries(porSerie).map(([chave,s])=>{
    const numeros = s.ocorrencias.map(o=>o.numero);
    const min = Math.min(...numeros), max = Math.max(...numeros);
    const presentes = new Set(numeros);
    const furos = [];
    for(let n=min;n<=max;n++) if(!presentes.has(n)) furos.push(n);
    const contagem = {};
    s.ocorrencias.forEach(o=>{ contagem[o.numero]=(contagem[o.numero]||0)+1; });
    const duplicados = Object.entries(contagem).filter(([,c])=>c>1)
      .map(([n])=>({numero:Number(n), lancs:s.ocorrencias.filter(o=>o.numero===Number(n)).map(o=>o.lanc)}));
    const chaveContador = `${s.prefixo}:${s.ano}`;
    const proximoEsperado = (DB.faturaSeries[chaveContador]||0)+1;
    return {chave, prefixo:s.prefixo, ano:s.ano, qtd:numeros.length, min, max, furos, duplicados, proximoEsperado};
  }).sort((a,b)=> a.chave.localeCompare(b.chave));
  return {series, foraDoPadrao};
}
function viewValidacaoFaturas(){

  const totalFuros = series.reduce((s,x)=>s+x.furos.length,0);

  const linhasDuplicados = series.flatMap(s=>s.duplicados.flatMap(d=>d.lancs.map(l=>

  ).join('');

  return `

  <p class="note">Confere a continuidade da numeração sequencial de cada série (Unidade/Ano) gerada automaticamente pelo sistema — obrigatório para faturação certificada: sem furos e sem números repetidos. Números escritos manualmente fora do formato PREFIXO/ANO/NNNNN aparecem à parte, para revisão. Um "furo" pode ser legítimo (ex.: fatura anulada antes de existir o estorno) mas tem de estar justificado/documentado — nunca simplesmente desaparecer.</p>
  <div class="card" style="background:${tudoOk?'var(--verde-claro)':'#fdeceb'};border-color:${tudoOk?'var(--verde)':'var(--vermelho)'};margin-bottom:14px;">
    ${tudoOk? '✅ Todas as séries de faturação estão contínuas, sem furos nem duplicados.' : `⚠️ ${totalFuros} furo(s) e ${totalDuplicados} número(s) duplicado(s) encontrados — reveja abaixo.`}
    ${foraDoPadrao.length? ` &nbsp;|&nbsp; ${foraDoPadrao.length} fatura(s) com número fora do padrão automático.` : ''}
  </div>
  <div class="tablewrap" style="margin-bottom:20px;">
    <table><thead><tr><th>Série (Prefixo/Ano)</th><th class="right">Qtd. Faturas</th><th class="right">Intervalo</th><th>Furos</th><th>Duplicados</th><th class="right">Próximo Nº</th></tr></thead>
    <tbody>${linhasSeries}</tbody></table>
  </div>
  ${linhasDuplicados? `

    <div style="grid-column:1/-1;margin-top:8px;"><label>Descrição (opcional)</label><input id="transfDescricaoInput" value="${xmlEsc(transfDescricao)}" placeholder="ex.: Reforço de caixa, cobertura de despesas..."></div>
