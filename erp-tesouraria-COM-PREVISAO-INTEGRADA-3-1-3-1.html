<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesoucantabil — Powered By Zoom's Lodge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --verde-escuro:#14232B; --verde:#1F6F68; --verde-claro:#E4F0EE;
    --castanho:#C89B3C; --azul-nav:#1F6F68;
    --creme:#FBF3E1; --creme-texto:#14232B; --linha-alt:#FBF8F1; --cinza-sub:#F6F1E7;
    --bg:#F6F1E7; --card:#ffffff; --texto:#14232B; --muted:#55666E;
    --borda:#DDD2B8; --vermelho:#A6472E; --amarelo:#C89B3C;
    --gold:#C89B3C;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Inter','Segoe UI',Arial,Helvetica,sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--texto);}
  #app{display:flex;min-height:100vh;}
  nav{width:224px;background:var(--verde-escuro);color:#fff;flex-shrink:0;padding:20px 0;}
  nav h1{font-size:15px;padding:0 18px 16px;margin:0 0 6px;border-bottom:1px solid rgba(246,241,231,.14);line-height:1.35;font-family:var(--font-display);font-weight:600;letter-spacing:.01em;}
  nav .item{padding:10px 18px;cursor:pointer;font-size:13.5px;opacity:.82;border-left:3px solid transparent;color:#C7D2D4;transition:background .15s,opacity .15s;}
  nav .item:hover{opacity:1;background:rgba(246,241,231,.07);color:#fff;}
  nav .item.active{opacity:1;background:var(--azul-nav);color:#fff;border-left:3px solid var(--gold);font-weight:600;}
  main{flex:1;padding:24px 32px;overflow-x:auto;}
  h2{background:var(--verde-escuro);color:#fff;font-family:var(--font-display);font-weight:600;
     padding:12px 20px;margin:0 0 16px;border-radius:8px;font-size:17px;letter-spacing:.01em;}
  main h2.sub{background:var(--cinza-sub);color:var(--verde);font-family:var(--font-display);font-weight:600;
     padding:8px 14px;border-radius:7px;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:16px 20px;min-width:180px;flex:1;}
  .card .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .lbl2{color:var(--muted);white-space:nowrap;font-weight:600;font-size:12px;padding-right:4px;}
  .tab-conta{background:#fff;color:var(--verde-escuro);border:1px solid var(--borda);border-radius:9px;padding:8px 14px;cursor:pointer;font-family:var(--font-body);font-size:12.5px;text-align:left;line-height:1.55;transition:background .15s,border-color .15s,color .15s;}
  .tab-conta:hover{border-color:var(--verde);}
  .tab-conta.active{background:var(--verde-escuro);color:#fff;border-color:var(--verde-escuro);}
  .tab-conta span{font-family:var(--font-mono);}
  .tab-conta small{opacity:.7;font-weight:normal;color:inherit;}
  .card .val{font-size:22px;font-weight:600;margin-top:5px;font-family:var(--font-mono);}
  .val.pos{color:var(--verde);} .val.neg{color:var(--vermelho);}
  table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;}
  th,td{padding:9px 11px;border-bottom:1px solid var(--linha-alt);text-align:left;white-space:nowrap;}
  th{background:var(--verde-escuro);color:#fff;font-family:var(--font-body);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;}
  tbody tr:nth-child(even) td{background:var(--linha-alt);}
  tr:hover td{background:#F3ECD9;}
  td.right, th.right{font-family:var(--font-mono);}
  .tablewrap{border:1px solid var(--borda);border-radius:10px;overflow:auto;max-height:60vh;margin-top:10px;}
  form.inline{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:18px;margin-bottom:18px;}
  form.inline .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500;}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--borda);border-radius:7px;font-size:13px;font-family:var(--font-body);background:#fff;color:var(--texto);}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  button{cursor:pointer;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:600;background:var(--verde);color:#fff;font-family:var(--font-body);transition:background .15s;}
  button:hover{background:#195A54;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  button:disabled:hover{background:var(--verde);}
  button.sec{background:#fff;color:var(--verde-escuro);border:1px solid var(--borda);}
  button.sec:hover{background:var(--bg);}
  button.print{background:#fff;color:var(--verde-escuro);border:1px solid var(--borda);}
  button.print:hover{background:var(--bg);}
  button.danger{background:#fff;color:var(--vermelho);border:1px solid var(--vermelho);padding:4px 9px;font-size:11px;}
  button.danger:hover{background:#FBEDE8;}
  .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.pago{background:var(--verde-claro);color:var(--verde);} .badge.pendente{background:#FBF3E1;color:#8A6A22;} .badge.atraso{background:#F5E6E1;color:var(--vermelho);}
  .tag{display:inline-block;background:var(--verde-claro);color:var(--verde);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:500;}
  .note{font-size:12.5px;color:var(--creme-texto);background:var(--creme);padding:9px 13px;border-radius:7px;margin-top:8px;display:block;border:1px solid var(--gold);font-style:italic;}
  td.note,p.note{display:block;}
  .split{display:flex;gap:18px;flex-wrap:wrap;}
  .split>div{flex:1;min-width:320px;}
  .right{text-align:right;font-family:var(--font-mono);}
  #toast{position:fixed;bottom:18px;right:18px;background:var(--verde-escuro);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;display:none;z-index:99;font-family:var(--font-body);}
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--verde-escuro);}
  #loginScreen .box{background:#fff;border-radius:12px;padding:34px 32px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  #loginScreen h1{font-family:var(--font-display);color:var(--verde-escuro);font-size:21px;font-weight:600;margin:0 0 4px;}
  #loginScreen p.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;}
  #loginScreen input{margin-bottom:10px;}
  #loginScreen button{width:100%;padding:10px;margin-top:4px;}
  #loginScreen .erro{color:var(--vermelho);font-size:12.5px;margin-top:8px;}
  #loginScreen .troca{text-align:center;font-size:12px;margin-top:14px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  /* ---- documentos imprimíveis ---- */
  button.print::before{content:"🖨 ";}
  #printOverlay{display:none;position:fixed;inset:0;background:#6B6255;z-index:200;overflow-y:auto;padding:28px 0 60px;}
  #printOverlay.is-open{display:block;}
  .print-toolbar{max-width:800px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end;padding:0 8px;}
  .print-toolbar button{padding:9px 18px;}
  .print-sheet{max-width:800px;margin:0 auto;background:#fff;padding:56px 60px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-family:var(--font-body);color:var(--texto);}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--verde-escuro);padding-bottom:14px;}
  .print-brand{font-family:var(--font-display);font-weight:600;font-size:22px;}
  .print-brand-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .print-doc-meta{text-align:right;}
  .print-code{font-size:12px;color:var(--gold);font-weight:700;}
  .print-title{font-family:var(--font-display);font-weight:600;font-size:17px;}
  .print-subtitle{font-size:13px;color:var(--muted);font-style:italic;margin:12px 0 18px;}
  .print-section-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--verde);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 8px;}
  .print-field-table{width:100%;border-collapse:collapse;border:1px solid var(--borda);margin-bottom:4px;}
  .print-field-table td{border:1px solid var(--borda);padding:8px 12px;font-size:13.5px;}
  .print-field-table .print-label{background:var(--bg);font-weight:600;width:38%;}
  .print-field-table.is-highlight{border-color:var(--gold);}
  .print-field-table.is-highlight .print-label{background:var(--creme);}
  .print-grid-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px;}
  .print-grid-table th{background:var(--verde-escuro);color:#fff;padding:6px 5px;font-size:10.5px;text-align:left;}
  .print-grid-table td{border:1px solid var(--linha-alt);padding:5px;}
  .print-grid-table .print-label{font-weight:600;background:var(--bg);white-space:nowrap;}
  .print-grid-table .num{text-align:right;font-family:var(--font-mono);}
  .print-note{margin-top:16px;padding:10px 14px;background:var(--creme);border:1px solid var(--gold);border-radius:6px;font-size:12.5px;font-style:italic;}
  .print-signatures{display:flex;gap:40px;margin-top:56px;}
  .print-sig{flex:1;}
  .print-sig-line{border-top:1px solid var(--verde-escuro);margin-bottom:6px;}
  .print-sig span{font-size:12px;color:var(--muted);}
  @media print{
    body *{visibility:hidden;}
    #printOverlay, #printOverlay *{visibility:visible;}
    #printOverlay{position:absolute;inset:0;background:#fff;padding:0;}
    .print-toolbar{display:none;}
    .print-sheet{box-shadow:none;padding:0;max-width:none;}
  }
</style>

<div id="loginScreen" style="display:none;">
  <div class="box">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ---------- Ligação ao Supabase (o teu "servidor próprio") ----------
   1. Cria uma conta grátis em https://supabase.com e um novo projeto.
   2. Em Project Settings → API, copia o "Project URL" e a "anon public key" para aqui: */
const SUPABASE_URL = "https://okwvzccirgxnpugypsgf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pOtoNEKOi2nZaiZVqn2uhQ_WTwy5ctm";
const supa = (SUPABASE_URL.startsWith('http')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- Dados mestre (extraídos da planilha LISTAS / FOLHA DE SALÁRIOS) ---------- */
/* Reorganizado por grupo, seguindo o mapeamento de contas da AGT/PGC-AO (classe 6):
   DESPESAS = gastos correntes/operacionais (contas 62,63,64,68,69).
   CUSTOS (não despesas) = custo das mercadorias vendidas e matérias consumidas (61),
   ativo fixo (4x), amortizações (66) e provisões (67) — não são "despesa" no sentido
   de saída corrente de caixa, mas sim custo de produção/venda ou património. */
const CATEGORIAS_DESPESAS = ["Administrativas","Pessoal","Comerciais","Serviços de Terceiros","Funcionamento",
"Financeiras","Impostos e Taxas","Manutenção","Transportes","Seguros","Outros Custos Operacionais",
"Despesas Não Aceites Fiscalmente"];
const CATEGORIAS_CUSTOS = ["Compra de Mercadorias para Revenda","Matéria-Prima de Produção",
"Embalagens de Produção","Custo das Vendas","Investimentos / Imobilizado","Amortizações e Reintegrações",
"Provisões"];
/* Categorias que não são nem despesa nem custo (receita, passivo, movimento neutro) —
   continuam a existir para os Lançamentos que não são gasto. */
const CATEGORIAS_OUTRAS = ["Comercial e Vendas","Suprimentos","Transferência entre Contas",
"Imposto Industrial (Pagamento)","Férias/13º Salário (Pagamento)","Adiantamentos e Suprimentos de Caixa a Justificar"];
/* Receitas Operacionais (Vendas) — detalha a natureza de cada receita (o que foi vendido/prestado),
   complementando a Origem (de que caixa/loja veio o dinheiro). Usada no campo Categoria quando
   Tipo=Receita, e é a base do bloco "RECEITAS OPERACIONAIS (VENDAS)" no Resumo Mensal. */
const CATEGORIAS_RECEITAS = [
 "Venda de Mercadorias","Venda de Produtos Acabados","Prestação de Serviços",
 "Prestação de Serviços de Alojamento","Receitas de Restauração","Receitas de Padaria e Pastelaria",
 "Receitas de Loja / Comércio a Retalho","Receitas de Bar e Bebidas","Receitas de Outros Serviços",
 "Outras Receitas Operacionais",
];
const CATEGORIAS = [...CATEGORIAS_DESPESAS, ...CATEGORIAS_CUSTOS, ...CATEGORIAS_OUTRAS, ...CATEGORIAS_RECEITAS];
/* Grupo de cada categoria — usado para agrupar os <select> e os relatórios (DESPESAS vs CUSTOS). */
const GRUPO_CATEGORIA = {};
CATEGORIAS_DESPESAS.forEach(c=>GRUPO_CATEGORIA[c]="DESPESAS");
CATEGORIAS_CUSTOS.forEach(c=>GRUPO_CATEGORIA[c]="CUSTOS");
CATEGORIAS_OUTRAS.forEach(c=>GRUPO_CATEGORIA[c]="OUTRAS");
CATEGORIAS_RECEITAS.forEach(c=>GRUPO_CATEGORIA[c]="RECEITAS");

/* Espelhamento automático: quando um lançamento é Receita, a Categoria (Receitas Operacionais)
   é preenchida sozinha a partir da Unidade de Negócio (e, no caso do Zoom's Lodge, do "Tipo de
   Venda" escolhido) — o utilizador pode sempre corrigir à mão depois.
   - Zoom's Lodge: precisa de dizer se é Hospedagem/Restauração/Bar/Outros, porque a mesma unidade
     cobre os 4 tipos de receita.
   - Bakery Line (as 3 lojas): espelha sempre para UMA só categoria — "Receitas de Loja / Comércio a
     Retalho" — porque cada loja vende, na mesma venda diária, tanto produção própria (pão, bolos)
     como produtos revendidos, sem separação no fecho de caixa; "Loja/Retalho" é a categoria que
     cobre as vendas ao balcão da loja como um todo, tal como "Receitas de Padaria e Pastelaria"
     cobriria só a parte de produção própria.
   - Suprimentos: não é uma venda, mantém a categoria "Suprimentos". */
const TIPOS_VENDA_ZOOMS_LODGE = {
 "Hospedagem":"Prestação de Serviços de Alojamento",
 "Restauração":"Receitas de Restauração",
 "Bar":"Receitas de Bar e Bebidas",
 "Outros Serviços":"Receitas de Outros Serviços",
};
const CATEGORIA_RECEITA_BAKERY = "Receitas de Loja / Comércio a Retalho";

/* ---------- Motor Fiscal AGT ----------
   Tabela central de taxas e prazos da Administração Geral Tributária (Angola),
   para os outros módulos (IVA e Retenções, Mapas Fiscais, Controlo NIF) usarem
   em vez de terem números "mágicos" espalhados pelo código.
   IMPORTANTE: taxas e prazos podem mudar por despacho da AGT (já aconteceu
   várias vezes, incl. prorrogações pontuais) — isto é uma referência de apoio,
   NÃO substitui a confirmação no Portal do Contribuinte (portaldocontribuinte.minfin.gov.ao)
   ou com o contabilista/OCPCA antes de qualquer submissão ou pagamento. */
const REGRAS_FISCAIS_AGT = {
  iva: {
    taxaGeral: 0.14,
    taxasReduzidas: [0.07, 0.05, 0],
    prazoDeclaracao: "Até ao último dia útil do mês seguinte ao das operações (Declaração Periódica, Regime Geral)",
  },
  retencaoServicos: {
    taxa: 0.065,
    base: "Serviços de Terceiros",
    nota: "Retenção na fonte sobre prestações de serviços — confirme o enquadramento exato (residente/não residente, tipo de serviço) com o contabilista.",
  },
  impostoIndustrial: {
    taxaGeral: 0.25,
    taxaAgropecuaria: 0.10,
    taxaSectorEspecial: 0.35, // banca, seguros, telecomunicações, petrolíferas
    prazoModelo1RegimeGeral: "Até ao último dia útil de Maio (exercício anterior)",
    prazoModelo1RegimeSimplificado: "Até ao último dia útil de Abril (exercício anterior)",
    limiarRegimeSimplificado: "Volume de negócios/importações abaixo do equivalente a USD 250.000",
  },
  /* Juros de Suprimentos de Sócios (empréstimos de sócios à sociedade): a Lei nº 26/20
     (que alterou o Código do Imposto Industrial) passou a aceitar como custo fiscal os
     juros de suprimentos de sócios, MAS só até ao limite da taxa média anual de
     referência dos juros estabelecida pelo BNA — a parcela de juro acordada com o
     sócio que exceder essa taxa de referência NÃO é aceite como gasto dedutível ao
     Imposto Industrial. taxaReferenciaBNA é apenas um valor de referência/ponto de
     partida (a taxa BNA muda ao longo do tempo) — confirme sempre o valor em vigor
     junto do BNA/contabilista antes de aplicar; pode ser ajustada em
     "🏦 Controlo de Suprimentos de Sócios". */
  suprimentosSocios: {
    taxaReferenciaBNA: 0.195,
    nota: "Juros de suprimentos de sócios são custo fiscalmente aceite até ao limite da taxa média anual de referência do BNA (Lei nº 26/20, Código do Imposto Industrial). O excedente sobre essa taxa não é dedutível.",
  },
  /* IAC — Imposto sobre a Aplicação de Capitais (Decreto Legislativo Presidencial n.º 2/14,
     de 20 de Outubro). Os juros de suprimentos de sócios (empréstimos dos sócios à empresa)
     são tributados na Secção B, à taxa de 10% (OGE 2026 eliminou a taxa reduzida de 5% antes
     aplicável a alguns rendimentos de capitais). A liquidação/retenção é da responsabilidade
     da EMPRESA (entidade pagadora dos juros) — não do sócio — por retenção na fonte: a
     empresa retém 10% do juro bruto antes de o pagar ao sócio, e entrega esse valor à AGT
     até ao final do mês seguinte ao do pagamento do juro. */
  iac: {
    taxaSuprimentosSocios: 0.10,
    prazoEntrega: "Até ao final do mês seguinte ao do pagamento do juro (entidade pagadora, por retenção na fonte)",
    nota: "Os juros de suprimentos de sócios estão sujeitos a Imposto sobre a Aplicação de Capitais (IAC), Secção B, à taxa de 10% (Decreto Legislativo Presidencial n.º 2/14). A retenção é obrigação da empresa (entidade pagadora) — retém-se 10% do juro bruto antes do pagamento ao sócio e entrega-se à AGT até ao final do mês seguinte.",
  },
};

/* Devolve a data do último dia útil (seg-sex) de um mês (mes 0-indexado). */
function ultimoDiaUtilDoMes(ano, mes){
  const d = new Date(ano, mes+1, 0);
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()-1);
  return d;
}
function fmtData(d){ return d.toLocaleDateString('pt-PT'); }

/* Categoria "neutra" usada pelo FaturaBot quando uma única fatura reúne várias
   categorias de despesa: o Lançamento fica com esta categoria (um só movimento,
   uma só conta bancária/caixa), e o detalhe por categoria de cada item fica
   guardado em l.itensDetalhe — os relatórios por categoria (Resumo Mensal,
   Orçamento vs Realizado, DRE, retenções) usam esse detalhe para contar cada
   parte na categoria certa, sem fragmentar a Tesouraria em várias saídas. */
const CATEGORIA_DIVERSOS = "DIVERSOS (fatura com várias categorias)";
/* Devolve a lista de lançamentos "explodida": qualquer lançamento com
   itensDetalhe vira várias entradas virtuais (uma por categoria do detalhe),
   para uso em somas/relatórios por categoria. Lançamentos normais passam
   inalterados. NUNCA usar esta lista para saldos de Tesouraria/Contas a
   Pagar — aí o movimento real é sempre o lançamento único original. */
function explodirLancamentos(lista){
  const out = [];
  lista.forEach(l=>{
    if(Array.isArray(l.itensDetalhe) && l.itensDetalhe.length){
      l.itensDetalhe.forEach(it=> out.push({...l, categoria:it.categoria, valor:it.valor, descricao:it.descricao||l.descricao}));
    } else out.push(l);
  });
  return out;
}

/* Origem do valor — os "caixas"/unidades de negócio, tal como na folha LISTAS (col. A) e usados no
   quadro RECEITAS da folha RESUMO. Cada lançamento (sobretudo receitas) pode indicar de onde veio o dinheiro. */

/* Origem automática: Cash → sufixo CASH; qualquer outra forma de pagamento

   granularidade que a folha RESUMO e os relatórios de Origem usam.
   SUPRIMENTOS é um caso especial (não tem CASH/BANCO). */
function origemAutomatica(unidade, forma){
  if(!unidade) return '';
  if(unidade==='SUPRIMENTOS') return 'SUPRIMENTOS';
  return `${unidade} ${forma==='Cash' ? 'CASH' : 'BANCO'}`;
}

/* Calcula, para um bem do Mapa de Amortizações, a amortização acumulada até ao mês atual
   usando o MESMO método (mensal, meses completos desde o mês seguinte à aquisição) que
   gera os lançamentos automáticos — garante que o Mapa de Amortizações, o Balanço e o
   Livro Diário mostram sempre o mesmo valor acumulado para o mesmo bem. */
function amortizacaoAcumuladaDoBem(a){
  const valorBem = Number(a.valor||0);
  const vidaUtilAnos = Number(a.vidaUtil||0);
  if(!valorBem || !vidaUtilAnos || !a.dataAquisicao) return 0;
  const amortMensal = valorBem / (vidaUtilAnos*12);
  const dataAq = new Date(a.dataAquisicao+'T00:00:00');
  let cursor = new Date(dataAq.getFullYear(), dataAq.getMonth()+1, 1);
  const limite = new Date(hoje().slice(0,7)+'-01T00:00:00');
  let acumulado = 0;
  while(cursor <= limite && acumulado < valorBem - 0.5){
    acumulado += Math.min(amortMensal, valorBem - acumulado);
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  return acumulado;
}

/* Gera as linhas de amortização mensal (Débito Gasto de Amortização / Crédito Amortizações
   Acumuladas) para todos os bens do Mapa de Amortizações, desde o mês seguinte à aquisição
   até ao mês atual (ou até o bem ficar totalmente amortizado, o que vier primeiro). São
   lançamentos AUTOMÁTICOS e não-monetários — não mexem em Caixa/Bancos, por isso não
   entram em DB.lancamentos; existem só no Livro Diário/Balancete de partidas dobradas. */
function gerarLancamentosAmortizacaoMensal(){
  const linhas = [];
  const hojeStr = hoje();
  (DB.imobilizado||[]).forEach(a=>{
    const valorBem = Number(a.valor||0);
    const vidaUtilAnos = Number(a.vidaUtil||0);
    if(!valorBem || !vidaUtilAnos || !a.dataAquisicao) return;
    const amortMensal = valorBem / (vidaUtilAnos*12);
    const dataAq = new Date(a.dataAquisicao+'T00:00:00');
    let cursor = new Date(dataAq.getFullYear(), dataAq.getMonth()+1, 1); // começa no mês SEGUINTE à aquisição
    const limite = new Date(hojeStr.slice(0,7)+'-01T00:00:00');
    let acumuladoAteAqui = 0;
    while(cursor <= limite && acumuladoAteAqui < valorBem - 0.5){
      const valorMes = Math.min(amortMensal, valorBem - acumuladoAteAqui);
      acumuladoAteAqui += valorMes;
      const mesRef = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
      linhas.push({id:`amort:${a.id}:${mesRef}`, data:`${mesRef}-28`,
        descricao:`Amortização mensal — ${xmlEsc(a.descricao)} (${a.categoria})`,
        debito:CONTA_GASTO_AMORTIZACAO, credito:CONTA_AMORTIZACOES_ACUMULADAS,
        valor:valorMes, origem:'Amortização (automática)'});
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }
  });
  return linhas;
}
/* Total de amortização (gasto) reconhecido num ano específico — usado para o Resultado
   do Exercício incluir este gasto não-monetário (sem isto, o Balanço não batia: o Ativo
   já descontava a amortização acumulada, mas o Capital Próprio não). */
function amortizacaoDoAno(ano){
  return gerarLancamentosAmortizacaoMensal().filter(l=>l.data.startsWith(String(ano))).reduce((s,l)=>s+l.valor,0);
}

/* ---------- Provisão de Férias e 13º Salário (Subsídio de Natal) ----------
   Acréscimo mensal (1/12 de férias + 1/12 de 13º, sobre Base+Subsídios) para os
   trabalhadores atualmente na Folha de Salários — só para o ANO CORRENTE (meses já
   decorridos), porque o sistema não guarda o quadro de pessoal histórico de anos
   anteriores; assume-se que a provisão de anos já encerrados foi liquidada (pagamento
   de férias/13º) até ao fecho desse exercício. */
function provisaoFeriasDecimoTerceiroDoAno(ano){
  const anoCorrente = new Date().getFullYear();
  if(Number(ano)!==anoCorrente) return 0;
  const mesesDecorridos = new Date().getMonth()+1;
  const folhaMensal = DB.salarios.reduce((s,x)=> s + Number(x.base||0)+Number(x.subsidios||0), 0);
  return folhaMensal * (1/12 + 1/12) * mesesDecorridos;
}
function gerarLancamentosProvisaoFeriasDecimoTerceiro(){
  const anoCorrente = new Date().getFullYear();
  const linhas = [];
  const folhaMensal = DB.salarios.reduce((s,x)=> s + Number(x.base||0)+Number(x.subsidios||0), 0);
  if(!folhaMensal) return linhas;
  const valorMes = folhaMensal * (1/12 + 1/12);
  for(let m=1;m<=new Date().getMonth()+1;m++){
    const mesRef = `${anoCorrente}-${String(m).padStart(2,'0')}`;
    linhas.push({id:`provferias:${mesRef}`, data:`${mesRef}-28`,
      descricao:`Provisão mensal de Férias e 13º Salário (${DB.salarios.length} trabalhador(es))`,
      debito:CONTA_GASTO_FERIAS_13, credito:CONTA_FERIAS_13_A_PAGAR,
      valor:valorMes, origem:'Provisão Férias/13º (automática)'});
  }
  return linhas;
}

/* ---------- Provisão para Créditos de Cobrança Duvidosa ----------
   Estimativa sobre o saldo em aberto de Contas a Receber vencidas há mais de N dias
   (parâmetros configuráveis em DB.empresaConfig). Recalculada sempre "à data de hoje"
   — não é acumulada mês a mês como a amortização, é uma reavaliação do saldo atual. */
function configProvisaoCobrancaDuvidosa(){
  const cfg = DB.empresaConfig||{};
  return {
    dias: Number(cfg.provisaoCobrancaDuvidosaDias ?? 90),
    percentual: Number(cfg.provisaoCobrancaDuvidosaPercentual ?? 50),
  };
}
function provisaoCobrancaDuvidosaAtual(){
  const {dias, percentual} = configProvisaoCobrancaDuvidosa();
  const limite = new Date(); limite.setDate(limite.getDate()-dias);
  const limiteStr = limite.toISOString().slice(0,10);
  const emAtraso = (DB.contasReceber||[]).filter(c=>{
    const saldo = Number(c.valor||0)-Number(c.valorPago||0);
    return saldo>0.5 && c.vencimento && c.vencimento < limiteStr;
  }).reduce((s,c)=> s + (Number(c.valor||0)-Number(c.valorPago||0)), 0);
  return emAtraso * (percentual/100);
}
function gerarLancamentosProvisaoCobrancaDuvidosa(){
  const valor = provisaoCobrancaDuvidosaAtual();
  if(valor<=0.5) return [];
  return [{id:`provcobranca:${new Date().getFullYear()}`, data:hoje(),
    descricao:`Provisão para cobrança duvidosa (${configProvisaoCobrancaDuvidosa().percentual}% de contas vencidas há mais de ${configProvisaoCobrancaDuvidosa().dias} dias)`,
    debito:CONTA_GASTO_PROVISOES, credito:CONTA_PROVISAO_COBRANCA_DUVIDOSA,
    valor, origem:'Provisão Cobrança Duvidosa (automática)'}];
}

/* ---------- Diferenças Cambiais ----------
   Reavalia, mês a mês, o saldo de cada conta em moeda estrangeira (EUR/USD) ao câmbio
   desse mês, e reconhece a diferença face ao saldo contabilístico (soma dos lançamentos
   ao câmbio histórico de cada um) como Ganho ou Perda Cambial — só no mês em que muda
   (a diferença ACUMULADA menos a do mês anterior). Só é possível calcular para meses com
   taxa de câmbio registada em "💱 Tabela de Câmbio". */
function calcularReavaliacaoCambial(){
  const linhas = [];
  const contasEstrangeiras = CONTAS.filter(c=>c.moeda==='EUR'||c.moeda==='USD');
  contasEstrangeiras.forEach(c=>{
    const lancsConta = DB.lancamentos.filter(l=>l.conta===c.codigo && !l.neutralizado).sort((a,b)=>a.data.localeCompare(b.data));
    if(!lancsConta.length) return;
    const mesesAno = [...new Set(lancsConta.map(l=>mesKey(l.data)))];
    const primeiroMes = mesesAno.sort()[0];
    const mesAtualStr = hoje().slice(0,7);
    let cursor = new Date(primeiroMes+'-01T00:00:00');
    const limite = new Date(mesAtualStr+'-01T00:00:00');
    let diferencaAnterior = 0;
    while(cursor<=limite){
      const mesRef = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;
      const ateEsteMes = lancsConta.filter(l=>mesKey(l.data)<=mesRef);
      const saldoNativo = ateEsteMes.reduce((s,l)=> s + (l.tipo==='Receita'?1:-1)*Number(l.valor||0), 0);
      const saldoContabilKZ = ateEsteMes.reduce((s,l)=> s + (l.tipo==='Receita'?1:-1)*valorEmKZ(l), 0);
      const taxaMes = taxaCambio(c.moeda, `${mesRef}-28`);
      let diferencaAcumulada = diferencaAnterior;
      if(taxaMes){
        const saldoRevalorizadoKZ = saldoNativo*taxaMes;
        diferencaAcumulada = saldoRevalorizadoKZ - saldoContabilKZ;
      }
      const diferencaDoMes = diferencaAcumulada - diferencaAnterior;
      linhas.push({conta:c.codigo, moeda:c.moeda, mesRef, ano:Number(mesRef.slice(0,4)),
        saldoNativo, taxaMes, saldoContabilKZ, diferencaAcumulada, diferencaDoMes});
      diferencaAnterior = diferencaAcumulada;
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }
  });
  return linhas;
}
function gerarLancamentosDiferencasCambiais(){
  return calcularReavaliacaoCambial().filter(l=>Math.abs(l.diferencaDoMes)>0.5).map(l=>{
    const ganho = l.diferencaDoMes>0;
    const contaBanco = CONTAS.find(c=>c.codigo===l.conta) || {codigo:l.conta,nome:l.conta};
    return {id:`cambio:${l.conta}:${l.mesRef}`, data:`${l.mesRef}-28`,
      descricao:`Reavaliação cambial de ${contaBanco.nome} (${l.moeda}) — ${ganho?'ganho':'perda'} cambial do mês`,
      debito: ganho?{cod:contaBanco.codigo,nome:contaBanco.nome}:CONTA_PERDAS_CAMBIAIS,
      credito: ganho?CONTA_GANHOS_CAMBIAIS:{cod:contaBanco.codigo,nome:contaBanco.nome},
      valor:Math.abs(l.diferencaDoMes), origem:'Diferença Cambial (automática)'};
  });
}
function diferencaCambialDoAno(ano){
  return calcularReavaliacaoCambial().filter(l=>l.ano===Number(ano)).reduce((s,l)=>s+l.diferencaDoMes,0);
}

/* ---------- Provisão de Imposto Industrial ----------
   Taxa configurável (padrão: Regime Geral 25%, art.º Imposto Industrial) sobre o Resultado
   Antes de Impostos do ano (já líquido de amortizações e provisões). Só incide sobre anos
   com lucro (não há provisão sobre prejuízo fiscal, e não considera prejuízos fiscais
   reportáveis de anos anteriores — confirme sempre com o contabilista/OCPCA). */
function taxaImpostoIndustrial(){
  return Number((DB.empresaConfig||{}).taxaImpostoIndustrial ?? (REGRAS_FISCAIS_AGT.impostoIndustrial.taxaGeral*100));
}
/* Despesas contabilisticamente reais mas que a AGT não aceita como custo dedutível para
   efeitos de Imposto Industrial — hoje sobretudo compras sem fatura/NIF válido (ex.:
   justificação de adiantamento de caixa em Mercado Informal, marcada com
   semDocumentoFiscal:true), mais qualquer lançamento lançado diretamente na categoria
   "Despesas Não Aceites Fiscalmente". Continuam a contar no Resultado Contabilístico
   (DRE) — são custo real do negócio — mas têm de ser somadas de volta ao lucro antes de
   calcular o imposto, porque a lei fiscal não as aceita como dedução. */
function custosNaoAceitesFiscalmenteDoAno(ano){
  return DB.lancamentos.filter(l=>
    l.tipo==='Despesa' && !l.neutralizado && mesKey(l.data).startsWith(String(ano)) &&
    (l.semDocumentoFiscal || l.categoria==='Despesas Não Aceites Fiscalmente')
  ).reduce((s,l)=>s+valorEmKZ(l),0);
}
function lucroTributavelDoAno(ano){
  return resultadoAntesImpostoDoAno(ano) + custosNaoAceitesFiscalmenteDoAno(ano);
}
function impostoIndustrialDoAno(ano){
  const lucro = lucroTributavelDoAno(ano);
  return lucro>0 ? lucro*(taxaImpostoIndustrial()/100) : 0;
}
function gerarLancamentosImpostoIndustrial(){
  const anos = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))];
  return anos.filter(ano=>impostoIndustrialDoAno(ano)>0.5).map(ano=>({
    id:`impostoindustrial:${ano}`, data:`${ano}-12-31`,
    descricao:`Provisão de Imposto Industrial do exercício ${ano} (${taxaImpostoIndustrial()}% sobre o lucro)`,
    debito:CONTA_GASTO_IMPOSTO_INDUSTRIAL, credito:CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR,
    valor:impostoIndustrialDoAno(ano), origem:'Imposto Industrial (automático)'}));
}


/* ---------- Livro Diário (Partidas Dobradas) ----------
   Gera, para CADA lançamento e para cada Conta a Pagar/Receber em aberto, um par
   Débito/Crédito. Ao contrário do sistema anterior (que só somava receitas/despesas
   por categoria), isto é contabilidade real de dupla entrada: todo o movimento tem
   uma origem (de onde saiu) e um destino (para onde foi) — por construção, o Total
   Débito é sempre igual ao Total Crédito do sistema inteiro. */
function gerarLivroDiario(){
  const linhas = [];
  DB.lancamentos.forEach(l=>{
    if(l.neutralizado) return; // neutralizado = fora de TODOS os relatórios oficiais, não só da lista
    const contaBanco = CONTAS.find(c=>c.codigo===l.conta) || {codigo:l.conta||'—', nome:l.conta||'Conta não identificada'};
    const cCateg = contaDe(l.categoria);
    const valor = valorEmKZ(l);
    if(!valor) return;
    const debito = l.tipo==='Receita' ? {cod:contaBanco.codigo,nome:contaBanco.nome} : {cod:cCateg.cod,nome:cCateg.nome};
    const credito = l.tipo==='Receita' ? {cod:cCateg.cod,nome:cCateg.nome} : {cod:contaBanco.codigo,nome:contaBanco.nome};
    linhas.push({id:l.id, data:l.data, descricao:l.descricao||l.categoria||'—', debito, credito, valor, origem:'Lançamento'});
  });
  (DB.contasPagar||[]).forEach(c=>{
    const saldo = Number(c.valor||0) - Number(c.valorPago||0);
    if(saldo <= 0.5) return; // liquidado (total ou parcialmente até sobrar quase nada)
    linhas.push({id:c.id, data:c.vencimento||hoje(), descricao:`Fornecedor: ${xmlEsc(c.entidade)}${c.descricao?' — '+xmlEsc(c.descricao):''}`,
      debito:{cod:'62',nome:'Fornecimentos e Serviços Externos (a pagar)'}, credito:CONTA_FORNECEDORES,
      valor:saldo, origem:'Conta a Pagar'});
  });
  (DB.contasReceber||[]).forEach(c=>{
    const saldo = Number(c.valor||0) - Number(c.valorPago||0);
    if(saldo <= 0.5) return;
    linhas.push({id:c.id, data:c.vencimento||hoje(), descricao:`Cliente: ${xmlEsc(c.entidade)}${c.descricao?' — '+xmlEsc(c.descricao):''}`,
      debito:CONTA_CLIENTES, credito:{cod:'78',nome:'Outros Rendimentos a Receber'},
      valor:saldo, origem:'Conta a Receber'});
  });
  linhas.push(...gerarLancamentosAmortizacaoMensal());
  linhas.push(...gerarLancamentosImpostoIndustrial());
  linhas.push(...gerarLancamentosProvisaoFeriasDecimoTerceiro());
  linhas.push(...gerarLancamentosProvisaoCobrancaDuvidosa());
  linhas.push(...gerarLancamentosDiferencasCambiais());
  return linhas.sort((a,b)=> a.data.localeCompare(b.data));
}

/* Agrega o Livro Diário por conta — dá o Balancete real (Débito/Crédito/Saldo por
   código de conta), incluindo as contas de Caixa/Bancos individualmente. */
function calcularBalancetePartidasDobradas(){
  const livro = gerarLivroDiario();
  const contas = {};
  const soma = (cod,nome,campo,valor)=>{
    contas[cod] = contas[cod] || {cod, nome, debito:0, credito:0};
    contas[cod][campo] += valor;
  };
  livro.forEach(l=>{
    soma(l.debito.cod, l.debito.nome, 'debito', l.valor);
    soma(l.credito.cod, l.credito.nome, 'credito', l.valor);
  });
  const totalDebito = livro.reduce((s,l)=>s+l.valor,0);
  const totalCredito = totalDebito; // por construção (partidas dobradas)
  return {contas, livro, totalDebito, totalCredito};
}


/* Gera as <option> de categoria agrupadas, para usar dentro de um <select>. `sel` é a
   categoria atualmente selecionada. `contexto` filtra os grupos mostrados:
   'receita' → só RECEITAS OPERACIONAIS + OUTRAS (Suprimentos/Transferência também podem ser entrada);
   'despesa' → DESPESAS + CUSTOS + OUTRAS (Suprimentos/Transferência também podem ser saída);
   sem contexto (undefined) → todos os grupos, usado só no filtro de pesquisa de Lançamentos,
   onde Tipo pode não estar definido. Isto evita que uma Receita apareça classificável como
   "Administrativas" (ou vice-versa), o que estragaria o Resumo/DRE/Balancete. */
function optsCategorias(sel, contexto){
  let grupos;
  if(contexto==='receita') grupos = [["RECEITAS OPERACIONAIS (VENDAS)",CATEGORIAS_RECEITAS],["OUTRAS",CATEGORIAS_OUTRAS]];
  else if(contexto==='despesa') grupos = [["DESPESAS",CATEGORIAS_DESPESAS],["CUSTOS (não despesas)",CATEGORIAS_CUSTOS],["OUTRAS",CATEGORIAS_OUTRAS]];
  else grupos = [["RECEITAS OPERACIONAIS (VENDAS)",CATEGORIAS_RECEITAS],["DESPESAS",CATEGORIAS_DESPESAS],["CUSTOS (não despesas)",CATEGORIAS_CUSTOS],["OUTRAS",CATEGORIAS_OUTRAS]];
  return grupos.map(([label,lista])=>
    `<optgroup label="${label}">${lista.map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')}</optgroup>`
  ).join('');
}

/* ---------- FATURABOT — motor de leitura e classificação de faturas de despesas ---------- */
/* Sementes de conhecimento: fornecedores/palavras-chave frequentes → sugestão inicial.
   Aprende e melhora sozinho a cada fatura aprovada (ver DB.faturabotAprendizado). */
const FATURABOT_SEED = [
  {chave:"ende", categoria:"Funcionamento", origem:"", nota:"Energia elétrica"},
  {chave:"epal", categoria:"Funcionamento", origem:"", nota:"Água"},
  {chave:"unitel", categoria:"Serviços de Terceiros", origem:"", nota:"Telecomunicações"},
  {chave:"internet", categoria:"Serviços de Terceiros", origem:"", nota:"Internet"},
  {chave:"sonangol", categoria:"Transportes", origem:"", nota:"Combustível"},
  {chave:"pump", categoria:"Transportes", origem:"", nota:"Combustível"},
  {chave:"combustí", categoria:"Transportes", origem:"", nota:"Combustível"},
  {chave:"cimento", categoria:"Matéria-Prima de Produção", origem:"", nota:"Material de construção"},
  {chave:"honorário", categoria:"Serviços de Terceiros", origem:"", nota:"Honorários"},
  {chave:"escritório", categoria:"Administrativas", origem:"", nota:"Material de escritório"},
  {chave:"manutenção", categoria:"Manutenção", origem:"", nota:"Serviços de manutenção"},
];
function faturabotSugestao(fornecedor, descricao){
  const alvo = `${fornecedor||''} ${descricao||''}`.toLowerCase().trim();
  if(!alvo) return null;
  const chaveExata = (fornecedor||'').toLowerCase().trim();
  if(DB.faturabotAprendizado[chaveExata]) return {...DB.faturabotAprendizado[chaveExata], origemSugestao:'histórico da empresa'};
  const s = FATURABOT_SEED.find(s=>alvo.includes(s.chave));
  if(s) return {categoria:s.categoria, conta:'', origemSugestao:`padrão conhecido (${xmlEsc(s.nota)})`};
  return null;
}

/* ---------- Sugestão de categoria para linhas do Extrato Bancário (Conciliação) ----------
   Reutiliza a mesma lógica de categorização automática das Despesas (FaturaBot: histórico da
   empresa + palavras-chave conhecidas), acrescentando padrões próprios de extrato bancário —
   Comissões/Mensalidade de TPA e taxas do banco vão para "Financeiras"; transferências de
   sócios identificadas como Suprimento vão para "Suprimentos". Serve para o utilizador saber
   em que categoria lançar cada pagamento "só no extrato" (ainda não lançado no sistema), e
   para o resumo mensal de pagamentos ao banco por categoria. */
const TERMOS_BANCARIOS_EXTRATO = [
  {chave:'comiss', categoria:'Financeiras', nota:'comissão bancária'},
  {chave:'mensalidade tpa', categoria:'Financeiras', nota:'mensalidade TPA'},
  {chave:'manutenção de conta', categoria:'Financeiras', nota:'manutenção de conta'},
  {chave:'imposto de selo', categoria:'Financeiras', nota:'imposto de selo bancário'},
  {chave:'juro', categoria:'Financeiras', nota:'juro bancário'},
  {chave:'suprimento', categoria:'Suprimentos', nota:'suprimento de sócio'},
  {chave:'fecho tpa', categoria:'Comercial e Vendas', nota:'liquidação de vendas TPA'},
];
/* Extrai um possível nome de fornecedor/entidade de descrições típicas do extrato,
   ex.: "TPA-500295023Mv85 PUMANGOL" → "PUMANGOL". Sem padrão reconhecido, devolve ''. */
function extrairEntidadeDescricaoExtrato(descricao){
  const m = String(descricao||'').match(/^TPA-\S+\s+(.+)$/i);
  return m ? m[1].trim() : '';
}
function sugerirCategoriaExtrato(descricao){
  const desc = (descricao||'').toLowerCase();
  const termo = TERMOS_BANCARIOS_EXTRATO.find(t=>desc.includes(t.chave));
  if(termo) return {categoria:termo.categoria, entidade:'', origemSugestao:`padrão de extrato bancário (${xmlEsc(termo.nota)})`};
  const entidade = extrairEntidadeDescricaoExtrato(descricao);
  const sug = faturabotSugestao(entidade, descricao);
  if(sug) return {categoria:sug.categoria, entidade, origemSugestao:sug.origemSugestao};
  return entidade ? {categoria:'', entidade, origemSugestao:''} : null;
}

/* ---------- Controlo NIF ----------
   Validação de formato do NIF angolano (não confirma existência real na AGT,
   só a estrutura). Duas famílias mais comuns:
   - Pessoa Coletiva (empresas): 10 dígitos.
   - Pessoa Singular: baseado no nº do Bilhete de Identidade, 9 dígitos + 2 letras + 3 dígitos.
   Outros formatos (estrangeiros, passaporte, formatos antigos) ficam como "a confirmar",
   sem bloquear o lançamento — isto é apoio, não substitui verificação no Portal do Contribuinte. */
function validarNIF(nifRaw){
  const nif = (nifRaw||'').trim().toUpperCase().replace(/[\s.\-]/g,'');
  if(!nif) return {valido:false, tipo:'', mensagem:'NIF em falta'};
  if(/^\d{10}$/.test(nif)) return {valido:true, tipo:'Pessoa Coletiva', mensagem:'Formato válido (empresa)'};
  if(/^\d{9}[A-Z]{2}\d{3}$/.test(nif)) return {valido:true, tipo:'Pessoa Singular', mensagem:'Formato válido (particular, nº BI)'};
  if(/^\d{8,9}$/.test(nif)) return {valido:null, tipo:'A confirmar', mensagem:'Só dígitos, sem letras — confirme se está completo (formato de particular costuma ter 2 letras)'};
  return {valido:false, tipo:'', mensagem:'Formato de NIF não reconhecido'};
}

function faturabotValidar(f){
  const alertas = [];
  const vNif = validarNIF(f.nif);
  if(vNif.valido===false) alertas.push(`NIF: ${vNif.mensagem}.`);
  else if(vNif.valido===null) alertas.push(`NIF: ${vNif.mensagem}.`);
  const total = faturabotTotalItens(f);
  const dupFB = DB.faturabot.some(x=>x.id!==f.id && x.fornecedor===f.fornecedor && x.nFatura===f.nFatura && Number(x.valor)===Number(total) && f.nFatura);
  const dupLanc = DB.lancamentos.some(l=>l.entidade===f.fornecedor && l.nFatura===f.nFatura && Number(l.valor)===Number(total) && f.nFatura);
  if(dupFB || dupLanc) alertas.push('Possível documento duplicado (mesmo fornecedor + nº fatura + valor).');
  if(f.vencimento && f.data && f.vencimento < f.data) alertas.push('Data de vencimento anterior à data da fatura.');
  if(f.iva==='Sim' && (!f.taxaIVA || Number(f.taxaIVA)<=0)) alertas.push('Marcado como sujeito a IVA mas sem taxa definida.');
  if(!total || total<=0) alertas.push('Valor em falta ou inválido.');
  const itens = faturabotGetItens(f);
  if(itens.some(i=>!i.valor || Number(i.valor)<=0)) alertas.push('Há pelo menos um item da fatura sem valor.');
  return alertas;
}

/* logar(): grava uma entrada no histórico curto em memória (DB.log, limitado a 500 —
   janela rápida, sem custo de rede, usada no filtro/relatórios do dia a dia) E, em
   paralelo, tenta gravar a mesma entrada numa tabela à parte no servidor (erp_log), que
   nunca é limitada nem apagada — para o histórico de auditoria não se perder para sempre
   quando sai da janela dos 500 mais recentes. A gravação em erp_log é "melhor esforço":
   se a tabela ainda não tiver sido criada (falta correr o SQL — ver 🧾 Log de Alterações),
   falha em silêncio (só um aviso na consola) e nunca bloqueia nem atrasa o registo local. */
function logar(acao,detalhe){
  const entrada = {id:uid(), quando:new Date().toISOString(), quem:meuEmail||'', acao, detalhe};
  DB.log.push(entrada);
  if(DB.log.length>500) DB.log = DB.log.slice(-500);
  if(supa){
    supa.from('erp_log').insert({quando:entrada.quando, quem:entrada.quem, acao:entrada.acao, detalhe:entrada.detalhe})
      .then(({error})=>{ if(error) console.warn('Histórico completo (erp_log) não gravado — provavelmente falta o SQL de configuração.', error); });
  }
}

function mesKey(data){ return (data||hoje()).slice(0,7); }
function taxaCambio(moeda,data){
  if(moeda==='KZ') return 1;
  const r = DB.cambio[mesKey(data)];
  if(!r) return null;
  return moeda==='EUR' ? Number(r.EUR||0) : Number(r.USD||0);
}
function valorEmKZ(l){
  if(l.moeda==='KZ') return Number(l.valor)||0;
  const t = taxaCambio(l.moeda,l.data);
  return t ? (Number(l.valor)||0)*t : (Number(l.valor)||0);
}

/* ---------- Saldo de Abertura bancário por ano ----------
   O saldo de abertura de uma conta bancária só pode ser um valor manual no "ano base"
   dessa conta (o ano mais antigo com lançamentos, ou o ano mais antigo já configurado
   manualmente). Para qualquer ano seguinte, o saldo de abertura é sempre calculado
   automaticamente como o saldo transitado do fecho de Dezembro do ano anterior — nunca
   um valor solto e independente por ano, à semelhança de como os Resultados Transitados
   já funcionam no Balanço. Isto evita que o mesmo valor sirva, por engano, de abertura
   para vários anos diferentes. */
function anoBaseContaBanco(codigo){
  const anosLanc = DB.lancamentos.filter(l=>l.conta===codigo).map(l=>Number(mesKey(l.data).slice(0,4)));
  const cfg = (DB.bancosConfig && DB.bancosConfig[codigo]) || {};
  const anosManual = Object.keys(cfg.saldoAberturaAno||{}).map(Number);
  const anos = [...anosLanc, ...anosManual, new Date().getFullYear()];
  return Math.min(...anos);
}
function saldoAberturaContaAno(codigo, ano){
  const cfg = (DB.bancosConfig && DB.bancosConfig[codigo]) || {};
  const porAno = cfg.saldoAberturaAno || {};
  const anoBase = anoBaseContaBanco(codigo);
  let saldo = porAno[anoBase]!==undefined ? Number(porAno[anoBase]||0) : Number(cfg.saldoAbertura||0); // fallback ao campo legado, pré-migração
  for(let a=anoBase; a<Number(ano); a++){
    for(let m=0;m<12;m++){
      const chaveMes = `${a}-${String(m+1).padStart(2,'0')}`;
      /* Mesma correção de !l.neutralizado aplicada ao movimento mensal em
         viewBancos — sem isto, o saldo de abertura transitado de anos
         anteriores também ficava a incluir lançamentos que deviam estar
         fora de todos os relatórios oficiais. */
      const mov = DB.lancamentos.filter(l=>l.conta===codigo && !l.neutralizado && mesKey(l.data)===chaveMes)
        .reduce((s,l)=> s + (l.tipo==='Receita'? Number(l.valor||0) : -Number(l.valor||0)), 0);
      saldo += mov;
    }
  }
  return saldo;
}

/* ---------- Reconciliação: Lançamentos (base do SAF-T) vs Fecho de Caixa declarado ----------
   Para cada dia + unidade de negócio + turno, soma-se:
   - totalLancado  = Receitas com Nº de Fatura preenchido nesse dia/unidade/turno (o que entra no SAF-T)
   - totalDeclarado = soma dos valores contados/declarados pelo caixa nesse dia/unidade/turno (DB.fechosCaixa)
   Se a diferença ultrapassar a tolerância, marca-se como "divergente".
   O "turno" é opcional (vazio/"—" = dia inteiro / turno único) — nem todos os dias são divididos
   por turno, mas quando são (vários fechos de caixa no mesmo dia/unidade), agrupar só por dia
   escondia diferenças entre turnos ou obrigava a somar tudo à força. Por isso a chave inclui
   sempre o turno: dias sem turno continuam a comparar-se normalmente (ambos os lados caem em
   "—"), e dias com turno só batem certo quando o lançamento e a contagem física do MESMO turno
   coincidem. */
const TOLERANCIA_RECONCILIACAO_KZ = 1; /* margem para arredondamentos */
function calcularReconciliacao(){
  const chaves = new Set();
  const porChave = {};
  const chaveDe = (data,unidade,turno)=>`${data}||${unidade||'—'}||${turno||'—'}`;

  DB.lancamentos.filter(l=>l.tipo==='Receita' && l.nFatura).forEach(l=>{
    const unidade = (l.unidade || (l.origem||'').split(' ')[0] || '—');
    const turno = l.turno || '—';
    const k = chaveDe(l.data, unidade, turno);
    chaves.add(k);
    porChave[k] = porChave[k] || {chave:k, data:l.data, unidade, turno, totalLancado:0, totalDeclarado:0, nDocs:0, lancamentos:[], fechos:[]};
    porChave[k].totalLancado += valorEmKZ(l);
    porChave[k].nDocs++;
    porChave[k].lancamentos.push(l);
  });

  (DB.fechosCaixa||[]).forEach(f=>{
    const unidade = f.unidade || '—';
    const turno = f.turno || '—';
    const k = chaveDe(f.data, unidade, turno);
    chaves.add(k);
    porChave[k] = porChave[k] || {chave:k, data:f.data, unidade, turno, totalLancado:0, totalDeclarado:0, nDocs:0, lancamentos:[], fechos:[]};
    const valorKZ = f.moeda==='KZ' ? Number(f.valorContado||0) : (Number(f.valorContado||0) * (taxaCambio(f.moeda,f.data)||1));
    porChave[k].totalDeclarado += valorKZ;
    porChave[k].fechos.push(f);
  });

  const linhas = Array.from(chaves).map(k=>{
    const r = porChave[k];
    const diferenca = r.totalLancado - r.totalDeclarado;
    const temDeclaracao = (DB.fechosCaixa||[]).some(f=>chaveDe(f.data,f.unidade||'—',f.turno||'—')===k);
    let status = 'ok';
    if(!temDeclaracao) status = 'pendente';
    else if(Math.abs(diferenca) > TOLERANCIA_RECONCILIACAO_KZ) status = 'divergente';
    return {...r, diferenca, status, observacao: (DB.reconciliacaoObservacoes||{})[k] || ''};
  }).sort((a,b)=> b.data.localeCompare(a.data));

  return linhas;
}

/* ---------- Conciliação de Extrato Bancário Real (CSV/Excel/OCR) ----------
   Mesma ideia da reconciliação SAF-T vs Fecho de Caixa, mas aqui compara-se o extrato
   bancário REAL (importado pelo utilizador) com os lançamentos do sistema pagos/recebidos
   por Banco/TPA/Transferência nessa conta — incluindo pagamentos a fornecedores por banco.
   Tolerância de 1 Kz para arredondamentos; janela de ±2 dias na data (compensação de
   processamento bancário) antes de considerar "sem correspondência". */
const TOLERANCIA_CONCILIACAO_KZ = 1;
function diasEntre(d1,d2){ return Math.abs((new Date(d1)-new Date(d2))/(24*3600*1000)); }

/* Regra do TPA: no mesmo dia é NORMAL haver mais do que um fecho de TPA (vários
   lotes/terminais, ou vários turnos/caixas a fechar em separado) — por isso o sistema
   NÃO bloqueia nem trata isso como duplicado. Em vez disso, avisa quantos fechos já
   existem nesse dia/conta antes de gravar mais um, e numera cada lançamento com o seu
   "fechoTpaSeq" (1º, 2º, 3º fecho do dia) para ficar claro no histórico e na conferência
   — sem interferir na reconciliação por lote (calcularConciliacaoExtrato, Passagem 2), que
   já soma todos os fechos TPA do dia/conta ao comparar com o extrato. */
function fechosTPADoDia(data, contaCodigo){
  const lista = DB.lancamentos.filter(l=> l.tipo==='Receita' && l.formaPagamento==='TPA (Multicaixa)' && l.data===data && l.conta===contaCodigo);
  return {quantidade: lista.length, total: lista.reduce((s,l)=>s+Number(l.valor||0),0)};
}
function confirmarFechoTPAAdicional(data, contaCodigo){
  const existentes = fechosTPADoDia(data, contaCodigo);
  if(!existentes.quantidade) return true;
  const contaNome = (CONTAS.find(c=>c.codigo===contaCodigo)||{}).nome || contaCodigo;
  return confirm(`Já há ${existentes.quantidade} fecho(s) de TPA lançado(s) em ${data} na conta ${contaNome}, totalizando ${fmt(existentes.total)} Kz.\n\nEste será mais um fecho TPA do mesmo dia (${existentes.quantidade+1}º) — normal se for outro lote/terminal ou outro turno. Confirma que NÃO é um lançamento em duplicado?`);
}

function calcularConciliacaoExtrato(contaCodigo){
  const extrato = (DB.extratoImportado && DB.extratoImportado[contaCodigo]) || [];
  const lancsConta = DB.lancamentos.filter(l=> l.conta===contaCodigo && l.formaPagamento!=='Cash');

  const usadosLanc = new Set();
  const linhasExtrato = extrato.map(e=>{
    const alvo = Math.abs(Number(e.valor));
    const descExtrato = (e.descricao||'').toLowerCase();
    const ehTPANoExtrato = descExtrato.includes('tpa');
    const candidato = lancsConta.find(l=>{
      if(usadosLanc.has(l.id)) return false;
      const sinalLanc = l.tipo==='Receita' ? 1 : -1;
      const sinalExtrato = Number(e.valor) >= 0 ? 1 : -1;
      if(sinalLanc !== sinalExtrato) return false;
      if(Math.abs(valorEmKZ(l) - alvo) > TOLERANCIA_CONCILIACAO_KZ) return false;
      if(diasEntre(l.data, e.data) <= 2) return true;
      /* Pagamento lançado como "Banco" mas que no banco sai como TPA (débito
         directo ao mesmo fornecedor): considera-se a mesma transação mesmo
         fora da janela normal de ±2 dias, desde que o fornecedor (entidade)
         apareça na descrição do extrato. */
      const fornecedorNoExtrato = l.entidade && descExtrato.includes(l.entidade.toLowerCase().trim());
      return l.formaPagamento==='Banco' && ehTPANoExtrato && fornecedorNoExtrato;
    });
    if(candidato) usadosLanc.add(candidato.id);
    const status = candidato? 'confere':'so_extrato';
    const sugestao = status==='so_extrato' ? sugerirCategoriaExtrato(e.descricao) : null;
    return {...e, status, lancId: candidato?candidato.id:null,
      categoriaSugerida: sugestao?.categoria || '', entidadeSugerida: sugestao?.entidade || '',
      origemSugestao: sugestao?.origemSugestao || ''};
  });

  /* Passagem 2 — Fecho de TPA por lote (agregado por dia): o banco muitas vezes credita
     o "Fecho TPA" do dia em VÁRIOS lotes/terminais (várias linhas no extrato, cada uma de
     um lote), enquanto o Fecho de Caixa Dividido lança normalmente UM único valor por dia
     na forma de pagamento "TPA (Multicaixa)". Por isso, se não houve correspondência 1:1,
     tenta-se somar todas as linhas "Fecho TPA" (créditos, sem ser "Comissões...") do extrato
     num dia (± 2 dias) e comparar com a soma dos lançamentos TPA ainda por confirmar nesse
     mesmo intervalo — se as somas baterem (tolerância de 1 Kz), tudo é dado como conciliado. */
  const restantesExtratoTPA = linhasExtrato.filter(l=>{
    if(l.status!=='so_extrato') return false;
    const d=(l.descricao||'').toLowerCase();
    return d.includes('fecho tpa') && !d.includes('comiss') && Number(l.valor)>0;
  });
  const restantesLancTPA = lancsConta.filter(l=> !usadosLanc.has(l.id) && l.formaPagamento==='TPA (Multicaixa)' && l.tipo==='Receita');
  const porDiaExtratoTPA = {};
  restantesExtratoTPA.forEach(l=>{ (porDiaExtratoTPA[l.data]=porDiaExtratoTPA[l.data]||[]).push(l); });
  Object.keys(porDiaExtratoTPA).forEach(dia=>{
    const grupoExtrato = porDiaExtratoTPA[dia];
    const somaExtrato = grupoExtrato.reduce((s,l)=>s+Number(l.valor),0);
    const candidatosLanc = restantesLancTPA.filter(l=> !usadosLanc.has(l.id) && diasEntre(l.data, dia) <= 2);
    if(!candidatosLanc.length) return;
    const somaLanc = candidatosLanc.reduce((s,l)=>s+valorEmKZ(l),0);
    if(Math.abs(somaExtrato - somaLanc) <= TOLERANCIA_CONCILIACAO_KZ){
      grupoExtrato.forEach(l=>{ l.status='confere'; l.lancId='agregado'; l.categoriaSugerida=''; l.entidadeSugerida=''; l.origemSugestao=''; });
      candidatosLanc.forEach(l=>usadosLanc.add(l.id));
    }
  });

  const lancamentosSemMatch = lancsConta.filter(l=>!usadosLanc.has(l.id)).map(l=>({
    id:l.id, data:l.data, descricao:l.descricao||l.categoria, valor:(l.tipo==='Receita'?1:-1)*valorEmKZ(l), status:'so_sistema'
  }));

  const todas = linhasExtrato.concat(lancamentosSemMatch).sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  const nConfere = linhasExtrato.filter(l=>l.status==='confere').length;
  const nSoExtrato = linhasExtrato.filter(l=>l.status==='so_extrato').length;
  const nSoSistema = lancamentosSemMatch.length;
  return {linhas:todas, nConfere, nSoExtrato, nSoSistema, total:todas.length};
}

/* ---------- Importação de Extrato: CSV/Excel ----------
   Deteta automaticamente colunas de Data, Descrição e Valor (ou Débito/Crédito
   separados) por nome de cabeçalho — cobre os formatos mais comuns de exportação
   dos bancos angolanos. Datas em DD/MM/AAAA ou AAAA-MM-DD são normalizadas. */
function normalizarDataExtrato(v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
function normalizarValorExtrato(v){
  if(v===undefined||v===null||v==='') return NaN;
  if(typeof v==='number') return v;
  const s = String(v).trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.');
  return Number(s.replace(/[^\d.\-]/g,''));
}
/* Cada Conta do Plano de Contas está ligada a um número de conta bancário real (numConta),
   cujo sufixo costuma corresponder à "natureza" (ex.: BFA-001 → ...300 01, BFA-KZ-002 →
   ...300 02). O extrato bancário real traz esse número de conta no cabeçalho/título do
   documento — comparamos os dois para confirmar que o ficheiro importado é mesmo o extrato
   da conta selecionada, e não de outra conta do mesmo banco (evita conciliações que nunca
   batem por o extrato ser de outra conta). */
function normalizarNumConta(s){ return String(s||'').replace(/\D/g,''); }
function extrairNumeroContaDoTexto(texto){
  const m = String(texto||'').match(/conta[^\d]{0,10}([\d\s]{10,25})/i);
  return m ? normalizarNumConta(m[1]) : '';
}
function detectarContaPorNumero(numDigits){
  if(!numDigits) return null;
  return CONTAS.find(c=> c.numConta && normalizarNumConta(c.numConta)===numDigits) || null;
}

/* ---------- Correlação Conta ↔ Extrato (rastreabilidade por lançamento) ----------
   Complementa o campo `conta` (que já liga o lançamento à conta interna certa desde
   que é criado — ver "+ Lançar" abaixo): aqui guardamos TAMBÉM, no próprio lançamento,
   o banco e o nº de conta do extrato de onde ele veio (nContaExtrato, bancoExtrato,
   idExtrato), para auditoria — dá para ver, lançamento a lançamento, exactamente de
   que conta/linha do extrato ele nasceu, mesmo que a conta interna seja editada depois. */
function extraiNumeroContaBancaria(numConta){
  if(!numConta) return null;
  const m = String(numConta).match(/(\d{2,3})[\s]*$/);
  return m ? m[1].padStart(3,'0') : null;
}
function extraiCodigoBanco(codigoOuBanco){
  if(!codigoOuBanco) return null;
  const m = String(codigoOuBanco).match(/^([a-zA-Z]+)/);
  return m ? m[1].toLowerCase() : null;
}
/* 3 estratégias com fallback: (1) código interno exacto — cobre sempre os lançamentos
   criados por "+ Lançar" ou por Fecho de Caixa, que já gravam `conta` correcto; (2) nº de
   conta + banco do extrato; (3) só o sufixo do nº de conta. Serve sobretudo de rede de
   segurança para lançamentos antigos/editados à mão sem `conta` válida. */
function correlacionarContaBancaria(lancamento, contas=CONTAS){
  if(!lancamento) return null;
  if(lancamento.conta){
    const contaExata = contas.find(c=>c.codigo===lancamento.conta);
    if(contaExata) return contaExata;
  }
  if(lancamento.nContaExtrato && lancamento.bancoExtrato){
    const contaPorNumero = contas.find(c=>{
      if(!c.numConta) return false;
      const nContaConta = extraiNumeroContaBancaria(c.numConta);
      const bancoConta = extraiCodigoBanco(c.codigo) || extraiCodigoBanco(c.banco) || '';
      return nContaConta===lancamento.nContaExtrato && bancoConta===lancamento.bancoExtrato.toLowerCase();
    });
    if(contaPorNumero) return contaPorNumero;
  }
  if(lancamento.nContaExtrato){
    const contaPorSufixo = contas.find(c=> c.numConta && extraiNumeroContaBancaria(c.numConta)===lancamento.nContaExtrato);
    if(contaPorSufixo) return contaPorSufixo;
  }
  return null;
}
function lancamentosExtratoSemCorrelacao(){
  return DB.lancamentos.filter(l=> l.origem && l.origem.includes('Conciliação Bancária') && l.nContaExtrato && !correlacionarContaBancaria(l, CONTAS));
}
function extrairLinhasDeMatriz(matriz){
  if(!matriz.length) return [];
  const cab = matriz[0].map(h=>String(h||'').toLowerCase().trim());
  const idxData = cab.findIndex(h=>/data|date/.test(h));
  const idxDesc = cab.findIndex(h=>/descri|histor|memo|detalhe/.test(h));
  const idxValor = cab.findIndex(h=>/^valor$|montante|amount/.test(h));
  const idxDebito = cab.findIndex(h=>/d[ée]bito|debit/.test(h));
  const idxCredito = cab.findIndex(h=>/cr[ée]dito|credit/.test(h));
  const linhas = [];
  for(let i=1;i<matriz.length;i++){
    const row = matriz[i];
    if(!row || row.every(c=>c===''||c===undefined||c===null)) continue;
    const data = normalizarDataExtrato(idxData>=0?row[idxData]:row[0]);
    const descricao = idxDesc>=0 ? String(row[idxDesc]||'') : (row[1]||'');
    let valor;
    if(idxValor>=0){ valor = normalizarValorExtrato(row[idxValor]); }
    else {
      const d = idxDebito>=0 ? normalizarValorExtrato(row[idxDebito]) : NaN;
      const c = idxCredito>=0 ? normalizarValorExtrato(row[idxCredito]) : NaN;
      valor = !isNaN(c)&&c!==0 ? Math.abs(c) : (!isNaN(d)&&d!==0 ? -Math.abs(d) : NaN);
    }
    if(!data || isNaN(valor)) continue;
    linhas.push({id:uid(), data, descricao:descricao.trim(), valor});
  }
  return linhas;
}
function parseCSVExtrato(texto){
  const delim = (texto.split('\n')[0].split(';').length > texto.split('\n')[0].split(',').length) ? ';' : ',';
  const matriz = texto.split(/\r?\n/).filter(l=>l.trim()!=='').map(l=>l.split(delim).map(c=>c.replace(/^"|"$/g,'').trim()));
  return {linhas: extrairLinhasDeMatriz(matriz), numContaDetectado: extrairNumeroContaDoTexto(texto)};
}
function parseXLSXExtrato(arrayBuffer){
  /* Alguns extratos (ex.: exportações do BAI geradas a partir de PDF) vêm
     com os movimentos espalhados por várias folhas ("Table 1", "Table 2"...),
     intercaladas com folhas de título/rodapé sem dados. Por isso percorremos
     TODAS as folhas do ficheiro e juntamos as linhas válidas de cada uma —
     folhas sem cabeçalho reconhecível simplesmente não contribuem linhas. O
     número de conta costuma vir numa dessas folhas de título (ex.: "Conta
     28900162530001"), por isso procuramo-lo em todas enquanto percorremos. */
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  let todasLinhas = [];
  let numContaDetectado = '';
  for(const nomeFolha of wb.SheetNames){
    const folha = wb.Sheets[nomeFolha];
    const matriz = XLSX.utils.sheet_to_json(folha, {header:1, raw:false, defval:''});
    todasLinhas = todasLinhas.concat(extrairLinhasDeMatriz(matriz));
    if(!numContaDetectado){
      const textoFolha = matriz.map(r=>r.join(' ')).join(' ');
      numContaDetectado = extrairNumeroContaDoTexto(textoFolha);
    }
  }
  return {linhas: todasLinhas, numContaDetectado};
}

/* ---------- Importação em Lote do FaturaBot: CSV/Excel ----------
   Mesma lógica de leitura do Extrato Bancário (deteção de colunas por nome de
   cabeçalho, várias folhas, CSV com ; ou ,), mas para lançar várias DESPESAS de
   uma só vez a partir de uma folha de cálculo — sem precisar de foto/PDF por
   fatura. Colunas reconhecidas (qualquer ordem, cabeçalho por nome):
   Fornecedor/Entidade, NIF, Nº Fatura, Data, Valor, Categoria (opcional — se
   vazia usa a sugestão automática do FaturaBot), Forma de Pagamento (opcional,
   default "Cash"), Unidade (opcional), Descrição (opcional). Cada linha válida
   vira uma fatura "Pendente" no FaturaBot, tal como uma leitura por IA — passa
   pela mesma aprovação antes de gerar o Lançamento. */
function extrairFaturasDeMatriz(matriz){
  if(!matriz.length) return [];
  const cab = matriz[0].map(h=>String(h||'').toLowerCase().trim());
  const idx = (re)=> cab.findIndex(h=>re.test(h));
  const idxFornecedor = idx(/fornecedor|entidade|nome/);
  const idxNif = idx(/^nif$/);
  const idxNFatura = idx(/n[ºo°]?\s*fatura|nfatura|documento/);
  const idxData = idx(/data/);
  const idxValor = idx(/valor|montante|total/);
  const idxCategoria = idx(/categoria/);
  const idxForma = idx(/forma.*pagamento|pagamento/);
  const idxUnidade = idx(/unidade/);
  const idxDescricao = idx(/descri/);
  const idxMoeda = idx(/moeda/);
  const faturas = [];
  for(let i=1;i<matriz.length;i++){
    const row = matriz[i];
    if(!row || row.every(c=>c===''||c===undefined||c===null)) continue;
    const fornecedor = idxFornecedor>=0 ? String(row[idxFornecedor]||'').trim() : '';
    const data = normalizarDataExtrato(idxData>=0?row[idxData]:'');
    const valor = idxValor>=0 ? normalizarValorExtrato(row[idxValor]) : NaN;
    if(!fornecedor || !data || isNaN(valor) || valor<=0) continue;
    faturas.push({
      fornecedor,
      nif: idxNif>=0 ? String(row[idxNif]||'').trim() : '',
      nFatura: idxNFatura>=0 ? String(row[idxNFatura]||'').trim() : '',
      data, valor,
      moeda: idxMoeda>=0 ? (String(row[idxMoeda]||'').trim().toUpperCase()||'KZ') : 'KZ',
      categoria: idxCategoria>=0 ? String(row[idxCategoria]||'').trim() : '',
      formaPagamento: idxForma>=0 ? String(row[idxForma]||'').trim() : '',
      unidade: idxUnidade>=0 ? String(row[idxUnidade]||'').trim() : '',
      descricao: idxDescricao>=0 ? String(row[idxDescricao]||'').trim() : '',
    });
  }
  return faturas;
}
function parseCSVFaturaBot(texto){
  const delim = (texto.split('\n')[0].split(';').length > texto.split('\n')[0].split(',').length) ? ';' : ',';
  const matriz = texto.split(/\r?\n/).filter(l=>l.trim()!=='').map(l=>l.split(delim).map(c=>c.replace(/^"|"$/g,'').trim()));
  return extrairFaturasDeMatriz(matriz);
}
function parseXLSXFaturaBot(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  let todasFaturas = [];
  for(const nomeFolha of wb.SheetNames){
    const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nomeFolha], {header:1, raw:false, defval:''});
    todasFaturas = todasFaturas.concat(extrairFaturasDeMatriz(matriz));
  }
  return todasFaturas;
}

/* ---------- Bloqueio Otimista (concorrência de escrita) ----------
   Todos os dados vivem numa única linha (erp_data / id "main"), e cada gravação substitui
   o blob inteiro. Sem isto, dois utilizadores em simultâneo podiam apagar-se um ao outro em
   silêncio: A abre a página de manhã, B lança dados o dia todo, A grava algo à tarde (ainda
   com os dados desatualizados na memória) — e isso reescrevia tudo o que B tinha feito
   entretanto, sem aviso nenhum.
   DB_VERSAO guarda o contador "versao" tal como veio do servidor na última leitura/gravação
   bem sucedida. Ao gravar, só atualizamos a linha SE o "versao" no servidor ainda for esse
   mesmo valor (ninguém gravou por cima entretanto) — e incrementamo-lo em 1. Se outra
   pessoa já tiver gravado, o "versao" mudou, a nossa condição falha, zero linhas são
   afetadas, e detetamos isso em vez de gravar às cegas por cima. Nesse caso, a única forma
   segura de garantir que não se perde nem se apaga o trabalho de mais ninguém é recarregar
   a página com os dados mais recentes e pedir para repetir a última ação.
   Usa-se um contador inteiro (não o "updated_at") porque uma comparação de texto entre
   timestamps é frágil a diferenças de precisão/formatação — um inteiro é inequívoco.
   Requer a coluna "versao" em erp_data — ver instruções em 🔑 Membros e Acessos. Enquanto
   essa coluna não existir, o sistema deteta o erro e grava no modo antigo (sem proteção),
   avisando por toast. */
let DB_VERSAO = null;
let DB_SEM_COLUNA_VERSAO = false;
async function loadDB(){
  try{
    let { data, error } = await supa.from('erp_data').select('data, versao').eq('id','main').single();
    if(error && String(error.message||'').toLowerCase().includes('versao')){
      /* Coluna "versao" ainda não existe nesta base — cai para o modo antigo (sem bloqueio
         otimista) em vez de falhar o carregamento todo. Ver instruções em 🔑 Membros e Acessos. */
      DB_SEM_COLUNA_VERSAO = true;
      ({ data, error } = await supa.from('erp_data').select('data').eq('id','main').single());
    }
    if(error) throw error;
    if(data && data.data) DB = Object.assign({}, DB, data.data);
    if(data && !DB_SEM_COLUNA_VERSAO) DB_VERSAO = (data.versao===undefined||data.versao===null) ? 0 : data.versao;
  }catch(e){ console.warn('Erro ao carregar dados', e); toast('Não consegui carregar os dados do servidor.'); }
  inicializarModulosOCeAprovacoes();
  await gerarLancamentosRecorrentesPendentes(false);
  render();
  if(meuPapel && meuPapel!=='caixa'){
    try{
      const urgentesLoad = calcularAlertasFinanceiros().filter(a=>a.nivel==='alto');
      if(urgentesLoad.length) toast(`🔔 ${urgentesLoad.length} alerta(s) urgente(s) precisam de atenção — ver 🔔 Alertas Financeiros.`);
    }catch(e){ /* não bloqueia o carregamento da app se o cálculo de alertas falhar */ }
  }
}
async function saveDB(){
  try{
    if(DB_SEM_COLUNA_VERSAO){
      /* Coluna "versao" ainda não existe (SQL de configuração ainda não foi corrido) —
         grava no modo antigo, sem proteção contra concorrência. Ver 🔑 Membros e Acessos. */
      const { error } = await supa.from('erp_data').update({data: DB, updated_at: new Date().toISOString()}).eq('id','main');
      if(error) throw error;
      return true;
    }
    const versaoEsperada = DB_VERSAO||0;
    const novaVersao = versaoEsperada + 1;
    const { data, error } = await supa.from('erp_data').update({data: DB, updated_at: new Date().toISOString(), versao: novaVersao}).eq('id','main').eq('versao', versaoEsperada).select('versao');
    if(error){
      if(String(error.message||'').toLowerCase().includes('versao')){
        DB_SEM_COLUNA_VERSAO = true;
        const { error: error2 } = await supa.from('erp_data').update({data: DB, updated_at: new Date().toISOString()}).eq('id','main');
        if(error2) throw error2;
        toast('Aviso: a proteção contra gravações simultâneas ainda não está ativa — ver instruções em 🔑 Membros e Acessos.');
        return true;
      }
      throw error;
    }
    if(!data || !data.length){
      alert('⚠️ Outra pessoa gravou alterações neste sistema entretanto.\n\nPara não apagar o trabalho dela, a tua última ação NÃO foi guardada.\n\nA página vai recarregar com os dados mais recentes — por favor repete a última ação.');
      location.reload();
      return false;
    }
    DB_VERSAO = novaVersao;
    return true;
  }
  catch(e){ console.warn(e); toast('Erro ao guardar no servidor. Tente novamente.'); return false; }
}

/* ========== MÓDULO 1: PREVISÃO DE TESOURARIA (CASH FLOW FORECAST) ========== */
function analisarPadroesReceitas(diasAtrair = 180) {
  const hoje = new Date();
  const dataLimite = new Date(hoje.getTime() - diasAtrair * 24 * 60 * 60 * 1000);
  const receitasHistoricas = (DB.lancamentos || [])
    .filter(l => l.tipo === 'Receita' && !l.neutralizado && new Date(l.data) > dataLimite);
  if(!receitasHistoricas.length) return null;
  const porDiaSemana = {'Segunda': [], 'Terça': [], 'Quarta': [], 'Quinta': [], 'Sexta': [], 'Sábado': [], 'Domingo': []};
  const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  receitasHistoricas.forEach(l => {
    const d = new Date(l.data + 'T00:00:00');
    const diaSemana = diasSemana[d.getDay()];
    porDiaSemana[diaSemana].push(Number(l.valor || 0));
  });
  const mediaPorDia = {};
  Object.entries(porDiaSemana).forEach(([dia, valores]) => {
    mediaPorDia[dia] = valores.length > 0 ? valores.reduce((a,b)=>a+b,0) / valores.length : 0;
  });
  const todasAsReceitas = Object.values(porDiaSemana).flat();
  const mediaGeral = todasAsReceitas.length > 0 ? todasAsReceitas.reduce((a,b)=>a+b,0) / todasAsReceitas.length : 0;
  return { diasAtrair, dataLimite: dataLimite.toISOString().slice(0,10), mediaGeral, mediaPorDia, totalDiasComDados: receitasHistoricas.length };
}
function analisarPadraoDespesas(diasAtrair = 180) {
  const hoje = new Date();
  const dataLimite = new Date(hoje.getTime() - diasAtrair * 24 * 60 * 60 * 1000);
  const despesasHistoricas = (DB.lancamentos || []).filter(l => l.tipo === 'Despesa' && !l.neutralizado && new Date(l.data) > dataLimite);
  if(!despesasHistoricas.length) return null;
  const totalDespesas = despesasHistoricas.reduce((s,l) => s + Number(l.valor||0), 0);
  const dias = Math.ceil((hoje - dataLimite) / (24 * 60 * 60 * 1000));
  const mediaDespesaDiaria = totalDespesas / dias;
  const valores = despesasHistoricas.map(l => Number(l.valor||0));
  const media = valores.reduce((a,b)=>a+b,0) / valores.length;
  const desvio = Math.sqrt(valores.reduce((s,v)=>(s + Math.pow(v-media, 2)), 0) / valores.length);
  return { diasAtrair, totalDespesas, mediaDespesaDiaria, desvio, volatilidade: (desvio / media) * 100 };
}
function previsaoContasAPagarProximos30Dias() {
  const hoje = new Date();
  const dateFim = new Date(hoje.getTime() + 30 * 24 * 60 * 60 * 1000);
  const contasVencidas = (DB.contasPagar || []).filter(c => {
    if(!c.vencimento) return false;
    const dVenc = new Date(c.vencimento);
    const saldo = Number(c.valor||0) - Number(c.valorPago||0);
    return dVenc > hoje && dVenc <= dateFim && saldo > 0;
  });
  return contasVencidas.map(c => ({ entidade: c.entidade, valor: Number(c.valor||0) - Number(c.valorPago||0), vencimento: c.vencimento, categoria: c.categoria || 'Outros' })).sort((a,b) => a.vencimento.localeCompare(b.vencimento));
}
function calcularSaldoAtual() {
  const contas = CONTAS.filter(c => c.codigo !== 'SUPRIMENTOS');
  let totalSaldo = 0;
  contas.forEach(conta => {
    const saldo = DB.lancamentos.filter(l => !l.neutralizado && l.conta === conta.codigo).reduce((s,l) => {
      const valor = Number(l.valor||0);
      return l.tipo === 'Receita' ? s + valor : s - valor;
    }, 0);
    totalSaldo += valorEmKZ(saldo, conta.moeda);
  });
  return totalSaldo;
}
function gerarPrevisaoFluxoCaixa(diasAdiante = 30) {
  const padraoReceitas = analisarPadroesReceitas(180);
  const padraoDespesas = analisarPadraoDespesas(180);
  const contasAgendadas = previsaoContasAPagarProximos30Dias();
  if(!padraoReceitas || !padraoDespesas) return { ok: false, msg: 'Histórico insuficiente (requer ≥180 dias de dados)' };
  const hoje = new Date();
  const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const previsao = [];
  let saldoAtual = calcularSaldoAtual();
  const saldoInicial = saldoAtual;
  for(let i = 1; i <= diasAdiante; i++) {
    const data = new Date(hoje.getTime() + i * 24 * 60 * 60 * 1000);
    const dataStr = data.toISOString().slice(0,10);
    const diaSemana = diasSemana[data.getDay()];
    const receitaEsperada = padraoReceitas.mediaPorDia[diaSemana] || 0;
    const variacao = (Math.random() - 0.5) * padraoDespesas.desvio;
    const despesaEsperada = Math.max(0, padraoDespesas.mediaDespesaDiaria + variacao);
    const contasHoje = contasAgendadas.filter(c => c.vencimento === dataStr);
    const contasHojeTotal = contasHoje.reduce((s,c) => s + c.valor, 0);
    const fluxoDia = receitaEsperada - despesaEsperada - contasHojeTotal;
    saldoAtual += fluxoDia;
    previsao.push({
      data: dataStr, diaSemana, receitaEsperada: Math.round(receitaEsperada), despesaEsperada: Math.round(despesaEsperada),
      contasAgendadas: contasHojeTotal > 0 ? Math.round(contasHojeTotal) : 0, fluxoLiquido: Math.round(fluxoDia),
      saldoProjetado: Math.round(saldoAtual), emRisco: saldoAtual < 50000, contas: contasHoje
    });
  }
  return { ok: true, saldoInicial: Math.round(saldoInicial), diasProjetados: diasAdiante, previsao, saldoFinal: Math.round(saldoAtual), variacaoTotal: Math.round(saldoAtual - saldoInicial), diasEmRisco: previsao.filter(p => p.emRisco).length };
}
function resumoPrevisaoTesouraria() {
  const previsao30 = gerarPrevisaoFluxoCaixa(30);
  const previsao60 = gerarPrevisaoFluxoCaixa(60);
  const previsao90 = gerarPrevisaoFluxoCaixa(90);
  if(!previsao30.ok) return previsao30;
  const minimoProx30 = Math.min(...previsao30.previsao.map(p => p.saldoProjetado));
  const minimoProx60 = Math.min(...previsao60.previsao.map(p => p.saldoProjetado));
  const minimoProx90 = Math.min(...previsao90.previsao.map(p => p.saldoProjetado));
  return {
    ok: true, saldoAtual: previsao30.saldoInicial,
    proximos30: { saldoFinal: previsao30.saldoFinal, variacao: previsao30.variacaoTotal, minimo: minimoProx30, diasEmRisco: previsao30.diasEmRisco },
    proximos60: { saldoFinal: previsao60.saldoFinal, variacao: previsao60.variacaoTotal, minimo: minimoProx60, diasEmRisco: previsao60.diasEmRisco },
    proximos90: { saldoFinal: previsao90.saldoFinal, variacao: previsao90.variacaoTotal, minimo: minimoProx90, diasEmRisco: previsao90.diasEmRisco },
    alerta: minimoProx30 < 50000 ? 'CRÍTICO: Saldo abaixo de 50k nos próximos 30 dias!' : null
  };
}
