/* ---------- Motor Fiscal AGT ---------- */
let ultimoMotorFiscal = null;
/* ---------- Reporting Fiscal (Integração Automática) ----------
   Ferramenta de reporting fiscal para cumprir as obrigações legais/fiscais da AGT: em vez
   de recalcular ou reintroduzir números, este módulo só LÊ os valores já apurados noutros
   módulos (🧾 IVA e Retenções, 👥 Folha de Salários, 📈 DRE, 📑 Mapas Fiscais) e junta-os
   num único checklist por período, com prazo (do 🏛️ Motor Fiscal AGT) e um estado que o
   utilizador pode marcar (Pendente/Submetido/Pago) — essa marcação fica guardada em
   DB.obrigacoesFiscais, por período e por obrigação. Não faz nenhuma submissão eletrónica
   à AGT (o ERP não tem essa integração) — é um painel de controlo interno do que falta
   entregar, com os valores já prontos para copiar para o Portal do Contribuinte. */
function chaveObrigacao(periodo, nome){ return `${periodo}::${nome}`; }
function estadoObrigacao(periodo, nome){
  DB.obrigacoesFiscais = DB.obrigacoesFiscais || {};
  return DB.obrigacoesFiscais[chaveObrigacao(periodo,nome)] || {estado:'Pendente', observacao:''};
}
function viewReportingFiscal(){
  const hojeD = new Date();
  const ano = hojeD.getFullYear();
  const mesIdx = hojeD.getMonth();
  const periodoMes = `${ano}-${String(mesIdx+1).padStart(2,'0')}`;
  const nomeMes = MESES[mesIdx];

  /* IVA do mês corrente — mesma lógica de viewIVA/dadosMensais.
     !l.neutralizado: lançamento neutralizado = fora de TODOS os relatórios
     oficiais (mesma regra aplicada em todo o resto do ERP), incluindo aqui
     o apuramento de IVA e a retenção sobre Serviços de Terceiros. */
  const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===periodoMes && !l.neutralizado);
  const ivaLiquidadoMes = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelMes = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaApuradoMes = ivaLiquidadoMes - ivaDedutivelMes;

  /* Retenção na Fonte s/ Serviços de Terceiros do mês — mesma lógica de Mapas Fiscais. */
  const retServicosMes = explodirLancamentos(doMes.filter(l=>l.tipo==='Despesa'))
    .filter(l=>l.categoria==='Serviços de Terceiros')
    .reduce((s,l)=>s+valorEmKZ(l),0) * REGRAS_FISCAIS_AGT.retencaoServicos.taxa;

  /* IRT sobre a Folha de Salários atual (mensal) — mesma lógica de Folha de Salários. */
  const irtMes = DB.salarios.reduce((s,f)=>{
    const bruto = Number(f.base||0)+Number(f.subsidios||0);
    const inssTrab = bruto*INSS_TAXA_TRABALHADOR;
    return s + calcIRT(bruto-inssTrab);
  },0);
  const inssEntidadeMes = DB.salarios.reduce((s,f)=>{const bruto=Number(f.base||0)+Number(f.subsidios||0); return s+bruto*INSS_TAXA_EMPRESA;},0);

  /* Imposto Industrial — provisão do exercício corrente (já calculada na DRE). */
  const impostoIndustrialAno = impostoIndustrialDoAno(ano);

  /* Imposto Predial sobre Rendas ("RENT") — só se aplica a quem tem receitas de arrendamento
     de imóveis. Zoom's Lodge/Bakery Line não têm essa categoria de receita nos Lançamentos,
     por isso fica configurável manualmente (para o dia em que passe a aplicar-se), em vez de
     inventar um valor. Guardado em DB.obrigacoesFiscaisConfig. */
  DB.obrigacoesFiscaisConfig = DB.obrigacoesFiscaisConfig || {};
  const rentAplicavel = !!DB.obrigacoesFiscaisConfig.rentAplicavel;
  const rentBaseAnual = Number(DB.obrigacoesFiscaisConfig.rentBaseAnual||0);

  /* IAC sobre Juros de Suprimentos de Sócios do mês — soma o Bruto de todos os juros
     registados em Controlo de Suprimentos de Sócios cuja data caia neste mês, × taxa IAC. */
  const iacMes = DB.suprimentosSocios.flatMap(a=>a.jurosRegistados||[])
    .filter(j=>mesKey(j.data)===periodoMes)
    .reduce((s,j)=>s+Number(j.retencaoIAC!=null ? j.retencaoIAC : Number(j.valor||0)*REGRAS_FISCAIS_AGT.iac.taxaSuprimentosSocios), 0);

  const obrigacoes = [
    {chave:'IVA', periodo:periodoMes, nome:`Declaração Periódica de IVA — ${nomeMes}/${ano}`, base:`IVA Liquidado (${fmt(ivaLiquidadoMes)}) − IVA Dedutível (${fmt(ivaDedutivelMes)})`, valor:ivaApuradoMes, origem:'🧾 IVA e Retenções', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'RETSERV', periodo:periodoMes, nome:`Retenção na Fonte s/ Serviços de Terceiros — ${nomeMes}/${ano}`, base:`${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% sobre despesas "Serviços de Terceiros" do mês`, valor:retServicosMes, origem:'📑 Mapas Fiscais', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'IAC', periodo:periodoMes, nome:`IAC — Retenção s/ Juros de Suprimentos de Sócios — ${nomeMes}/${ano}`, base:`${(REGRAS_FISCAIS_AGT.iac.taxaSuprimentosSocios*100).toFixed(0)}% sobre o juro bruto pago aos sócios neste mês (🏦 Controlo de Suprimentos de Sócios)`, valor:iacMes, origem:'🏦 Controlo de Suprimentos de Sócios', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'IRT', periodo:periodoMes, nome:`IRT — Retenção sobre Salários — ${nomeMes}/${ano}`, base:`Soma do IRT calculado por trabalhador na Folha de Salários atual`, valor:irtMes, origem:'👥 Folha de Salários', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'INSS', periodo:periodoMes, nome:`INSS (Trabalhador 3% + Entidade 8%) — ${nomeMes}/${ano}`, base:`Calculado sobre a Folha de Salários atual`, valor:(DB.salarios.reduce((s,f)=>{const bruto=Number(f.base||0)+Number(f.subsidios||0);return s+bruto*INSS_TAXA_TRABALHADOR;},0)+inssEntidadeMes), origem:'👥 Folha de Salários', prazo:ultimoDiaUtilDoMes(mesIdx===11?ano+1:ano, (mesIdx+1)%12)},
    {chave:'II', periodo:String(ano), nome:`Imposto Industrial — Provisão do Exercício ${ano}`, base:`Lucro Tributável × ${taxaImpostoIndustrial()}% — Resultado Contabilístico (${fmt(resultadoAntesImpostoDoAno(ano))}) + Custos Não Aceites Fiscalmente (${fmt(custosNaoAceitesFiscalmenteDoAno(ano))}) = ${fmt(lucroTributavelDoAno(ano))} (ver 📈 DRE)`, valor:impostoIndustrialAno, origem:'📈 Demonstração de Resultados', prazo:ultimoDiaUtilDoMes(ano+1,4)},
  ];
  if(rentAplicavel){
    obrigacoes.push({chave:'RENT', periodo:String(ano), nome:`Imposto Predial sobre Rendas ("RENT") — ${ano}`, base:`Base anual configurada manualmente abaixo (${fmt(rentBaseAnual)} Kz)`, valor:rentBaseAnual, origem:'Configuração manual (sem módulo de arrendamento no ERP)', prazo:ultimoDiaUtilDoMes(ano+1,0)});
  }

  const linhas = obrigacoes.map(o=>{
    const est = estadoObrigacao(o.periodo, o.chave);
    const diasRestantes = Math.ceil((o.prazo - hojeD)/86400000);
    return `<tr>
      <td>${o.nome}<div class="note" style="margin-top:2px;">${o.base} · fonte: ${o.origem}</div></td>
      <td class="right">${fmt(o.valor)}</td>
      <td class="right ${diasRestantes<=7?'neg':''}">${fmtData(o.prazo)}${diasRestantes>=0?` (${diasRestantes}d)`:''}</td>
      <td><select data-obr-estado="${o.periodo}::${o.chave}">
        <option ${est.estado==='Pendente'?'selected':''}>Pendente</option>
        <option ${est.estado==='Submetido'?'selected':''}>Submetido</option>
        <option ${est.estado==='Pago'?'selected':''}>Pago</option>
      </select></td>
      <td><input data-obr-obs="${o.periodo}::${o.chave}" value="${xmlEsc(est.observacao||'')}" placeholder="Nº de referência, notas..."></td>
    </tr>`;
  }).join('');

  const pendentes = obrigacoes.filter(o=>estadoObrigacao(o.periodo,o.chave).estado==='Pendente').length;

  return `
  <h2 style="background:var(--castanho);">📅 Reporting Fiscal (Integração Automática)</h2>
  <p class="note">Este painel não recalcula nada por si — só reúne, num único checklist, os valores já apurados automaticamente nos módulos 🧾 IVA e Retenções, 👥 Folha de Salários, 📈 DRE e 📑 Mapas Fiscais, com o prazo de cada obrigação e um estado que pode marcar à medida que vai submetendo à AGT. Não submete nada eletronicamente — é um painel de controlo interno; a submissão continua a ser feita no <a href="https://portaldocontribuinte.minfin.gov.ao" target="_blank" rel="noopener">Portal do Contribuinte</a>. (Ferramentas como o NovoADN, historicamente focadas no Modelo 22/IES de Portugal, têm vindo a alargar-se a Angola — mas este ERP não está ligado a nenhuma API externa: os dados abaixo vêm sempre dos seus próprios Lançamentos/Salários.)</p>
  <div class="cards">
    <div class="card"><div class="lbl">Obrigações Pendentes</div><div class="val ${pendentes?'neg':'pos'}">${pendentes}</div></div>
    <div class="card"><div class="lbl">IVA Apurado (${nomeMes})</div><div class="val">${fmt(ivaApuradoMes)} Kz</div></div>
    <div class="card"><div class="lbl">Imposto Industrial — Provisão ${ano}</div><div class="val">${fmt(impostoIndustrialAno)} Kz</div></div>
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Obrigação</th><th class="right">Valor Apurado</th><th class="right">Prazo</th><th>Estado</th><th>Observações / Nº Referência</th></tr></thead>
    <tbody>${linhas}</tbody></table>
  </div>
  <h2 class="sub" style="font-size:15px;margin-top:18px;">Imposto Predial sobre Rendas ("RENT")</h2>
  <p class="note">${rentAplicavel ? 'Ativo — a linha "RENT" acima usa a base anual configurada abaixo (o ERP ainda não tem um módulo de receitas de arrendamento próprio; se vier a ter, ligamos automaticamente).' : 'Só se aplica a quem recebe rendas de arrendamento de imóveis. Não há esse tipo de receita nos Lançamentos atuais — por isso está desativado. Ative e indique a base anual se/quando isso mudar.'}</p>
  <form class="inline" id="formRentConfig">
    <div class="grid">
      <div><label>Aplica-se à minha empresa?</label><select name="rentAplicavel"><option value="nao" ${!rentAplicavel?'selected':''}>Não</option><option value="sim" ${rentAplicavel?'selected':''}>Sim</option></select></div>
      <div><label>Base Anual de Rendas Recebidas</label><input type="number" step="0.01" name="rentBaseAnual" value="${rentBaseAnual||''}"></div>
    </div>
    <div class="actions"><button type="submit" class="sec">Guardar</button></div>
  </form>`;
}

function viewMotorFiscal(){
  const hojeD = new Date();
  const ano = hojeD.getFullYear();
  const addMeses = (data,n)=>{ const d=new Date(data); d.setMonth(d.getMonth()+n); return d; };
  /* Próximo prazo de IVA: a declaração do mês anterior ao corrente vence no último dia útil do mês corrente.
     Se já passou esse dia, o próximo prazo relevante é o do mês seguinte (para o mês corrente).
     Usa setMonth (via addMeses) para a virada de ano (dez→jan) ser tratada automaticamente pelo JS. */
  const prazoIvaEsteMes = ultimoDiaUtilDoMes(ano, hojeD.getMonth());
  const mesAnterior = addMeses(new Date(ano, hojeD.getMonth(), 1), -1);
  let prazoIvaProximo = prazoIvaEsteMes, mesDeclarado = MESES[mesAnterior.getMonth()];
  if(hojeD > prazoIvaEsteMes){
    const mesSeguinte = addMeses(new Date(ano, hojeD.getMonth(), 1), 1);
    prazoIvaProximo = ultimoDiaUtilDoMes(mesSeguinte.getFullYear(), mesSeguinte.getMonth());
    mesDeclarado = MESES[hojeD.getMonth()];
  }
  let prazoModelo1Geral = ultimoDiaUtilDoMes(ano, 4); // Maio
  let prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano, 3); // Abril
  let exercicioGeral = ano-1, exercicioSimplificado = ano-1;
  if(hojeD > prazoModelo1Geral){ prazoModelo1Geral = ultimoDiaUtilDoMes(ano+1, 4); exercicioGeral = ano; }
  if(hojeD > prazoModelo1Simplificado){ prazoModelo1Simplificado = ultimoDiaUtilDoMes(ano+1, 3); exercicioSimplificado = ano; }
  const iiG = REGRAS_FISCAIS_AGT.impostoIndustrial;
  const iva = REGRAS_FISCAIS_AGT.iva;
  const ret = REGRAS_FISCAIS_AGT.retencaoServicos;

  const prazos = [
    {nome:`Declaração Periódica de IVA (${mesDeclarado})`, data:prazoIvaProximo, freq:"Mensal"},
    {nome:`Imposto Industrial — Modelo 1 (Regime Geral, exercício ${exercicioGeral})`, data:prazoModelo1Geral, freq:"Anual"},
    {nome:`Imposto Industrial — Declaração Simplificada (exercício ${exercicioSimplificado})`, data:prazoModelo1Simplificado, freq:"Anual"},
  ].sort((a,b)=>a.data-b.data);
  ultimoMotorFiscal = prazos.map(p=>{
    const dias = Math.ceil((p.data - hojeD)/86400000);
    return [p.nome, p.freq, fmtData(p.data), dias>=0?String(dias):'—'];
  });

  return `
  <h2 style="background:var(--castanho);">🏛️ Motor Fiscal AGT</h2>
  <p class="note">⚠️ Referência interna de apoio — taxas e prazos podem mudar por despacho da AGT (já houve prorrogações pontuais). Confirme sempre no <a href="https://portaldocontribuinte.minfin.gov.ao" target="_blank" rel="noopener">Portal do Contribuinte</a> ou com o contabilista antes de submeter ou pagar.</p>

  <h2 class="sub" style="font-size:15px;">Próximos Prazos</h2>
  <div class="tablewrap"><table><thead><tr><th>Obrigação</th><th>Periodicidade</th><th class="right">Prazo</th><th class="right">Dias restantes</th></tr></thead><tbody>
    ${prazos.map(p=>{
      const dias = Math.ceil((p.data - hojeD)/86400000);
      return `<tr><td>${p.nome}</td><td>${p.freq}</td><td class="right">${fmtData(p.data)}</td><td class="right ${dias<=7?'neg':''}">${dias>=0?dias+' dia(s)':'—'}</td></tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="actions" style="margin-top:8px;">
    <button type="button" class="sec" id="btnExportarMotorFiscal">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirMotorFiscal">Imprimir / PDF</button>
  </div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">IVA</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral</td><td class="right">${(iva.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Taxas reduzidas</td><td class="right">${iva.taxasReduzidas.map(t=>(t*100).toFixed(0)+'%').join(' / ')}</td></tr>
    <tr><td>Prazo da declaração</td><td>${iva.prazoDeclaracao}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Retenção na Fonte</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa (${ret.base})</td><td class="right">${(ret.taxa*100).toFixed(1)}%</td></tr>
    <tr><td colspan="2" class="note">${xmlEsc(ret.nota)}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">IAC — Imposto sobre a Aplicação de Capitais</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa (Secção B — juros de suprimentos de sócios)</td><td class="right">${(REGRAS_FISCAIS_AGT.iac.taxaSuprimentosSocios*100).toFixed(0)}%</td></tr>
    <tr><td>Prazo de entrega</td><td>${REGRAS_FISCAIS_AGT.iac.prazoEntrega}</td></tr>
    <tr><td colspan="2" class="note">${xmlEsc(REGRAS_FISCAIS_AGT.iac.nota)}</td></tr>
  </tbody></table></div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Imposto Industrial</h2>
  <div class="tablewrap"><table><tbody>
    <tr><td>Taxa geral (Regime Geral)</td><td class="right">${(iiG.taxaGeral*100).toFixed(0)}%</td></tr>
    <tr><td>Atividades agrícolas/aquícolas/pecuárias</td><td class="right">${(iiG.taxaAgropecuaria*100).toFixed(0)}%</td></tr>
    <tr><td>Banca, seguros, telecomunicações, petrolíferas</td><td class="right">${(iiG.taxaSectorEspecial*100).toFixed(0)}%</td></tr>
    <tr><td>Prazo Modelo 1 (Regime Geral)</td><td>${iiG.prazoModelo1RegimeGeral}</td></tr>
    <tr><td>Prazo Declaração Simplificada</td><td>${iiG.prazoModelo1RegimeSimplificado}</td></tr>
    <tr><td>Limiar do Regime Simplificado</td><td>${iiG.limiarRegimeSimplificado}</td></tr>
  </tbody></table></div>`;
}

/* ---------- Mapas Fiscais (Retenções na Fonte + Fornecedores/Clientes por NIF) ---------- */
let ultimoMapasFiscais = null;
function viewMapasFiscais(){
  const anos = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))].filter(Boolean).sort((a,b)=>b-a);
  const ano = anos[0] || new Date().getFullYear();
  const doAno = DB.lancamentos.filter(l=>mesKey(l.data).startsWith(String(ano)));

  /* Mapa de Retenções na Fonte: despesas de "Serviços de Terceiros" com retenção estimada. */
  const retencoes = explodirLancamentos(doAno.filter(l=>l.tipo==='Despesa'))
    .filter(l=>l.categoria==='Serviços de Terceiros')
    .map(l=>({data:l.data, entidade:l.entidade||'—', nif:l.nif||'—', base:l.valor, retencao:l.valor*REGRAS_FISCAIS_AGT.retencaoServicos.taxa}))
    .sort((a,b)=>a.data.localeCompare(b.data));
  const totalBase = retencoes.reduce((s,r)=>s+r.base,0);
  const totalRetido = retencoes.reduce((s,r)=>s+r.retencao,0);

  /* Mapa de Fornecedores e Clientes: total anual por NIF/entidade — despesas (fornecedores) e receitas (clientes). */
  const porEntidade = {};
  doAno.filter(l=>l.entidade && l.entidade.trim()).forEach(l=>{
    const chave = `${(l.nif||'—')}|${xmlEsc(l.entidade)}`;
    if(!porEntidade[chave]) porEntidade[chave] = {entidade:l.entidade, nif:l.nif||'—', compras:0, vendas:0};
    if(l.tipo==='Despesa') porEntidade[chave].compras += valorEmKZ(l);
    else porEntidade[chave].vendas += valorEmKZ(l);
  });
  const listaEntidades = Object.values(porEntidade).sort((a,b)=>(b.compras+b.vendas)-(a.compras+a.vendas));
  const semNIF = listaEntidades.filter(e=>e.nif==='—').length;

  ultimoMapasFiscais = {
    ano,
    retencoes: {cabecalhos:['Data','Entidade','NIF','Base','Retenção'], linhas: retencoes.map(r=>[r.data,r.entidade,r.nif,r.base,r.retencao])},
    entidades: {cabecalhos:['Entidade','NIF','Total Compras','Total Vendas'], linhas: listaEntidades.map(e=>[e.entidade,e.nif,e.compras,e.vendas])},
  };

  return `
  <h2 style="background:var(--castanho);">📑 Mapas Fiscais (${ano})</h2>
  <p class="note">⚠️ Mapas de apoio gerados a partir dos Lançamentos — confirme sempre valores e enquadramento com o contabilista/AGT antes de qualquer submissão.</p>
  ${anos.length>1?`<p class="note">A mostrar o ano ${ano} (mais recente com lançamentos). Anos disponíveis: ${anos.join(', ')}.</p>`:''}

  <h2 class="sub" style="font-size:15px;">Mapa de Retenções na Fonte (${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% s/ Serviços de Terceiros)</h2>
  <div class="cards">
    <div class="card"><div class="lbl">Base Sujeita a Retenção</div><div class="val">${fmt(totalBase)} Kz</div></div>
    <div class="card"><div class="lbl">Total Retido no Ano</div><div class="val neg">${fmt(totalRetido)} Kz</div></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Entidade</th><th>NIF</th><th class="right">Base</th><th class="right">Retenção</th></tr></thead><tbody>
    ${retencoes.length? retencoes.map(r=>`<tr><td>${r.data}</td><td>${xmlEsc(r.entidade)}</td><td>${xmlEsc(r.nif)}</td><td class="right">${fmt(r.base)}</td><td class="right">${fmt(r.retencao)}</td></tr>`).join('') : `<tr><td colspan="5" class="note">Sem despesas de "Serviços de Terceiros" em ${ano}.</td></tr>`}
    ${retencoes.length? `<tr><td colspan="3"><b>TOTAL</b></td><td class="right"><b>${fmt(totalBase)}</b></td><td class="right"><b>${fmt(totalRetido)}</b></td></tr>`:''}
  </tbody></table></div>
  <div class="actions" style="margin:8px 0;">
    <button type="button" class="sec" id="btnExportarMapaRetencoes">⬇️ Exportar Retenções (Excel)</button>
    <button type="button" class="print" id="btnImprimirMapaRetencoes">Imprimir Retenções / PDF</button>
  </div>

  <h2 class="sub" style="font-size:15px;margin-top:16px;">Mapa de Fornecedores e Clientes (por NIF — anexo anual)</h2>
  ${semNIF? `<p class="note" style="color:var(--vermelho,#b00);">⚠️ ${semNIF} entidade(s) sem NIF preenchido — complete o NIF nos lançamentos correspondentes (ou nas faturas do FaturaBot) antes de submeter este mapa.</p>`:''}
  <div class="tablewrap"><table><thead><tr><th>Entidade</th><th>NIF</th><th class="right">Total Compras (Despesas)</th><th class="right">Total Vendas (Receitas)</th></tr></thead><tbody>
    ${listaEntidades.length? listaEntidades.map(e=>`<tr><td>${xmlEsc(e.entidade)}</td><td>${e.nif==='—'?`<span class="note">— em falta</span>`:xmlEsc(e.nif)}</td><td class="right">${fmt(e.compras)}</td><td class="right">${fmt(e.vendas)}</td></tr>`).join('') : `<tr><td colspan="4" class="note">Sem lançamentos com entidade preenchida em ${ano}.</td></tr>`}
  </tbody></table></div>
  <div class="actions" style="margin-top:8px;">
    <button type="button" class="sec" id="btnExportarMapaEntidades">⬇️ Exportar Fornecedores/Clientes (Excel)</button>
    <button type="button" class="print" id="btnImprimirMapaEntidades">Imprimir Fornecedores/Clientes / PDF</button>
  </div>`;
}

/* ---------- Controlo NIF ----------
   Junta o NIF de todas as fontes (Lançamentos + faturas do FaturaBot, pendentes e
   já aprovadas) por entidade, valida o formato, e assinala inconsistências:
   NIFs com formato inválido/a confirmar, entidades sem NIF, e o mesmo NIF usado
   por nomes de entidade diferentes (possível erro de digitação a corrigir). */
/* ---------- Pacote do Contabilista ----------
   Gera um único ficheiro Excel com várias abas, juntando os relatórios que o
   contabilista/auditor normalmente pede no fecho do mês/período: Balancete, DRE,
   Balanço, Fluxo de Caixa, IVA e Retenções, Mapa de Retenções na Fonte e Mapa de
   Fornecedores/Clientes. Reaproveita exatamente os mesmos cálculos já usados nas
   páginas individuais (calcularBalancetePartidasDobradas, viewBalanco, viewFluxoCaixa,
   viewMapasFiscais, exportarIVAAtual) — não recalcula nada de novo, só reorganiza em
   abas separadas dentro do mesmo livro.
   NOTA: os ficheiros SAF-T (Faturação/Compras) ficam de fora de propósito — são um
   formato legal próprio (XML), que não deve ser embutido num Excel; continuam a
   exportar-se em Fiscalidade (AGT) → Exportar SAF-T. */
function gerarPacoteContabilista(){
  try{
    const anoAtual = new Date().getFullYear();
    const wb = XLSX.utils.book_new();

    const capa = [
      ['Pacote do Contabilista — TESOUCANTABIL'],
      [`Gerado em: ${fmtData(new Date())}`],
      [],
      ['Este ficheiro reúne, num único Excel, os relatórios normalmente pedidos no fecho do mês/período:'],
      ['1. Balancete (Partidas Dobradas)'],
      ['2. Demonstração de Resultados (DRE)'],
      ['3. Balanço Patrimonial'],
      ['4. Demonstração de Fluxos de Caixa'],
      ['5. IVA e Retenções'],
      ['6. Mapa de Retenções na Fonte'],
      ['7. Mapa de Fornecedores e Clientes (por NIF)'],
      [],
      ['⚠️ Os ficheiros SAF-T (Faturação/Compras) NÃO estão incluídos aqui — são um formato legal próprio (XML) que não deve ser embutido num Excel. Continue a exportá-los separadamente em Fiscalidade (AGT) → Exportar SAF-T.'],
      ['Confirme sempre valores, taxas e enquadramento com o contabilista/AGT antes de qualquer submissão oficial.'],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(capa), 'Capa');

    // 1) Balancete (Partidas Dobradas)
    const {contas} = calcularBalancetePartidasDobradas();
    const linhasBalancete = Object.values(contas).sort((a,b)=>String(a.cod).localeCompare(String(b.cod)))
      .map(c=>[c.cod, c.nome, c.debito, c.credito, c.debito-c.credito]);
    XLSX.utils.book_append_sheet(wb,
      XLSX.utils.aoa_to_sheet([['Código','Conta','Débito','Crédito','Saldo'], ...linhasBalancete]), 'Balancete');

    // 2) DRE (formal) — mesmo ano selecionado na página de DRE (dreAnoAtivo), tal como no ecrã
    const anoDRE = (typeof dreAnoAtivo!=='undefined' && dreAnoAtivo) ? dreAnoAtivo : anoAtual;
    const doAnoDRE = l => mesKey(l.data).startsWith(String(anoDRE)) && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria) && !l.neutralizado;
    const receitaAnoDRE = explodirLancamentos(DB.lancamentos.filter(l=>doAnoDRE(l) && l.tipo==='Receita')).reduce((s,l)=>s+valorEmKZ(l),0);
    const despesaAnoDRE = explodirLancamentos(DB.lancamentos.filter(l=>doAnoDRE(l) && l.tipo==='Despesa')).reduce((s,l)=>s+valorEmKZ(l),0);
    const resultadoOperacionalDRE = receitaAnoDRE - despesaAnoDRE;
    const amortAnoDRE = amortizacaoDoAno(anoDRE);
    const provFeriasAnoDRE = provisaoFeriasDecimoTerceiroDoAno(anoDRE);
    const provCobrancaAnoDRE = Number(anoDRE)===anoAtual ? provisaoCobrancaDuvidosaAtual() : 0;
    const cambialAnoDRE = diferencaCambialDoAno(anoDRE);
    const antesImpostoDRE = resultadoAntesImpostoDoAno(anoDRE);
    const impostoAnoDRE = impostoIndustrialDoAno(anoDRE);
    const liquidoAnoDRE = resultadoLiquidoDoAno(anoDRE);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      [`Demonstração de Resultados — Exercício ${anoDRE}`,'Valor (Kz)'],
      ['Receitas Operacionais', receitaAnoDRE],
      ['Despesas e Custos Operacionais', -despesaAnoDRE],
      ['Resultado Operacional', resultadoOperacionalDRE],
      ['Amortizações do Exercício', -amortAnoDRE],
      ['Provisão de Férias e 13º Salário', -provFeriasAnoDRE],
      ['Provisão de Cobrança Duvidosa', -provCobrancaAnoDRE],
      ['Diferenças Cambiais (ganho/perda líquida)', cambialAnoDRE],
      ['Resultado Antes de Impostos', antesImpostoDRE],
      [`Provisão de Imposto Industrial (${taxaImpostoIndustrial()}%)`, -impostoAnoDRE],
      ['RESULTADO LÍQUIDO DO EXERCÍCIO', liquidoAnoDRE],
    ]), 'DRE');

    // 3) Balanço Patrimonial — reaproveita viewBalanco() (side effect: preenche ultimoBalanco)
    viewBalanco();
    if(ultimoBalanco){
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
        [`Balanço Patrimonial — ${ultimoBalanco.anoCorrente}`,'Ativo (Kz)','Passivo + Capital (Kz)'],
        ...ultimoBalanco.linhas,
      ]), 'Balanço');
    }

    // 4) Fluxo de Caixa — reaproveita viewFluxoCaixa() (side effect: preenche ultimoFluxoCaixa)
    viewFluxoCaixa();
    if(ultimoFluxoCaixa){
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
        [`Fluxo de Caixa — ${ultimoFluxoCaixa.ano}`,'Valor (Kz)'],
        ...ultimoFluxoCaixa.linhas,
      ]), 'Fluxo de Caixa');
    }

    // 5) IVA e Retenções — reaproveita exportarIVAAtual()
    const ivaData = exportarIVAAtual();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      [`IVA e Retenções — ${ivaData.ano}`],
      ['IVA Liquidado', ivaData.c.ivaLiquidado],
      ['IVA Dedutível Aceite', ivaData.c.ivaDedutivelAceite],
      ['IVA a Pagar / Crédito', ivaData.c.ivaPagar],
      [],
      ['Mês','IVA Liquidado','IVA Dedutível','IVA Apurado','Acumulado'],
      ...ivaData.dadosMensais.map(d=>[d.mes, d.liquidado, d.dedutivel, d.apurado, d.acumulado]),
    ]), 'IVA e Retenções');

    // 6) e 7) Mapas Fiscais — reaproveita viewMapasFiscais() (side effect: preenche ultimoMapasFiscais)
    viewMapasFiscais();
    if(ultimoMapasFiscais){
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
        ultimoMapasFiscais.retencoes.cabecalhos, ...ultimoMapasFiscais.retencoes.linhas,
      ]), 'Retenções na Fonte');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
        ultimoMapasFiscais.entidades.cabecalhos, ...ultimoMapasFiscais.entidades.linhas,
      ]), 'Fornecedores e Clientes');
    }

    XLSX.writeFile(wb, `pacote-contabilista-${anoAtual}.xlsx`);
    toast('Pacote do Contabilista exportado.');
    logar('Pacote do Contabilista exportado', `Ano de referência: ${anoAtual}`);
    return true;
  }catch(e){
    toast('Não foi possível gerar o pacote: '+e.message);
    return false;
  }
}

function viewControloNIF(){
  const porEntidade = {};
  const registar = (entidade, nif)=>{
    if(!entidade || !entidade.trim()) return;
    const chaveEnt = entidade.trim();
    if(!porEntidade[chaveEnt]) porEntidade[chaveEnt] = {entidade:chaveEnt, nifs:new Set(), ocorrencias:0};
    porEntidade[chaveEnt].nifs.add((nif||'').trim());
    porEntidade[chaveEnt].ocorrencias++;
  };
  DB.lancamentos.forEach(l=>registar(l.entidade, l.nif));
  DB.faturabot.forEach(f=>registar(f.fornecedor, f.nif));

  const linhas = Object.values(porEntidade).map(e=>{
    const nifsValidos = [...e.nifs].filter(n=>n);
    const v = nifsValidos.length ? validarNIF(nifsValidos[0]) : {valido:false, tipo:'', mensagem:'NIF em falta'};
    return {...e, nifPrincipal: nifsValidos[0]||'', multiplosNIF: nifsValidos.length>1, validacao:v};
  }).sort((a,b)=> (a.validacao.valido===true?1:0) - (b.validacao.valido===true?1:0) || a.entidade.localeCompare(b.entidade));

  /* Mesmo NIF usado por entidades com nomes diferentes — indício de nome digitado de formas diferentes. */
  const nifParaEntidades = {};
  Object.values(porEntidade).forEach(e=>{
    [...e.nifs].filter(n=>n).forEach(n=>{
      if(!nifParaEntidades[n]) nifParaEntidades[n] = new Set();
      nifParaEntidades[n].add(e.entidade);
    });
  });
  const nifsPartilhados = Object.entries(nifParaEntidades).filter(([n,ents])=>ents.size>1);

  const semNif = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem==='NIF em falta').length;
  const invalidos = linhas.filter(l=>l.validacao.valido===false && l.validacao.mensagem!=='NIF em falta').length;
  const aConfirmar = linhas.filter(l=>l.validacao.valido===null).length;
  const validos = linhas.filter(l=>l.validacao.valido===true).length;

  return `
  <h2 style="background:var(--castanho);">🪪 Controlo NIF</h2>
  <p class="note">Verificação de formato (10 dígitos para empresas; 9 dígitos + 2 letras + 3 dígitos para particulares com nº de BI) — não confirma se o NIF existe de facto na AGT, só a estrutura. Consolidado a partir de Lançamentos e faturas do FaturaBot.</p>
  <div class="cards">
    <div class="card"><div class="lbl">Válidos</div><div class="val pos">${validos}</div></div>
    <div class="card"><div class="lbl">A Confirmar</div><div class="val">${aConfirmar}</div></div>
    <div class="card"><div class="lbl">Formato Inválido</div><div class="val neg">${invalidos}</div></div>
    <div class="card"><div class="lbl">Sem NIF</div><div class="val neg">${semNif}</div></div>
  </div>
  ${nifsPartilhados.length? `
  <h2 class="sub" style="font-size:15px;">⚠️ Mesmo NIF em nomes diferentes (possível erro de digitação)</h2>
  <div class="tablewrap"><table><thead><tr><th>NIF</th><th>Nomes usados</th></tr></thead><tbody>
    ${nifsPartilhados.map(([n,ents])=>`<tr><td>${xmlEsc(n)}</td><td>${xmlEsc([...ents].join(' / '))}</td></tr>`).join('')}
  </tbody></table></div>`:''}
  <h2 class="sub" style="font-size:15px;margin-top:16px;">Por Entidade</h2>
  <div class="tablewrap"><table><thead><tr><th>Entidade</th><th>NIF</th><th>Situação</th><th class="right">Nº Lançamentos/Faturas</th></tr></thead><tbody>
    ${linhas.length? linhas.map(l=>`<tr>
      <td>${xmlEsc(l.entidade)}</td>
      <td>${xmlEsc(l.nifPrincipal||'—')}${l.multiplosNIF?' <span class="note">(vários NIFs diferentes!)</span>':''}</td>
      <td>${l.validacao.valido===true?'✅':(l.validacao.valido===null?'⚠️':'❌')} ${l.validacao.mensagem}${l.validacao.tipo?` (${l.validacao.tipo})`:''}</td>
      <td class="right">${l.ocorrencias}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="note">Sem entidades registadas ainda.</td></tr>`}
  </tbody></table></div>`;
}

/* calcularIVAControlado(): separa o IVA Dedutível "bruto" do "aceite" — compras sem NIF do
   fornecedor OU sem nº de fatura (nFatura) ficam de fora do dedutível aceite, porque a AGT não
   aceita dedução de IVA sem documento fiscal válido. Note: usa l.nFatura (o campo que o
   formulário de Lançamento realmente preenche) e não um campo "documentoFiscal" separado que
   nunca chegava a ser gravado. */
function calcularIVAControlado(ano){
  const doAno = l => !ano || mesKey(l.data).startsWith(String(ano));
  /* !l.neutralizado: lançamento neutralizado fica fora de TODOS os relatórios
     oficiais (mesma regra usada no resto do ERP) — sem isto, o IVA a
     Pagar/Crédito ficava errado sempre que havia um lançamento neutralizado
     com IVA no período. */
  const vendas = DB.lancamentos.filter(l=>l.tipo==='Receita' && l.iva==='Sim' && !l.neutralizado && doAno(l));
  const compras = DB.lancamentos.filter(l=>l.tipo==='Despesa' && l.iva==='Sim' && !l.neutralizado && doAno(l));
  const ivaLiquidado = vendas.reduce((s,l)=>s + valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelBruto = compras.reduce((s,l)=>s + valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const comprasPendentes = compras.filter(l=>!l.nif || !l.nFatura).reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
  const ivaDedutivelAceite = Math.max(0, ivaDedutivelBruto-comprasPendentes);
  return {ivaLiquidado, ivaDedutivelBruto, ivaDedutivelAceite, ivaPagar:ivaLiquidado-ivaDedutivelAceite, comprasPendentes};
}

function validarIVACompra(l){
  const alertas=[];
  if(!l.nif) alertas.push('Sem NIF fornecedor');
  if(!l.nFatura) alertas.push('Sem referência da fatura');
  if(l.iva!=='Sim') alertas.push('IVA não marcado');
  return alertas;
}

function viewIVA(){
  const anosLanc = Array.from(new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4)))));
  const anos = Array.from(new Set([...anosLanc, new Date().getFullYear()])).sort((a,b)=>b-a);
  if(!anos.includes(ivaAnoAtivo)) ivaAnoAtivo = anos[0];
  const ano = ivaAnoAtivo;
  const c = calcularIVAControlado(ano);
  let acumulado=0;
  const dadosMensais = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    /* !l.neutralizado: excluir lançamentos neutralizados do apuramento
       mensal de IVA, tal como já é feito no resto do ERP. */
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key && !l.neutralizado);
    const liquidado = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const dedutivel = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const apurado = liquidado-dedutivel;
    acumulado += apurado;
    const retServicos = explodirLancamentos(doMes).filter(l=>l.tipo==='Despesa'&&l.categoria==='Serviços de Terceiros').reduce((s,l)=>s+valorEmKZ(l),0)*REGRAS_FISCAIS_AGT.retencaoServicos.taxa;
    return {mes:m, liquidado, dedutivel, apurado, acumulado, retServicos};
  });
  const linhas = dadosMensais.map(d=>`<tr><td>${d.mes}</td><td class="right">${fmt(d.liquidado)}</td><td class="right">${fmt(d.dedutivel)}</td><td class="right">${fmt(d.apurado)}</td><td class="right">${fmt(d.acumulado)}</td><td class="right">${fmt(d.retServicos)}</td></tr>`).join('');

  const erros = DB.lancamentos.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim'&&!l.neutralizado&&mesKey(l.data).startsWith(String(ano))&&validarIVACompra(l).length)
    .slice(0,10).map(l=>`<tr><td>${xmlEsc(l.descricao||l.categoria)}</td><td>${validarIVACompra(l).join(', ')}</td></tr>`).join('');

  return `
  <h2>🧾 IVA e Retenções — Controlo AGT</h2>
  <p class="note">O ERP calcula o IVA pela lógica: IVA Liquidado das vendas menos IVA Dedutível aceite das compras (excluindo compras sem NIF ou sem nº de fatura). Retenção estimada: ${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}% sobre despesas de "Serviços de Terceiros". Taxas e prazos consultáveis em 🏛️ Motor Fiscal AGT. Confirme sempre com o contabilista/AGT antes de submeter. Os cartões e a tabela abaixo referem-se apenas ao ano selecionado.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Ano</label><select id="ivaAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">IVA Liquidado (${ano})</div><div class="val">${fmt(c.ivaLiquidado)}</div></div>
    <div class="card"><div class="lbl">IVA Dedutível Aceite (${ano})</div><div class="val">${fmt(c.ivaDedutivelAceite)}</div></div>
    <div class="card"><div class="lbl">IVA a Pagar / Crédito (${ano})</div><div class="val">${fmt(c.ivaPagar)}</div></div>
  </div>
  <h2 class="sub">Apuramento Mensal (${ano})</h2>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">IVA Liquidado</th><th class="right">IVA Dedutível</th><th class="right">IVA Apurado</th><th class="right">Acumulado</th><th class="right">Retenção Estimada (${(REGRAS_FISCAIS_AGT.retencaoServicos.taxa*100).toFixed(1)}%)</th></tr></thead>
  <tbody>${linhas}</tbody></table></div>
  <div class="actions" style="margin-top:10px;">
    <button type="button" class="sec" id="btnExportarIVA">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirIVA">Imprimir / PDF</button>
  </div>
  <h2 class="sub">Validação de Compras com IVA (${ano})</h2>
  <div class="tablewrap"><table><thead><tr><th>Documento</th><th>Pendências</th></tr></thead><tbody>${erros || '<tr><td colspan="2">Nenhuma pendência encontrada</td></tr>'}</tbody></table></div>`;
}
function exportarIVAAtual(){
  const ano = ivaAnoAtivo;
  const c = calcularIVAControlado(ano);
  let acumulado=0;
  const dadosMensais = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    /* !l.neutralizado: mesma correção do apuramento mensal em viewIVA, para
       que a exportação/impressão bata certo com o que é mostrado no ecrã. */
    const doMes = DB.lancamentos.filter(l=>mesKey(l.data)===key && !l.neutralizado);
    const liquidado = doMes.filter(l=>l.tipo==='Receita'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const dedutivel = doMes.filter(l=>l.tipo==='Despesa'&&l.iva==='Sim').reduce((s,l)=>s+valorEmKZ(l)*Number(l.taxaIVA||0),0);
    const apurado = liquidado-dedutivel;
    acumulado += apurado;
    return {mes:m, liquidado, dedutivel, apurado, acumulado};
  });
  return {c, ano, dadosMensais};
}

/* ---------- Balanço Patrimonial (simplificado) ---------- */
let ultimoBalanco = null;
function viewBalanco(){
  const {contas} = calcularBalancetePartidasDobradas();
  const saldoConta = (cod)=> contas[cod] ? contas[cod].debito - contas[cod].credito : 0;

  /* Ativo: soma o saldo devedor de todas as contas de Caixa/Bancos (códigos definidos em
     CONTAS, já incluindo o efeito das reavaliações de Diferenças Cambiais) + saldo da conta
     Clientes líquido da Provisão de Cobrança Duvidosa — tudo extraído do Balancete de
     partidas dobradas, não de um filtro solto. */
  const caixaBancos = CONTAS.reduce((s,c)=> s + saldoConta(c.codigo), 0);
  const provisaoCobrancaDuvidosa = provisaoCobrancaDuvidosaAtual();
  const contasReceber = Math.max(0, saldoConta(CONTA_CLIENTES.cod) - provisaoCobrancaDuvidosa);
  const imobilizadoLiquido = DB.imobilizado.reduce((s,a)=> s + Math.max(0, Number(a.valor||0) - amortizacaoAcumuladaDoBem(a)), 0);
  const ativoTotal = caixaBancos+contasReceber+imobilizadoLiquido;

  /* Passivo: saldo credor da conta Fornecedores + qualquer outra conta do Plano de Contas
     explicitamente marcada como "Passivo" (Suprimentos de Sócios, Imposto Industrial a
     Pagar, Provisão de Férias/13º a Pagar). */
  const contasPagar = Math.max(0, -saldoConta(CONTA_FORNECEDORES.cod));
  const suprimentos = Math.max(0, -saldoConta("25"));
  const impostoAPagar = Math.max(0, -saldoConta(CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod));
  const feriasAPagar = Math.max(0, -saldoConta(CONTA_FERIAS_13_A_PAGAR.cod));
  const codigosPassivoOutros = [...new Set(Object.values(CATEGORIA_CONTA).filter(c=>c.tipo==='Passivo').map(c=>c.cod))]
    .filter(cod=>!["25",CONTA_IMPOSTO_INDUSTRIAL_A_PAGAR.cod,CONTA_FERIAS_13_A_PAGAR.cod].includes(cod));
  const passivoOutros = codigosPassivoOutros.reduce((s,cod)=> s + Math.max(0, -saldoConta(cod)), 0);
  const passivoExtra = suprimentos + impostoAPagar + feriasAPagar + passivoOutros;
  const passivoTotal = contasPagar + passivoExtra;

  /* Capital Próprio: calculado de forma INDEPENDENTE (não é "o que sobra" para o Balanço
     bater à força) — Capital Social (declarado pela empresa) + Resultados Transitados
     (resultado líquido acumulado de anos fiscais anteriores) + Resultado do Exercício
     (receitas - despesas - custos do ano corrente, já líquido de amortizações, provisões,
     diferenças cambiais e Imposto Industrial). */
  const anoCorrente = new Date().getFullYear();
  const capitalSocial = Number((DB.empresaConfig||{}).capitalSocial || 0);
  const anosComMovimento = [...new Set(DB.lancamentos.map(l=>mesKey(l.data).slice(0,4)))].map(Number);
  const resultadosTransitados = anosComMovimento.filter(a=>a<anoCorrente).reduce((s,a)=>s+resultadoLiquidoDoAno(a),0);
  const resultadoExercicio = resultadoLiquidoDoAno(anoCorrente);
  const capitalProprio = capitalSocial + resultadosTransitados + resultadoExercicio;

  const diferenca = ativoTotal - (passivoTotal + capitalProprio);
  const bate = Math.abs(diferenca) < 0.5;

  ultimoBalanco = {
    anoCorrente,
    linhas: [
      ['Caixa e Bancos', fmt(caixaBancos), ''],
      ['Clientes (Contas a Receber)', fmt(contasReceber), ''],
      ['Ativo Fixo Líquido (Imobilizado)', fmt(imobilizadoLiquido), ''],
      ['TOTAL DO ATIVO', fmt(ativoTotal), ''],
      ['Fornecedores (Contas a Pagar)', '', fmt(contasPagar)],
      ['Suprimentos de Sócios', '', fmt(suprimentos)],
      ['Estado — Imposto Industrial a Pagar', '', fmt(impostoAPagar)],
      ['Provisão de Férias e 13º Salário a Pagar', '', fmt(feriasAPagar)],
      ['Outros Passivos', '', fmt(passivoOutros)],
      ['Capital Social', '', fmt(capitalSocial)],
      ['Resultados Transitados (anos anteriores)', '', fmt(resultadosTransitados)],
      [`Resultado do Exercício (${anoCorrente})`, '', fmt(resultadoExercicio)],
      ['TOTAL PASSIVO + CAPITAL PRÓPRIO', '', fmt(passivoTotal+capitalProprio)],
    ],
  };

  return `
  <h2>🏛️ Balanço Patrimonial</h2>
  <p class="note">O Capital Próprio já não é calculado "à força" para o balanço bater — é a soma de Capital Social + Resultados Transitados (anos anteriores) + Resultado do Exercício (ano corrente), tal como numa contabilidade real. O Resultado do Exercício já inclui Amortizações, Provisão de Férias/13º, Provisão de Cobrança Duvidosa, Diferenças Cambiais e a Provisão de Imposto Industrial (ver 📈 DRE para o detalhe). O Resultado exclui entradas de Suprimentos (empréstimos de sócios) — isso é Passivo, não lucro. Se o Ativo não coincidir com Passivo + Capital Próprio, o sistema avisa em vez de esconder a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:14px;">
    <div><label>Capital Social</label><input type="number" step="0.01" id="balancoCapitalSocial" value="${capitalSocial||''}" placeholder="0.00"></div>
  </div>
  <div class="card" style="background:${bate?'var(--verde-claro)':'#fdeceb'};border-color:${bate?'var(--verde)':'var(--vermelho)'};margin-bottom:14px;">
    Ativo: <b>${fmt(ativoTotal)} Kz</b> &nbsp;|&nbsp; Passivo + Capital Próprio: <b>${fmt(passivoTotal+capitalProprio)} Kz</b> &nbsp;|&nbsp;
    ${bate?'✅ O Balanço bate':`⚠️ Diferença de ${fmt(diferenca)} Kz — reveja lançamentos/contas em aberto`}
  </div>
  <div class="split">
    <div><h2 class="sub" style="font-size:16px;">ATIVO</h2>
      <table><tbody>
      <tr><td>Caixa e Bancos</td><td class="right">${fmt(caixaBancos)}</td></tr>
      <tr><td>Clientes (Contas a Receber)${provisaoCobrancaDuvidosa>0.5?` <span class="note">(líquido de ${fmt(provisaoCobrancaDuvidosa)} de provisão)</span>`:''}</td><td class="right">${fmt(contasReceber)}</td></tr>
      <tr><td>Ativo Fixo Líquido (Imobilizado)</td><td class="right">${fmt(imobilizadoLiquido)}</td></tr>
      <tr><td><b>Total do Ativo</b></td><td class="right"><b>${fmt(ativoTotal)}</b></td></tr>
      </tbody></table>
    </div>
    <div><h2 class="sub" style="font-size:16px;">PASSIVO + CAPITAL PRÓPRIO</h2>
      <table><tbody>
      <tr><td>Fornecedores (Contas a Pagar)</td><td class="right">${fmt(contasPagar)}</td></tr>
      ${suprimentos>0?`<tr><td>Suprimentos de Sócios</td><td class="right">${fmt(suprimentos)}</td></tr>`:''}
      ${impostoAPagar>0?`<tr><td>Estado — Imposto Industrial a Pagar</td><td class="right">${fmt(impostoAPagar)}</td></tr>`:''}
      ${feriasAPagar>0?`<tr><td>Provisão de Férias e 13º Salário a Pagar</td><td class="right">${fmt(feriasAPagar)}</td></tr>`:''}
      ${passivoOutros>0?`<tr><td>Outros Passivos</td><td class="right">${fmt(passivoOutros)}</td></tr>`:''}
      <tr><td>Capital Social</td><td class="right">${fmt(capitalSocial)}</td></tr>
      <tr><td>Resultados Transitados (anos anteriores)</td><td class="right">${fmt(resultadosTransitados)}</td></tr>
      <tr><td>Resultado do Exercício (${anoCorrente})</td><td class="right">${fmt(resultadoExercicio)}</td></tr>
      <tr><td><b>Total</b></td><td class="right"><b>${fmt(passivoTotal+capitalProprio)}</b></td></tr>
      </tbody></table>
    </div>
  </div>
  <div class="actions" style="margin-top:14px;">
    <button type="button" class="sec" id="btnExportarBalanco">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirBalanco">Imprimir / PDF</button>
  </div>
  <p class="note" style="cursor:pointer;margin-top:14px;" data-tab="notasDemonstracoes">📝 As políticas contabilísticas e o detalhe das rubricas acima (critério de amortização, de existências, contingências, etc.) constam nas <b>Notas às Demonstrações Financeiras</b>. Clique para consultar/editar.</p>`;
}

/* ---------- Notas às Demonstrações Financeiras (anexo ao Balanço/DRE) ----------
   Texto estruturado por secção, editável, com alguns campos pré-sugeridos a partir do que
   o sistema já faz de facto (método de amortização, método de valorização de existências),
   para que a Nota não fique dessincronizada da prática real do ERP. Guardado por secção em
   DB.notasDemonstracoes — cada textarea grava-se sozinha ao sair do campo (onchange), tal
   como os outros formulários de configuração da empresa (ex.: dados fiscais do SAF-T). */
function sugestaoPoliticaAmortizacoes(){
  const porCategoria = {};
  (DB.imobilizado||[]).forEach(a=>{
    const cat = a.categoria||'Outros';
    if(!porCategoria[cat]) porCategoria[cat] = new Set();
    porCategoria[cat].add(Number(a.vidaUtil||0));
  });
  const linhas = Object.entries(porCategoria).map(([cat,vidas])=>`${cat}: ${[...vidas].filter(Boolean).sort((a,b)=>a-b).join(' ou ')} ano(s)`);
  return `O imobilizado é amortizado pelo Método das Quotas Constantes (linha reta), com base na vida útil estimada de cada bem. Um lançamento mensal automático (Débito Gastos de Amortização / Crédito Amortizações Acumuladas) é gerado no Livro Diário a partir do Mapa de Amortizações.`
    + (linhas.length ? `\n\nVidas úteis atualmente em uso, por categoria:\n- ${linhas.join('\n- ')}` : '');
}
function sugestaoPoliticaExistencias(){
  return `As existências são valorizadas pelo Método de Inventário Periódico: o Custo das Mercadorias Vendidas (CMV) de cada mês é apurado por CMV = Existências Iniciais + Compras do Mês − Existências Finais (contagem física). A contagem física é registada no fecho de cada mês em "Existências e CMV" / "Existências — Stocks (SKU)".`;
}
function sugestaoPoliticaContasReceberPagar(){
  return `As Contas a Receber são reconhecidas pelo valor da fatura e apresentadas líquidas de Provisão para Cobrança Duvidosa, quando aplicável. As Contas a Pagar são reconhecidas pelo valor da fatura/obrigação, na data em que a despesa é incorrida (regime de acréscimo/competência), independentemente da data de pagamento.`;
}

/* ---------- Demonstração de Fluxos de Caixa (DFC) — Método Direto ---------- */
let fluxoCaixaAnoAtivo = new Date().getFullYear();
let ultimoFluxoCaixa = null;
function viewFluxoCaixa(){
  const ano = fluxoCaixaAnoAtivo;
  const chaveAno = String(ano);
  const todosCash = DB.lancamentos.filter(l=> CONTAS.some(c=>c.codigo===l.conta) && !l.neutralizado);

  /* Saldo inicial de caixa = tudo o que já se moveu nas contas de Caixa/Bancos ANTES do
     1º dia do ano selecionado (independentemente da atividade). */
  const saldoInicial = todosCash.filter(l=>mesKey(l.data) < `${chaveAno}-01`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doAno = todosCash.filter(l=> mesKey(l.data).startsWith(chaveAno));

  /* Classifica cada movimento de caixa do ano na atividade certa. "Transferência entre
     Contas" é excluída das 3 atividades — é dinheiro que sai de uma conta da empresa e
     entra noutra conta da própria empresa, não é fluxo real de/para fora da empresa (o
     efeito líquido no Saldo de Caixa total é sempre ~0, por isso só distorceria os
     totais se fosse incluída). */
  const isInvestimento = l => l.categoria==='Investimentos / Imobilizado';
  const isFinanciamento = l => l.categoria==='Suprimentos';
  const isTransferencia = l => l.categoria==='Transferência entre Contas';
  const isOperacional = l => !isInvestimento(l) && !isFinanciamento(l) && !isTransferencia(l);

  const somaTipo = (lista, tipo)=> lista.filter(l=>l.tipo===tipo).reduce((s,l)=>s+valorEmKZ(l),0);

  const opRecebimentos = somaTipo(doAno.filter(isOperacional), 'Receita');
  const opPagamentos = somaTipo(doAno.filter(isOperacional), 'Despesa');
  const fluxoOperacional = opRecebimentos - opPagamentos;

  const invEntradas = somaTipo(doAno.filter(isInvestimento), 'Receita');
  const invSaidas = somaTipo(doAno.filter(isInvestimento), 'Despesa');
  const fluxoInvestimento = invEntradas - invSaidas;

  const finEntradas = somaTipo(doAno.filter(isFinanciamento), 'Receita');
  const finSaidas = somaTipo(doAno.filter(isFinanciamento), 'Despesa');
  const fluxoFinanciamento = finEntradas - finSaidas;

  const transferenciasEntradas = somaTipo(doAno.filter(isTransferencia), 'Receita');
  const transferenciasSaidas = somaTipo(doAno.filter(isTransferencia), 'Despesa');

  const variacaoLiquida = fluxoOperacional + fluxoInvestimento + fluxoFinanciamento;
  const saldoFinal = saldoInicial + variacaoLiquida;

  /* Confirmação: o Saldo Final calculado aqui tem de bater com o saldo real de Caixa e
     Bancos a 31/Dez desse ano (soma de todos os movimentos até ao fim do ano, por
     qualquer atividade — incluindo transferências, que aqui se anulam). */
  const saldoRealAoFimDoAno = todosCash.filter(l=>mesKey(l.data) <= `${chaveAno}-12`)
    .reduce((s,l)=> s + (l.tipo==='Receita'? valorEmKZ(l) : -valorEmKZ(l)), 0);
  const bate = Math.abs(saldoFinal - saldoRealAoFimDoAno) < 0.5;

  const anosDisponiveis = [...new Set(DB.lancamentos.map(l=>Number(mesKey(l.data).slice(0,4))))].concat([new Date().getFullYear()]);
  const anosUnicos = [...new Set(anosDisponiveis)].sort((a,b)=>b-a);

  ultimoFluxoCaixa = {
    ano,
    linhas: [
      ['Recebimentos de Clientes / Vendas', fmt(opRecebimentos)],
      ['Pagamentos a Fornecedores e Despesas Operacionais', `(${fmt(opPagamentos)})`],
      ['Fluxo de Caixa das Atividades Operacionais', fmt(fluxoOperacional)],
      ['Entradas de Investimento', fmt(invEntradas)],
      ['Saídas de Investimento', `(${fmt(invSaidas)})`],
      ['Fluxo de Caixa das Atividades de Investimento', fmt(fluxoInvestimento)],
      ['Suprimentos de Sócios Recebidos', fmt(finEntradas)],
      ['Reembolsos de Suprimentos aos Sócios', `(${fmt(finSaidas)})`],
      ['Fluxo de Caixa das Atividades de Financiamento', fmt(fluxoFinanciamento)],
      ['Variação Líquida de Caixa no Ano', fmt(variacaoLiquida)],
      ['Saldo de Caixa no Início do Ano', fmt(saldoInicial)],
      ['Saldo de Caixa no Fim do Ano', fmt(saldoFinal)],
    ],
  };

  return `
  <h2>🌊 Demonstração de Fluxos de Caixa (Método Direto)</h2>
  <p class="note">Mostra de onde veio e para onde foi o dinheiro da Caixa Tesouraria e das contas bancárias durante o ano — separado em Atividades Operacionais (o negócio em si), de Investimento (compra/venda de equipamento e imobilizado) e de Financiamento (empréstimos/suprimentos de sócios). Transferências entre contas da própria empresa não entram (não representam entrada/saída real de dinheiro da empresa).</p>
  <div class="grid" style="grid-template-columns:160px;margin-bottom:14px;">
    <div><label>Ano</label><select id="fluxoCaixaAnoSel">${anosUnicos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>

  <div class="tablewrap" style="margin-bottom:14px;">
    <table><tbody>
      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades Operacionais</b></td></tr>
      <tr><td>Recebimentos de Clientes / Vendas</td><td class="right">${fmt(opRecebimentos)}</td></tr>
      <tr><td>Pagamentos a Fornecedores e Despesas Operacionais</td><td class="right">(${fmt(opPagamentos)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades Operacionais</b></td><td class="right"><b>${fmt(fluxoOperacional)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Investimento</b></td></tr>
      <tr><td>Entradas (venda de imobilizado)</td><td class="right">${fmt(invEntradas)}</td></tr>
      <tr><td>Saídas (compra de imobilizado/equipamento)</td><td class="right">(${fmt(invSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Investimento</b></td><td class="right"><b>${fmt(fluxoInvestimento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Atividades de Financiamento</b></td></tr>
      <tr><td>Suprimentos de Sócios Recebidos</td><td class="right">${fmt(finEntradas)}</td></tr>
      <tr><td>Reembolsos de Suprimentos aos Sócios</td><td class="right">(${fmt(finSaidas)})</td></tr>
      <tr><td><b>Fluxo de Caixa das Atividades de Financiamento</b></td><td class="right"><b>${fmt(fluxoFinanciamento)}</b></td></tr>

      <tr style="background:var(--bg);"><td colspan="2"><b>Resumo</b></td></tr>
      <tr><td><b>Variação Líquida de Caixa no Ano</b></td><td class="right"><b>${fmt(variacaoLiquida)}</b></td></tr>
      <tr><td>Saldo de Caixa no Início do Ano</td><td class="right">${fmt(saldoInicial)}</td></tr>

/* ---------- Existências e CMV ---------- */
let ultimoExistencias = null;
function viewExistencias(){
  const anosLanc = Array.from(new Set(explodirLancamentos(DB.lancamentos).filter(l=>l.categoria==='Compra de Mercadorias para Revenda').map(l=>Number(mesKey(l.data).slice(0,4)))));
  const anosContagem = Array.from(new Set(Object.keys(DB.existencias||{}).map(k=>Number(k.slice(0,4)))));
  const anos = Array.from(new Set([...anosLanc, ...anosContagem, new Date().getFullYear()])).sort((a,b)=>b-a);
  if(!anos.includes(existenciasAnoAtivo)) existenciasAnoAtivo = anos[0];
  const ano = existenciasAnoAtivo;
  /* Exist. Iniciais de Janeiro transita automaticamente do fecho de Dezembro do ano
     anterior (mesmo padrão do Saldo de Abertura bancário) — nunca reinicia em zero só
     porque se mudou de ano. */
  let inicial = Number(DB.existencias[`${ano-1}-12`]||0), inicialQtd = Number(DB.existenciasQtd[`${ano-1}-12`]||0);
  const linhasExport = [];
  const linhas = MESES.map((m,i)=>{
    const key = `${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = explodirLancamentos(DB.lancamentos.filter(l=>mesKey(l.data)===key)).filter(l=>l.categoria==='Compra de Mercadorias para Revenda');
    const compras = doMes.reduce((s,l)=>s+valorEmKZ(l),0);
    const comprasQtd = doMes.reduce((s,l)=>s+(Number(l.quantidade)||0),0);
    const final = Number(DB.existencias[key]||0);
    const finalQtd = Number(DB.existenciasQtd[key]||0);
    const cmv = inicial+compras-final;
    const consumoQtd = inicialQtd+comprasQtd-finalQtd;
    linhasExport.push([m, inicial, compras, final, cmv, inicialQtd, comprasQtd, finalQtd, consumoQtd]);
    const linha = `<tr><td>${m}</td>
      <td class="right">${fmt(inicial)}</td><td class="right">${fmt(compras)}</td>
      <td><input type="number" step="0.01" data-existencia="${key}" value="${DB.existencias[key]||''}" placeholder="Valor" style="width:110px;"></td>
      <td class="right"><b>${fmt(cmv)}</b></td>
      <td class="right">${fmt(inicialQtd)}</td><td class="right">${fmt(comprasQtd)}</td>
      <td><input type="number" step="0.01" data-existencia-qtd="${key}" value="${DB.existenciasQtd[key]||''}" placeholder="Contagem" style="width:100px;"></td>
      <td class="right"><b>${fmt(consumoQtd)}</b></td></tr>`;
    inicial = final; inicialQtd = finalQtd;
    return linha;
  }).join('');
  ultimoExistencias = {ano, linhas: linhasExport};
  return `
  <h2>📦 Existências e CMV</h2>
  <p class="note">Método de inventário periódico: CMV = Existências Iniciais + Compras do Mês − Existências Finais. As colunas de Quantidade vêm automaticamente do campo "Quantidade" dos Lançamentos (categoria "Compra de Mercadorias para Revenda") — preencha só a contagem física do fim do mês (valor e/ou quantidade); o mês seguinte transita sozinho, e Janeiro transita automaticamente do fecho de Dezembro do ano anterior.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Ano</label><select id="existenciasAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>
  <div class="tablewrap"><table><thead><tr>
    <th>Mês</th><th class="right">Exist. Iniciais (Kz)</th><th class="right">Compras (Kz)</th><th>Exist. Finais (Kz)</th><th class="right">CMV (Kz)</th>
    <th class="right">Exist. Iniciais (Qtd.)</th><th class="right">Compras (Qtd.)</th><th>Exist. Finais (Qtd.)</th><th class="right">Consumo (Qtd.)</th>
  </tr></thead>
  <tbody>${linhas}</tbody></table></div>
  <div class="actions" style="margin-top:14px;">
    <button type="button" class="sec" id="btnExportarExistencias">⬇️ Exportar (Excel)</button>
    <button type="button" class="print" id="btnImprimirExistencias">Imprimir / PDF</button>
  </div>`;
}

/* ---------- Análise Comparativa Inter-Períodos (Benchmarking) ----------
   Compara um mês de referência com (a) o mês imediatamente anterior e (b) o mesmo mês do
   ano anterior, categoria a categoria (Receitas, Despesas, Custos) — mesma base de cálculo
   do Resumo Mensal/DRE (explodirLancamentos, valorEmKZ, exclui neutralizados e categorias
   fora do Resultado). O objetivo é ajudar a distinguir sazonalidade normal (ex.: época alta
   de turismo, época festiva) de um desvio que precisa mesmo de investigação — por isso cada
   variação % vem colorida (verde/amarelo/vermelho) consoante a dimensão do desvio, e não há
   julgamento automático de "bom" ou "mau": o utilizador decide, com o contexto do negócio. */
function totaisPorCategoriaPeriodo(ano, mes){
  const key = `${ano}-${String(mes).padStart(2,'0')}`;
  const doMes = explodirLancamentos(DB.lancamentos).filter(l=>mesKey(l.data)===key && !l.neutralizado && !CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  const somaCat = (tipo,c)=> doMes.filter(l=>l.tipo===tipo && l.categoria===c).reduce((s,l)=>s+valorEmKZ(l),0);
  const receitas = CATEGORIAS_RECEITAS.map(c=>({nome:c, val:somaCat('Receita',c)}));
  const despesas = CATEGORIAS_DESPESAS.map(c=>({nome:c, val:somaCat('Despesa',c)}));
  const custos = CATEGORIAS_CUSTOS.map(c=>({nome:c, val:somaCat('Despesa',c)}));
  const totalReceitas = receitas.reduce((s,r)=>s+r.val,0);
  const totalDespesas = despesas.reduce((s,r)=>s+r.val,0);
  const totalCustos = custos.reduce((s,r)=>s+r.val,0);
  return {ano, mes, key, receitas, despesas, custos, totalReceitas, totalDespesas, totalCustos, resultado: totalReceitas-totalDespesas-totalCustos};
}
function viewComparativoPeriodos(){
  const ano=new Date().getFullYear(), mesAtual=String(new Date().getMonth()+1).padStart(2,'0');
  return `
  <h2>📈 Análise Comparativa Inter-Períodos</h2>
  <p class="note">Compara o mês selecionado, categoria a categoria, com o mês anterior e com o mesmo mês do ano anterior — ajuda a distinguir sazonalidade normal (ex.: época alta/baixa) de um desvio real que precisa de investigação.</p>
  <form class="inline" onsubmit="return false;">
    <div class="grid">
      <div><label>Ano</label><input type="number" id="compAno" value="${ano}"></div>
      <div><label>Mês</label><select id="compMes">${MESES.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===mesAtual?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="actions">
      <button type="button" id="btnComparativo">Atualizar</button>
      <button type="button" class="sec" id="btnExportarComparativo">⬇️ Exportar (Excel)</button>
      <button type="button" class="print" id="btnImprimirComparativo">Imprimir / PDF</button>
    </div>
  </form>
  <div id="comparativoConteudo"></div>`;
}
let ultimoComparativo = null;
function atualizarComparativo(){
  const ano = Number(document.getElementById('compAno').value);
  const mes = Number(document.getElementById('compMes').value);
  const mesAntAno = mes===1 ? ano-1 : ano;
  const mesAntMes = mes===1 ? 12 : mes-1;

  const pAtual = totaisPorCategoriaPeriodo(ano, mes);
  const pMesAnterior = totaisPorCategoriaPeriodo(mesAntAno, mesAntMes);
  const pAnoAnterior = totaisPorCategoriaPeriodo(ano-1, mes);

  const labelAtual = `${MESES[mes-1]}/${ano}`;
  const labelMesAnterior = `${MESES[mesAntMes-1]}/${mesAntAno}`;
  const labelAnoAnterior = `${MESES[mes-1]}/${ano-1}`;

  /* Infinity = "novo" (não havia nenhum movimento no período de comparação, logo a % não
     tem significado matemático); null = ambos os períodos são zero (sem variação a reportar). */
  const pct = (a,b)=>{ if(b===0) return a===0 ? null : Infinity; return ((a-b)/Math.abs(b))*100; };
  const fmtPct = v => v===null ? '—' : (v===Infinity ? 'novo' : `${v>=0?'+':''}${v.toFixed(1)}%`);
  const corPct = v => (v===null) ? '' : (v===Infinity || Math.abs(v)>=20) ? 'color:var(--vermelho);font-weight:600;' : (Math.abs(v)>=5 ? 'color:var(--amarelo);' : 'color:var(--verde);');

  function montarBloco(titulo, listaAtual, listaMesAnt, listaAnoAnt, totalAtual, totalMesAnt, totalAnoAnt){
    const linhas = listaAtual.map((item,i)=>{
      const va=item.val, vm=listaMesAnt[i].val, vy=listaAnoAnt[i].val;
      if(va===0 && vm===0 && vy===0) return null;
      return {nome:item.nome, va, vm, vy, pctM:pct(va,vm), pctY:pct(va,vy)};
    }).filter(Boolean);
    return {titulo, linhas, totalAtual, totalMesAnt, totalAnoAnt, pctTotalM:pct(totalAtual,totalMesAnt), pctTotalY:pct(totalAtual,totalAnoAnt)};
  }

  const blocoReceitas = montarBloco('RECEITAS OPERACIONAIS (por Categoria)', pAtual.receitas, pMesAnterior.receitas, pAnoAnterior.receitas, pAtual.totalReceitas, pMesAnterior.totalReceitas, pAnoAnterior.totalReceitas);
  const blocoDespesas = montarBloco('DESPESAS (por Categoria)', pAtual.despesas, pMesAnterior.despesas, pAnoAnterior.despesas, pAtual.totalDespesas, pMesAnterior.totalDespesas, pAnoAnterior.totalDespesas);
  const blocoCustos   = montarBloco('CUSTOS (não despesas)', pAtual.custos, pMesAnterior.custos, pAnoAnterior.custos, pAtual.totalCustos, pMesAnterior.totalCustos, pAnoAnterior.totalCustos);
  const pctResM = pct(pAtual.resultado, pMesAnterior.resultado);
  const pctResY = pct(pAtual.resultado, pAnoAnterior.resultado);

  ultimoComparativo = {labelAtual, labelMesAnterior, labelAnoAnterior, blocoReceitas, blocoDespesas, blocoCustos,
    resultadoAtual:pAtual.resultado, resultadoMesAnt:pMesAnterior.resultado, resultadoAnoAnt:pAnoAnterior.resultado, pctResM, pctResY};

  const renderBloco = (b)=> `
    <h2 class="sub" style="font-size:16px;">${b.titulo}</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Categoria</th><th class="right">${labelAtual}</th><th class="right">${labelMesAnterior}</th><th class="right">Var. vs mês ant.</th><th class="right">${labelAnoAnterior}</th><th class="right">Var. vs ano ant.</th></tr></thead>
      <tbody>
        ${b.linhas.map(l=>`<tr><td>${l.nome}</td><td class="right">${fmt(l.va)}</td><td class="right">${fmt(l.vm)}</td><td class="right" style="${corPct(l.pctM)}">${fmtPct(l.pctM)}</td><td class="right">${fmt(l.vy)}</td><td class="right" style="${corPct(l.pctY)}">${fmtPct(l.pctY)}</td></tr>`).join('') || `<tr><td colspan="6" class="note">Sem movimento em nenhum dos três períodos.</td></tr>`}
        <tr style="font-weight:bold;"><td>TOTAL</td><td class="right">${fmt(b.totalAtual)}</td><td class="right">${fmt(b.totalMesAnt)}</td><td class="right" style="${corPct(b.pctTotalM)}">${fmtPct(b.pctTotalM)}</td><td class="right">${fmt(b.totalAnoAnt)}</td><td class="right" style="${corPct(b.pctTotalY)}">${fmtPct(b.pctTotalY)}</td></tr>
      </tbody>
    </table></div>`;

  document.getElementById('comparativoConteudo').innerHTML = `
    <p class="note">🔎 A comparar <b>${labelAtual}</b> com o mês anterior (<b>${labelMesAnterior}</b>) e com o mesmo mês do ano anterior (<b>${labelAnoAnterior}</b>). Variações a <span style="color:var(--vermelho);font-weight:600;">vermelho</span> (±20% ou mais) merecem atenção — podem ser sazonalidade normal (ex.: época alta/baixa, feriados) ou um desvio real a investigar; a <span style="color:var(--amarelo);">amarelo</span> ficam entre ±5% e ±20%.</p>
    ${renderBloco(blocoReceitas)}
    ${renderBloco(blocoDespesas)}
    ${renderBloco(blocoCustos)}
    <h2 class="sub" style="font-size:16px;">RESULTADO (Receitas − Despesas − Custos)</h2>
    <div class="tablewrap"><table><tbody>
      <tr style="font-weight:bold;"><td>RESULTADO</td><td class="right">${fmt(pAtual.resultado)}</td><td class="right">${fmt(pMesAnterior.resultado)}</td><td class="right" style="${corPct(pctResM)}">${fmtPct(pctResM)}</td><td class="right">${fmt(pAnoAnterior.resultado)}</td><td class="right" style="${corPct(pctResY)}">${fmtPct(pctResY)}</td></tr>
    </tbody></table></div>`;
}
function linhasExportacaoComparativo(c){
  const fmtPctExport = v => v===null ? '—' : (v===Infinity ? 'novo' : `${v>=0?'+':''}${v.toFixed(1)}%`);
  const bloco = (b)=> [
    [b.titulo,'','','','',''],
    ...b.linhas.map(l=>[l.nome, l.va, l.vm, fmtPctExport(l.pctM), l.vy, fmtPctExport(l.pctY)]),
    ['TOTAL '+b.titulo, b.totalAtual, b.totalMesAnt, fmtPctExport(b.pctTotalM), b.totalAnoAnt, fmtPctExport(b.pctTotalY)],
    ['','','','','',''],
  ];
  return [
    ...bloco(c.blocoReceitas), ...bloco(c.blocoDespesas), ...bloco(c.blocoCustos),
    ['RESULTADO', c.resultadoAtual, c.resultadoMesAnt, fmtPctExport(c.pctResM), c.resultadoAnoAnt, fmtPctExport(c.pctResY)],
  ];
}

/* ---------- Relatório Consolidado (Multi-Posto) ----------
   Diferente da Contabilidade Analítica (que rateia custos indiretos e calcula um "Resultado
   Analítico" só visível a Administrador), este relatório é uma leitura direta e simples:
   Receitas por Categoria e Despesas por Categoria, lado a lado, uma coluna por Posto de Venda
   (Unidade de Negócio), sem nenhum rateio — só o que foi lançado com essa Unidade preenchida.
   Serve para comparar rapidamente os postos entre si num período. Mesma visibilidade do Resumo
   Mensal (não é módulo restrito a Administrador). */
let filtroConsolidadoPostos = {de:'', ate:''};
let ultimoConsolidadoPostos = null;
function calcularConsolidadoPostos(de, ate){
  const postos = UNIDADES_RATEIO; // = UNIDADES_NEGOCIO sem "SUPRIMENTOS", mesma lista usada no Posto de Venda dos Caixas
  let lista = explodirLancamentos(DB.lancamentos).filter(l=>!CATEGORIAS_EXCLUIDAS_RESULTADO.includes(l.categoria));
  if(de) lista = lista.filter(l=>l.data>=de);
  if(ate) lista = lista.filter(l=>l.data<=ate);

  const zerarPorPosto = ()=> Object.fromEntries([...postos,'Sem Posto'].map(p=>[p,0]));
  const receitasPorCat = {}; CATEGORIAS_RECEITAS.forEach(c=> receitasPorCat[c] = zerarPorPosto());
  const despesasPorCat = {}; [...CATEGORIAS_DESPESAS, ...CATEGORIAS_CUSTOS].forEach(c=> despesasPorCat[c] = zerarPorPosto());

  lista.forEach(l=>{
    const valor = valorEmKZ(l);
    const unidade = postos.includes((l.unidade||'').trim()) ? l.unidade.trim() : 'Sem Posto';
    if(l.tipo==='Receita' && receitasPorCat[l.categoria]) receitasPorCat[l.categoria][unidade] += valor;
    else if(l.tipo==='Despesa' && despesasPorCat[l.categoria]) despesasPorCat[l.categoria][unidade] += valor;
  });

  const colunas = [...postos, 'Sem Posto'];
  const totalReceitasPorPosto = zerarPorPosto();
  Object.values(receitasPorCat).forEach(row=> colunas.forEach(p=> totalReceitasPorPosto[p]+=row[p]));
  const totalDespesasPorPosto = zerarPorPosto();
  Object.values(despesasPorCat).forEach(row=> colunas.forEach(p=> totalDespesasPorPosto[p]+=row[p]));
  const resultadoPorPosto = zerarPorPosto();
  colunas.forEach(p=> resultadoPorPosto[p] = totalReceitasPorPosto[p]-totalDespesasPorPosto[p]);

  return {colunas, receitasPorCat, despesasPorCat, totalReceitasPorPosto, totalDespesasPorPosto, resultadoPorPosto};
}
function viewConsolidadoPostos(){
  const {colunas, receitasPorCat, despesasPorCat, totalReceitasPorPosto, totalDespesasPorPosto, resultadoPorPosto} = calcularConsolidadoPostos(filtroConsolidadoPostos.de, filtroConsolidadoPostos.ate);

  const linhaTotal = (nome, obj, destaque)=> `<tr>${destaque?'<td><b>'+nome+'</b></td>':'<td>'+nome+'</td>'}${colunas.map(p=>`<td class="right">${destaque?'<b>'+fmt(obj[p])+'</b>':fmt(obj[p])}</td>`).join('')}<td class="right">${destaque?'<b>':''}${fmt(colunas.reduce((s,p)=>s+obj[p],0))}${destaque?'</b>':''}</td></tr>`;
  const linhasCategoria = (mapaCat)=> Object.entries(mapaCat)
    .filter(([,row])=> colunas.some(p=>row[p]!==0))
    .map(([cat,row])=>`<tr><td>${cat}</td>${colunas.map(p=>`<td class="right">${row[p]?fmt(row[p]):'—'}</td>`).join('')}<td class="right">${fmt(colunas.reduce((s,p)=>s+row[p],0))}</td></tr>`).join('');

  const semPostoTotal = totalReceitasPorPosto['Sem Posto'] + totalDespesasPorPosto['Sem Posto'];

  ultimoConsolidadoPostos = {
    cabecalhos: ['Categoria', ...colunas, 'TOTAL'],
    linhas: [
      ['RECEITAS (por Categoria)', ...colunas.map(()=>''), ''],
      ...Object.entries(receitasPorCat).filter(([,row])=>colunas.some(p=>row[p]!==0)).map(([cat,row])=>[cat, ...colunas.map(p=>row[p]), colunas.reduce((s,p)=>s+row[p],0)]),
      ['TOTAL RECEITAS', ...colunas.map(p=>totalReceitasPorPosto[p]), colunas.reduce((s,p)=>s+totalReceitasPorPosto[p],0)],
      ['', ...colunas.map(()=>''), ''],
      ['DESPESAS (por Categoria)', ...colunas.map(()=>''), ''],
      ...Object.entries(despesasPorCat).filter(([,row])=>colunas.some(p=>row[p]!==0)).map(([cat,row])=>[cat, ...colunas.map(p=>row[p]), colunas.reduce((s,p)=>s+row[p],0)]),
      ['TOTAL DESPESAS', ...colunas.map(p=>totalDespesasPorPosto[p]), colunas.reduce((s,p)=>s+totalDespesasPorPosto[p],0)],
      ['', ...colunas.map(()=>''), ''],
      ['RESULTADO (Receitas − Despesas)', ...colunas.map(p=>resultadoPorPosto[p]), colunas.reduce((s,p)=>s+resultadoPorPosto[p],0)],
    ],
    periodo: `${filtroConsolidadoPostos.de||'início'} a ${filtroConsolidadoPostos.ate||'hoje'}`,
  };

  return `
  <h2>📊 Relatório Consolidado (Multi-Posto)</h2>
  <p class="note">Receitas e Despesas por Categoria, uma coluna por Posto de Venda (Unidade de Negócio), no período escolhido — sem nenhum rateio de custos indiretos (para isso, ver 🧮 Contabilidade Analítica). "Sem Posto" junta lançamentos sem Unidade de Negócio preenchida.${semPostoTotal!==0?' <b>Há valores em "Sem Posto" neste período</b> — considere preencher a Unidade nesses lançamentos para o comparativo ficar completo.':''}</p>
  <form class="inline" id="formFiltroConsolidadoPostos">
    <div class="grid">
      <div><label>De</label><input type="date" name="de" value="${filtroConsolidadoPostos.de}"></div>
      <div><label>Até</label><input type="date" name="ate" value="${filtroConsolidadoPostos.ate}"></div>
    </div>
    <div class="actions">
      <button type="submit">🔍 Filtrar</button>
      <button type="button" class="sec" id="btnLimparConsolidadoPostos">Limpar filtros</button>
      <button type="button" class="sec" id="btnExportarConsolidadoPostos">⬇️ Exportar (Excel)</button>
      <button type="button" class="print" id="btnImprimirConsolidadoPostos">Imprimir / PDF</button>
    </div>
  </form>
  <div class="tablewrap">
    <table><thead><tr><th>Categoria</th>${colunas.map(p=>`<th class="right">${p}</th>`).join('')}<th class="right">TOTAL</th></tr></thead>
    <tbody>
      <tr><td colspan="${colunas.length+2}"><b>RECEITAS (por Categoria)</b></td></tr>
      ${linhasCategoria(receitasPorCat) || `<tr><td colspan="${colunas.length+2}" class="note">Sem receitas classificadas por categoria neste período.</td></tr>`}
      ${linhaTotal('TOTAL RECEITAS', totalReceitasPorPosto, true)}
      <tr><td colspan="${colunas.length+2}">&nbsp;</td></tr>
      <tr><td colspan="${colunas.length+2}"><b>DESPESAS (por Categoria)</b></td></tr>
      ${linhasCategoria(despesasPorCat) || `<tr><td colspan="${colunas.length+2}" class="note">Sem despesas classificadas por categoria neste período.</td></tr>`}
      ${linhaTotal('TOTAL DESPESAS', totalDespesasPorPosto, true)}
      <tr><td colspan="${colunas.length+2}">&nbsp;</td></tr>
      ${linhaTotal('RESULTADO (Receitas − Despesas)', resultadoPorPosto, true)}
    </tbody></table>
  </div>`;
}

/* ---------- Controlo de Cash ---------- */
function viewCashControlo(){
  const anosLanc = Array.from(new Set(DB.lancamentos.filter(l=>l.conta==='CASH').map(l=>Number(mesKey(l.data).slice(0,4)))));
  const anos = Array.from(new Set([...anosLanc, new Date().getFullYear()])).sort((a,b)=>b-a);
  if(!anos.includes(cashControloAnoAtivo)) cashControloAnoAtivo = anos[0];
  const ano = cashControloAnoAtivo;
  const doAno = DB.lancamentos.filter(l=>l.conta==='CASH' && mesKey(l.data).startsWith(String(ano)));
  const totRec = doAno.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
  const totDesp = doAno.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
  /* Saldo Cash Acumulado = saldo real da Caixa Tesouraria desde sempre até ao fim do ano
     selecionado (não reinicia a cada ano, tal como uma caixa física não reinicia). */
  const ateFimDoAno = DB.lancamentos.filter(l=>l.conta==='CASH' && mesKey(l.data)<=`${ano}-12`);
  const saldoAcumulado = ateFimDoAno.reduce((s,l)=>s+(l.tipo==='Receita'?valorEmKZ(l):-valorEmKZ(l)),0);
  const linhas = MESES.map((m,i)=>{
    const key=`${ano}-${String(i+1).padStart(2,'0')}`;
    const doMes = doAno.filter(l=>mesKey(l.data)===key);
    const r = doMes.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const d = doMes.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    return `<tr><td>${m}</td><td class="right">${fmt(r)}</td><td class="right">${fmt(d)}</td><td class="right"><b>${fmt(r-d)}</b></td></tr>`;
  }).join('');
  return `
  <h2 style="background:var(--castanho);">💵 Controlo de Cash (${ano})</h2>
  <p class="note">Resumo automático de tudo o que foi lançado com Conta/Forma de Pagamento = CASH.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:12px;">
    <div><label>Ano</label><select id="cashControloAnoSel">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">Total Receitas em Cash (${ano})</div><div class="val pos">${fmt(totRec)} Kz</div></div>
    <div class="card"><div class="lbl">Total Despesas em Cash (${ano})</div><div class="val neg">${fmt(totDesp)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo Cash Acumulado (até fim de ${ano})</div><div class="val ${saldoAcumulado>=0?'pos':'neg'}">${fmt(saldoAcumulado)} Kz</div></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th class="right">Receitas</th><th class="right">Despesas</th><th class="right">Saldo do Mês</th></tr></thead><tbody>${linhas}</tbody></table></div>
  ${viewControloCashDiario()}`;
}

/* ---------- Controlo de Cash Diário (Caixa Tesouraria) ---------- */
function viewControloCashDiario(){
  const doCashTodos = DB.lancamentos.filter(l=>l.conta==='CASH').slice().sort((a,b)=> a.data.localeCompare(b.data));
  const mesRef = cashDiarioMes || hoje().slice(0,7);

  /* Saldo inicial = tudo o que entrou/saiu na Caixa Tesouraria ANTES do 1º dia do mês selecionado. */
  const saldoInicialMes = doCashTodos
    .filter(l=> mesKey(l.data) < mesRef)
    .reduce((s,l)=> s + (l.tipo==='Receita' ? valorEmKZ(l) : -valorEmKZ(l)), 0);

  const doMes = doCashTodos.filter(l=> mesKey(l.data)===mesRef);
  const dias = [...new Set(doMes.map(l=>l.data))].sort();

  let saldoCorrente = saldoInicialMes;
  const linhasDias = dias.map(dia=>{
    const doDia = doMes.filter(l=>l.data===dia);
    const entradas = doDia.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+valorEmKZ(l),0);
    const saidas = doDia.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+valorEmKZ(l),0);
    const saldoAbertura = saldoCorrente;
    saldoCorrente = saldoAbertura + entradas - saidas;
    const declaracoesDia = (DB.fechosCaixa||[]).filter(f=>f.data===dia);
    const totalContadoDia = declaracoesDia.reduce((s,f)=> s + (f.moeda==='KZ' ? Number(f.valorContado||0) : (Number(f.valorContado||0) * (taxaCambio(f.moeda,f.data)||1))), 0);
    const diferenca = declaracoesDia.length ? totalContadoDia - saldoCorrente : null;
    return {dia, saldoAbertura, entradas, saidas, saldoFecho:saldoCorrente, totalContadoDia, temDeclaracao:declaracoesDia.length>0, diferenca, nLanc:doDia.length};
  });

  const totalEntradasMes = linhasDias.reduce((s,l)=>s+l.entradas,0);
  const totalSaidasMes = linhasDias.reduce((s,l)=>s+l.saidas,0);
  const saldoFinalMes = linhasDias.length ? linhasDias[linhasDias.length-1].saldoFecho : saldoInicialMes;

  const opcoesMes = [...new Set(doCashTodos.map(l=>mesKey(l.data)).concat([hoje().slice(0,7)]))].sort().reverse();

  return `
  <h2 class="sub" style="font-size:15px;margin-top:22px;">📅 Controlo de Cash Diário — Caixa Tesouraria</h2>
  <p class="note">Saldo dia-a-dia da Caixa Tesouraria (conta CASH): saldo de abertura, entradas, saídas e saldo de fecho, com o saldo acumulado a transitar de um dia para o outro. Quando existe uma contagem física declarada no "Fecho de Caixa" para esse dia, mostra também a diferença.</p>
  <div class="grid" style="grid-template-columns:220px;margin-bottom:10px;">
    <div><label>Mês</label><select id="cashDiarioMesSel">${opcoesMes.map(m=>`<option value="${m}" ${m===mesRef?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="cards">
    <div class="card"><div class="lbl">Saldo Inicial do Mês</div><div class="val">${fmt(saldoInicialMes)} Kz</div></div>
    <div class="card"><div class="lbl">Entradas do Mês</div><div class="val pos">${fmt(totalEntradasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saídas do Mês</div><div class="val neg">${fmt(totalSaidasMes)} Kz</div></div>
    <div class="card"><div class="lbl">Saldo Final do Mês</div><div class="val ${saldoFinalMes>=0?'pos':'neg'}">${fmt(saldoFinalMes)} Kz</div></div>
  </div>
  <div class="tablewrap">
    <table><thead><tr><th>Data</th><th class="right">Saldo Abertura</th><th class="right">Entradas</th><th class="right">Saídas</th><th class="right">Saldo Fecho</th><th class="right">Contado (físico)</th><th class="right">Diferença</th></tr></thead>
    <tbody>${linhasDias.length ? linhasDias.map(l=>`
      <tr>
        <td>${l.dia}</td>
        <td class="right">${fmt(l.saldoAbertura)}</td>
        <td class="right">${fmt(l.entradas)}</td>
        <td class="right">${fmt(l.saidas)}</td>
        <td class="right"><b>${fmt(l.saldoFecho)}</b></td>
        <td class="right">${l.temDeclaracao ? fmt(l.totalContadoDia) : '—'}</td>
        <td class="right" style="${l.diferenca!==null && Math.abs(l.diferenca)>=0.5 ? 'color:var(--vermelho);font-weight:bold;' : ''}">${l.diferenca!==null ? fmt(l.diferenca) : '—'}</td>
      </tr>`).join('') : `<tr><td colspan="7" class="note">Sem movimentos na Caixa Tesouraria em ${mesRef}.</td></tr>`}
    </tbody></table>
  </div>`;
}
