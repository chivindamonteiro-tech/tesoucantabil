<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotelaria — Zoom's Lodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="hotel-core.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --verde-escuro:#14232B; --verde:#1F6F68; --verde-claro:#E4F0EE;
    --castanho:#C89B3C; --creme:#FBF3E1; --bg:#F6F1E7; --card:#ffffff;
    --texto:#14232B; --muted:#55666E; --borda:#DDD2B8; --vermelho:#A6472E;
    --gold:#C89B3C; --font-display:'Fraunces',Georgia,serif; --font-body:'Inter','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--texto);}
  #app{display:flex;min-height:100vh;}
  nav{width:200px;background:var(--verde-escuro);color:#fff;flex-shrink:0;padding:20px 0;}
  nav h1{font-size:15px;padding:0 18px 16px;font-family:var(--font-display);font-weight:600;}
  nav .item{padding:10px 18px;cursor:pointer;font-size:13.5px;opacity:.82;border-left:3px solid transparent;color:#fff;}
  nav .item:hover{opacity:1;background:rgba(246,241,231,.07);}
  nav .item.active{opacity:1;background:var(--verde);border-left:3px solid var(--gold);font-weight:600;}
  main{flex:1;padding:24px 28px;overflow-x:auto;}
  h2{background:var(--verde-escuro);color:#fff;font-family:var(--font-display);font-weight:600;
     padding:12px 20px;margin:0 0 16px;border-radius:8px;font-size:17px;}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:16px 20px;margin-bottom:16px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 3px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:7px;font-size:14px;font-family:var(--font-body);background:#fff;}
  textarea{min-height:60px;}
  button{margin-top:16px;padding:11px 22px;background:var(--verde);color:#fff;border:none;
         border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  button:hover{background:var(--verde-escuro);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--borda);}
  th{color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.03em;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.confirmada{background:var(--verde-claro);color:var(--verde);}
  .badge.checkin{background:#EDE7F9;color:#6B4FA5;}
  .badge.checkout{background:#F6F1E7;color:var(--muted);}
  .badge.cancelada{background:#F6E4E0;color:var(--vermelho);}
  .voltar{position:fixed;top:14px;right:18px;background:var(--verde-escuro);color:#fff;
          padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;z-index:999;}
</style>
</head>
<body>
<a class="voltar" href="index.html">← Voltar</a>
<div id="app">
  <nav>
    <h1>🏨 Zoom's Lodge</h1>
    <div class="item" data-view="nova" onclick="mudarView('nova')">➕ Nova Reserva</div>
    <div class="item" data-view="lista" onclick="mudarView('lista')">📋 Reservas</div>
    <div class="item" data-view="quartos" onclick="mudarView('quartos')">🛏️ Quartos</div>
  </nav>
  <main id="main">A carregar...</main>
</div>

<script>
let viewAtual = 'nova';

async function iniciar(){
  await carregarDadosHotel();
  render();
}

function mudarView(v){
  viewAtual = v;
  render();
}

function render(){
  document.querySelectorAll('nav .item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view === viewAtual);
  });
  const main = document.getElementById('main');
  if(viewAtual === 'nova') main.innerHTML = viewNovaReserva();
  else if(viewAtual === 'lista') main.innerHTML = viewListaReservas();
  else if(viewAtual === 'quartos') main.innerHTML = viewQuartos();
  ligarEventos();
}

/* ---------- Nova Reserva ---------- */
function viewNovaReserva(){
  return `<h2>➕ Nova Reserva</h2>
  <div class="card">
  <form id="formReserva">
    <label>Nome do hóspede</label>
    <input name="hospedeNome" required>
    <label>Nº Doc/BI</label>
    <input name="hospedeDoc">
    <label>Contacto</label>
    <input name="hospedeContacto">
    <label>Tipo de quarto</label>
    <select name="tipoId" required>${DBHotel.tiposQuarto.map(t=>`<option value="${t.id}">${t.nome} (${t.precoBase} Kz/noite)</option>`).join('')}</select>
    <label>Check-in previsto</label>
    <input type="date" name="checkinPrevisto" required>
    <label>Check-out previsto</label>
    <input type="date" name="checkoutPrevisto" required>
    <label>Sinal / Depósito (Kz)</label>
    <input type="number" name="sinal" value="0">
    <label>Observações</label>
    <textarea name="observacoes"></textarea>
    <button type="submit">Guardar Reserva</button>
  </form>
  </div>`;
}

/* ---------- Lista de Reservas ---------- */
function viewListaReservas(){
  const linhas = DBHotel.reservas.slice().sort((a,b)=> a.checkinPrevisto.localeCompare(b.checkinPrevisto));
  return `<h2>📋 Reservas</h2>
  <div class="card">
  <table>
    <thead><tr><th>Hóspede</th><th>Quarto</th><th>Check-in</th><th>Check-out</th><th>Total</th><th>Sinal</th><th>Estado</th></tr></thead>
    <tbody>
      ${linhas.length ? linhas.map(r=>`
        <tr>
          <td>${r.hospedeNome}</td>
          <td>${r.quartoId}</td>
          <td>${r.checkinPrevisto}</td>
          <td>${r.checkoutPrevisto}</td>
          <td>${r.totalReserva} Kz</td>
          <td>${r.sinal} Kz</td>
          <td><span class="badge ${r.estado}">${r.estado}</span></td>
        </tr>`).join('') : '<tr><td colspan="7">Ainda não há reservas.</td></tr>'}
    </tbody>
  </table>
  </div>`;
}

/* ---------- Gestão de Quartos ---------- */
function viewQuartos(){
  return `<h2>🛏️ Quartos</h2>
  <div class="card">
  <form id="formQuarto">
    <label>Número do quarto</label>
    <input name="numero" required>
    <label>Tipo</label>
    <select name="tipoId" required>${DBHotel.tiposQuarto.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('')}</select>
    <button type="submit">Adicionar Quarto</button>
  </form>
  </div>
  <div class="card">
  <table>
    <thead><tr><th>Número</th><th>Tipo</th><th>Estado</th></tr></thead>
    <tbody>
      ${DBHotel.quartos.length ? DBHotel.quartos.map(q=>{
        const tipo = DBHotel.tiposQuarto.find(t=>t.id===q.tipoId);
        return `<tr><td>${q.numero}</td><td>${tipo?tipo.nome:q.tipoId}</td><td>${q.estado}</td></tr>`;
      }).join('') : '<tr><td colspan="3">Ainda não há quartos registados.</td></tr>'}
    </tbody>
  </table>
  </div>`;
}

/* ---------- Eventos dos formulários ---------- */
function ligarEventos(){
  const fReserva = document.getElementById('formReserva');
  if(fReserva) fReserva.onsubmit = submeterReserva;

  const fQuarto = document.getElementById('formQuarto');
  if(fQuarto) fQuarto.onsubmit = submeterQuarto;
}

async function submeterReserva(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const dados = Object.fromEntries(f.entries());
  dados.sinal = Number(dados.sinal) || 0;

  const cin = new Date(dados.checkinPrevisto), cout = new Date(dados.checkoutPrevisto);
  const noites = Math.round((cout - cin) / 86400000);
  if(noites <= 0){ alert('Check-out deve ser depois do check-in.'); return; }

  const candidatos = DBHotel.quartos.filter(q => q.tipoId === dados.tipoId);
  const livre = candidatos.find(q => !quartoOcupadoHotel(q.id, dados.checkinPrevisto, dados.checkoutPrevisto));
  if(!livre){ alert('Não há quartos livres desse tipo neste período. Verifica em "Quartos" se já registaste os quartos físicos.'); return; }

  const tipo = DBHotel.tiposQuarto.find(t => t.id === dados.tipoId);
  const reserva = {
    id: uidHotel(),
    hospedeNome: dados.hospedeNome, hospedeDoc: dados.hospedeDoc, hospedeContacto: dados.hospedeContacto,
    quartoId: livre.id, tipoId: dados.tipoId,
    checkinPrevisto: dados.checkinPrevisto, checkoutPrevisto: dados.checkoutPrevisto,
    checkinReal: null, checkoutReal: null,
    estado: 'confirmada',
    precoNoite: tipo.precoBase, numNoites: noites, totalReserva: tipo.precoBase * noites,
    sinal: dados.sinal, observacoes: dados.observacoes,
    criadoEm: new Date().toISOString()
  };
  DBHotel.reservas.push(reserva);
  await saveDBHotel();

  if(reserva.sinal > 0 && confirm(`Lançar já o sinal de ${reserva.sinal} Kz na tesouraria?`)){
    await gerarLancamentoReceitaHotel(reserva, reserva.sinal, 'Sinal de Reserva');
  }

  toastHotel('Reserva criada com sucesso.');
  mudarView('lista');
}

async function submeterQuarto(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const dados = Object.fromEntries(f.entries());
  DBHotel.quartos.push({ id: uidHotel(), numero: dados.numero, tipoId: dados.tipoId, estado: 'livre' });
  await saveDBHotel();
  toastHotel('Quarto adicionado.');
  render();
}

iniciar();
</script>
</body>
</html>
